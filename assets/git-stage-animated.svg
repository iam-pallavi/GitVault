<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#11102E"/><stop offset="1" stop-color="#281052"/></linearGradient><linearGradient id="neon"><stop stop-color="#9B5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="32" fill="url(#bg)"/><g opacity=".35" fill="#9B5CFF"><circle cx="80" cy="80" r="2"><animate attributeName="cy" values="80;55;80" dur="3s" repeatCount="indefinite"/></circle><circle cx="1080" cy="95" r="2"><animate attributeName="cy" values="95;125;95" dur="4s" repeatCount="indefinite"/></circle><circle cx="1040" cy="340" r="2"><animate attributeName="cx" values="1040;1090;1040" dur="5s" repeatCount="indefinite"/></circle></g><text x="600" y="58" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="32" font-weight="800">git add</text><text x="600" y="86" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">choose changes → stage them → prepare the next commit</text><g font-family="system-ui"><rect x="70" y="125" width="330" height="190" rx="28" fill="#10142B" fill-opacity=".9" stroke="#7C5CFF" stroke-width="2"/><text x="105" y="162" fill="#9B5CFF" font-size="13" font-weight="800">WORKING TREE</text><g font-family="monospace" font-size="14"><rect x="105" y="185" width="210" height="30" rx="10" fill="#191E3D"/><text x="122" y="205" fill="#D7DBF5">README.md</text><rect x="105" y="225" width="210" height="30" rx="10" fill="#191E3D"/><text x="122" y="245" fill="#D7DBF5">app.py</text></g><text x="235" y="290" text-anchor="middle" fill="#7F89B0" font-size="12">modified files</text><rect x="435" y="125" width="330" height="190" rx="28" fill="#10142B" fill-opacity=".9" stroke="#55E6FF" stroke-width="2"/><text x="470" y="162" fill="#55E6FF" font-size="13" font-weight="800">STAGING AREA</text><rect x="490" y="190" width="220" height="82" rx="18" fill="#0B1027" stroke="#55E6FF" stroke-opacity=".5"/><text x="600" y="220" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15">✓ selected changes</text><text x="600" y="247" text-anchor="middle" fill="#8F99BF" font-size="12">ready for commit</text></g><g filter="url(#glow)"><circle r="9" fill="#55E6FF"><animateMotion dur="1.5s" repeatCount="indefinite" path="M400 220 H435"/></circle><circle r="7" fill="#9B5CFF"><animateMotion dur="1.5s" begin=".7s" repeatCount="indefinite" path="M400 260 H435"/></circle></g><path d="M400 220H435M400 260H435" stroke="url(#neon)" stroke-width="3" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur=".9s" repeatCount="indefinite"/></path><rect x="835" y="125" width="295" height="190" rx="28" fill="#10142B" fill-opacity=".9" stroke="#9B5CFF" stroke-width="2"/><text x="982" y="162" text-anchor="middle" fill="#9B5CFF" font-family="system-ui" font-size="13" font-weight="800">COMMAND</text><rect x="875" y="195" width="215" height="48" rx="14" fill="#090D20" stroke="#30345F"/><text x="982" y="225" text-anchor="middle" fill="#55E6FF" font-family="monospace" font-size="17">git add .</text><text x="982" y="275" text-anchor="middle" fill="#8F99BF" font-family="system-ui" font-size="12">stage selected changes</text><text x="600" y="370" text-anchor="middle" fill="#A9B1D6" font-family="monospace" font-size="14">git add = move chosen changes into the staging area</text></svg>