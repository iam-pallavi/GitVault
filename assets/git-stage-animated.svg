<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0d1328"/><stop offset="1" stop-color="#1b0d34"/></linearGradient><linearGradient id="a"><stop stop-color="#b27cff"/><stop offset=".5" stop-color="#49dfff"/><stop offset="1" stop-color="#55e6b3"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="30" fill="url(#b)"/><g opacity=".07" stroke="#aab5d4"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git add</text><text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">Stage a precise snapshot — the index is Git's commit preparation area</text><rect x="45" y="105" width="330" height="300" rx="20" fill="#090e1c" stroke="#745cff"/><text x="70" y="135" fill="#b27cff" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1.4">WORKING TREE</text><g font-family="monospace" font-size="12"><rect x="70" y="160" width="280" height="52" rx="11" fill="#0f172a" stroke="#2b3855"/><text x="90" y="191" fill="#e1e6f4">app.py</text><text x="330" y="191" text-anchor="end" fill="#ff7895">MODIFIED</text><rect x="70" y="224" width="280" height="52" rx="11" fill="#0f172a" stroke="#2b3855"/><text x="90" y="255" fill="#e1e6f4">README.md</text><text x="330" y="255" text-anchor="end" fill="#ff7895">MODIFIED</text><text x="70" y="330" fill="#cbd2e4">$ git add app.py</text></g><rect x="410" y="105" width="370" height="300" rx="20" fill="#071321" stroke="#49dfff"/><text x="595" y="135" text-anchor="middle" fill="#49dfff" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1.4">INDEX / STAGING AREA</text><rect x="470" y="177" width="250" height="62" rx="12" fill="#0e1b2d" stroke="#49dfff"/><text x="595" y="204" text-anchor="middle" fill="#e7edf9" font-family="monospace" font-size="12">app.py</text><text x="595" y="224" text-anchor="middle" fill="#55e6b3" font-family="monospace" font-size="10">staged ✓</text><path d="M375 218H410M780 218H825" stroke="#293752" stroke-width="9"/><path d="M375 218H410M780 218H825" stroke="url(#a)" stroke-width="2" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".55s" repeatCount="indefinite"/></path><circle r="7" fill="#56eaff" filter="url(#g)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M375 218H410"/></circle><text x="595" y="290" text-anchor="middle" fill="#7e8cac" font-family="system-ui" font-size="11">Index snapshot updated</text><text x="595" y="314" text-anchor="middle" fill="#687696" font-family="system-ui" font-size="10">README.md remains outside the next commit</text><rect x="825" y="105" width="330" height="300" rx="20" fill="#090e1c" stroke="#55e6b3"/><text x="990" y="135" text-anchor="middle" fill="#55e6b3" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1.4">NEXT COMMIT SNAPSHOT</text><circle cx="990" cy="235" r="70" fill="#0d1829" stroke="#49dfff"/><circle cx="990" cy="235" r="52" fill="none" stroke="url(#a)" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 990 235" to="360 990 235" dur="4s" repeatCount="indefinite"/></circle><text x="990" y="231" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="15" font-weight="800">READY</text><text x="990" y="252" text-anchor="middle" fill="#70e8ff" font-family="monospace" font-size="10">1 staged file</text><text x="990" y="340" text-anchor="middle" fill="#8290ae" font-family="system-ui" font-size="10">git add changes the index</text><text x="600" y="454" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">git add app.py  →  working tree → index → commit-ready</text><text x="600" y="490" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">Staging does not create history — git commit does.</text></svg>