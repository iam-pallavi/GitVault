<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b"><stop stop-color="#050817"/><stop offset="1" stop-color="#180d32"/></linearGradient><linearGradient id="g"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git add</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">move selected changes from the working tree into the staging area</text><rect x="65" y="110" width="360" height="255" rx="18" fill="#080c19" stroke="#8067ff"/><text x="95" y="145" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="800">WORKING TREE</text><text x="95" y="185" fill="#cfd5ee" font-family="monospace" font-size="13">M  app.py</text><text x="95" y="215" fill="#cfd5ee" font-family="monospace" font-size="13">M  README.md</text><text x="95" y="255" fill="#737f9f" font-family="system-ui" font-size="11">modified files live here</text><text x="95" y="305" fill="#cfd5ee" font-family="monospace" font-size="13">$ git add app.py</text><rect x="470" y="110" width="260" height="255" rx="18" fill="#0a0f20" stroke="url(#g)"/><text x="600" y="145" text-anchor="middle" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">STAGING AREA</text><rect x="515" y="190" width="170" height="48" rx="9" fill="#111a2c" stroke="#4de7ff"/><text x="600" y="220" text-anchor="middle" fill="#e2e6f8" font-family="monospace" font-size="12">app.py ✓</text><text x="600" y="270" text-anchor="middle" fill="#7380a1" font-family="system-ui" font-size="11">selected for next commit</text><g><path d="M425 200H470" stroke="url(#g)" stroke-width="3" stroke-dasharray="8 9"/><circle r="7" fill="#4de7ff"><animateMotion dur="1s" repeatCount="indefinite" path="M425 200H470"/></circle></g><rect x="775" y="110" width="360" height="255" rx="18" fill="#080c19" stroke="#4de7ff"/><text x="955" y="145" text-anchor="middle" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">NEXT STEP</text><text x="955" y="205" text-anchor="middle" fill="#e0e4f7" font-family="monospace" font-size="15">git commit</text><text x="955" y="240" text-anchor="middle" fill="#7f8baa" font-family="system-ui" font-size="11">only staged changes become</text><text x="955" y="260" text-anchor="middle" fill="#7f8baa" font-family="system-ui" font-size="11">part of the next snapshot</text><text x="600" y="410" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git add app.py → stage exactly what you want to commit</text></svg>