<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset="1" stop-color="#211044"/></linearGradient><linearGradient id="f"><stop stop-color="#b98cff"/><stop offset="1" stop-color="#4deaff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git add</text><text x="600" y="74" text-anchor="middle" fill="#a5afd0" font-family="system-ui" font-size="13">Watch a file move from the working tree into Git's index</text><rect x="55" y="108" width="330" height="265" rx="18" fill="#070b17" stroke="#8067ff"/><text x="80" y="140" fill="#b98cff" font-family="system-ui" font-size="12" font-weight="800">WORKING TREE</text><rect x="80" y="168" width="280" height="42" rx="8" fill="#10172a" stroke="#293653"/><text x="100" y="194" fill="#dce1f2" font-family="monospace" font-size="12">app.py</text><text x="340" y="194" text-anchor="end" fill="#ff7b99" font-family="monospace" font-size="11">MODIFIED</text><text x="80" y="314" fill="#cfd5ee" font-family="monospace" font-size="12">$ git add app.py</text><rect x="425" y="108" width="350" height="265" rx="18" fill="#070d1b" stroke="#4deaff"/><text x="600" y="140" text-anchor="middle" fill="#4deaff" font-family="system-ui" font-size="12" font-weight="800">INDEX / STAGING AREA</text><rect x="475" y="168" width="250" height="54" rx="9" fill="#101a2e" stroke="#4deaff"/><text x="600" y="201" text-anchor="middle" fill="#e5e9f8" font-family="monospace" font-size="12">app.py  •  staged ✓</text><path d="M390 195H790" stroke="#33415e" stroke-width="5"/><path d="M390 195H790" stroke="url(#f)" stroke-width="2" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur=".55s" repeatCount="indefinite"/></path><circle cx="390" cy="195" r="7" fill="#b98cff" filter="url(#g)"><animate attributeName="cx" values="390;600;790;390" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="600" cy="195" r="35" fill="none" stroke="#4deaff" opacity=".15"><animate attributeName="r" values="30;60;30" dur="2.2s" repeatCount="indefinite"/></circle><text x="600" y="260" text-anchor="middle" fill="#8591b0" font-family="system-ui" font-size="11">working-tree bytes → index entry</text><text x="600" y="302" text-anchor="middle" fill="#6f7b9c" font-family="system-ui" font-size="11">README.md remains modified</text><rect x="815" y="108" width="330" height="265" rx="18" fill="#070b17" stroke="#4deaff"/><text x="980" y="140" text-anchor="middle" fill="#4deaff" font-family="system-ui" font-size="12" font-weight="800">NEXT COMMIT</text><circle cx="980" cy="225" r="58" fill="#0b1426" stroke="#b98cff"/><circle cx="980" cy="225" r="44" fill="none" stroke="#4deaff" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 980 225" to="360 980 225" dur="4s" repeatCount="indefinite"/></circle><text x="980" y="221" text-anchor="middle" fill="white" font-size="14" font-weight="800">READY</text><text x="980" y="242" text-anchor="middle" fill="#4deaff" font-family="monospace" font-size="10">index snapshot</text><text x="980" y="305" text-anchor="middle" fill="#8490ad" font-family="system-ui" font-size="11">Only staged content</text><text x="980" y="323" text-anchor="middle" fill="#8490ad" font-family="system-ui" font-size="11">will enter the commit.</text><rect x="300" y="400" width="600" height="34" rx="17" fill="#080c18" stroke="#46527a"/><text x="600" y="422" text-anchor="middle" fill="#b7c0da" font-family="monospace" font-size="11">git add = update index • history is still unchanged</text></svg>