<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040714"/><stop offset="1" stop-color="#190d35"/></linearGradient><linearGradient id="f"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">git add</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">The index records exactly which changes will enter the next commit</text><rect x="55" y="108" width="330" height="265" rx="18" fill="#080c19" stroke="#8067ff"/><text x="80" y="140" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="800">WORKING TREE</text><rect x="80" y="168" width="280" height="42" rx="8" fill="#10172a" stroke="#293653"/><text x="100" y="194" fill="#dce1f2" font-family="monospace" font-size="12">app.py</text><text x="340" y="194" text-anchor="end" fill="#ff7b99" font-family="monospace" font-size="11">MODIFIED</text><rect x="80" y="222" width="280" height="42" rx="8" fill="#10172a" stroke="#293653"/><text x="100" y="248" fill="#dce1f2" font-family="monospace" font-size="12">README.md</text><text x="340" y="248" text-anchor="end" fill="#ff7b99" font-family="monospace" font-size="11">MODIFIED</text><text x="80" y="314" fill="#cfd5ee" font-family="monospace" font-size="12">$ git add app.py</text><rect x="425" y="108" width="350" height="265" rx="18" fill="#080e1d" stroke="#4de7ff"/><text x="600" y="140" text-anchor="middle" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">INDEX / STAGING AREA</text><path d="M465 195H735" stroke="#202c48" stroke-width="2"/><rect x="475" y="168" width="250" height="54" rx="9" fill="#101a2e" stroke="#4de7ff"/><text x="600" y="201" text-anchor="middle" fill="#e5e9f8" font-family="monospace" font-size="12">app.py  •  staged ✓</text><circle cx="450" cy="195" r="6" fill="#a78bfa" filter="url(#gl)"><animate attributeName="cx" values="390;600;790;600;390" dur="2.2s" repeatCount="indefinite"/></circle><path d="M390 195H600M600 195H790" stroke="url(#f)" stroke-width="2" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".65s" repeatCount="indefinite"/></path><text x="600" y="260" text-anchor="middle" fill="#8591b0" font-family="system-ui" font-size="11">working-tree bytes → index entry</text><text x="600" y="302" text-anchor="middle" fill="#6f7b9c" font-family="system-ui" font-size="11">README.md stays modified</text><text x="600" y="324" text-anchor="middle" fill="#6f7b9c" font-family="system-ui" font-size="11">because it was not added</text><rect x="815" y="108" width="330" height="265" rx="18" fill="#080c19" stroke="#4de7ff"/><text x="980" y="140" text-anchor="middle" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">NEXT COMMIT</text><circle cx="980" cy="225" r="58" fill="#0c1425" stroke="#a78bfa"/><circle cx="980" cy="225" r="44" fill="none" stroke="#4de7ff" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 980 225" to="360 980 225" dur="5s" repeatCount="indefinite"/></circle><text x="980" y="221" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="14" font-weight="800">READY</text><text x="980" y="242" text-anchor="middle" fill="#4de7ff" font-family="monospace" font-size="10">commit</text><text x="980" y="305" text-anchor="middle" fill="#8490ad" font-family="system-ui" font-size="11">Only staged content</text><text x="980" y="323" text-anchor="middle" fill="#8490ad" font-family="system-ui" font-size="11">will be snapshotted.</text><text x="600" y="415" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git add = update the index, not the repository history</text></svg>