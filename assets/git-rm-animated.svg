<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#080d1e"/><stop offset=".5" stop-color="#19103d"/><stop offset="1" stop-color="#062333"/></linearGradient></defs><rect width="1200" height="450" rx="28" fill="url(#b)"/><text x="70" y="60" fill="#fff" font-family="Arial" font-size="28" font-weight="700">git rm — delete a file and stage the deletion</text><g transform="translate(70 100)"><rect width="1060" height="270" rx="20" fill="#060a15" stroke="#364267"/><g transform="translate(35 45)"><text x="0" y="0" fill="#7587b2" font-family="monospace">WORKING TREE</text><rect y="22" width="280" height="130" rx="14" fill="#111936"/><text x="25" y="62" fill="#fff" font-family="monospace">test.txt</text><text x="25" y="98" fill="#9aaad0" font-family="Arial" font-size="15">file exists</text><text x="25" y="128" fill="#ff7f8e" font-family="Arial" font-size="15">delete requested</text></g><path d="M350 120H625" stroke="#ff6f8a" stroke-width="5" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur=".7s" repeatCount="indefinite"/></path><g transform="translate(650 45)"><text x="0" y="0" fill="#7587b2" font-family="monospace">STAGING AREA</text><rect y="22" width="350" height="130" rx="14" fill="#111936"/><text x="25" y="62" fill="#ff7f8e" font-family="monospace">test.txt  → DELETED</text><text x="25" y="98" fill="#9aaad0" font-family="Arial" font-size="15">deletion is staged</text><text x="25" y="128" fill="#7df5c5" font-family="Arial" font-size="15">ready for next commit ✓</text></g><rect x="35" y="205" width="390" height="42" rx="10" fill="#0f1730"/><text x="55" y="232" fill="#fff" font-family="monospace">$ git rm test.txt</text><rect x="450" y="205" width="550" height="42" rx="10" fill="#0f1730"/><text x="470" y="232" fill="#9fb0d7" font-family="monospace">git commit → records the deletion</text></g></svg>