<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1f"/><stop offset="1" stop-color="#17113b"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.label{fill:#e9e7ff;font-size:22px;font-weight:700}.small{fill:#a8b0d6;font-size:16px}.cmd{fill:#d8b4fe;font-size:15px;font-family:monospace}.node{fill:#0e1630;stroke:#8b5cf6;stroke-width:3}.node2{fill:#101a2f;stroke:#22d3ee;stroke-width:3}</style>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<text x="70" y="70" class="label" font-size="32">⚡ Git Branches — One Repository, Multiple Paths</text>
<text x="70" y="102" class="small">Create isolated work, switch safely, then merge it back into the main line.</text>
<path d="M120 360 H1080" stroke="#30375c" stroke-width="8" stroke-linecap="round"/>
<path d="M300 360 C420 360 430 210 600 210 S790 360 900 360" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
<path d="M600 210 C720 210 730 105 920 105" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity=".85"/>
<circle cx="120" cy="360" r="17" class="node"/><circle cx="300" cy="360" r="17" class="node"/><circle cx="600" cy="210" r="18" class="node2"/><circle cx="900" cy="360" r="18" class="node2"/><circle cx="920" cy="105" r="18" class="node2"/>
<text x="86" y="410" class="label">main</text><text x="74" y="438" class="cmd">git switch main</text>
<text x="254" y="410" class="label">start</text><text x="225" y="438" class="cmd">git switch -c feature</text>
<text x="552" y="165" class="label">feature</text><text x="510" y="138" class="cmd">work + commits</text>
<text x="855" y="410" class="label">merge</text><text x="820" y="438" class="cmd">git merge feature</text>
<text x="885" y="75" class="label">release</text><text x="855" y="50" class="cmd">git push</text>
<g opacity=".95"><rect x="70" y="505" width="1060" height="70" rx="18" fill="#0b1229" stroke="#343b66"/><text x="100" y="548" class="cmd">main  ────────────────●───────────────●──────────────→</text><text x="100" y="572" class="cmd">                         ╲  feature  ╱</text></g>
<circle r="7" fill="#fff"><animateMotion dur="3.8s" repeatCount="indefinite" path="M120 360 H1080"/></circle>
<circle r="6" fill="#22d3ee"><animateMotion dur="4.8s" repeatCount="indefinite" path="M300 360 C420 360 430 210 600 210 S790 360 900 360"/></circle>
<circle r="5" fill="#c084fc"><animateMotion dur="4.2s" repeatCount="indefinite" path="M600 210 C720 210 730 105 920 105"/></circle>
</svg>
