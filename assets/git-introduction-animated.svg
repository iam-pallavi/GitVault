<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".48" stop-color="#0B1025"/><stop offset="1" stop-color="#190A2D"/></linearGradient>
<linearGradient id="flow" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
<style>
.t{font-family:Inter,Segoe UI,sans-serif;fill:#F8FAFC}.muted{font-family:Inter,Segoe UI,sans-serif;fill:#8FA0BA}.label{font:700 12px Inter,Segoe UI,sans-serif;fill:#9CAAC2;letter-spacing:1.8px}.head{font:800 20px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.code{font:600 14px ui-monospace,Consolas,monospace;fill:#E8F9FF}.tiny{font:600 10px ui-monospace,Consolas,monospace;fill:#8192AD}
</style>
</defs>

<rect width="1400" height="780" rx="32" fill="url(#bg)"/>
<circle cx="230" cy="270" r="180" fill="#22D3EE" opacity=".055" filter="url(#blur)"><animate attributeName="cx" values="170;280;170" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1140" cy="430" r="220" fill="#A855F7" opacity=".07" filter="url(#blur)"><animate attributeName="cy" values="350;470;350" dur="8s" repeatCount="indefinite"/></circle>

<text x="60" y="58" class="label">GITVAULT / GIT BASICS / 01</text>
<text x="60" y="104" class="t" style="font-size:38px;font-weight:800">What is Git?</text>
<text x="60" y="134" class="muted" style="font-size:15px">Watch your code move through Git's version-control workflow.</text>

<!-- flowing backbone -->
<path d="M120 400 H1280" stroke="#263653" stroke-width="3"/>
<path d="M120 400 H1280" stroke="url(#flow)" stroke-width="3" stroke-dasharray="14 18">
<animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
</path>

<!-- WORKING DIRECTORY -->
<g transform="translate(55 185)">
<rect width="285" height="375" rx="24" fill="#0D1729" stroke="#2B4567" stroke-width="2"/>
<rect x="1" y="1" width="283" height="5" rx="3" fill="#22D3EE" opacity=".75"/>
<text x="24" y="37" class="label">01 / WORKING DIRECTORY</text>
<text x="24" y="69" class="head">Write &amp; change code</text>
<text x="24" y="94" class="muted" style="font-size:13px">Your live project files.</text>
<rect x="24" y="120" width="237" height="190" rx="16" fill="#050A15" stroke="#20314B"/>
<text x="43" y="151" class="code">📁 my-project/</text>
<g class="muted" style="font-size:13px;font-family:ui-monospace,monospace">
<text x="43" y="188">├── app.py</text><text x="43" y="219">├── index.html</text><text x="43" y="250">├── style.css</text><text x="43" y="281">└── README.md</text></g>
<rect x="24" y="330" width="237" height="28" rx="14" fill="#17263B"/>
<circle cx="43" cy="344" r="5" fill="#FBBF24"><animate attributeName="r" values="4;7;4" dur="1.1s" repeatCount="indefinite"/></circle>
<text x="56" y="348" class="tiny">CHANGE HAPPENS HERE</text>
<!-- moving file pulse -->
<circle cx="244" cy="188" r="4" fill="#22D3EE" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="188;281;188" dur="2.4s" repeatCount="indefinite"/></circle>
</g>

<!-- TRACK -->
<g transform="translate(370 185)">
<rect width="285" height="375" rx="24" fill="#12122B" stroke="#4C3B82" stroke-width="2"/>
<rect x="1" y="1" width="283" height="5" rx="3" fill="#8B5CF6" opacity=".8"/>
<text x="24" y="37" class="label">02 / TRACK</text>
<text x="24" y="69" class="head">Git detects changes</text>
<text x="24" y="94" class="muted" style="font-size:13px">It compares your current state.</text>
<rect x="24" y="120" width="237" height="145" rx="16" fill="#050914" stroke="#30265B"/>
<text x="43" y="153" class="code">$ git status</text>
<text x="43" y="185" class="muted" style="font:13px ui-monospace,monospace">modified: app.py</text>
<text x="43" y="213" class="muted" style="font:13px ui-monospace,monospace">untracked: index.html</text>
<rect x="43" y="235" width="195" height="2" fill="#3B3261"/>
<rect x="43" y="235" width="195" height="2" fill="#A78BFA">
<animate attributeName="width" values="0;195;0" dur="2s" repeatCount="indefinite"/>
</rect>
<text x="24" y="297" class="tiny">GIT SEES WHAT CHANGED</text>
<text x="24" y="325" class="muted" style="font-size:13px">Current files ↔ saved state</text>
<circle cx="244" cy="324" r="7" fill="#A78BFA" filter="url(#glow)"><animate attributeName="r" values="5;12;5" dur="1.5s" repeatCount="indefinite"/></circle>
</g>

<!-- STAGE -->
<g transform="translate(685 185)">
<rect width="285" height="375" rx="24" fill="#0D1B2A" stroke="#2C6973" stroke-width="2"/>
<rect x="1" y="1" width="283" height="5" rx="3" fill="#22D3EE" opacity=".75"/>
<text x="24" y="37" class="label">03 / STAGING AREA</text>
<text x="24" y="69" class="head">Choose what to save</text>
<text x="24" y="94" class="muted" style="font-size:13px">Select changes for the next snapshot.</text>
<rect x="24" y="120" width="237" height="145" rx="16" fill="#050C15" stroke="#24545D"/>
<text x="43" y="153" class="code">$ git add app.py</text>
<text x="43" y="185" style="font:600 13px ui-monospace,monospace;fill:#67F5B1">✓ app.py staged</text>
<text x="43" y="213" class="muted" style="font:13px ui-monospace,monospace">index.html not staged</text>
<rect x="43" y="238" width="195" height="2" fill="#24545D"/>
<circle cx="43" cy="239" r="6" fill="#67F5B1" filter="url(#glow)"><animate attributeName="cx" values="43;238;43" dur="2.2s" repeatCount="indefinite"/></circle>
<rect x="24" y="294" width="237" height="65" rx="14" fill="#082126" stroke="#2C6973"/>
<text x="43" y="321" class="tiny">YOUR SELECTION</text>
<text x="43" y="343" class="muted" style="font-size:13px">controls the next commit</text>
</g>

<!-- HISTORY -->
<g transform="translate(1000 185)">
<rect width="345" height="375" rx="24" fill="#11152A" stroke="#563A79" stroke-width="2"/>
<rect x="1" y="1" width="343" height="5" rx="3" fill="#D946EF" opacity=".7"/>
<text x="24" y="37" class="label">04 / COMMIT + HISTORY</text>
<text x="24" y="69" class="head">Create a checkpoint</text>
<text x="24" y="94" class="muted" style="font-size:13px">A commit records a version of your work.</text>
<rect x="24" y="120" width="297" height="190" rx="16" fill="#050914" stroke="#30265B"/>
<text x="43" y="151" class="code">$ git commit -m "Update"</text>
<path d="M61 180V282" stroke="#405271" stroke-width="4"/>
<circle cx="61" cy="188" r="10" fill="#22D3EE" filter="url(#glow)"><animate attributeName="r" values="8;14;8" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="61" cy="235" r="8" fill="#8B5CF6"/>
<circle cx="61" cy="282" r="8" fill="#475569"/>
<text x="88" y="194" class="code">v3  Current</text>
<text x="88" y="241" class="muted" style="font-size:13px">v2  Previous</text>
<text x="88" y="288" class="muted" style="font-size:13px">v1  Earlier</text>
<circle r="6" fill="#E879F9" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M43 151 L275 151"/></circle>
<rect x="24" y="330" width="297" height="29" rx="14" fill="#24132F"/>
<text x="43" y="349" class="tiny" style="fill:#D8B4FE">CHECKPOINTS YOU CAN RETURN TO</text>
</g>

<!-- animated data packets -->
<g fill="#67E8F9" filter="url(#glow)">
<circle r="7"><animateMotion dur="2s" repeatCount="indefinite" path="M340 400 C355 400 360 400 370 400"/></circle>
<circle r="7" fill="#C4B5FD"><animateMotion dur="2s" begin=".55s" repeatCount="indefinite" path="M655 400 C670 400 675 400 685 400"/></circle>
<circle r="7" fill="#F0ABFC"><animateMotion dur="2s" begin="1.1s" repeatCount="indefinite" path="M970 400 C985 400 990 400 1000 400"/></circle>
</g>

<!-- bottom -->
<g transform="translate(55 595)">
<rect width="1290" height="125" rx="24" fill="#070C18" stroke="#293D5D" stroke-width="2"/>
<text x="28" y="34" class="label">THE BIG PICTURE</text>
<text x="28" y="70" class="t" style="font-size:22px;font-weight:800">WRITE → TRACK → STAGE → COMMIT → HISTORY</text>
<text x="28" y="99" class="muted" style="font-size:13px">Git turns everyday edits into clear checkpoints you can inspect, compare, and recover.</text>
<g transform="translate(1080 42)"><rect width="175" height="44" rx="22" fill="#101C31" stroke="#355477"/><text x="87" y="27" text-anchor="middle" style="font:700 14px Inter,Segoe UI,sans-serif;fill:#67E8F9">VERSION CONTROL</text></g>
</g>

<!-- scan highlight -->
<rect x="55" y="180" width="1290" height="2" fill="url(#flow)" opacity=".35"><animate attributeName="y" values="180;555;180" dur="5s" repeatCount="indefinite"/></rect>
</svg>