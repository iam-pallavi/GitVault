<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030611"/><stop offset=".45" stop-color="#0A1022"/><stop offset="1" stop-color="#160A27"/></linearGradient>
 <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#21D4FD"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24334E"/><stop offset=".5" stop-color="#101A2E"/><stop offset="1" stop-color="#070C18"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#67E8F9" stop-opacity=".8"/><stop offset=".35" stop-color="#6366F1" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#A8B7D8" stroke-opacity=".045"/></pattern>
 <style>
 .title{font:800 44px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#91A0BA}.label{font:700 11px Inter,Segoe UI,sans-serif;fill:#91A4C2;letter-spacing:2px}.head{font:800 23px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 14px Inter,Segoe UI,sans-serif;fill:#8EA0BC}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#DFFBFF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71839F}
 </style>
</defs>

<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<rect width="1600" height="900" rx="36" fill="url(#grid)"/>

<!-- ambient cinematic light -->
<circle cx="260" cy="350" r="260" fill="url(#orb)" opacity=".22" filter="url(#blur)"><animate attributeName="cx" values="180;330;180" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="1330" cy="450" r="300" fill="url(#orb)" opacity=".16" filter="url(#blur)"><animate attributeName="cy" values="360;540;360" dur="9s" repeatCount="indefinite"/></circle>

<text x="70" y="62" class="label">GITVAULT / VISUAL EXPLAINER / 01</text>
<text x="70" y="112" class="title">What is Git?</text>
<text x="70" y="142" class="sub">Think of Git as a timeline for your code — every important change can become a recoverable checkpoint.</text>

<!-- cinematic stage -->
<g transform="translate(70 190)" filter="url(#shadow)">
 <rect width="1460" height="510" rx="30" fill="#060B17" stroke="#273753" stroke-width="2"/>
 <rect x="1" y="1" width="1458" height="6" rx="3" fill="url(#neon)" opacity=".7"/>
 
 <!-- perspective floor -->
 <path d="M70 435 H1390" stroke="#1C2B45"/>
 <path d="M110 470 L1490 470 M150 500 L1450 500" stroke="#18263E" stroke-opacity=".7"/>
 <path d="M180 420L80 510M340 420L300 510M500 420L500 510M660 420L700 510M820 420L900 510M980 420L1100 510M1140 420L1300 510" stroke="#1C2A43" stroke-opacity=".55"/>
 
 <!-- WORKSPACE monitor -->
 <g transform="translate(65 70)">
  <rect width="360" height="285" rx="22" fill="url(#metal)" stroke="#34506F" stroke-width="2"/>
  <rect x="18" y="18" width="324" height="214" rx="15" fill="#030711" stroke="#1E304A"/>
  <circle cx="35" cy="35" r="4" fill="#EF4444"/><circle cx="50" cy="35" r="4" fill="#F59E0B"/><circle cx="65" cy="35" r="4" fill="#22C55E"/>
  <text x="35" y="70" class="code">$ cd my-project</text>
  <text x="35" y="100" class="body">app.py</text>
  <text x="35" y="127" class="body">index.html</text>
  <text x="35" y="154" class="body">style.css</text>
  <text x="35" y="181" class="body">README.md</text>
  <rect x="35" y="199" width="90" height="3" fill="#22D3EE"><animate attributeName="width" values="20;190;20" dur="2.2s" repeatCount="indefinite"/></rect>
  <text x="25" y="260" class="label">WORKING DIRECTORY</text>
  <text x="25" y="281" class="tiny">YOUR LIVE FILES</text>
  <!-- typing cursor -->
  <rect x="205" y="67" width="7" height="18" fill="#67E8F9"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>
 </g>

 <!-- TRACK scanner -->
 <g transform="translate(500 70)">
  <rect width="360" height="285" rx="22" fill="url(#metal)" stroke="#4A3F80" stroke-width="2"/>
  <rect x="20" y="20" width="320" height="214" rx="15" fill="#050914" stroke="#30265B"/>
  <text x="38" y="58" class="code">$ git status</text>
  <g style="font:13px ui-monospace,Consolas,monospace">
   <text x="38" y="92" class="body">modified: app.py</text>
   <text x="38" y="122" class="body">untracked: index.html</text>
   <text x="38" y="152" class="body">modified: style.css</text>
  </g>
  <rect x="38" y="176" width="270" height="2" fill="#352D62"/>
  <rect x="38" y="176" width="270" height="2" fill="#A78BFA">
   <animate attributeName="width" values="0;270;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="308" cy="92" r="7" fill="#A78BFA" filter="url(#glow)"><animate attributeName="r" values="5;13;5" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="25" y="260" class="label">GIT DETECTS CHANGE</text>
  <text x="25" y="281" class="tiny">CURRENT STATE ≠ LAST CHECKPOINT</text>
 </g>

 <!-- STAGING tray -->
 <g transform="translate(935 70)">
  <rect width="360" height="285" rx="22" fill="url(#metal)" stroke="#28626D" stroke-width="2"/>
  <rect x="20" y="20" width="320" height="214" rx="15" fill="#040C14" stroke="#22545D"/>
  <text x="38" y="58" class="code">$ git add app.py</text>
  <rect x="38" y="82" width="270" height="42" rx="10" fill="#0A2228" stroke="#28626D"/>
  <text x="54" y="109" style="font:600 13px ui-monospace,monospace;fill:#67F5B1">✓ app.py selected</text>
  <rect x="38" y="138" width="270" height="42" rx="10" fill="#101621" stroke="#26364C"/>
  <text x="54" y="165" class="body">○ index.html waiting</text>
  <circle cx="54" cy="103" r="6" fill="#67F5B1" filter="url(#glow)"><animate attributeName="cx" values="54;292;54" dur="2.1s" repeatCount="indefinite"/></circle>
  <text x="25" y="260" class="label">STAGING AREA</text>
  <text x="25" y="281" class="tiny">YOU CHOOSE WHAT GOES NEXT</text>
 </g>

 <!-- COMMIT timeline -->
 <g transform="translate(1370 70)">
  <rect width="25" height="285" rx="12" fill="#0A1020" opacity=".7"/>
  <line x1="12" y1="40" x2="12" y2="245" stroke="#344762" stroke-width="3"/>
  <circle cx="12" cy="65" r="11" fill="#22D3EE" filter="url(#glow)"><animate attributeName="r" values="8;15;8" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="12" cy="145" r="9" fill="#8B5CF6"/>
  <circle cx="12" cy="225" r="8" fill="#475569"/>
 </g>

 <!-- connecting light trails -->
 <g fill="none" stroke-linecap="round">
  <path d="M425 305 C455 305 470 305 500 305" stroke="#22D3EE55" stroke-width="5"/>
  <path d="M860 305 C890 305 905 305 935 305" stroke="#8B5CF655" stroke-width="5"/>
  <path d="M1295 305 C1320 305 1340 305 1370 305" stroke="#E879F955" stroke-width="5"/>
  <circle r="8" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M425 305 C455 305 470 305 500 305"/></circle>
  <circle r="8" fill="#C4B5FD" filter="url(#glow)"><animateMotion dur="1.8s" begin=".5s" repeatCount="indefinite" path="M860 305 C890 305 905 305 935 305"/></circle>
  <circle r="8" fill="#F0ABFC" filter="url(#glow)"><animateMotion dur="1.8s" begin="1s" repeatCount="indefinite" path="M1295 305 C1320 305 1340 305 1370 305"/></circle>
 </g>

 <!-- floating commit cards -->
 <g transform="translate(1040 390)">
  <rect width="330" height="78" rx="18" fill="#0C1425" stroke="#3B4E70"/>
  <circle cx="30" cy="39" r="13" fill="#6366F1" filter="url(#glow)"/>
  <text x="58" y="32" class="code">a91f2c</text>
  <text x="58" y="53" class="tiny">Update login page</text>
  <animateTransform attributeName="transform" type="translate" values="1040 390;1040 378;1040 390" dur="3.5s" repeatCount="indefinite"/>
 </g>
 <g transform="translate(700 430)">
  <rect width="300" height="70" rx="18" fill="#0C1425" stroke="#3B4E70"/>
  <circle cx="29" cy="35" r="12" fill="#8B5CF6"/>
  <text x="55" y="29" class="code">73bd11</text>
  <text x="55" y="49" class="tiny">Add navigation</text>
  <animateTransform attributeName="transform" type="translate" values="700 430;700 442;700 430" dur="4s" repeatCount="indefinite"/>
 </g>
 <g transform="translate(355 390)">
  <rect width="285" height="70" rx="18" fill="#0C1425" stroke="#3B4E70"/>
  <circle cx="29" cy="35" r="12" fill="#334155"/>
  <text x="55" y="29" class="code">19e4aa</text>
  <text x="55" y="49" class="tiny">Initial project</text>
  <animateTransform attributeName="transform" type="translate" values="355 390;355 380;355 390" dur="4.5s" repeatCount="indefinite"/>
 </g>
</g>

<!-- bottom concept bar -->
<g transform="translate(70 735)">
 <rect width="1460" height="105" rx="24" fill="#070C18" stroke="#293D5D" stroke-width="2"/>
 <text x="30" y="34" class="label">THE CORE IDEA</text>
 <text x="30" y="68" class="t" style="font:800 22px Inter,Segoe UI,sans-serif">CODE → DETECT → SELECT → CHECKPOINT → HISTORY</text>
 <text x="30" y="91" class="body">Git doesn't just store files — it gives your project a timeline you can inspect and return to.</text>
 <g transform="translate(1215 27)">
  <rect width="190" height="48" rx="24" fill="#101C31" stroke="#355477"/>
  <text x="95" y="30" text-anchor="middle" style="font:700 13px Inter,Segoe UI,sans-serif;fill:#67E8F9">VERSION CONTROL</text>
 </g>
</g>

<!-- cinematic scan -->
<rect x="70" y="185" width="1460" height="2" fill="url(#neon)" opacity=".4">
 <animate attributeName="y" values="185;700;185" dur="6s" repeatCount="indefinite"/>
</rect>

<!-- floating particles -->
<g fill="#67E8F9" opacity=".65">
 <circle cx="120" cy="165" r="2"><animate attributeName="cy" values="165;145;165" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="480" cy="160" r="2"><animate attributeName="cy" values="160;180;160" dur="2.7s" repeatCount="indefinite"/></circle>
 <circle cx="1110" cy="160" r="2"><animate attributeName="cy" values="160;140;160" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="1500" cy="170" r="2"><animate attributeName="cy" values="170;150;170" dur="2.9s" repeatCount="indefinite"/></circle>
</g>
</svg>