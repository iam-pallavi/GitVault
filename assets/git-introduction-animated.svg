<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#0a1024"/><stop offset="1" stop-color="#160a2d"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
 <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
 <linearGradient id="gitline" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="bigGlow"><feGaussianBlur stdDeviation="22"/></filter>
 <style>
 .t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.muted{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{font-size:34px;font-weight:850}.head{font-size:18px;font-weight:800}.small{font-size:13px}.tiny{font-size:11px}
 </style>
</defs>

<rect width="1400" height="760" rx="32" fill="url(#bg)"/>
<circle cx="1110" cy="130" r="190" fill="#8b5cf6" opacity=".08" filter="url(#bigGlow)"><animate attributeName="r" values="170;215;170" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="280" cy="590" r="180" fill="#06b6d4" opacity=".07" filter="url(#bigGlow)"><animate attributeName="r" values="160;205;160" dur="8s" repeatCount="indefinite"/></circle>

<text x="58" y="62" class="t title">Git Introduction</text>
<text x="58" y="91" class="muted small">Git is a version control system — it remembers meaningful versions of your project.</text>
<text x="1342" y="62" text-anchor="end" class="muted mono tiny">VERSION CONTROL / LOCAL</text>

<!-- BEFORE: REAL PROJECT PROBLEM -->
<g>
 <text x="58" y="142" class="muted mono tiny">WITHOUT GIT</text>
 <text x="58" y="170" class="t head">“final_final_v7” problem</text>
 <rect x="50" y="190" width="330" height="360" rx="24" fill="#07101d" stroke="#263752"/>
 <rect x="75" y="220" width="280" height="48" rx="10" fill="#0b1627" stroke="#334766"/>
 <text x="94" y="249" class="muted mono small">📁 my-project</text>
 <g class="mono small">
  <rect x="76" y="286" width="278" height="40" rx="8" fill="#120f20"/>
  <text x="94" y="312" fill="#fbbf24">project_final.zip</text>
  <rect x="76" y="334" width="278" height="40" rx="8" fill="#161021"/>
  <text x="94" y="360" fill="#fb7185">project_final_v2.zip</text>
  <rect x="76" y="382" width="278" height="40" rx="8" fill="#171025"/>
  <text x="94" y="408" fill="#e879f9">project_final_NEW.zip</text>
  <rect x="76" y="430" width="278" height="40" rx="8" fill="#181329"/>
  <text x="94" y="456" fill="#c4b5fd">project_USE_THIS.zip</text>
 </g>
 <text x="75" y="505" class="t small">Which version is correct?</text>
 <text x="75" y="527" fill="#fb7185" class="mono tiny">⚠ no clear history • hard to compare</text>
 <circle cx="350" cy="204" r="7" fill="#fb7185" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
</g>

<!-- GIT CORE: actual transformation -->
<g>
 <text x="700" y="142" text-anchor="middle" class="muted mono tiny">GIT ENTERS THE WORKFLOW</text>
 <text x="700" y="170" text-anchor="middle" class="t head">One project. Many safe versions.</text>

 <!-- energy field -->
 <circle cx="700" cy="356" r="138" fill="#7c3aed" opacity=".08" filter="url(#bigGlow)">
  <animate attributeName="r" values="125;155;125" dur="3.5s" repeatCount="indefinite"/>
 </circle>
 <circle cx="700" cy="356" r="105" fill="#071225" stroke="url(#gitline)" stroke-width="3" filter="url(#glow)">
  <animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.5s" repeatCount="indefinite"/>
 </circle>
 <circle cx="700" cy="356" r="82" fill="#050b17" stroke="#263957"/>
 <text x="700" y="347" text-anchor="middle" class="t mono" font-size="30" font-weight="900">GIT</text>
 <text x="700" y="371" text-anchor="middle" class="muted mono tiny">TRACK • SNAPSHOT • HISTORY</text>

 <!-- incoming code packets -->
 <g>
  <rect x="430" y="235" width="170" height="55" rx="12" fill="#071827" stroke="#24506a"/>
  <text x="450" y="258" class="muted mono tiny">WORKING PROJECT</text>
  <text x="450" y="278" class="t mono small">app.py • index.html</text>
  <path d="M600 263 C635 270 650 300 665 324" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="7 7"/>
  <circle r="7" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M600 263 C635 270 650 300 665 324"/></circle>
 </g>

 <!-- snapshots -->
 <g>
  <path d="M700 461 C580 515 470 480 470 400" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 8"/>
  <path d="M700 461 C820 515 930 480 930 400" fill="none" stroke="#d946ef" stroke-width="2" stroke-dasharray="5 8"/>
  <circle cx="505" cy="415" r="31" fill="#071827" stroke="#22d3ee" stroke-width="2"/>
  <text x="505" y="411" text-anchor="middle" class="t mono small">V1</text><text x="505" y="427" text-anchor="middle" class="muted tiny">saved</text>
  <circle cx="700" cy="485" r="31" fill="#100c25" stroke="#8b5cf6" stroke-width="2"/>
  <text x="700" y="481" text-anchor="middle" class="t mono small">V2</text><text x="700" y="497" text-anchor="middle" class="muted tiny">saved</text>
  <circle cx="895" cy="415" r="31" fill="#180c25" stroke="#e879f9" stroke-width="2"/>
  <text x="895" y="411" text-anchor="middle" class="t mono small">V3</text><text x="895" y="427" text-anchor="middle" class="muted tiny">current</text>
  <circle r="6" fill="#fff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M505 415 C580 470 625 480 700 485 C775 480 820 470 895 415"/></circle>
 </g>
 <text x="700" y="555" text-anchor="middle" class="muted small">Each checkpoint becomes a known point in your project’s history.</text>
</g>

<!-- AFTER GIT: clean history -->
<g>
 <text x="1010" y="142" class="muted mono tiny">WITH GIT</text>
 <text x="1010" y="170" class="t head">Clean project history</text>
 <rect x="1000" y="190" width="350" height="360" rx="24" fill="#07101d" stroke="#303f66"/>
 <text x="1028" y="224" class="muted mono tiny">my-project / .git</text>
 <line x1="1055" y1="275" x2="1055" y2="470" stroke="#33476b" stroke-width="3"/>
 <g>
  <circle cx="1055" cy="280" r="10" fill="#22d3ee" filter="url(#glow)"/>
  <text x="1080" y="276" class="t small">Version 1</text><text x="1080" y="294" class="muted mono tiny">project created</text>
  <circle cx="1055" cy="355" r="10" fill="#8b5cf6" filter="url(#glow)"/>
  <text x="1080" y="351" class="t small">Version 2</text><text x="1080" y="369" class="muted mono tiny">feature added</text>
  <circle cx="1055" cy="430" r="10" fill="#e879f9" filter="url(#glow)"/>
  <text x="1080" y="426" class="t small">Version 3</text><text x="1080" y="444" class="muted mono tiny">current state</text>
 </g>
 <rect x="1028" y="480" width="294" height="42" rx="11" fill="#0c1730" stroke="#35486e">
  <animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
 </rect>
 <text x="1175" y="498" text-anchor="middle" class="t mono tiny">COMPARE</text>
 <text x="1175" y="514" text-anchor="middle" class="muted tiny">inspect • compare • restore</text>
</g>

<!-- central directional flow -->
<g opacity=".9">
 <path d="M382 370 C420 350 430 300 430 263" fill="none" stroke="url(#cyan)" stroke-width="2" stroke-dasharray="6 9"/>
 <path d="M930 415 C960 415 980 390 1000 370" fill="none" stroke="url(#violet)" stroke-width="2" stroke-dasharray="6 9"/>
 <circle r="5" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="2.8s" repeatCount="indefinite" path="M382 370 C420 350 430 300 430 263"/></circle>
 <circle r="5" fill="#d8b4fe" filter="url(#glow)"><animateMotion dur="2.8s" repeatCount="indefinite" path="M930 415 C960 415 980 390 1000 370"/></circle>
</g>

<!-- learning takeaway -->
<rect x="50" y="610" width="1300" height="92" rx="22" fill="#070d1b" stroke="#263856"/>
<text x="80" y="640" class="muted mono tiny">THE IDEA</text>
<text x="80" y="668" class="t head">Git does not replace your project — it remembers how your project changes over time.</text>
<text x="80" y="690" class="muted small">You keep working normally. Git gives those changes a reliable history you can inspect, compare and recover.</text>
<text x="1320" y="660" text-anchor="end" fill="#67e8f9" class="mono tiny">GIT = VERSION CONTROL</text>
</svg>