<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b1f"/><stop offset=".55" stop-color="#10143a"/><stop offset="1" stop-color="#180d35"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .t{font-family:Inter,Segoe UI,sans-serif;fill:#eaf2ff}.muted{fill:#8fa2c7;font-family:Inter,Segoe UI,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.line{stroke:#31416f;stroke-width:2}.node{fill:#0d1530;stroke:#4c5d92;stroke-width:2}.small{font-size:16px}.label{font-size:18px;font-weight:600}.title{font-size:30px;font-weight:700}.cmd{fill:#7dd3fc;font-size:17px}
  </style>
</defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="90" fill="#7c3aed" opacity=".08"><animate attributeName="r" values="90;125;90" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="120" cy="490" r="110" fill="#06b6d4" opacity=".06"><animate attributeName="r" values="110;145;110" dur="6s" repeatCount="indefinite"/></circle>

<text x="60" y="58" class="t title">Git Introduction — How Git protects your project history</text>
<text x="60" y="88" class="muted small">One project → tracked changes → snapshots → recoverable history</text>

<!-- developer workspace -->
<rect x="55" y="125" width="260" height="330" rx="18" fill="#0b1228" stroke="#26365f"/>
<text x="80" y="160" class="t label">PROJECT FOLDER</text>
<text x="80" y="188" class="muted mono small">~/git-project</text>
<g class="mono small">
 <text x="82" y="235" class="t">📄 app.py</text><text x="82" y="270" class="t">📄 README.md</text><text x="82" y="305" class="t">📄 config.yml</text>
 <text x="82" y="365" class="cmd">$ git status</text>
 <text x="82" y="394" class="muted">modified: app.py</text>
</g>
<rect x="72" y="210" width="210" height="120" rx="12" fill="none" stroke="#22d3ee" opacity=".35">
 <animate attributeName="stroke-opacity" values=".15;.7;.15" dur="2.8s" repeatCount="indefinite"/>
</rect>

<!-- git engine -->
<path d="M315 290 H425" class="line"/>
<circle cx="425" cy="290" r="8" fill="#22d3ee" filter="url(#glow)"><animate attributeName="cx" values="315;425" dur="1.2s" repeatCount="indefinite"/></circle>
<rect x="425" y="150" width="330" height="280" rx="22" fill="#0d1530" stroke="#4b3f83" stroke-width="2"/>
<text x="455" y="188" class="t label">GIT</text>
<text x="455" y="216" class="muted small">Version control engine</text>

<!-- tracking animation -->
<g>
 <circle cx="470" cy="275" r="18" fill="#111c3d" stroke="#22d3ee"/>
 <text x="463" y="281" class="t small">Δ</text>
 <text x="505" y="281" class="t label">Track changes</text>
 <circle cx="470" cy="330" r="18" fill="#111c3d" stroke="#a78bfa"/>
 <text x="463" y="336" class="t small">◎</text>
 <text x="505" y="336" class="t label">Create snapshots</text>
 <circle cx="470" cy="385" r="18" fill="#111c3d" stroke="#ec4899"/>
 <text x="463" y="391" class="t small">↶</text>
 <text x="505" y="391" class="t label">Keep history</text>
 <circle cx="425" cy="275" r="5" fill="#22d3ee"><animate attributeName="cy" values="260;395;260" dur="3s" repeatCount="indefinite"/></circle>
</g>

<!-- history -->
<path d="M755 290 H865" class="line"/>
<circle cx="755" cy="290" r="8" fill="#a78bfa" filter="url(#glow)"><animate attributeName="cx" values="755;865" dur="1.2s" repeatCount="indefinite"/></circle>
<rect x="865" y="125" width="280" height="330" rx="18" fill="#0b1228" stroke="#26365f"/>
<text x="892" y="160" class="t label">PROJECT HISTORY</text>
<text x="892" y="188" class="muted small">Git remembers versions</text>

<line x1="930" y1="225" x2="930" y2="400" stroke="#4c5d92" stroke-width="3"/>
<g>
 <circle cx="930" cy="240" r="10" fill="#22d3ee" filter="url(#glow)"/>
 <text x="955" y="246" class="t label">Version 3</text><text x="955" y="268" class="muted mono small">latest changes</text>
 <circle cx="930" cy="310" r="9" fill="#a78bfa"/>
 <text x="955" y="316" class="t label">Version 2</text><text x="955" y="338" class="muted mono small">previous snapshot</text>
 <circle cx="930" cy="380" r="8" fill="#64748b"/>
 <text x="955" y="386" class="t label">Version 1</text><text x="955" y="408" class="muted mono small">first snapshot</text>
</g>
<circle cx="930" cy="240" r="17" fill="none" stroke="#22d3ee" opacity=".5"><animate attributeName="r" values="12;25;12" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2s" repeatCount="indefinite"/></circle>

<!-- bottom takeaway -->
<rect x="55" y="480" width="1090" height="48" rx="14" fill="#0d1530" stroke="#26365f"/>
<text x="600" y="511" text-anchor="middle" class="t label">Git = track changes • save meaningful snapshots • understand what changed • move back through history</text>
</svg>