<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".48" stop-color="#09132d"/><stop offset="1" stop-color="#160821"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f5f9ff}.m{font-family:Inter,Segoe UI,sans-serif;fill:#8fa5c9}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{font-size:32px;font-weight:800}.label{font-size:17px;font-weight:700}.small{font-size:13px}.cmd{font-size:15px;fill:#7dd3fc}.green{fill:#86efac}.red{fill:#fb7185}.violet{fill:#c4b5fd}</style>
</defs>
<rect width="1280" height="620" rx="30" fill="url(#bg)"/>
<circle cx="1080" cy="70" r="150" fill="#7c3aed" opacity=".09" filter="url(#blur)"><animate attributeName="r" values="130;190;130" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="170" cy="510" r="145" fill="#06b6d4" opacity=".07" filter="url(#blur)"><animate attributeName="r" values="120;175;120" dur="8s" repeatCount="indefinite"/></circle>
<path d="M0 112H1280" stroke="#1b2a49"/><text x="52" y="58" class="t title">Git Introduction</text><text x="52" y="86" class="m small">See what Git does — in motion, from a file change to project history.</text>
<text x="1228" y="58" text-anchor="end" class="m mono small">LOCAL VERSION CONTROL</text>

<!-- developer workspace -->
<rect x="45" y="130" width="350" height="370" rx="24" fill="#070d1d" stroke="#24385e"/>
<circle cx="70" cy="155" r="5" fill="#fb7185"/><circle cx="87" cy="155" r="5" fill="#facc15"/><circle cx="104" cy="155" r="5" fill="#4ade80"/>
<text x="125" y="160" class="m mono small">terminal / ~/git-project</text>
<rect x="67" y="182" width="306" height="188" rx="14" fill="#030712" stroke="#1c3157"/>
<text x="86" y="211" class="cmd mono">$ git status</text>
<text x="86" y="238" class="m mono small">On branch main</text>
<text x="86" y="263" class="red mono small">modified: app.py</text>
<text x="86" y="288" class="m mono small">README.md</text>
<text x="86" y="325" class="cmd mono">$ git</text>
<text x="122" y="325" class="t mono small">tracks changes</text>
<rect x="84" y="342" width="3" height="12" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>

<!-- file changing -->
<text x="70" y="408" class="m small">WORKING FOLDER</text>
<rect x="68" y="425" width="306" height="50" rx="12" fill="#0b1730" stroke="#263d68"/>
<text x="86" y="456" class="t mono small">app.py</text>
<text x="184" y="456" class="red mono small">+ new code</text>
<circle cx="342" cy="450" r="8" fill="#fb7185" filter="url(#glow)"><animate attributeName="r" values="6;11;6" dur="1.4s" repeatCount="indefinite"/></circle>

<!-- tracking engine -->
<path d="M396 314 C430 314 445 314 480 314" fill="none" stroke="#38517b" stroke-width="3"/>
<circle r="7" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.5s" repeatCount="indefinite" path="M396 314 C430 314 445 314 480 314"/></circle>

<rect x="480" y="130" width="320" height="370" rx="24" fill="#081126" stroke="#413778"/>
<text x="510" y="165" class="t label">THE GIT ENGINE</text><text x="510" y="189" class="m small">Git observes → snapshots → remembers.</text>

<!-- animated scanner -->
<rect x="510" y="214" width="260" height="92" rx="16" fill="#0c1832" stroke="#29466e"/>
<text x="530" y="240" class="m small">01  DETECT</text>
<text x="530" y="269" class="t label">What changed?</text>
<text x="530" y="292" class="m mono small">app.py  →  modified</text>
<rect x="516" y="218" width="4" height="84" fill="#22d3ee" opacity=".85"><animate attributeName="x" values="516;760;516" dur="2s" repeatCount="indefinite"/></rect>

<path d="M640 306V330" stroke="#536b99" stroke-width="2"/><circle cx="640" cy="318" r="5" fill="#8b5cf6"><animate attributeName="cy" values="306;330;306" dur="1.2s" repeatCount="indefinite"/></circle>

<rect x="510" y="330" width="260" height="92" rx="16" fill="#0c1832" stroke="#4d3d7d"/>
<text x="530" y="356" class="m small">02  SNAPSHOT</text>
<text x="530" y="385" class="t label">Capture a known state</text>
<g transform="translate(715 378)"><rect x="-20" y="-15" width="40" height="30" rx="6" fill="none" stroke="#c4b5fd" stroke-width="2"><animate attributeName="stroke-width" values="2;4;2" dur="1.8s" repeatCount="indefinite"/></rect><path d="M-10 0H10" stroke="#c4b5fd"/><path d="M0 -8V8" stroke="#c4b5fd"/></g>

<path d="M640 422V447" stroke="#536b99" stroke-width="2"/><circle cx="640" cy="434" r="5" fill="#f472b6"><animate attributeName="cy" values="422;447;422" dur="1.2s" repeatCount="indefinite"/></circle>
<rect x="510" y="447" width="260" height="32" rx="10" fill="#121b38" stroke="#74406f"/><text x="640" y="469" text-anchor="middle" class="t small">03  HISTORY  •  traceable versions</text>

<!-- history / snapshot chain -->
<path d="M800 314 C836 314 850 314 885 314" fill="none" stroke="#38517b" stroke-width="3"/>
<circle r="7" fill="#d946ef" filter="url(#glow)"><animateMotion dur="1.5s" repeatCount="indefinite" path="M800 314 C836 314 850 314 885 314"/></circle>

<rect x="885" y="130" width="350" height="370" rx="24" fill="#070d1d" stroke="#24385e"/>
<text x="915" y="165" class="t label">PROJECT MEMORY</text><text x="915" y="189" class="m small">Saved states form a timeline.</text>

<!-- history graph -->
<path d="M950 235 C950 270 950 360 950 440" stroke="#344a73" stroke-width="3"/>
<path d="M950 235 C1000 260 1035 260 1085 295 C1125 323 1145 350 1170 390" fill="none" stroke="url(#line)" stroke-width="3" opacity=".8"/>
<g>
 <circle cx="950" cy="235" r="12" fill="#22d3ee" filter="url(#glow)"/><circle cx="950" cy="235" r="22" fill="none" stroke="#22d3ee"><animate attributeName="r" values="14;28;14" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="2.5s" repeatCount="indefinite"/></circle>
 <text x="980" y="231" class="t label">Current state</text><text x="980" y="252" class="m mono small">your project now</text>
 <circle cx="1085" cy="295" r="10" fill="#a78bfa"/><text x="1110" y="291" class="t label">Previous state</text><text x="1110" y="311" class="m mono small">saved earlier</text>
 <circle cx="1170" cy="390" r="9" fill="#64748b"/><text x="1000" y="393" class="t label">Older state</text><text x="1000" y="414" class="m mono small">still traceable</text>
</g>

<!-- bottom cinematic flow -->
<rect x="45" y="525" width="1190" height="58" rx="18" fill="#071023" stroke="#26385e"/>
<text x="68" y="560" class="m mono small">FILE CHANGE</text><text x="178" y="560" class="t mono">→</text><text x="210" y="560" class="cmd mono small">GIT TRACKS IT</text><text x="350" y="560" class="t mono">→</text><text x="382" y="560" class="violet mono small">SNAPSHOT</text><text x="485" y="560" class="t mono">→</text><text x="517" y="560" class="cmd mono small">HISTORY</text><text x="635" y="560" class="m small">•</text><text x="660" y="560" class="m small">That is the core idea of version control.</text>

<!-- ambient moving particles -->
<g fill="#67e8f9"><circle cx="420" cy="110" r="2"><animate attributeName="cy" values="110;95;110" dur="3s" repeatCount="indefinite"/></circle><circle cx="845" cy="92" r="2"><animate attributeName="cy" values="92;108;92" dur="3.7s" repeatCount="indefinite"/></circle><circle cx="1180" cy="520" r="2"><animate attributeName="cx" values="1180;1160;1180" dur="4s" repeatCount="indefinite"/></circle></g>
</svg>