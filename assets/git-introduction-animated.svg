<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".48" stop-color="#0B1026"/><stop offset="1" stop-color="#170B2B"/></linearGradient>
 <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#D946EF"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17243D" stop-opacity=".82"/><stop offset="1" stop-color="#0A1020" stop-opacity=".82"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <style>
 .title{font:800 38px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 15px Inter,Segoe UI,sans-serif;fill:#91A0BA}.label{font:700 12px Inter,Segoe UI,sans-serif;fill:#9CAAC2;letter-spacing:1.8px}.card{font:750 20px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 13px Inter,Segoe UI,sans-serif;fill:#8FA0BA}.code{font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#E8F9FF}.tiny{font:600 10px ui-monospace,Consolas,monospace;fill:#7F91AD}
 </style>
</defs>

<rect width="1400" height="780" rx="32" fill="url(#bg)"/>
<circle cx="250" cy="250" r="170" fill="#22D3EE" opacity=".06" filter="url(#blur)"/>
<circle cx="1120" cy="430" r="210" fill="#A855F7" opacity=".07" filter="url(#blur)"/>
<path d="M0 150H1400M0 300H1400M0 450H1400M0 600H1400M175 0V780M350 0V780M525 0V780M700 0V780M875 0V780M1050 0V780M1225 0V780" stroke="#8BA4D8" stroke-opacity=".055"/>

<text x="62" y="58" class="label">GITVAULT / GIT BASICS / 01</text>
<text x="62" y="103" class="title">What is Git?</text>
<text x="62" y="132" class="sub">A visual tour of how Git turns code changes into a safe, recoverable project history.</text>

<!-- main workflow rail -->
<path d="M120 410H1280" stroke="#263653" stroke-width="3"/>
<path d="M120 410H1280" stroke="url(#accent)" stroke-width="3" stroke-dasharray="18 20" opacity=".75">
 <animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1.6s" repeatCount="indefinite"/>
</path>

<!-- 1 WORK -->
<g transform="translate(55 190)">
 <rect width="285" height="365" rx="24" fill="url(#glass)" stroke="#2B4567" stroke-width="2"/>
 <text x="25" y="34" class="label">01 / WRITE</text>
 <text x="25" y="68" class="card">Working directory</text>
 <text x="25" y="94" class="body">Where your current code lives.</text>
 <rect x="25" y="125" width="235" height="174" rx="16" fill="#050A16" stroke="#20314B"/>
 <text x="45" y="158" class="code">📁 my-project/</text>
 <text x="45" y="195" class="body">├── app.py</text>
 <text x="45" y="224" class="body">├── index.html</text>
 <text x="45" y="253" class="body">├── style.css</text>
 <text x="45" y="282" class="body">└── README.md</text>
 <rect x="25" y="319" width="235" height="28" rx="14" fill="#1D293D"/>
 <circle cx="44" cy="333" r="5" fill="#FBBF24"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
 <text x="57" y="337" class="tiny">FILES CHANGE HERE</text>
</g>

<!-- 2 TRACK -->
<g transform="translate(370 190)">
 <rect width="285" height="365" rx="24" fill="url(#glass)" stroke="#4C3B82" stroke-width="2"/>
 <text x="25" y="34" class="label">02 / TRACK</text>
 <text x="25" y="68" class="card">Git watches changes</text>
 <text x="25" y="94" class="body">Git compares your files with history.</text>
 <rect x="25" y="125" width="235" height="135" rx="16" fill="#050914" stroke="#30265B"/>
 <text x="45" y="158" class="code">$ git status</text>
 <text x="45" y="190" class="body">modified: app.py</text>
 <text x="45" y="218" class="body">untracked: index.html</text>
 <circle cx="225" cy="226" r="7" fill="#A78BFA" filter="url(#glow)"><animate attributeName="r" values="5;11;5" dur="1.6s" repeatCount="indefinite"/></circle>
 <rect x="25" y="282" width="235" height="65" rx="14" fill="#0E1024" stroke="#4C3B82"/>
 <text x="45" y="310" class="tiny">GIT KNOWS</text>
 <text x="45" y="332" class="body">what changed + what is new</text>
</g>

<!-- 3 STAGE -->
<g transform="translate(685 190)">
 <rect width="285" height="365" rx="24" fill="url(#glass)" stroke="#2C6973" stroke-width="2"/>
 <text x="25" y="34" class="label">03 / SELECT</text>
 <text x="25" y="68" class="card">Staging area</text>
 <text x="25" y="94" class="body">Choose exactly what goes into the next snapshot.</text>
 <rect x="25" y="125" width="235" height="135" rx="16" fill="#050C15" stroke="#24545D"/>
 <text x="45" y="158" class="code">$ git add app.py</text>
 <text x="45" y="190" fill="#67F5B1" style="font:600 13px ui-monospace,monospace">✓ app.py staged</text>
 <text x="45" y="218" class="body">index.html not staged</text>
 <rect x="25" y="282" width="235" height="65" rx="14" fill="#082126" stroke="#2C6973"/>
 <text x="45" y="310" class="tiny">YOUR SELECTION</text>
 <text x="45" y="332" class="body">controls the next commit</text>
</g>

<!-- 4 HISTORY -->
<g transform="translate(1000 190)">
 <rect width="345" height="365" rx="24" fill="url(#glass)" stroke="#563A79" stroke-width="2"/>
 <text x="25" y="34" class="label">04 / SAVE + RECOVER</text>
 <text x="25" y="68" class="card">Project history</text>
 <text x="25" y="94" class="body">Each commit becomes a checkpoint.</text>
 <rect x="25" y="125" width="295" height="174" rx="16" fill="#050914" stroke="#30265B"/>
 <path d="M61 158V273" stroke="#415271" stroke-width="4"/>
 <circle cx="61" cy="165" r="10" fill="#22D3EE" filter="url(#glow)"><animate attributeName="r" values="8;13;8" dur="1.7s" repeatCount="indefinite"/></circle>
 <circle cx="61" cy="215" r="8" fill="#8B5CF6"/>
 <circle cx="61" cy="265" r="8" fill="#475569"/>
 <text x="88" y="171" class="code">v3  Current</text>
 <text x="88" y="221" class="body">v2  Previous</text>
 <text x="88" y="271" class="body">v1  Earlier</text>
 <rect x="25" y="319" width="295" height="28" rx="14" fill="#21122E"/>
 <text x="45" y="337" class="tiny" style="fill:#D8B4FE">GO BACK WHEN NEEDED</text>
</g>

<!-- moving nodes between cards -->
<g filter="url(#glow)">
 <circle cy="410" r="7" fill="#67E8F9"><animate attributeName="cx" values="340;370;340" dur="1.5s" repeatCount="indefinite"/></circle>
 <circle cy="410" r="7" fill="#C4B5FD"><animate attributeName="cx" values="655;685;655" dur="1.5s" begin=".35s" repeatCount="indefinite"/></circle>
 <circle cy="410" r="7" fill="#67E8F9"><animate attributeName="cx" values="970;1000;970" dur="1.5s" begin=".7s" repeatCount="indefinite"/></circle>
</g>

<!-- bottom summary -->
<g transform="translate(55 595)">
 <rect width="1290" height="125" rx="24" fill="#070C18" stroke="#293D5D" stroke-width="2"/>
 <text x="28" y="34" class="label">THE SIMPLE PICTURE</text>
 <text x="28" y="68" class="card">CHANGE → TRACK → SELECT → COMMIT → HISTORY</text>
 <text x="28" y="98" class="body">Git gives you controlled checkpoints instead of relying on filenames like final_v2_really-final.zip.</text>
 <rect x="1035" y="39" width="220" height="48" rx="24" fill="#101C31" stroke="#355477"/>
 <text x="1145" y="69" text-anchor="middle" style="font:700 15px Inter,Segoe UI,sans-serif;fill:#67E8F9">VERSION CONTROL</text>
</g>
</svg>