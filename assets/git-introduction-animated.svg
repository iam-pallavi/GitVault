<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040D"/><stop offset=".5" stop-color="#0A1025"/><stop offset="1" stop-color="#190728"/></linearGradient>
 <linearGradient id="git" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF8A3D"/><stop offset=".5" stop-color="#F04438"/><stop offset="1" stop-color="#A21CAF"/></linearGradient>
 <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#6366F1" stop-opacity=".45"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#A8B7D8" stroke-opacity=".045"/></pattern>
 <style>.title{font:800 46px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#91A0BA}.label{font:700 11px Inter,Segoe UI,sans-serif;fill:#91A4C2;letter-spacing:2px}.head{font:800 21px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 14px Inter,Segoe UI,sans-serif;fill:#8EA0BC}.code{font:600 14px ui-monospace,Consolas,monospace;fill:#E6FAFF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71839F}</style>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect width="1600" height="900" rx="36" fill="url(#grid)"/>
<circle cx="800" cy="430" r="420" fill="url(#halo)" filter="url(#blur)"><animate attributeName="r" values="360;440;360" dur="6s" repeatCount="indefinite"/></circle>
<text x="70" y="60" class="label">GITVAULT / GIT BASICS / 01</text>
<text x="70" y="110" class="title">Git — what is it?</text>
<text x="70" y="140" class="sub">A 3D visual story of Git: track changes, keep versions, understand history and recover your work.</text>

<!-- LEFT: changing code -->
<g transform="translate(65 255)" filter="url(#shadow)">
 <rect width="310" height="300" rx="26" fill="#0B1527" stroke="#2B4969" stroke-width="2"/><rect width="310" height="5" rx="2" fill="#22D3EE"/>
 <text x="25" y="38" class="label">YOUR PROJECT</text><text x="25" y="70" class="head">Files keep changing</text>
 <rect x="25" y="94" width="260" height="132" rx="16" fill="#030812" stroke="#20334D"/>
 <text x="44" y="124" class="code">📁 my-project</text><text x="44" y="153" class="body">app.py   → edited</text><text x="44" y="181" class="body">index.html → new</text><text x="44" y="209" class="body">README.md → changed</text>
 <circle cx="265" cy="153" r="6" fill="#FBBF24"><animate attributeName="cy" values="153;209;153" dur="1.8s" repeatCount="indefinite"/></circle>
 <text x="25" y="264" class="tiny">WITHOUT GIT: VERSIONS ARE EASY TO LOSE</text>
</g>

<!-- RIGHT: version history -->
<g transform="translate(1225 255)" filter="url(#shadow)">
 <rect width="310" height="300" rx="26" fill="#10142A" stroke="#563D79" stroke-width="2"/><rect width="310" height="5" rx="2" fill="#E879F9"/>
 <text x="25" y="38" class="label">WITH GIT</text><text x="25" y="70" class="head">History stays with you</text>
 <rect x="25" y="94" width="260" height="132" rx="16" fill="#030812" stroke="#30265B"/>
 <path d="M58 113V216" stroke="#40516D" stroke-width="4"/>
 <circle cx="58" cy="120" r="10" fill="#22D3EE" filter="url(#glow)"><animate attributeName="r" values="8;15;8" dur="1.7s" repeatCount="indefinite"/></circle>
 <circle cx="58" cy="166" r="8" fill="#8B5CF6"/><circle cx="58" cy="212" r="8" fill="#475569"/>
 <text x="83" y="126" class="code">v3  current</text><text x="83" y="172" class="body">v2  previous</text><text x="83" y="218" class="body">v1  earlier</text>
 <text x="25" y="264" class="tiny">COMPARE • RETURN • RECOVER</text>
</g>

<!-- CENTRAL 3D GIT CORE -->
<g transform="translate(800 410)" filter="url(#shadow)">
 <ellipse rx="465" ry="125" fill="none" stroke="url(#flow)" stroke-opacity=".2" stroke-width="2" transform="rotate(-12)"><animateTransform attributeName="transform" type="rotate" from="-12 0 0" to="348 0 0" dur="11s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="370" ry="100" fill="none" stroke="#22D3EE" stroke-opacity=".13" stroke-width="2" transform="rotate(52)"><animateTransform attributeName="transform" type="rotate" from="52 0 0" to="412 0 0" dur="9s" repeatCount="indefinite"/></ellipse>

 <!-- 3D cube -->
 <g>
  <animateTransform attributeName="transform" type="rotate" values="-2 0 0;2 0 0;-2 0 0" dur="5s" repeatCount="indefinite"/>
  <polygon points="-145,-95 0,-180 145,-95 0,-10" fill="url(#git)" stroke="#FFC08A" stroke-width="2"/>
  <polygon points="-145,-95 0,-10 0,165 -145,75" fill="#B42373" stroke="#FF8C69" stroke-width="2"/>
  <polygon points="0,-10 145,-95 145,75 0,165" fill="#D94841" stroke="#FFB06A" stroke-width="2"/>
  <path d="M-88 -91L0 -143L88 -91L0 -40Z M-88 -91V46 M88 -91V46 M0 -40V128" fill="none" stroke="#FFF4ED" stroke-opacity=".3" stroke-width="3"/>
  <text x="0" y="-50" text-anchor="middle" style="font:900 36px Inter,Segoe UI,sans-serif;fill:white">GIT</text>
  <circle cx="-42" cy="22" r="8" fill="white" filter="url(#glow)"><animate attributeName="r" values="6;13;6" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="22" r="8" fill="white" filter="url(#glow)"><animate attributeName="r" values="6;13;6" dur="1.4s" begin=".45s" repeatCount="indefinite"/></circle>
  <circle cx="0" cy="95" r="8" fill="white" filter="url(#glow)"><animate attributeName="r" values="6;13;6" dur="1.4s" begin=".9s" repeatCount="indefinite"/></circle>
  <path d="M-42 22L0 95L42 22" fill="none" stroke="white" stroke-width="5" opacity=".8"/>
 </g>

 <!-- repository platform -->
 <g transform="translate(0 225)">
  <polygon points="-285,0 0,-82 285,0 0,82" fill="#0C172B" stroke="#3B506D" stroke-width="2"/>
  <polygon points="-285,0 0,82 0,112 -285,30" fill="#07101D" stroke="#243A58"/><polygon points="0,82 285,0 285,30 0,112" fill="#0A1425" stroke="#243A58"/>
  <text x="0" y="14" text-anchor="middle" class="label">.GIT</text><text x="0" y="41" text-anchor="middle" class="code">PROJECT HISTORY</text>
 </g>
</g>

<!-- animated idea: changes flow into Git -->
<g fill="none" stroke-linecap="round">
 <path d="M375 405 C505 395 570 350 645 325" stroke="#22D3EE44" stroke-width="5"/><path d="M1225 405 C1095 395 1030 350 955 325" stroke="#E879F944" stroke-width="5"/>
 <circle r="8" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M375 405 C505 395 570 350 645 325"/></circle>
 <circle r="8" fill="#F0ABFC" filter="url(#glow)"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite" path="M1225 405 C1095 395 1030 350 955 325"/></circle>
</g>

<!-- simple definition -->
<g transform="translate(65 675)">
 <rect width="1470" height="150" rx="28" fill="#070C18" stroke="#293D5D" stroke-width="2"/>
 <text x="32" y="38" class="label">SO, WHAT IS GIT?</text>
 <text x="32" y="76" class="title" style="font-size:27px">Git is a distributed version control system.</text>
 <text x="32" y="107" class="body" style="font-size:15px">It tracks changes in your files and keeps project history, so you can understand, compare and recover versions.</text>
 <text x="32" y="134" class="code">TRACK CHANGES  •  SAVE VERSIONS  •  SEE HISTORY  •  RECOVER WORK</text>
 <rect x="1245" y="45" width="190" height="48" rx="24" fill="#101C31" stroke="#355477"/><text x="1340" y="75" text-anchor="middle" style="font:800 13px Inter,Segoe UI,sans-serif;fill:#67E8F9">VERSION CONTROL</text>
</g>

<rect x="65" y="185" width="1470" height="2" fill="url(#flow)" opacity=".35"><animate attributeName="y" values="185;650;185" dur="6s" repeatCount="indefinite"/></rect>
<g fill="#67E8F9" opacity=".7"><circle cx="430" cy="175" r="2"><animate attributeName="cy" values="175;145;175" dur="3s" repeatCount="indefinite"/></circle><circle cx="800" cy="175" r="2"><animate attributeName="cy" values="175;200;175" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="1170" cy="175" r="2"><animate attributeName="cy" values="175;145;175" dur="3.2s" repeatCount="indefinite"/></circle></g>
</svg>