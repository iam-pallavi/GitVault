<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".48" stop-color="#090d24"/><stop offset="1" stop-color="#17082c"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f4f8ff}.m{font-family:Inter,Segoe UI,sans-serif;fill:#91a4c7}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.h{font-size:32px;font-weight:800}.s{font-size:15px}.b{font-size:18px;font-weight:700}.tiny{font-size:12px}</style>
</defs>
<rect width="1280" height="620" rx="32" fill="url(#bg)"/>
<circle cx="1050" cy="110" r="170" fill="#7c3aed" opacity=".10" filter="url(#blur)"><animate attributeName="r" values="150;190;150" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="190" cy="500" r="150" fill="#06b6d4" opacity=".07" filter="url(#blur)"><animate attributeName="r" values="130;180;130" dur="8s" repeatCount="indefinite"/></circle>

<text x="55" y="56" class="t h">Git Introduction</text>
<text x="55" y="84" class="m s">Think of Git as a time machine for your code.</text>
<text x="1225" y="55" text-anchor="end" class="m mono tiny">LOCAL • VERSION CONTROL</text>

<!-- left: live code -->
<g>
 <rect x="45" y="125" width="300" height="350" rx="20" fill="#07101f" stroke="#263957"/>
 <circle cx="69" cy="151" r="5" fill="#fb7185"/><circle cx="86" cy="151" r="5" fill="#facc15"/><circle cx="103" cy="151" r="5" fill="#4ade80"/>
 <text x="122" y="156" class="m mono tiny">~/git-project</text>
 <text x="68" y="194" class="t b">LIVE CODE</text>
 <text x="68" y="218" class="m mono tiny">app.py</text>
 <rect x="65" y="232" width="260" height="150" rx="10" fill="#050b17" stroke="#1b2c48"/>
 <g class="mono tiny">
  <text x="80" y="255" class="m">01  def deploy():</text>
  <text x="80" y="277" class="m">02    build()</text>
  <text x="80" y="299" class="m">03    test()</text>
  <text x="80" y="321" fill="#22d3ee">04    deploy("prod")</text>
  <text x="80" y="343" class="m">05  return "done"</text>
 </g>
 <rect x="65" y="232" width="260" height="150" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".75"><animate attributeName="stroke-opacity" values=".2;.9;.2" dur="2.4s" repeatCount="indefinite"/></rect>
 <text x="68" y="415" class="m mono tiny">$ git status</text>
 <text x="68" y="437" fill="#fbbf24" class="mono tiny">modified: app.py</text>
 <text x="68" y="458" class="m tiny">Git notices the change.</text>
</g>

<!-- center: time machine -->
<g>
 <text x="640" y="128" text-anchor="middle" class="m mono tiny">THE GIT IDEA</text>
 <text x="640" y="158" text-anchor="middle" class="t b">CAPTURE → REMEMBER → REWIND</text>

 <!-- orbit -->
 <ellipse cx="640" cy="302" rx="205" ry="128" fill="none" stroke="#26365b" stroke-width="2"/>
 <ellipse cx="640" cy="302" rx="155" ry="94" fill="none" stroke="#3b2d69" stroke-width="2"/>
 <ellipse cx="640" cy="302" rx="92" ry="57" fill="#090d25" stroke="#8b5cf6" stroke-width="2"/>
 <circle cx="640" cy="302" r="40" fill="#0d1735" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)"><animate attributeName="r" values="36;44;36" dur="2.2s" repeatCount="indefinite"/></circle>
 <text x="640" y="298" text-anchor="middle" class="t mono tiny">GIT</text>
 <text x="640" y="316" text-anchor="middle" class="m mono tiny">HISTORY</text>

 <!-- rotating orbit dots -->
 <circle r="8" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M435 302 A205 128 0 1 0 845 302 A205 128 0 1 0 435 302"/></circle>
 <circle r="7" fill="#d946ef" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M485 302 A155 94 0 1 1 795 302 A155 94 0 1 1 485 302"/></circle>

 <!-- snapshots -->
 <g>
  <circle cx="455" cy="302" r="23" fill="#07172a" stroke="#22d3ee"/>
  <text x="455" y="298" text-anchor="middle" class="t mono tiny">NOW</text><text x="455" y="313" text-anchor="middle" class="m tiny">v3</text>
  <circle cx="824" cy="302" r="23" fill="#120b2a" stroke="#d946ef"/>
  <text x="824" y="298" text-anchor="middle" class="t mono tiny">PAST</text><text x="824" y="313" text-anchor="middle" class="m tiny">v2</text>
 </g>

 <!-- incoming code pulse -->
 <path d="M345 300 C410 250 425 260 455 290" fill="none" stroke="#22d3ee" stroke-width="3" opacity=".8"/>
 <circle r="6" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="1.5s" repeatCount="indefinite" path="M345 300 C410 250 425 260 455 290"/></circle>
 <path d="M824 315 C875 340 895 330 930 300" fill="none" stroke="#d946ef" stroke-width="3" opacity=".8"/>
 <circle r="6" fill="#f0abfc" filter="url(#glow)"><animateMotion dur="1.5s" repeatCount="indefinite" path="M824 315 C875 340 895 330 930 300"/></circle>

 <text x="640" y="390" text-anchor="middle" class="t b">A snapshot becomes a point in history.</text>
 <text x="640" y="414" text-anchor="middle" class="m s">Git lets you inspect what changed — and return to an earlier state.</text>
</g>

<!-- right: timeline, deliberately floating -->
<g>
 <text x="935" y="128" class="m mono tiny">PROJECT MEMORY</text>
 <line x1="950" y1="175" x2="950" y2="450" stroke="#33466d" stroke-width="3"/>
 <circle cx="950" cy="190" r="12" fill="#22d3ee" filter="url(#glow)"><animate attributeName="r" values="9;15;9" dur="2s" repeatCount="indefinite"/></circle>
 <text x="980" y="195" class="t b">Current state</text>
 <text x="980" y="216" class="m mono tiny">your project • now</text>
 <circle cx="950" cy="278" r="10" fill="#a78bfa"/>
 <text x="980" y="283" class="t b">Saved state</text>
 <text x="980" y="304" class="m mono tiny">before the latest change</text>
 <circle cx="950" cy="366" r="9" fill="#64748b"/>
 <text x="980" y="371" class="t b">Older state</text>
 <text x="980" y="392" class="m mono tiny">earlier project version</text>
 <path d="M950 450 C990 470 1080 470 1140 430" fill="none" stroke="#4b3a7d" stroke-width="2" stroke-dasharray="5 7"/>
 <text x="1145" y="435" class="m mono tiny">inspect / compare / restore</text>
</g>

<!-- bottom command strip -->
<rect x="45" y="505" width="1190" height="68" rx="18" fill="#070f20" stroke="#273958"/>
<text x="70" y="534" class="m mono tiny">DEVELOPER FLOW</text>
<text x="70" y="557" class="t mono s">change</text><text x="137" y="557" fill="#22d3ee" class="mono s">→</text>
<text x="160" y="557" class="t mono s">git add</text><text x="235" y="557" fill="#8b5cf6" class="mono s">→</text>
<text x="258" y="557" class="t mono s">git commit</text><text x="367" y="557" fill="#d946ef" class="mono s">→</text>
<text x="390" y="557" class="t mono s">history</text>
<text x="540" y="557" class="m s">Git = version control that makes your project traceable.</text>
<circle cx="1160" cy="539" r="4" fill="#22d3ee"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
</svg>