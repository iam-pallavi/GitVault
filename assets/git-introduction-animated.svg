<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040D"/><stop offset=".45" stop-color="#0A1025"/><stop offset="1" stop-color="#190728"/></linearGradient>
 <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
 <linearGradient id="cubeA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7A18"/><stop offset="1" stop-color="#F04438"/></linearGradient>
 <linearGradient id="cubeB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F04438"/><stop offset="1" stop-color="#A21CAF"/></linearGradient>
 <linearGradient id="cubeC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF9A3D"/><stop offset="1" stop-color="#D92D20"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2945" stop-opacity=".9"/><stop offset="1" stop-color="#070C19" stop-opacity=".9"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#6366F1" stop-opacity=".5"/><stop offset=".45" stop-color="#22D3EE" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#A8B7D8" stroke-opacity=".045"/></pattern>
 <style>
 .title{font:800 44px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#91A0BA}.label{font:700 11px Inter,Segoe UI,sans-serif;fill:#91A4C2;letter-spacing:2px}.head{font:800 20px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 13px Inter,Segoe UI,sans-serif;fill:#8EA0BC}.code{font:600 14px ui-monospace,Consolas,monospace;fill:#E6FAFF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71839F}
 </style>
</defs>

<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<rect width="1600" height="900" rx="36" fill="url(#grid)"/>
<circle cx="800" cy="420" r="430" fill="url(#halo)" filter="url(#blur)"/>
<circle cx="800" cy="420" r="230" fill="none" stroke="#4F46E5" stroke-opacity=".08" stroke-width="1"/>
<circle cx="800" cy="420" r="310" fill="none" stroke="#22D3EE" stroke-opacity=".06" stroke-width="1"/>

<text x="70" y="60" class="label">GITVAULT / GIT BASICS / 01</text>
<text x="70" y="108" class="title">Git — your project's time machine</text>
<text x="70" y="138" class="sub">A 3D visual story of how code changes become tracked, selected, committed and recoverable.</text>

<!-- central 3D Git core -->
<g transform="translate(800 405)" filter="url(#shadow)">
 <!-- orbit rings -->
 <ellipse rx="430" ry="118" fill="none" stroke="url(#edge)" stroke-opacity=".18" stroke-width="2" transform="rotate(-13)">
  <animateTransform attributeName="transform" type="rotate" from="-13 0 0" to="347 0 0" dur="12s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="350" ry="95" fill="none" stroke="#22D3EE" stroke-opacity=".13" stroke-width="2" transform="rotate(55)">
  <animateTransform attributeName="transform" type="rotate" from="55 0 0" to="415 0 0" dur="10s" repeatCount="indefinite"/>
 </ellipse>
 
 <!-- 3D cube -->
 <g>
  <animateTransform attributeName="transform" type="rotate" values="0 0 0;3 0 0;0 0 0;-3 0 0;0 0 0" dur="5s" repeatCount="indefinite"/>
  <polygon points="-120,-80 0,-150 120,-80 0,-10" fill="url(#cubeA)" stroke="#FFB06A" stroke-width="2"/>
  <polygon points="-120,-80 0,-10 0,140 -120,70" fill="url(#cubeB)" stroke="#FF8C69" stroke-width="2"/>
  <polygon points="0,-10 120,-80 120,70 0,140" fill="url(#cubeC)" stroke="#FFB36B" stroke-width="2"/>
  <path d="M-72 -76L0 -117L72 -76L0 -35Z M-72 -76V45 M72 -76V45 M0 -35V110" fill="none" stroke="#FFF2E8" stroke-opacity=".28" stroke-width="2"/>
  <text x="0" y="-43" text-anchor="middle" style="font:900 31px Inter,Segoe UI,sans-serif;fill:#FFF8F2">GIT</text>
  <circle cx="-34" cy="16" r="7" fill="#FFF" opacity=".9"><animate attributeName="r" values="5;10;5" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="34" cy="16" r="7" fill="#FFF" opacity=".9"><animate attributeName="r" values="5;10;5" dur="1.5s" begin=".5s" repeatCount="indefinite"/></circle>
  <circle cx="0" cy="76" r="7" fill="#FFF" opacity=".9"><animate attributeName="r" values="5;10;5" dur="1.5s" begin="1s" repeatCount="indefinite"/></circle>
  <path d="M-34 16L0 76L34 16" fill="none" stroke="#FFF" stroke-width="4" opacity=".75"/>
 </g>
 
 <!-- floating 3D repository platform -->
 <g transform="translate(0 195)">
  <polygon points="-240,0 0,-70 240,0 0,70" fill="#0B1528" stroke="#334A6A" stroke-width="2"/>
  <polygon points="-240,0 0,70 0,95 -240,25" fill="#07101E" stroke="#243A58"/>
  <polygon points="0,70 240,0 240,25 0,95" fill="#0A1425" stroke="#243A58"/>
  <text x="0" y="15" text-anchor="middle" class="label">REPOSITORY</text>
  <text x="0" y="39" text-anchor="middle" class="code">.git / project history</text>
 </g>
</g>

<!-- left: code enters Git -->
<g transform="translate(75 250)" filter="url(#shadow)">
 <rect width="300" height="300" rx="26" fill="url(#glass)" stroke="#2D4968" stroke-width="2"/>
 <rect width="300" height="5" rx="2" fill="#22D3EE"/>
 <text x="24" y="38" class="label">01 / WORKING DIRECTORY</text>
 <text x="24" y="68" class="head">Your code changes</text>
 <rect x="24" y="92" width="252" height="142" rx="16" fill="#030812" stroke="#20334D"/>
 <text x="43" y="123" class="code">📁 my-project</text>
 <text x="43" y="151" class="body">app.py</text><text x="43" y="177" class="body">index.html</text><text x="43" y="203" class="body">style.css</text>
 <circle cx="250" cy="151" r="5" fill="#FBBF24"><animate attributeName="cy" values="151;203;151" dur="2s" repeatCount="indefinite"/></circle>
 <text x="24" y="266" class="tiny">LIVE FILES • CHANGES HAPPEN HERE</text>
 <!-- code packets -->
 <g fill="#67E8F9" filter="url(#glow)"><circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M270 115 C330 145 380 220 430 285"/></circle></g>
</g>

<!-- right: history -->
<g transform="translate(1225 250)" filter="url(#shadow)">
 <rect width="300" height="300" rx="26" fill="url(#glass)" stroke="#553D7B" stroke-width="2"/>
 <rect width="300" height="5" rx="2" fill="#D946EF"/>
 <text x="24" y="38" class="label">04 / HISTORY</text>
 <text x="24" y="68" class="head">Recoverable checkpoints</text>
 <rect x="24" y="92" width="252" height="142" rx="16" fill="#030812" stroke="#30265B"/>
 <path d="M55 116V215" stroke="#415271" stroke-width="4"/>
 <circle cx="55" cy="122" r="10" fill="#22D3EE" filter="url(#glow)"><animate attributeName="r" values="8;14;8" dur="1.7s" repeatCount="indefinite"/></circle>
 <circle cx="55" cy="168" r="8" fill="#8B5CF6"/>
 <circle cx="55" cy="214" r="8" fill="#475569"/>
 <text x="80" y="128" class="code">v3  HEAD</text><text x="80" y="174" class="body">v2  previous</text><text x="80" y="220" class="body">v1  initial</text>
 <text x="24" y="266" class="tiny">GO BACK • COMPARE • RECOVER</text>
 <!-- history packet -->
 <g fill="#F0ABFC" filter="url(#glow)"><circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M-20 250 C-80 210 -90 130 -5 95"/></circle></g>
</g>

<!-- bottom stage cards: stage + commit -->
<g transform="translate(470 615)" filter="url(#shadow)">
 <rect width="300" height="105" rx="22" fill="url(#glass)" stroke="#2C6973" stroke-width="2"/>
 <text x="22" y="30" class="label">02 / STAGING AREA</text>
 <text x="22" y="58" class="head" style="font-size:18px">Choose the changes</text>
 <text x="22" y="82" class="code">$ git add app.py</text>
 <circle cx="260" cy="56" r="10" fill="#67F5B1" filter="url(#glow)"><animate attributeName="r" values="7;13;7" dur="1.4s" repeatCount="indefinite"/></circle>
</g>

<g transform="translate(830 615)" filter="url(#shadow)">
 <rect width="300" height="105" rx="22" fill="url(#glass)" stroke="#563A79" stroke-width="2"/>
 <text x="22" y="30" class="label">03 / COMMIT</text>
 <text x="22" y="58" class="head" style="font-size:18px">Create a checkpoint</text>
 <text x="22" y="82" class="code">$ git commit -m "Update"</text>
 <circle cx="260" cy="56" r="10" fill="#E879F9" filter="url(#glow)"><animate attributeName="r" values="7;13;7" dur="1.6s" repeatCount="indefinite"/></circle>
</g>

<!-- animated energy paths -->
<g fill="none" stroke-linecap="round">
 <path d="M375 390 C500 390 520 350 620 340" stroke="#22D3EE44" stroke-width="5"/>
 <path d="M980 340 C1080 350 1100 390 1225 390" stroke="#E879F944" stroke-width="5"/>
 <path d="M620 575 C700 540 730 500 760 500" stroke="#67F5B144" stroke-width="5"/>
 <path d="M840 500 C870 540 900 575 980 615" stroke="#E879F944" stroke-width="5"/>
 <circle r="8" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M375 390 C500 390 520 350 620 340"/></circle>
 <circle r="8" fill="#F0ABFC" filter="url(#glow)"><animateMotion dur="2.2s" begin=".7s" repeatCount="indefinite" path="M980 340 C1080 350 1100 390 1225 390"/></circle>
 <circle r="8" fill="#67F5B1" filter="url(#glow)"><animateMotion dur="1.8s" begin=".3s" repeatCount="indefinite" path="M620 575 C700 540 730 500 760 500"/></circle>
 <circle r="8" fill="#E879F9" filter="url(#glow)"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M840 500 C870 540 900 575 980 615"/></circle>
</g>

<!-- bottom message -->
<g transform="translate(70 770)">
 <rect width="1460" height="82" rx="24" fill="#070C18" stroke="#293D5D" stroke-width="2"/>
 <text x="30" y="31" class="label">THE IDEA IN ONE MOTION</text>
 <text x="30" y="59" class="t" style="font:800 21px Inter,Segoe UI,sans-serif;fill:#F8FAFC">CHANGE → TRACK → STAGE → COMMIT → HISTORY → RECOVER</text>
 <text x="1110" y="51" style="font:800 13px Inter,Segoe UI,sans-serif;fill:#67E8F9">VERSION CONTROL</text>
</g>

<!-- particles -->
<g fill="#67E8F9" opacity=".65">
 <circle cx="420" cy="160" r="2"><animate attributeName="cy" values="160;135;160" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="800" cy="170" r="2"><animate attributeName="cy" values="170;195;170" dur="2.5s" repeatCount="indefinite"/></circle>
 <circle cx="1180" cy="160" r="2"><animate attributeName="cy" values="160;135;160" dur="3.3s" repeatCount="indefinite"/></circle>
 <circle cx="1450" cy="590" r="2"><animate attributeName="cx" values="1450;1425;1450" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
</svg>