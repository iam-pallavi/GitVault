<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".48" stop-color="#0a1024"/><stop offset="1" stop-color="#180d2c"/></linearGradient>
 <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#6366f1"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <linearGradient id="git" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <style>
 .t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{font-size:35px;font-weight:900}.h{font-size:17px;font-weight:800}.s{font-size:12px}.xs{font-size:10px}.cmd{font-size:12px;fill:#67e8f9}
 </style>
</defs>

<rect width="1500" height="820" rx="30" fill="url(#bg)"/>
<circle cx="760" cy="400" r="280" fill="#4f46e5" opacity=".06" filter="url(#blur)"><animate attributeName="r" values="250;310;250" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="140" cy="180" r="120" fill="#22d3ee" opacity=".045" filter="url(#blur)"/>
<circle cx="1370" cy="620" r="150" fill="#d946ef" opacity=".045" filter="url(#blur)"/>

<text x="58" y="62" class="t title">Git Introduction</text>
<text x="58" y="91" class="m s">A visual explanation of what Git actually does with your project.</text>
<text x="1442" y="62" text-anchor="end" class="m mono xs">LOCAL VERSION CONTROL</text>

<!-- STEP 1 -->
<g>
 <text x="65" y="138" class="m mono xs">01</text>
 <text x="95" y="138" class="t h">YOU WRITE & CHANGE CODE</text>
 <rect x="55" y="160" width="300" height="390" rx="22" fill="#050b18" stroke="#263754"/>
 <rect x="75" y="185" width="260" height="42" rx="10" fill="#0c1528" stroke="#243957"/>
 <circle cx="94" cy="206" r="5" fill="#fb7185"/><circle cx="111" cy="206" r="5" fill="#fbbf24"/><circle cx="128" cy="206" r="5" fill="#4ade80"/>
 <text x="148" y="211" class="m mono xs">VS CODE • project/</text>
 <g class="mono s">
  <text x="80" y="260" class="m">app.py</text><text x="80" y="285" class="t">def login(user):</text><text x="80" y="308" fill="#67e8f9">    validate(user)</text>
  <text x="80" y="345" class="m">config.yml</text><text x="80" y="370" fill="#c4b5fd">port: 8080</text>
  <text x="80" y="407" class="m">README.md</text><text x="80" y="432" fill="#f0abfc"># My Project</text>
 </g>
 <rect x="75" y="465" width="260" height="55" rx="12" fill="#071c26" stroke="#155e75"/>
 <text x="90" y="488" class="m mono xs">WORKING DIRECTORY</text>
 <text x="90" y="508" class="t mono xs">files are changing here</text>
 <circle cx="322" cy="180" r="6" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
</g>

<!-- STEP 2 GIT DETECTS -->
<g>
 <text x="390" y="138" class="m mono xs">02</text>
 <text x="420" y="138" class="t h">GIT TRACKS THE CHANGES</text>
 <rect x="380" y="160" width="300" height="390" rx="22" fill="#060b19" stroke="#29416a"/>
 <circle cx="530" cy="300" r="76" fill="#0a1020" stroke="url(#flow)" stroke-width="3" filter="url(#glow)">
  <animate attributeName="r" values="70;82;70" dur="2.2s" repeatCount="indefinite"/>
 </circle>
 <!-- git logo-ish branching mark -->
 <path d="M495 270 C535 270 565 300 565 335 M495 270 C495 300 515 315 540 315 M565 335 C565 365 545 385 515 385" fill="none" stroke="url(#git)" stroke-width="8" stroke-linecap="round"/>
 <circle cx="495" cy="270" r="13" fill="#f97316"/><circle cx="565" cy="335" r="13" fill="#ef4444"/><circle cx="515" cy="385" r="13" fill="#fb7185"/>
 <text x="530" y="440" text-anchor="middle" class="t mono h">GIT</text>
 <text x="530" y="461" text-anchor="middle" class="m mono xs">VERSION CONTROL SYSTEM</text>
 <rect x="405" y="485" width="250" height="42" rx="10" fill="#081423" stroke="#164e63"/>
 <text x="425" y="511" class="cmd mono">$ git status</text>
 <text x="610" y="511" class="m mono xs">→ detects changes</text>
 <!-- packets -->
 <g>
  <rect width="86" height="24" rx="8" fill="#10283a" stroke="#22d3ee"><animateMotion dur="1.8s" repeatCount="indefinite" path="M355 350 L450 350"/></rect>
  <text class="t mono xs" x="10" y="17">app.py changed</text>
 </g>
</g>

<!-- STEP 3 STAGE -->
<g>
 <text x="715" y="138" class="m mono xs">03</text>
 <text x="745" y="138" class="t h">YOU CHOOSE WHAT TO SAVE</text>
 <rect x="705" y="160" width="300" height="390" rx="22" fill="#070b1b" stroke="#44358a"/>
 <text x="730" y="193" class="m mono xs">WORKING DIRECTORY</text>
 <rect x="730" y="210" width="250" height="65" rx="12" fill="#0b1425" stroke="#283c5d"/>
 <text x="750" y="235" class="t mono s">app.py</text><text x="900" y="235" fill="#4ade80" class="mono xs">changed ✓</text>
 <text x="750" y="258" class="t mono s">config.yml</text><text x="900" y="258" fill="#fbbf24" class="mono xs">changed</text>
 
 <path d="M855 282 L855 330" stroke="url(#flow)" stroke-width="4" stroke-dasharray="7 7"/>
 <circle r="7" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="1s" repeatCount="indefinite" path="M855 282 L855 330"/></circle>
 <text x="875" y="314" class="m mono xs">git add</text>
 
 <rect x="730" y="340" width="250" height="90" rx="14" fill="#100d27" stroke="#6d4cc8"/>
 <text x="750" y="365" class="m mono xs">STAGING AREA / INDEX</text>
 <text x="750" y="392" class="t mono s">✓ app.py</text><text x="750" y="414" class="m mono xs">ready for next snapshot</text>
 <rect x="730" y="455" width="250" height="60" rx="12" fill="#0a1022" stroke="#4c3a7d"/>
 <text x="750" y="479" class="cmd mono">$ git add app.py</text>
 <text x="750" y="499" class="m mono xs">selected change → staged</text>
</g>

<!-- STEP 4 COMMIT -->
<g>
 <text x="1040" y="138" class="m mono xs">04</text>
 <text x="1070" y="138" class="t h">GIT CREATES A SNAPSHOT</text>
 <rect x="1030" y="160" width="415" height="390" rx="22" fill="#080b1c" stroke="#5c3b9e"/>
 <text x="1060" y="193" class="m mono xs">COMMIT = SAVED PROJECT STATE</text>
 
 <!-- snapshot object -->
 <rect x="1080" y="220" width="315" height="150" rx="18" fill="#0c1025" stroke="url(#flow)" stroke-width="2" filter="url(#glow)"/>
 <circle cx="1115" cy="252" r="12" fill="#8b5cf6"/><text x="1140" y="257" class="t mono s">NEW COMMIT</text>
 <text x="1100" y="292" class="m mono xs">Commit message</text>
 <text x="1100" y="316" class="t mono s">"add login validation"</text>
 <text x="1100" y="344" class="m mono xs">Commit ID: abc1234</text>
 <circle cx="1360" cy="252" r="7" fill="#22d3ee" filter="url(#glow)"><animate attributeName="r" values="5;11;5" dur="1.7s" repeatCount="indefinite"/></circle>
 
 <path d="M1235 372 L1235 414" stroke="url(#flow)" stroke-width="4" stroke-dasharray="7 7"/>
 <circle r="7" fill="#e879f9" filter="url(#glow)"><animateMotion dur="1s" repeatCount="indefinite" path="M1235 372 L1235 414"/></circle>
 
 <rect x="1060" y="425" width="355" height="88" rx="14" fill="#0a1022" stroke="#34466c"/>
 <text x="1080" y="450" class="m mono xs">GIT HISTORY</text>
 <circle cx="1090" cy="480" r="7" fill="#22d3ee"/><circle cx="1180" cy="480" r="7" fill="#6366f1"/><circle cx="1270" cy="480" r="7" fill="#e879f9"/>
 <line x1="1097" y1="480" x2="1173" y2="480" stroke="#475569"/><line x1="1187" y1="480" x2="1263" y2="480" stroke="#475569"/>
 <text x="1080" y="502" class="m mono xs">older</text><text x="1165" y="502" class="m mono xs">previous</text><text x="1255" y="502" class="t mono xs">current</text>
</g>

<!-- FLOW ARROW / EXPLANATION -->
<g>
 <path d="M115 625 C360 590 600 590 750 625 C920 664 1110 664 1375 625" fill="none" stroke="#263754" stroke-width="5"/>
 <path d="M115 625 C360 590 600 590 750 625 C920 664 1110 664 1375 625" fill="none" stroke="url(#flow)" stroke-width="4" stroke-dasharray="10 12"/>
 <circle r="7" fill="#fff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M115 625 C360 590 600 590 750 625 C920 664 1110 664 1375 625"/></circle>
 
 <text x="750" y="690" text-anchor="middle" class="t" font-size="22" font-weight="900">THE CORE IDEA</text>
 <text x="750" y="720" text-anchor="middle" class="m s">Git watches your project changes and lets you save meaningful versions of your work.</text>
 <text x="750" y="745" text-anchor="middle" class="m s">You can inspect history, compare changes, undo safely, and return to an earlier version.</text>
 <rect x="330" y="770" width="840" height="28" rx="14" fill="#07101e" stroke="#2a3c5d"/>
 <text x="750" y="789" text-anchor="middle" class="t mono xs">WRITE → TRACK → STAGE → COMMIT → HISTORY → SAFE CONTROL OVER YOUR CODE</text>
</g>

<!-- moving file stream across top -->
<g opacity=".85">
 <rect x="355" y="100" width="72" height="20" rx="7" fill="#0d2434" stroke="#22d3ee"><animateMotion dur="3.5s" repeatCount="indefinite" path="M0 0 L1000 0"/></rect>
 <text x="365" y="114" class="t mono xs"><animateMotion dur="3.5s" repeatCount="indefinite" path="M0 0 L1000 0"/>changes</text>
</g>
</svg>