<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#0b1024"/><stop offset="1" stop-color="#180b30"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <style>
 .t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{font-size:34px;font-weight:850}.h{font-size:20px;font-weight:800}.b{font-size:15px;font-weight:750}.s{font-size:13px}.tiny{font-size:10px}
 </style>
</defs>
<rect width="1400" height="720" rx="30" fill="url(#bg)"/>
<circle cx="180" cy="140" r="170" fill="#06b6d4" opacity=".06" filter="url(#blur)"><animate attributeName="r" values="145;185;145" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1190" cy="560" r="210" fill="#7c3aed" opacity=".08" filter="url(#blur)"><animate attributeName="r" values="180;230;180" dur="8s" repeatCount="indefinite"/></circle>

<text x="55" y="58" class="t title">Git Introduction</text>
<text x="55" y="86" class="m s">Think of Git as a checkpoint system for your project — your files keep changing, but important states can be saved.</text>
<text x="1345" y="57" text-anchor="end" class="m mono tiny">VERSION CONTROL • CONCEPT</text>

<!-- LIVE PROJECT -->
<g>
 <text x="55" y="125" class="m mono tiny">01 • LIVE PROJECT</text>
 <rect x="55" y="145" width="360" height="390" rx="24" fill="#070d1b" stroke="#263858"/>
 <circle cx="80" cy="172" r="5" fill="#fb7185"/><circle cx="97" cy="172" r="5" fill="#facc15"/><circle cx="114" cy="172" r="5" fill="#4ade80"/>
 <text x="138" y="177" class="m mono tiny">~/cloud-app</text>
 <rect x="78" y="205" width="314" height="190" rx="14" fill="#030812" stroke="#1d3150"/>
 <text x="96" y="230" class="m mono tiny">server.py</text>
 <text x="96" y="260" class="m mono tiny">01  def deploy():</text>
 <text x="96" y="283" class="m mono tiny">02      status =</text>
 <text x="96" y="306" class="m mono tiny">03      <tspan fill="#22d3ee">"production"</tspan></text>
 <text x="96" y="329" class="m mono tiny">04      return status</text>
 <rect x="89" y="294" width="230" height="25" rx="6" fill="#22d3ee" opacity=".09">
   <animate attributeName="x" values="89;105;89" dur="2.8s" repeatCount="indefinite"/>
 </rect>
 <text x="78" y="435" class="t b">You keep editing the project.</text>
 <text x="78" y="459" class="m s">Code changes → files change → project moves forward.</text>
 <rect x="78" y="481" width="314" height="32" rx="10" fill="#111b31" stroke="#33476d"/>
 <circle cx="96" cy="497" r="5" fill="#fbbf24"><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></circle>
 <text x="111" y="501" class="m mono tiny">CURRENT STATE • always changing</text>
</g>

<!-- SNAPSHOT ACTION -->
<g>
 <text x="445" y="125" class="m mono tiny">02 • GIT CREATES A CHECKPOINT</text>
 <rect x="445" y="145" width="510" height="390" rx="24" fill="#080d20" stroke="#343d67"/>
 <circle cx="700" cy="318" r="105" fill="#0a1430" stroke="url(#cyan)" stroke-width="3" opacity=".95"/>
 <circle cx="700" cy="318" r="82" fill="none" stroke="#33466d" stroke-width="2" stroke-dasharray="5 8">
   <animateTransform attributeName="transform" type="rotate" from="0 700 318" to="360 700 318" dur="12s" repeatCount="indefinite"/>
 </circle>
 <text x="700" y="301" text-anchor="middle" class="t mono" font-size="27" font-weight="850">GIT</text>
 <text x="700" y="325" text-anchor="middle" class="m mono tiny">SAVE A SNAPSHOT</text>
 <text x="700" y="350" text-anchor="middle" class="m s">of the project state</text>

 <!-- camera aperture -->
 <g transform="translate(700 318)" fill="none" stroke="#8b5cf6" stroke-width="3" opacity=".85">
  <path d="M-34-34 L-12-44 L8-36 L-4-12 L-30-12 Z"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></path>
 </g>

 <!-- packets entering snapshot -->
 <g>
  <rect x="472" y="278" width="92" height="28" rx="8" fill="#0c2130" stroke="#1d7d91"/>
  <text x="518" y="296" text-anchor="middle" class="t mono tiny">server.py</text>
  <circle r="5" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M564 292 C600 292 620 305 635 318"/></circle>
  <rect x="836" y="278" width="92" height="28" rx="8" fill="#17112d" stroke="#6d4cc1"/>
  <text x="882" y="296" text-anchor="middle" class="t mono tiny">README</text>
  <circle r="5" fill="#d8b4fe" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M836 292 C800 292 780 305 765 318"/></circle>
 </g>

 <text x="700" y="445" text-anchor="middle" class="t h">A checkpoint is a saved version.</text>
 <text x="700" y="470" text-anchor="middle" class="m s">Git remembers what the project looked like at that moment.</text>
 <text x="700" y="505" text-anchor="middle" fill="#67e8f9" class="mono tiny">WORKING FILES  →  SNAPSHOT  →  HISTORY</text>
</g>

<!-- HISTORY -->
<g>
 <text x="985" y="125" class="m mono tiny">03 • YOUR PROJECT GETS A MEMORY</text>
 <rect x="985" y="145" width="360" height="390" rx="24" fill="#080d1d" stroke="#2d3d60"/>
 <text x="1012" y="180" class="t h">Project history</text>
 <text x="1012" y="201" class="m mono tiny">older → newer</text>
 <line x1="1040" y1="232" x2="1040" y2="466" stroke="#33466d" stroke-width="3"/>
 <circle cx="1040" cy="248" r="10" fill="#22d3ee" filter="url(#glow)"/>
 <circle cx="1040" cy="327" r="10" fill="#8b5cf6"/>
 <circle cx="1040" cy="406" r="10" fill="#e879f9"/>
 <circle cx="1040" cy="466" r="10" fill="#f8fafc"/>
 <text x="1070" y="244" class="t b">Checkpoint 1</text>
 <text x="1070" y="263" class="m mono tiny">project starts</text>
 <text x="1070" y="323" class="t b">Checkpoint 2</text>
 <text x="1070" y="342" class="m mono tiny">feature added</text>
 <text x="1070" y="402" class="t b">Checkpoint 3</text>
 <text x="1070" y="421" class="m mono tiny">bug fixed</text>
 <text x="1070" y="462" class="t b">Current state</text>
 <text x="1070" y="481" class="m mono tiny">you are here</text>
 <circle r="6" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M1040 466 L1040 248"/></circle>
</g>

<!-- CONNECTION / CORE IDEA -->
<path d="M415 335 C430 335 435 335 445 335" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="7 8"/>
<path d="M955 335 C970 335 975 335 985 335" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="7 8"/>
<circle r="6" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M415 335 C430 335 435 335 445 335"/></circle>
<circle r="6" fill="#d8b4fe" filter="url(#glow)"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M955 335 C970 335 975 335 985 335"/></circle>

<!-- WHAT YOU GET -->
<g>
 <rect x="55" y="575" width="1290" height="92" rx="20" fill="#070d1a" stroke="#263957"/>
 <text x="82" y="607" class="m mono tiny">THE POINT OF GIT</text>
 <text x="82" y="637" class="t h">Your project can change without losing its past.</text>
 <text x="82" y="657" class="m s">Track changes • save checkpoints • see what changed • move back to a known version when needed</text>
 <text x="1307" y="635" text-anchor="end" fill="#67e8f9" class="mono b">GIT = VERSION CONTROL</text>
 </g>
</svg>