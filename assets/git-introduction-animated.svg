<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#0b1026"/><stop offset="1" stop-color="#160b2c"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
 <style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f5f7ff}.m{font-family:Inter,Segoe UI,sans-serif;fill:#91a4c7}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.h{font-size:32px;font-weight:800}.b{font-size:18px;font-weight:750}.s{font-size:14px}.tiny{font-size:11px}</style>
</defs>
<rect width="1280" height="620" rx="30" fill="url(#bg)"/>
<circle cx="1040" cy="120" r="170" fill="#7c3aed" opacity=".10" filter="url(#soft)"><animate attributeName="r" values="150;185;150" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="210" cy="450" r="160" fill="#06b6d4" opacity=".07" filter="url(#soft)"><animate attributeName="r" values="135;180;135" dur="8s" repeatCount="indefinite"/></circle>

<text x="52" y="55" class="t h">Git Introduction</text>
<text x="52" y="82" class="m s">Git watches your project change — and keeps a history of the versions you save.</text>
<text x="1228" y="53" text-anchor="end" class="m mono tiny">VERSION CONTROL • LOCAL</text>

<!-- PROJECT / WORKING FILE -->
<g>
 <rect x="42" y="120" width="275" height="340" rx="20" fill="#07101f" stroke="#263957"/>
 <circle cx="66" cy="146" r="5" fill="#fb7185"/><circle cx="83" cy="146" r="5" fill="#facc15"/><circle cx="100" cy="146" r="5" fill="#4ade80"/>
 <text x="120" y="151" class="m mono tiny">~/my-project</text>
 <text x="65" y="185" class="m mono tiny">WORKING FOLDER</text>
 <rect x="62" y="202" width="235" height="150" rx="12" fill="#040a14" stroke="#1d3150"/>
 <text x="78" y="224" class="m mono tiny">app.py</text>
 <text x="78" y="252" class="m mono tiny">01  def hello():</text>
 <text x="78" y="274" class="m mono tiny">02    print(</text>
 <text x="78" y="296" fill="#22d3ee" class="mono tiny">03    "Hello World"</text>
 <text x="78" y="318" class="m mono tiny">04  )</text>
 <rect x="73" y="287" width="165" height="23" rx="5" fill="#22d3ee" opacity=".10">
  <animate attributeName="x" values="73;88;73" dur="3s" repeatCount="indefinite"/>
 </rect>
 <text x="65" y="383" class="t b">Developer changes code</text>
 <text x="65" y="407" class="m s">Version 1 → Version 2 → Version 3</text>
 <text x="65" y="438" fill="#fbbf24" class="mono tiny">modified: app.py</text>
</g>

<!-- FLOW ARROW 1 -->
<g>
 <path d="M320 290 C350 250 370 250 405 290" fill="none" stroke="#22d3ee" stroke-width="3" opacity=".5"/>
 <circle r="7" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M320 290 C350 250 370 250 405 290"/></circle>
 <text x="362" y="238" text-anchor="middle" class="m mono tiny">SAVE A VERSION</text>
</g>

<!-- GIT CORE -->
<g>
 <text x="640" y="122" text-anchor="middle" class="m mono tiny">WHAT GIT DOES</text>
 <rect x="408" y="145" width="465" height="300" rx="28" fill="#070d20" stroke="#303d63"/>
 <circle cx="640" cy="294" r="72" fill="#0b1430" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)">
  <animate attributeName="r" values="68;76;68" dur="2.8s" repeatCount="indefinite"/>
 </circle>
 <text x="640" y="286" text-anchor="middle" class="t mono" font-size="25" font-weight="800">GIT</text>
 <text x="640" y="308" text-anchor="middle" class="m mono tiny">VERSION HISTORY</text>

 <!-- snapshots orbiting around git -->
 <path d="M485 294 C485 205 795 205 795 294" fill="none" stroke="#28385c" stroke-width="2" stroke-dasharray="6 8"/>
 <path d="M485 294 C485 383 795 383 795 294" fill="none" stroke="#28385c" stroke-width="2" stroke-dasharray="6 8"/>

 <g>
  <circle cx="495" cy="294" r="27" fill="#071827" stroke="#22d3ee" stroke-width="2"/>
  <text x="495" y="291" text-anchor="middle" class="t mono tiny">V1</text><text x="495" y="307" text-anchor="middle" class="m tiny">saved</text>
  <circle cx="640" cy="194" r="27" fill="#120d29" stroke="#8b5cf6" stroke-width="2"/>
  <text x="640" y="191" text-anchor="middle" class="t mono tiny">V2</text><text x="640" y="207" text-anchor="middle" class="m tiny">saved</text>
  <circle cx="785" cy="294" r="27" fill="#180d27" stroke="#e879f9" stroke-width="2"/>
  <text x="785" y="291" text-anchor="middle" class="t mono tiny">V3</text><text x="785" y="307" text-anchor="middle" class="m tiny">current</text>
 </g>

 <circle r="6" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M495 294 C495 205 795 205 795 294 C795 383 485 383 495 294"/></circle>

 <text x="640" y="365" text-anchor="middle" class="t b">Every saved version has a place in history.</text>
 <text x="640" y="388" text-anchor="middle" class="m s">You can look back, compare versions, or return to an earlier state.</text>
</g>

<!-- HISTORY / REWIND -->
<g>
 <text x="920" y="122" class="m mono tiny">GIT HISTORY</text>
 <rect x="918" y="145" width="318" height="300" rx="22" fill="#080e20" stroke="#29385b"/>
 <line x1="962" y1="194" x2="962" y2="395" stroke="#34466f" stroke-width="3"/>
 <circle cx="962" cy="205" r="10" fill="#e879f9" filter="url(#glow)"/>
 <circle cx="962" cy="280" r="9" fill="#8b5cf6"/>
 <circle cx="962" cy="355" r="9" fill="#22d3ee"/>
 <text x="990" y="201" class="t b">Version 3</text>
 <text x="990" y="220" class="m mono tiny">current project</text>
 <text x="990" y="276" class="t b">Version 2</text>
 <text x="990" y="295" class="m mono tiny">previous saved state</text>
 <text x="990" y="351" class="t b">Version 1</text>
 <text x="990" y="370" class="m mono tiny">older saved state</text>
 <rect x="946" y="401" width="265" height="28" rx="9" fill="#121a32" stroke="#3d4d72">
  <animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.5s" repeatCount="indefinite"/>
 </rect>
 <text x="1078" y="420" text-anchor="middle" class="m mono tiny">inspect • compare • restore</text>
</g>

<!-- REWIND LOOP -->
<g>
 <path d="M918 465 C820 520 555 520 390 455 C315 425 270 370 270 315" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 9" opacity=".65"/>
 <circle r="6" fill="#d8b4fe" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M918 465 C820 520 555 520 390 455 C315 425 270 370 270 315"/></circle>
 <text x="640" y="507" text-anchor="middle" class="t b">Need an older version?</text>
 <text x="640" y="529" text-anchor="middle" class="m s">Git keeps the history so your project is not just “now” — it has a past.</text>
</g>

<!-- bottom definition -->
<rect x="42" y="555" width="1194" height="40" rx="14" fill="#070d1c" stroke="#243553"/>
<text x="640" y="581" text-anchor="middle" class="t mono s">GIT = Version Control System • tracks changes • saves versions • lets you inspect and return to history</text>
</svg>