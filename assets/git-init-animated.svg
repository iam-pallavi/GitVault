<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050817"/><stop offset=".55" stop-color="#100d2b"/><stop offset="1" stop-color="#1b0d3b"/></linearGradient><linearGradient id="neon"><stop stop-color="#9b6cff"/><stop offset="1" stop-color="#48e7ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="28"/></filter></defs><rect width="1200" height="420" rx="34" fill="url(#bg)"/><circle cx="130" cy="80" r="130" fill="#7c5cff" opacity=".11" filter="url(#soft)"/><circle cx="1080" cy="330" r="150" fill="#48e7ff" opacity=".08" filter="url(#soft)"/><g fill="#fff" opacity=".4"><circle cx="80" cy="120" r="2"><animate attributeName="cy" values="120;100;120" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="1100" cy="100" r="2"><animate attributeName="cy" values="100;125;100" dur="4s" repeatCount="indefinite"/></circle><circle cx="1020" cy="350" r="1.7"><animate attributeName="cy" values="350;330;350" dur="3s" repeatCount="indefinite"/></circle></g><text x="600" y="58" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git init</text><text x="600" y="86" text-anchor="middle" fill="#aab2d8" font-family="system-ui" font-size="14">turn a normal project folder into a local Git repository</text><g font-family="system-ui"><rect x="55" y="145" width="310" height="145" rx="27" fill="#10152d" fill-opacity=".9" stroke="#8b67ff" stroke-width="2"/><rect x="445" y="145" width="310" height="145" rx="27" fill="#10172e" fill-opacity=".9" stroke="#4ce5ff" stroke-width="2"/><rect x="835" y="145" width="310" height="145" rx="27" fill="#11152f" fill-opacity=".9" stroke="#a26dff" stroke-width="2"/><text x="210" y="190" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">Project Folder</text><text x="210" y="219" text-anchor="middle" fill="#8d97bd" font-size="13">your code + files</text><text x="210" y="250" text-anchor="middle" fill="#c6cae3" font-family="monospace" font-size="14">my-project/</text><text x="600" y="190" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">git init</text><text x="600" y="219" text-anchor="middle" fill="#8d97bd" font-size="13">initialize Git</text><text x="600" y="250" text-anchor="middle" fill="#6fe9ff" font-family="monospace" font-size="14">$ git init</text><text x="990" y="190" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">.git</text><text x="990" y="219" text-anchor="middle" fill="#8d97bd" font-size="13">hidden Git metadata</text><text x="990" y="250" text-anchor="middle" fill="#d0baff" font-family="monospace" font-size="14">repository ready</text></g><path d="M365 218H445M755 218H835" stroke="#30365f" stroke-width="9" stroke-linecap="round"/><path d="M365 218H445M755 218H835" stroke="url(#neon)" stroke-width="3" stroke-dasharray="9 12"><animate attributeName="stroke-dashoffset" from="0" to="-42" dur="1s" repeatCount="indefinite"/></path><g filter="url(#glow)"><circle r="8" fill="#a98bff"><animateMotion dur="1.7s" repeatCount="indefinite" path="M365 218H445"/></circle><circle r="8" fill="#55e6ff"><animateMotion dur="1.7s" begin=".55s" repeatCount="indefinite" path="M755 218H835"/></circle></g><circle cx="600" cy="218" r="48" fill="none" stroke="#55e6ff" opacity=".18"><animate attributeName="r" values="38;58;38" dur="2.2s" repeatCount="indefinite"/></circle><text x="600" y="365" text-anchor="middle" fill="#7f89b2" font-family="monospace" font-size="13">local repository created • GitHub connection comes later</text></svg>