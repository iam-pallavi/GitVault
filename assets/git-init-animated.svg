<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b"><stop stop-color="#050817"/><stop offset="1" stop-color="#180d32"/></linearGradient><linearGradient id="g"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git init</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">initialize Git inside an existing project directory</text><rect x="70" y="115" width="1060" height="245" rx="18" fill="#080c19" stroke="#293152"/><rect x="90" y="135" width="1020" height="34" rx="8" fill="#11172a"/><circle cx="108" cy="152" r="5" fill="#ff6b6b"/><circle cx="126" cy="152" r="5" fill="#ffd166"/><circle cx="144" cy="152" r="5" fill="#5ee38b"/><text x="170" y="157" fill="#8792b5" font-family="monospace" font-size="11">developer@local ~/my-project</text><text x="105" y="205" fill="#cfd5ee" font-family="monospace" font-size="15">$ ls</text><text x="105" y="232" fill="#aeb7d5" font-family="monospace" font-size="13">README.md   app.py   requirements.txt</text><text x="105" y="270" fill="#cfd5ee" font-family="monospace" font-size="15">$ git init</text><text x="105" y="297" fill="#73e6b1" font-family="monospace" font-size="13">Initialized empty Git repository in ~/my-project/.git/</text><text x="105" y="332" fill="#7e89ad" font-family="monospace" font-size="12">working tree</text><rect x="260" y="318" width="95" height="3" fill="url(#g)"/><text x="375" y="332" fill="#7e89ad" font-family="monospace" font-size="12">.git metadata created</text><g><circle r="7" fill="#4de7ff"><animateMotion dur="1.7s" repeatCount="indefinite" path="M260 320H355"/></circle></g><path d="M260 320H355" stroke="url(#g)" stroke-width="2" stroke-dasharray="7 8"/><rect x="815" y="210" width="230" height="92" rx="12" fill="#0d1324" stroke="#4de7ff"/><text x="930" y="238" text-anchor="middle" fill="#4de7ff" font-family="monospace" font-size="13">.git/</text><text x="930" y="262" text-anchor="middle" fill="#aab4d2" font-family="system-ui" font-size="11">objects • refs • HEAD</text><text x="930" y="283" text-anchor="middle" fill="#6f7b9e" font-family="system-ui" font-size="10">local repository metadata</text></g><text x="600" y="405" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git init creates the local repository — no commit exists yet</text></svg>