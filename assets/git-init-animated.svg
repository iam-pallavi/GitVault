<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02040d"/><stop offset=".48" stop-color="#0b1022"/><stop offset="1" stop-color="#1b0b35"/></linearGradient>
 <linearGradient id="flow"><stop stop-color="#b58cff"/><stop offset=".5" stop-color="#6f7cff"/><stop offset="1" stop-color="#45e6ff"/></linearGradient>
 <linearGradient id="term" x2="0" y2="1"><stop stop-color="#111a2e"/><stop offset="1" stop-color="#070b16"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <clipPath id="screen"><rect x="54" y="106" width="510" height="306" rx="18"/></clipPath>
</defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<circle cx="950" cy="180" r="150" fill="#6c4cff" opacity=".07" filter="url(#soft)"/>
<circle cx="250" cy="390" r="130" fill="#00d9ff" opacity=".045" filter="url(#soft)"/>
<g opacity=".1" stroke="#8790b5" stroke-width="1"><path d="M40 100H1160M40 150H1160M40 200H1160M40 250H1160M40 300H1160M40 350H1160M40 400H1160M40 450H1160"/><path d="M100 80V470M200 80V470M300 80V470M400 80V470M500 80V470M600 80V470M700 80V470M800 80V470M900 80V470M1000 80V470M1100 80V470"/></g>
<text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git init</text>
<text x="600" y="75" text-anchor="middle" fill="#aab3d1" font-family="system-ui" font-size="13">Turn an ordinary project folder into a Git repository</text>
<!-- terminal -->
<rect x="54" y="106" width="510" height="306" rx="18" fill="url(#term)" stroke="#34405f" stroke-width="1.5"/>
<rect x="54" y="106" width="510" height="42" rx="18" fill="#121a2d"/>
<circle cx="82" cy="127" r="5" fill="#ff657f"/><circle cx="100" cy="127" r="5" fill="#ffc75f"/><circle cx="118" cy="127" r="5" fill="#5ce1b0"/>
<text x="145" y="132" fill="#7f8cac" font-family="monospace" font-size="11">pallavi@devbox  ~/my-project</text>
<g font-family="monospace" font-size="13">
 <text x="82" y="178" fill="#dfe5f5">$ ls</text><text x="82" y="201" fill="#8d9ab8">README.md   app.py   requirements.txt</text>
 <text x="82" y="240" fill="#dfe5f5">$ git init</text>
 <rect x="82" y="252" width="0" height="3" rx="2" fill="#45e6ff"><animate attributeName="width" values="0;350;0" dur="3.8s" repeatCount="indefinite"/></rect>
 <g opacity="0"><text x="82" y="283" fill="#65e4b0">Initialized empty Git repository</text><text x="82" y="304" fill="#65e4b0">in /my-project/.git/</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.31;.36;.76;1" dur="3.8s" repeatCount="indefinite"/></g>
 <text x="82" y="342" fill="#7685a6">$ git status</text>
 <text x="82" y="366" fill="#9ca8c5">On branch main • No commits yet</text>
</g>
<!-- filesystem transformation -->
<text x="650" y="135" fill="#8e9aba" font-family="system-ui" font-size="12" font-weight="800">WHAT GIT INIT ACTUALLY CREATES</text>
<g font-family="monospace" font-size="12">
 <rect x="650" y="164" width="180" height="38" rx="8" fill="#0d1425" stroke="#303c60"/><text x="665" y="188" fill="#d9dff0">my-project/</text>
 <rect x="650" y="211" width="180" height="34" rx="8" fill="#0d1425" stroke="#303c60"/><text x="665" y="233" fill="#bfc8de">├─ README.md</text>
 <rect x="650" y="253" width="180" height="34" rx="8" fill="#0d1425" stroke="#303c60"/><text x="665" y="275" fill="#bfc8de">├─ app.py</text>
 <rect x="650" y="295" width="180" height="34" rx="8" fill="#0d1425" stroke="#303c60"/><text x="665" y="317" fill="#bfc8de">└─ requirements.txt</text>
</g>
<path d="M840 246 C885 246 885 232 930 232" fill="none" stroke="#303b5a" stroke-width="8"/>
<path d="M840 246 C885 246 885 232 930 232" fill="none" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".6s" repeatCount="indefinite"/></path>
<circle r="6" fill="#55eaff" filter="url(#glow)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M840 246 C885 246 885 232 930 232"/></circle>
<!-- .git -->
<rect x="930" y="154" width="195" height="180" rx="15" fill="#071525" stroke="#45e6ff" stroke-width="1.4"/>
<text x="1027" y="183" text-anchor="middle" fill="#45e6ff" font-family="monospace" font-size="19" font-weight="800">.git/</text>
<g font-family="monospace" font-size="10" fill="#b5bfd8"><text x="952" y="208">HEAD</text><text x="952" y="229">config</text><text x="952" y="250">objects/</text><text x="952" y="271">refs/</text><text x="952" y="292">index*</text></g>
<text x="1027" y="316" text-anchor="middle" fill="#697999" font-family="system-ui" font-size="9">repository metadata</text>
<circle cx="1027" cy="240" r="35" fill="none" stroke="#45e6ff" opacity="0"><animate attributeName="r" values="25;75;25" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="2.2s" repeatCount="indefinite"/></circle>
<!-- subtle live activity -->
<g font-family="monospace" font-size="10"><rect x="650" y="354" width="475" height="48" rx="12" fill="#080e1c" stroke="#263352"/><text x="670" y="375" fill="#71809f">filesystem event</text><text x="790" y="375" fill="#5ee7b2">.git/ created</text><circle cx="1088" cy="373" r="4" fill="#5ee7b2"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></circle><text x="670" y="392" fill="#8794b3">working tree remains unchanged • history is still empty</text></g>
<rect x="315" y="430" width="570" height="42" rx="21" fill="#080c19" stroke="#46527b"/>
<text x="600" y="457" text-anchor="middle" fill="#c0c7dd" font-family="monospace" font-size="12">git init  →  .git/ created  →  repository ready</text>
<text x="600" y="495" text-anchor="middle" fill="#697596" font-family="system-ui" font-size="11">Your files are not committed yet — Git now knows how to track them.</text>
</svg>