<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050713"/><stop offset=".5" stop-color="#0b1022"/><stop offset="1" stop-color="#180d32"/></linearGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#42f5d0"/><stop offset=".5" stop-color="#48d9ff"/><stop offset="1" stop-color="#a879ff"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#18223b" stop-opacity=".94"/><stop offset="1" stop-color="#080d1c" stop-opacity=".96"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <clipPath id="termClip"><rect x="50" y="108" width="515" height="306" rx="20"/></clipPath>
</defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<circle cx="960" cy="130" r="170" fill="#8255ff" opacity=".09" filter="url(#blur)"/><circle cx="180" cy="420" r="150" fill="#18e4ff" opacity=".055" filter="url(#blur)"/>
<g opacity=".08" stroke="#9ba8d0"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M80 70V470M180 70V470M280 70V470M380 70V470M480 70V470M580 70V470M680 70V470M780 70V470M880 70V470M980 70V470M1080 70V470"/></g>
<text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git init</text>
<text x="600" y="72" text-anchor="middle" fill="#9ca9c8" font-family="system-ui" font-size="13">Repository bootstrap — watch the project become Git-aware</text>
<!-- terminal -->
<rect x="50" y="108" width="515" height="306" rx="20" fill="url(#glass)" stroke="#34415f"/>
<rect x="50" y="108" width="515" height="42" rx="20" fill="#11192c"/><circle cx="78" cy="129" r="5" fill="#ff6685"/><circle cx="96" cy="129" r="5" fill="#ffd15b"/><circle cx="114" cy="129" r="5" fill="#5de6b1"/>
<text x="142" y="134" fill="#7685a5" font-family="monospace" font-size="11">pallavi@devbox  ~/gitvault-demo</text>
<g font-family="monospace" font-size="13"><text x="78" y="181" fill="#e7ebf7">$ ls</text><text x="78" y="204" fill="#8997b7">README.md   app.py   requirements.txt</text><text x="78" y="243" fill="#e7ebf7">$ git init</text><rect x="78" y="257" width="0" height="2" rx="1" fill="#4ce7ff"><animate attributeName="width" values="0;350;350;0" keyTimes="0;.35;.8;1" dur="4s" repeatCount="indefinite"/></rect><g opacity="0"><text x="78" y="286" fill="#65e6b3">Initialized empty Git repository</text><text x="78" y="307" fill="#65e6b3">in /gitvault-demo/.git/</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.34;.39;.78;1" dur="4s" repeatCount="indefinite"/></g><text x="78" y="347" fill="#7786a6">$ git status</text><text x="78" y="370" fill="#a4b0ca">On branch main • No commits yet</text></g>
<!-- transformation -->
<text x="635" y="125" fill="#7f8dac" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1.5">PROJECT → REPOSITORY</text>
<g font-family="monospace"><rect x="635" y="148" width="205" height="52" rx="12" fill="#0d1426" stroke="#34415e"/><text x="658" y="179" fill="#e3e8f5" font-size="15">gitvault-demo/</text><text x="658" y="193" fill="#687897" font-size="9">ordinary directory</text><g fill="#b8c2da" font-size="11"><text x="650" y="225">├─ README.md</text><text x="650" y="247">├─ app.py</text><text x="650" y="269">└─ requirements.txt</text></g></g>
<path d="M845 244 C895 244 895 225 932 225" fill="none" stroke="#27334e" stroke-width="10"/><path d="M845 244 C895 244 895 225 932 225" fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-dasharray="9 9"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur=".55s" repeatCount="indefinite"/></path><circle r="6" fill="#58e9ff" filter="url(#glow)"><animateMotion dur="1.5s" repeatCount="indefinite" path="M845 244 C895 244 895 225 932 225"/></circle>
<rect x="932" y="145" width="205" height="190" rx="17" fill="#071524" stroke="#4be7ff" stroke-width="1.5"/><text x="1034" y="176" text-anchor="middle" fill="#4be7ff" font-family="monospace" font-size="20" font-weight="800">.git/</text>
<g font-family="monospace" font-size="10" fill="#b9c4dd"><text x="955" y="204">HEAD</text><text x="955" y="225">config</text><text x="955" y="246">objects/</text><text x="955" y="267">refs/</text><text x="955" y="288">hooks/</text></g><text x="1034" y="315" text-anchor="middle" fill="#6d7b9a" font-family="system-ui" font-size="9">repository metadata</text>
<circle cx="1034" cy="242" r="28" fill="none" stroke="#54e8ff" opacity="0"><animate attributeName="r" values="25;78;25" dur="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.55;0" dur="2.3s" repeatCount="indefinite"/></circle>
<!-- filesystem event -->
<rect x="635" y="355" width="502" height="59" rx="15" fill="#080e1c" stroke="#293654"/><text x="656" y="378" fill="#687897" font-family="monospace" font-size="10">filesystem event</text><text x="770" y="378" fill="#63e6b1" font-family="monospace" font-size="11">+ .git/ created</text><circle cx="1095" cy="376" r="4" fill="#63e6b1"><animate attributeName="r" values="3;7;3" dur="1.1s" repeatCount="indefinite"/></circle><text x="656" y="399" fill="#8794b2" font-family="system-ui" font-size="10">files stay untouched • Git history starts empty</text>
<rect x="300" y="431" width="600" height="42" rx="21" fill="#070b17" stroke="#44517a"/><text x="600" y="457" text-anchor="middle" fill="#d0d6e7" font-family="monospace" font-size="12">git init   →   .git/   →   repository ready</text>
<text x="600" y="497" text-anchor="middle" fill="#667493" font-family="system-ui" font-size="11">Initialization creates Git metadata — it does not commit your files.</text>
</svg>