<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030611"/><stop offset=".5" stop-color="#0b1024"/><stop offset="1" stop-color="#1d0d3b"/></linearGradient><linearGradient id="flow"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#737cff"/><stop offset="1" stop-color="#4de7ff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="30" fill="url(#bg)"/><g opacity=".12" stroke="#7780aa"><path d="M40 100H1160M40 150H1160M40 200H1160M40 250H1160M40 300H1160M40 350H1160M40 400H1160M40 450H1160"/><path d="M100 80V470M200 80V470M300 80V470M400 80V470M500 80V470M600 80V470M700 80V470M800 80V470M900 80V470M1000 80V470M1100 80V470"/></g><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git init</text><text x="600" y="75" text-anchor="middle" fill="#aab3d1" font-family="system-ui" font-size="13">Git creates the hidden repository metadata inside your project</text><g><rect x="55" y="105" width="505" height="305" rx="18" fill="#060a15" stroke="#303a60"/><rect x="55" y="105" width="505" height="40" rx="18" fill="#11172a"/><circle cx="82" cy="125" r="5" fill="#ff657f"/><circle cx="100" cy="125" r="5" fill="#ffc75f"/><circle cx="118" cy="125" r="5" fill="#5ce1b0"/><text x="145" y="130" fill="#8794b7" font-family="monospace" font-size="11">pallavi@devbox ~/my-project</text><text x="82" y="178" fill="#d9def1" font-family="monospace" font-size="14">$ ls</text><text x="82" y="202" fill="#8995b8" font-family="monospace" font-size="12">README.md   app.py   requirements.txt</text><text x="82" y="244" fill="#d9def1" font-family="monospace" font-size="14">$ git init<tspan fill="#4de7ff">_</tspan><animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/></text><rect x="82" y="258" width="0" height="4" rx="2" fill="#4de7ff"><animate attributeName="width" values="0;360;360" dur="1.2s" fill="freeze"/></rect><text x="82" y="294" fill="#67e6b0" font-family="monospace" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1" dur="1.2s" fill="freeze"/>Initialized empty Git repository</text><text x="82" y="316" fill="#67e6b0" font-family="monospace" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1" dur="1.2s" fill="freeze"/>in /my-project/.git/</text><text x="82" y="358" fill="#7783a5" font-family="monospace" font-size="11">$ git status</text><text x="82" y="381" fill="#9aa5c3" font-family="monospace" font-size="11">On branch main • No commits yet</text></g><g><text x="650" y="137" fill="#8792b5" font-family="system-ui" font-size="12" font-weight="800">PROJECT → REPOSITORY METADATA</text><g font-family="monospace" font-size="12"><rect x="650" y="165" width="190" height="34" rx="7" fill="#10162a" stroke="#293554"/><text x="665" y="187" fill="#d3d8eb">README.md</text><rect x="650" y="207" width="190" height="34" rx="7" fill="#10162a" stroke="#293554"/><text x="665" y="229" fill="#d3d8eb">app.py</text><rect x="650" y="249" width="190" height="34" rx="7" fill="#10162a" stroke="#293554"/><text x="665" y="271" fill="#d3d8eb">requirements.txt</text></g><path d="M850 220H950" stroke="#2e3855" stroke-width="8"/><path d="M850 220H950" stroke="url(#flow)" stroke-width="2" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".65s" repeatCount="indefinite"/></path><circle cx="850" cy="220" r="6" fill="#a78bfa" filter="url(#gl)"><animate attributeName="cx" values="850;950;850" dur="1.6s" repeatCount="indefinite"/></circle><rect x="950" y="155" width="175" height="150" rx="14" fill="#091525" stroke="#4de7ff"/><text x="1037" y="184" text-anchor="middle" fill="#4de7ff" font-family="monospace" font-size="17">.git/</text><text x="1037" y="209" text-anchor="middle" fill="#b1bbd5" font-family="monospace" font-size="10">HEAD</text><text x="1037" y="228" text-anchor="middle" fill="#b1bbd5" font-family="monospace" font-size="10">config</text><text x="1037" y="247" text-anchor="middle" fill="#b1bbd5" font-family="monospace" font-size="10">objects/</text><text x="1037" y="266" text-anchor="middle" fill="#b1bbd5" font-family="monospace" font-size="10">refs/</text><text x="1037" y="286" text-anchor="middle" fill="#71809f" font-family="system-ui" font-size="9">metadata only</text><circle cx="1037" cy="230" r="42" fill="none" stroke="#4de7ff" opacity="0"><animate attributeName="r" values="30;68;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.55;0" dur="2.4s" repeatCount="indefinite"/></circle></g><rect x="315" y="430" width="570" height="42" rx="21" fill="#080c19" stroke="#46527b"/><text x="600" y="457" text-anchor="middle" fill="#b5bdd9" font-family="monospace" font-size="12">git init  →  .git/ created  →  repository ready</text><text x="600" y="495" text-anchor="middle" fill="#697596" font-family="system-ui" font-size="11">Git is initialized; your files are still uncommitted.</text></svg>