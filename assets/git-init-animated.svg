<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#101735"/><stop offset="1" stop-color="#1b0b2b"/></linearGradient><linearGradient id="w"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient><radialGradient id="h"><stop stop-color="#6366f1" stop-opacity=".28"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient><filter id="s"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g"><feGaussianBlur stdDeviation="6" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font:800 45px Inter,Segoe UI,sans-serif;fill:#f8fafc}.st{font:500 16px Inter,Segoe UI,sans-serif;fill:#91a0ba}.l{font:800 11px Inter,Segoe UI,sans-serif;fill:#8fa2c2;letter-spacing:2px}.h1{font:800 23px Inter,Segoe UI,sans-serif;fill:#f8fafc}.p{font:500 14px Inter,Segoe UI,sans-serif;fill:#94a3b8}.c{font:600 14px ui-monospace,Consolas,monospace;fill:#e6faff}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#7185a4}.ok{font:600 12px ui-monospace,Consolas,monospace;fill:#86efac}</style></defs><rect width="1600" height="900" rx="36" fill="url(#b)"/><circle cx="800" cy="430" r="420" fill="url(#h)"/><text x="70" y="60" class="l">GITVAULT / GIT BASICS / 05</text><text x="70" y="108" class="t">git init — build the repository layer</text><text x="70" y="140" class="st">See what actually changes inside the folder when Git is initialized.</text>
<!-- filesystem --> <g transform="translate(70 235)" filter="url(#s)"><rect width="430" height="420" rx="28" fill="#091322" stroke="#294764" stroke-width="2"/><text x="30" y="40" class="l">BEFORE</text><text x="30" y="77" class="h1">A normal project folder</text><rect x="30" y="105" width="370" height="245" rx="20" fill="#040912" stroke="#20354e"/><path d="M70 160h85l22 23h185v125H70z" fill="#13233a" stroke="#42617f" stroke-width="2"/><text x="95" y="205" class="c">my-project/</text><text x="100" y="242" class="p">app.py</text><text x="100" y="270" class="p">index.html</text><text x="100" y="298" class="p">README.md</text><rect x="30" y="370" width="370" height="28" rx="14" fill="#24101a" stroke="#6b314f"/><text x="215" y="389" text-anchor="middle" fill="#fb7185" class="tiny">NO .git → NO LOCAL REPOSITORY</text></g>
<!-- command --> <g transform="translate(560 245)" filter="url(#s)"><rect width="480" height="235" rx="28" fill="#050a14" stroke="#354a69" stroke-width="2"/><text x="30" y="38" class="l">THE COMMAND</text><text x="30" y="75" class="p">Run this inside the project folder:</text><rect x="30" y="96" width="420" height="82" rx="18" fill="#02060d" stroke="#1e3852"/><text x="52" y="128" class="c">pallavi@devbox ~/my-project</text><text x="52" y="158" fill="#67e8f9" class="c">$ git init</text><text x="30" y="208" class="tiny">INITIALIZE = CREATE GIT'S LOCAL CONTROL LAYER</text></g>
<!-- internal --> <g transform="translate(555 515)" filter="url(#s)"><rect width="490" height="240" rx="28" fill="#0b1023" stroke="#4c3c76" stroke-width="2"/><text x="30" y="38" class="l">WHAT GIT CREATES</text><text x="30" y="78" class="c">my-project/.git/</text><g transform="translate(30 100)"><rect width="125" height="38" rx="12" fill="#111a30" stroke="#35466b"/><text x="62" y="24" text-anchor="middle" class="tiny">objects/</text><rect x="140" width="125" height="38" rx="12" fill="#111a30" stroke="#35466b"/><text x="202" y="24" text-anchor="middle" class="tiny">refs/</text><rect x="280" width="125" height="38" rx="12" fill="#111a30" stroke="#35466b"/><text x="342" y="24" text-anchor="middle" class="tiny">HEAD</text></g><rect x="30" y="155" width="405" height="44" rx="15" fill="#10252b" stroke="#155e75"/><text x="232" y="183" text-anchor="middle" fill="#67e8f9" class="tiny">REPOSITORY METADATA CREATED</text></g>
<!-- result --> <g transform="translate(1100 235)" filter="url(#s)"><rect width="430" height="420" rx="28" fill="#0b1421" stroke="#3a5b65" stroke-width="2"/><text x="30" y="40" class="l">AFTER</text><text x="30" y="77" class="h1">Git repository exists</text><rect x="30" y="105" width="370" height="190" rx="20" fill="#02070d" stroke="#21414c"/><text x="55" y="140" class="ok">Initialized empty Git repository in</text><text x="55" y="165" class="ok">C:/Users/Pallavi/</text><text x="55" y="190" class="ok">my-project/.git/</text><text x="55" y="235" class="tiny">ACTUAL git init OUTPUT</text><text x="55" y="270" fill="#67e8f9" class="tiny">✓ .git/ EXISTS</text><rect x="30" y="330" width="370" height="55" rx="17" fill="#11112b" stroke="#8b5cf6"/><text x="215" y="354" text-anchor="middle" fill="#c4b5fd" class="tiny">LOCAL REPOSITORY INITIALIZED</text><text x="215" y="373" text-anchor="middle" fill="#c4b5fd" class="tiny">FILES ARE NOT COMMITTED YET</text></g>
<!-- how it works --> <g transform="translate(70 800)"><rect width="1460" height="62" rx="22" fill="#080d19" stroke="#293d5a"/><text x="28" y="26" class="l">HOW IT WORKS</text><text x="28" y="48" class="c">project folder → git init → .git metadata → Git understands the folder → ready for git add</text><text x="1425" y="36" text-anchor="end" fill="#a78bfa" class="tiny">INIT ≠ ADD ≠ COMMIT ≠ PUSH</text></g>
<!-- connections --> <path d="M500 445H560" stroke="url(#w)" stroke-width="4"/><path d="M1040 445H1100" stroke="url(#w)" stroke-width="4"/><circle cx="530" cy="445" r="7" fill="#67e8f9" filter="url(#g)"/><circle cx="1070" cy="445" r="7" fill="#c4b5fd" filter="url(#g)"/></svg>