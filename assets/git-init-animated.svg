<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030611"/><stop offset=".55" stop-color="#0b1024"/><stop offset="1" stop-color="#1b0c35"/></linearGradient><linearGradient id="flow"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#687cff"/><stop offset="1" stop-color="#4de7ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="30" fill="url(#bg)"/><g opacity=".18" stroke="#59638c"><path d="M40 100H1160M40 150H1160M40 200H1160M40 250H1160M40 300H1160M40 350H1160M40 400H1160M40 450H1160"/><path d="M100 80V470M200 80V470M300 80V470M400 80V470M500 80V470M600 80V470M700 80V470M800 80V470M900 80V470M1000 80V470M1100 80V470"/></g><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git init</text><text x="600" y="75" text-anchor="middle" fill="#aab3d1" font-family="system-ui" font-size="13">turn an ordinary project folder into a Git repository</text><g><rect x="55" y="105" width="515" height="300" rx="18" fill="#070b17" stroke="#343b61"/><rect x="55" y="105" width="515" height="40" rx="18" fill="#11172a"/><circle cx="82" cy="125" r="5" fill="#ff6b6b"/><circle cx="100" cy="125" r="5" fill="#ffd166"/><circle cx="118" cy="125" r="5" fill="#5ee38b"/><text x="145" y="130" fill="#8994b6" font-family="monospace" font-size="11">developer@local ~/my-project</text><text x="82" y="178" fill="#cdd4ed" font-family="monospace" font-size="14">$ ls</text><text x="82" y="202" fill="#8995b8" font-family="monospace" font-size="12">README.md</text><text x="205" y="202" fill="#8995b8" font-family="monospace" font-size="12">app.py</text><text x="280" y="202" fill="#8995b8" font-family="monospace" font-size="12">requirements.txt</text><text x="82" y="244" fill="#cdd4ed" font-family="monospace" font-size="14">$ git init</text><rect x="82" y="257" width="0" height="18" rx="4" fill="#a78bfa"><animate attributeName="width" from="0" to="300" dur="1s" fill="freeze"/></rect><text x="82" y="300" fill="#70e6b0" font-family="monospace" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1" dur="1s" fill="freeze"/>Initialized empty Git repository</text><text x="82" y="322" fill="#70e6b0" font-family="monospace" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1" dur="1s" fill="freeze"/>in ~/my-project/.git/</text><text x="82" y="360" fill="#697697" font-family="monospace" font-size="11">$ git status</text><text x="82" y="382" fill="#8d98b8" font-family="monospace" font-size="11">On branch main • No commits yet</text></g><g><rect x="635" y="105" width="510" height="300" rx="18" fill="#070d19" stroke="#343b61"/><text x="675" y="140" fill="#8792b4" font-family="system-ui" font-size="12">PROJECT DIRECTORY</text><g font-family="monospace" font-size="12"><rect x="675" y="165" width="190" height="34" rx="7" fill="#10162a"/><text x="690" y="187" fill="#cdd4ed">📄 README.md</text><rect x="675" y="207" width="190" height="34" rx="7" fill="#10162a"/><text x="690" y="229" fill="#cdd4ed">📄 app.py</text><rect x="675" y="249" width="190" height="34" rx="7" fill="#10162a"/><text x="690" y="271" fill="#cdd4ed">📄 requirements.txt</text></g><path d="M875 220H950" stroke="#313958" stroke-width="7"/><path d="M875 220H950" stroke="url(#flow)" stroke-width="2" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".7s" repeatCount="indefinite"/></path><g filter="url(#glow)"><circle cx="875" cy="220" r="6" fill="#a78bfa"><animate attributeName="cx" values="875;950;875" dur="1.6s" repeatCount="indefinite"/></circle></g><rect x="950" y="165" width="155" height="120" rx="12" fill="#0b1423" stroke="#4de7ff"/><text x="1027" y="192" text-anchor="middle" fill="#4de7ff" font-family="monospace" font-size="16">.git/</text><text x="1027" y="216" text-anchor="middle" fill="#aab5d3" font-family="monospace" font-size="10">HEAD</text><text x="1027" y="235" text-anchor="middle" fill="#aab5d3" font-family="monospace" font-size="10">objects/</text><text x="1027" y="254" text-anchor="middle" fill="#aab5d3" font-family="monospace" font-size="10">refs/</text><text x="1027" y="273" text-anchor="middle" fill="#6f7b9c" font-family="system-ui" font-size="9">Git metadata</text></g><g opacity="0"><circle cx="1027" cy="225" r="55" fill="none" stroke="#4de7ff" stroke-width="2"><animate attributeName="r" values="35;65;35" dur="2s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/></g><rect x="335" y="430" width="530" height="42" rx="21" fill="#080c19" stroke="#4b5480"/><text x="600" y="457" text-anchor="middle" fill="#b5bdd9" font-family="monospace" font-size="12">git init  →  .git created  →  repository ready</text><text x="600" y="495" text-anchor="middle" fill="#697596" font-family="system-ui" font-size="11">No files are committed yet — Git has only created the repository metadata.</text></svg>