<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030817"/><stop offset=".55" stop-color="#0a1731"/><stop offset="1" stop-color="#21113d"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
  <linearGradient id="git" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.c{font-family:ui-monospace,Consolas,monospace}.h{font-size:40px;font-weight:900}.b{font-size:18px;font-weight:800}.s{font-size:13px}.x{font-size:11px}
  </style>
</defs>
<rect width="1500" height="820" rx="34" fill="url(#bg)"/>
<g opacity=".10" stroke="#64748b"><path d="M0 150H1500M0 300H1500M0 450H1500M0 600H1500M0 750H1500"/><path d="M150 0V820M300 0V820M450 0V820M600 0V820M750 0V820M900 0V820M1050 0V820M1200 0V820M1350 0V820"/></g>
<text x="60" y="64" class="t h">git init</text>
<text x="60" y="94" class="m s">Turn an ordinary project folder into a local Git repository.</text>
<text x="1440" y="62" text-anchor="end" class="m c x">GIT BASICS / 05</text>

<!-- left: terminal -->
<rect x="60" y="145" width="410" height="445" rx="28" fill="#050b17" stroke="#263c5b"/>
<text x="90" y="185" fill="#67e8f9" class="c x">STEP 01 / RUN THE COMMAND</text>
<circle cx="94" cy="222" r="5" fill="#fb7185"/><circle cx="112" cy="222" r="5" fill="#fbbf24"/><circle cx="130" cy="222" r="5" fill="#34d399"/>
<text x="90" y="258" class="m c s">pallavi@devbox ~/my-project</text>
<text x="90" y="294" class="t c s">$ git init</text>
<rect x="90" y="320" width="330" height="1" fill="#1e293b"/>
<text x="90" y="352" fill="#67e8f9" class="c s">Initialized empty Git repository</text>
<text x="90" y="378" fill="#67e8f9" class="c s">in C:/Projects/my-project/.git/</text>
<text x="90" y="425" class="m s">Git has created the repository</text>
<text x="90" y="447" class="m s">metadata inside a hidden .git folder.</text>
<rect x="90" y="482" width="330" height="70" rx="16" fill="#071b27" stroke="#155e75"/>
<text x="110" y="510" fill="#67e8f9" class="c x">COMMAND EFFECT</text>
<text x="110" y="533" class="t c s">git init → creates .git/</text>

<!-- center: transformation -->
<text x="525" y="185" fill="#a5b4fc" class="c x">STEP 02 / FOLDER TRANSFORMATION</text>
<rect x="525" y="220" width="420" height="370" rx="28" fill="#071121" stroke="#38476d"/>
<!-- folder -->
<path d="M585 330V278Q585 260 603 260H700L730 292H885Q905 292 905 312V500Q905 520 885 520H605Q585 520 585 500Z" fill="#0b1c35" stroke="#416181" stroke-width="2"/>
<path d="M585 330H905" stroke="#416181" stroke-width="2"/>
<text x="620" y="316" class="t c s">my-project/</text>
<text x="620" y="365" class="m c s">app.py</text><text x="620" y="395" class="m c s">index.html</text><text x="620" y="425" class="m c s">README.md</text>
<!-- initialization pulse -->
<circle cx="745" cy="430" r="35" fill="#22d3ee" opacity=".08"><animate attributeName="r" values="25;70;25" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="745" cy="430" r="20" fill="#101b3b" stroke="url(#line)" stroke-width="3" filter="url(#glow)"><animate attributeName="r" values="18;25;18" dur="2.8s" repeatCount="indefinite"/></circle>
<text x="745" y="435" text-anchor="middle" fill="#e0e7ff" class="c x">.git</text>
<path d="M745 410V350" stroke="url(#line)" stroke-width="3" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path>
<text x="615" y="475" fill="#a5b4fc" class="c x">repository metadata</text>
<text x="615" y="497" class="m x">objects • refs • HEAD • config</text>
<text x="735" y="555" text-anchor="middle" fill="#67e8f9" class="c x">THE FOLDER IS NOW GIT-AWARE</text>

<!-- right: result -->
<text x="1000" y="185" fill="#d8b4fe" class="c x">STEP 03 / REPOSITORY READY</text>
<rect x="1000" y="220" width="440" height="370" rx="28" fill="#0a1021" stroke="#5a4380"/>
<text x="1035" y="260" class="t b">Local Git repository</text>
<text x="1035" y="284" class="m s">The project is initialized — but nothing is committed.</text>
<rect x="1035" y="315" width="370" height="160" rx="18" fill="#050a15" stroke="#2c3154"/>
<text x="1060" y="350" class="t c s">my-project/</text>
<text x="1060" y="380" class="m c s">├── app.py</text>
<text x="1060" y="407" class="m c s">├── index.html</text>
<text x="1060" y="434" class="m c s">├── README.md</text>
<text x="1060" y="461" fill="#d8b4fe" class="c s">└── .git/</text>
<rect x="1035" y="500" width="370" height="52" rx="16" fill="#11152e" stroke="#6d4ab0"/>
<text x="1220" y="522" text-anchor="middle" fill="#c4b5fd" class="c x">✓ REPOSITORY INITIALIZED</text>
<text x="1220" y="541" text-anchor="middle" class="m x">Ready for git status → git add → git commit</text>

<!-- animated bridge -->
<path d="M470 365 C500 365 505 365 525 365" fill="none" stroke="url(#line)" stroke-width="4" stroke-dasharray="9 10"/>
<circle r="7" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M470 365 C500 365 505 365 525 365"/></circle>
<path d="M945 365 C970 365 980 365 1000 365" fill="none" stroke="url(#line)" stroke-width="4" stroke-dasharray="9 10"/>
<circle r="7" fill="#d8b4fe" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M945 365 C970 365 980 365 1000 365"/></circle>

<!-- bottom truth -->
<rect x="60" y="625" width="1380" height="125" rx="26" fill="#050a15" stroke="#293e61"/>
<text x="90" y="657" fill="#67e8f9" class="c x">REMEMBER</text>
<text x="90" y="691" class="t b">git init creates the .git directory and initializes local repository metadata.</text>
<text x="90" y="718" class="m s">Your project files are still uncommitted. git init does NOT create a commit and does NOT push to GitHub.</text>
<text x="1380" y="691" text-anchor="end" fill="#a78bfa" class="c x">NEXT → git status</text>
</svg>