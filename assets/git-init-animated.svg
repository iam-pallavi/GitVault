<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040D"/><stop offset=".5" stop-color="#0A1025"/><stop offset="1" stop-color="#190728"/></linearGradient>
 <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
 <linearGradient id="git" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF8A3D"/><stop offset=".5" stop-color="#F04438"/><stop offset="1" stop-color="#A21CAF"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#6366F1" stop-opacity=".38"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#A8B7D8" stroke-opacity=".045"/></pattern>
 <style>.title{font:800 46px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#91A0BA}.label{font:700 11px Inter,Segoe UI,sans-serif;fill:#91A4C2;letter-spacing:2px}.head{font:800 21px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 14px Inter,Segoe UI,sans-serif;fill:#8EA0BC}.code{font:600 14px ui-monospace,Consolas,monospace;fill:#E6FAFF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71839F}</style>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect width="1600" height="900" rx="36" fill="url(#grid)"/>
<circle cx="800" cy="430" r="420" fill="url(#halo)" filter="url(#blur)"><animate attributeName="r" values="360;440;360" dur="6s" repeatCount="indefinite"/></circle>
<text x="70" y="60" class="label">GITVAULT / GIT BASICS / 05</text>
<text x="70" y="110" class="title">git init — initialize a repository</text>
<text x="70" y="140" class="sub">One command turns an ordinary project folder into a local Git repository.</text>

<!-- BEFORE -->
<g transform="translate(65 250)" filter="url(#shadow)">
 <rect width="330" height="315" rx="26" fill="#0B1527" stroke="#2B4969" stroke-width="2"/><rect width="330" height="5" rx="2" fill="#22D3EE"/>
 <text x="25" y="38" class="label">01 / BEFORE GIT</text><text x="25" y="70" class="head">Ordinary project folder</text>
 <rect x="25" y="94" width="280" height="145" rx="16" fill="#030812" stroke="#20334D"/>
 <text x="45" y="126" class="code">📁 my-project</text>
 <text x="45" y="157" class="body">app.py</text><text x="45" y="185" class="body">index.html</text><text x="45" y="213" class="body">README.md</text>
 <rect x="25" y="258" width="280" height="34" rx="17" fill="#1B1220" stroke="#6B314F"/><text x="165" y="280" text-anchor="middle" fill="#FB7185" class="tiny">NOT A GIT REPOSITORY</text>
</g>

<!-- CENTER COMMAND + GIT CORE -->
<g transform="translate(800 400)" filter="url(#shadow)">
 <ellipse rx="430" ry="150" fill="none" stroke="url(#flow)" stroke-opacity=".18" stroke-width="2" transform="rotate(-8)"><animateTransform attributeName="transform" type="rotate" from="-8 0 0" to="352 0 0" dur="11s" repeatCount="indefinite"/></ellipse>
 <rect x="-245" y="-155" width="490" height="120" rx="22" fill="#050A15" stroke="#293E61"/>
 <circle cx="-215" cy="-126" r="5" fill="#FB7185"/><circle cx="-197" cy="-126" r="5" fill="#FBBF24"/><circle cx="-179" cy="-126" r="5" fill="#34D399"/>
 <text x="-215" y="-88" class="body" style="font-family:ui-monospace,Consolas,monospace">pallavi@devbox ~/my-project</text>
 <text x="-215" y="-58" class="code">$ git init</text>
 <text x="215" y="-58" text-anchor="end" fill="#67E8F9" class="tiny">COMMAND</text>
 <path d="M-210 -28H210" stroke="#1E293B"/>
 <text x="-210" y="-7" fill="#67E8F9" class="tiny">Initialized empty Git repository</text>
 <text x="210" y="-7" text-anchor="end" fill="#67E8F9" class="tiny">.git/ CREATED</text>

 <g transform="translate(0 115)">
  <circle r="185" fill="#6366F1" opacity=".06"><animate attributeName="r" values="155;205;155" dur="4s" repeatCount="indefinite"/></circle>
  <ellipse rx="175" ry="70" fill="none" stroke="#22D3EE" stroke-opacity=".18" stroke-width="2" transform="rotate(25)"><animateTransform attributeName="transform" type="rotate" from="25 0 0" to="385 0 0" dur="8s" repeatCount="indefinite"/></ellipse>
  <polygon points="-115,-72 0,-140 115,-72 0,-5" fill="url(#git)" stroke="#FFC08A" stroke-width="2"/>
  <polygon points="-115,-72 0,-5 0,105 -115,38" fill="#B42373" stroke="#FF8C69" stroke-width="2"/>
  <polygon points="0,-5 115,-72 115,38 0,105" fill="#D94841" stroke="#FFB06A" stroke-width="2"/>
  <path d="M-72 -69L0 -111L72 -69L0 -29Z M-72 -69V22 M72 -69V22 M0 -29V72" fill="none" stroke="#FFF4ED" stroke-opacity=".3" stroke-width="3"/>
  <text x="0" y="-40" text-anchor="middle" style="font:900 30px Inter,Segoe UI,sans-serif;fill:white">GIT</text>
  <circle cx="-38" cy="15" r="7" fill="white" filter="url(#glow)"><animate attributeName="r" values="6;12;6" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="38" cy="15" r="7" fill="white" filter="url(#glow)"><animate attributeName="r" values="6;12;6" dur="1.5s" begin=".45s" repeatCount="indefinite"/></circle>
  <circle cx="0" cy="66" r="7" fill="white" filter="url(#glow)"><animate attributeName="r" values="6;12;6" dur="1.5s" begin=".9s" repeatCount="indefinite"/></circle>
  <path d="M-38 15L0 66L38 15" fill="none" stroke="white" stroke-width="4" opacity=".8"/>
 </g>
 <text x="0" y="310" text-anchor="middle" class="label">GIT INITIALIZES LOCAL REPOSITORY METADATA</text>
</g>

<!-- AFTER -->
<g transform="translate(1205 250)" filter="url(#shadow)">
 <rect width="330" height="315" rx="26" fill="#10142A" stroke="#563D79" stroke-width="2"/><rect width="330" height="5" rx="2" fill="#E879F9"/>
 <text x="25" y="38" class="label">03 / AFTER GIT</text><text x="25" y="70" class="head">Git repository ready</text>
 <rect x="25" y="94" width="280" height="145" rx="16" fill="#030812" stroke="#30265B"/>
 <text x="45" y="126" class="code">📁 my-project</text>
 <text x="45" y="157" class="body">app.py</text><text x="45" y="185" class="body">index.html</text><text x="45" y="213" fill="#D8B4FE" class="code">.git/</text>
 <rect x="25" y="258" width="280" height="34" rx="17" fill="#0B2227" stroke="#155E75"/><text x="165" y="280" text-anchor="middle" fill="#67E8F9" class="tiny">✓ REPOSITORY INITIALIZED</text>
</g>

<!-- bridges -->
<g fill="none" stroke-linecap="round">
 <path d="M395 405 C520 405 565 430 620 455" stroke="#22D3EE44" stroke-width="5"/>
 <path d="M980 455 C1035 430 1080 405 1205 405" stroke="#E879F944" stroke-width="5"/>
 <circle r="8" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M395 405 C520 405 565 430 620 455"/></circle>
 <circle r="8" fill="#F0ABFC" filter="url(#glow)"><animateMotion dur="2.5s" begin=".8s" repeatCount="indefinite" path="M980 455 C1035 430 1080 405 1205 405"/></circle>
</g>
<g><rect x="455" y="382" width="130" height="32" rx="16" fill="#0A1728" stroke="#29445F"/><text x="520" y="403" text-anchor="middle" class="tiny">git init</text><rect x="1015" y="382" width="130" height="32" rx="16" fill="#120D24" stroke="#49345D"/><text x="1080" y="403" text-anchor="middle" class="tiny">.git created</text></g>

<!-- bottom explanation -->
<g transform="translate(65 650)">
 <rect width="1470" height="155" rx="28" fill="#070C18" stroke="#293D5D" stroke-width="2"/>
 <text x="32" y="38" class="label">THE CORE IDEA</text>
 <text x="32" y="76" class="title" style="font-size:27px">git init = initialize Git in the current folder.</text>
 <text x="32" y="107" class="body" style="font-size:15px">It creates the hidden .git directory that stores local repository metadata and history information.</text>
 <text x="32" y="135" class="code">git init → .git/ created → repository ready</text>
 <text x="1375" y="76" text-anchor="end" fill="#A78BFA" class="tiny">IMPORTANT</text>
 <text x="1375" y="105" text-anchor="end" class="body">initialize ≠ commit</text>
 <text x="1375" y="132" text-anchor="end" class="body">initialize ≠ push to GitHub</text>
</g>
</svg>