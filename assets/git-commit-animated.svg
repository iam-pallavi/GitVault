<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b"><stop stop-color="#050817"/><stop offset="1" stop-color="#180d32"/></linearGradient><linearGradient id="g"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git commit</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">create an immutable snapshot from the staged changes</text><rect x="70" y="110" width="330" height="255" rx="18" fill="#080c19" stroke="#4de7ff"/><text x="100" y="145" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">STAGED</text><text x="100" y="190" fill="#dfe4f8" font-family="monospace" font-size="13">app.py ✓</text><text x="100" y="218" fill="#7d89aa" font-family="system-ui" font-size="11">ready to record</text><text x="100" y="290" fill="#cfd5ee" font-family="monospace" font-size="13">$ git commit -m</text><text x="100" y="315" fill="#cfd5ee" font-family="monospace" font-size="13">  "update app"</text><rect x="470" y="100" width="260" height="275" rx="130" fill="#090d1b" stroke="url(#g)" stroke-width="2"/><circle cx="600" cy="235" r="78" fill="none" stroke="#7c5cff" stroke-width="3" opacity=".35"><animate attributeName="r" values="68;88;68" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="600" cy="235" r="54" fill="#11172a" stroke="#4de7ff"/><text x="600" y="226" text-anchor="middle" fill="white" font-family="system-ui" font-size="17" font-weight="800">COMMIT</text><text x="600" y="250" text-anchor="middle" fill="#4de7ff" font-family="monospace" font-size="12">7c91e4a</text><g><path d="M400 235H470" stroke="url(#g)" stroke-width="3" stroke-dasharray="8 9"/><circle r="7" fill="#4de7ff"><animateMotion dur="1.1s" repeatCount="indefinite" path="M400 235H470"/></circle></g><