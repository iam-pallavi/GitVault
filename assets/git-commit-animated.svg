<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040611"/><stop offset=".5" stop-color="#100B29"/><stop offset="1" stop-color="#2A1052"/></linearGradient><linearGradient id="neon"><stop stop-color="#B66CFF"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="34" fill="url(#bg)"/><g fill="#55E6FF" opacity=".35"><circle cx="90" cy="100" r="2"><animate attributeName="cy" values="100;75;100" dur="3s" repeatCount="indefinite"/></circle><circle cx="1110" cy="100" r="2"><animate attributeName="cx" values="1110;1140;1110" dur="4s" repeatCount="indefinite"/></circle><circle cx="1050" cy="340" r="2"><animate attributeName="cy" values="340;315;340" dur="3.5s" repeatCount="indefinite"/></circle></g><text x="600" y="55" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="33" font-weight="850">git commit</text><text x="600" y="83" text-anchor="middle" fill="#AEB5D5" font-family="system-ui" font-size="14">turn staged changes into a permanent versioned snapshot</text><g font-family="system-ui"><rect x="75" y="135" width="270" height="170" rx="28" fill="#11132D" fill-opacity=".7" stroke="#55E6FF" stroke-opacity=".55"/><text x="210" y="168" text-anchor="middle" fill="#55E6FF" font-size="12" font-weight="800">STAGED CHANGES</text><rect x="125" y="195" width="170" height="52" rx="15" fill="#090C20" stroke="#30345F"/><text x="210" y="226" text-anchor="middle" fill="#DDE1F7" font-family="monospace" font-size="14">changes ✓</text><text x="210" y="276" text-anchor="middle" fill="#737DA5" font-size="11">ready to snapshot</text><rect x="455" y="120" width="290" height="200" rx="100" fill="#090C20" stroke="url(#neon)" stroke-width="2"/><circle cx="600" cy="220" r="70" fill="none" stroke="#7C5CFF" stroke-opacity=".2" stroke-width="22"><animate attributeName="r" values="62;82;62" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="600" cy="220" r="51" fill="#12142F" stroke="#55E6FF" stroke-width="2" filter="url(#glow)"/><text x="600" y="213" text-anchor="middle" fill="#fff" font-size="18" font-weight="850">SNAPSHOT</text><text x="600" y="237" text-anchor="middle" fill="#55E6FF" font-family="monospace" font-size="12">a8f3c2</text><g fill="none" stroke="#B66CFF" stroke-width="2" opacity=".8"><ellipse cx="600" cy="220" rx="115" ry="45"><animateTransform attributeName="transform" type="rotate" from="0 600 220" to="360 600 220" dur="5s" repeatCount="indefinite"/></ellipse></g><circle cx="715" cy="220" r="6" fill="#B66CFF" filter="url(#glow)"/><rect x="855" y="135" width="270" height="170" rx="28" fill="#11132D" fill-opacity=".7" stroke="#B66CFF" stroke-opacity=".55"/><text x="990" y="168" text-anchor="middle" fill="#B66CFF" font-size="12" font-weight="800">HISTORY</text><g stroke="#30345F" stroke-width="4"><path d="M930 205 H1050"/><path d="M930 250 H1050"/></g><g fill="#55E6FF" filter="url(#glow)"><circle cx="945" cy="205" r="7"><animate attributeName="r" values="5;10;5" dur="1.7s" repeatCount="indefinite"/></circle><circle cx="990" cy="205" r="7" fill="#B66CFF"/><circle cx="1035" cy="205" r="7"/></g><circle cx="945" cy="250" r="7" fill="#7C5CFF"/><circle cx="990" cy="250" r="7" fill="#55E6FF"/><text x="990" y="280" text-anchor="middle" fill="#737DA5" font-size="11">version recorded</text></g><path d="M345 220 C390 190 415 190 455 210" fill="none" stroke="url(#neon)" stroke-width="4" stroke-dasharray="9 11"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur=".8s" repeatCount="indefinite"/></path><g filter="url(#glow)"><circle r="8" fill="#55E6FF"><animateMotion dur="1.1s" repeatCount="indefinite" path="M345 220 C390 190 415 190 455 210"/></circle></g><path d="M745 220 C785 190 810 190 855 220" fill="none" stroke="url(#neon)" stroke-width="4" stroke-dasharray="9 11"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur=".8s" repeatCount="indefinite"/></path><text x="600" y="370" text-anchor="middle" fill="#AEB5D5" font-family="monospace" font-size="14">git commit -m "message" → create a versioned snapshot</text></svg>