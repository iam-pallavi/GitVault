<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#11102E"/><stop offset="1" stop-color="#281052"/></linearGradient><linearGradient id="neon"><stop stop-color="#9B5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="32" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="32" font-weight="800">git commit</text><text x="600" y="86" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">turn staged changes into a permanent versioned snapshot</text><rect x="70" y="125" width="300" height="190" rx="28" fill="#10142B" fill-opacity=".92" stroke="#55E6FF" stroke-width="2"/><text x="220" y="162" text-anchor="middle" fill="#55E6FF" font-family="system-ui" font-size="13" font-weight="800">STAGED</text><rect x="115" y="192" width="210" height="58" rx="16" fill="#0A1025" stroke="#30345F"/><text x="220" y="227" text-anchor="middle" fill="#D7DBF5" font-family="monospace" font-size="15">changes ready ✓</text><text x="220" y="280" text-anchor="middle" fill="#7F89B0" font-family="system-ui" font-size="12">snapshot input</text><rect x="450" y="125" width="300" height="190" rx="28" fill="#10142B" fill-opacity=".92" stroke="#9B5CFF" stroke-width="2"/><text x="600" y="162" text-anchor="middle" fill="#9B5CFF" font-family="system-ui" font-size="13" font-weight="800">NEW SNAPSHOT</text><circle cx="600" cy="225" r="42" fill="#0A1025" stroke="#55E6FF" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="36;48;36" dur="2s" repeatCount="indefinite"/></circle><text x="600" y="222" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">a8f3c2</text><text x="600" y="244" text-anchor="middle" fill="#8F99BF" font-family="system-ui" font-size="11">commit hash</text><rect x="830" y="125" width="300" height="190" rx="28" fill="#10142B" fill-opacity=".92" stroke="#7C5CFF" stroke-width="2"/><text x="980" y="162" text-anchor="middle" fill="#7C5CFF" font-family="system-ui" font-size="13" font-weight="800">HISTORY</text><g stroke="#30345F" stroke-width="4"><line x1="900" y1="205" x2="1060" y2="205"/><line x1="900" y1="250" x2="1060" y2="250"/></g><circle cx="930" cy="205" r="8" fill="#55E6FF"/><circle cx="980" cy="205" r="8" fill="#9B5CFF"/><circle cx="1030" cy="205" r="8" fill="#55E6FF"/><circle cx="930" cy="250" r="7" fill="#7C5CFF"/><circle cx="980" cy="250" r="7" fill="#55E6FF"/><text x="980" y="290" text-anchor="middle" fill="#8F99BF" font-family="system-ui" font-size="12">version recorded</text><path d="M370 220H450" stroke="url(#neon)" stroke-width="4" stroke-dasharray="9 10"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur=".9s" repeatCount="indefinite"/></path><g filter="url(#glow)"><circle r="9" fill="#55E6FF"><animateMotion dur="1.2s" repeatCount="indefinite" path="M370 220H450"/></circle></g><path d="M750 220H830" stroke="url(#neon)" stroke-width="4" stroke-dasharray="9 10"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur=".9s" repeatCount="indefinite"/></path><text x="600" y="370" text-anchor="middle" fill="#A9B1D6" font-family="monospace" font-size="14">git commit -m "your message" → create a versioned snapshot</text></svg>