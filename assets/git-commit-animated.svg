<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040714"/><stop offset="1" stop-color="#190d35"/></linearGradient><linearGradient id="f"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">git commit</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">Turn the staged index into a permanent snapshot in local history</text><rect x="55" y="110" width="330" height="255" rx="18" fill="#080c19" stroke="#4de7ff"/><text x="80" y="143" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">INDEX</text><rect x="80" y="172" width="280" height="44" rx="8" fill="#10172a" stroke="#293653"/><text x="100" y="199" fill="#e0e5f6" font-family="monospace" font-size="12">app.py  ✓ staged</text><text x="80" y="255" fill="#cfd5ee" font-family="monospace" font-size="12">$ git commit -m</text><text x="80" y="278" fill="#cfd5ee" font-family="monospace" font-size="12">  "update app"</text><text x="80" y="318" fill="#67e6b0" font-family="monospace" font-size="11">1 file changed • snapshot ready</text><path d="M385 235H470" stroke="url(#f)" stroke-width="3" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".7s" repeatCount="indefinite"/></path><circle cx="390" cy="235" r="6" fill="#4de7ff" filter="url(#gl)"><animate attributeName="cx" values="390;465;390" dur="1.2s" repeatCount="indefinite"/></circle><g filter="url(#gl)"><circle cx="600" cy="235" r="108" fill="#714dff" opacity=".16"/><circle cx="600" cy="235" r="72" fill="#090e20" stroke="#a96cff" stroke-width="2"/><circle cx="600" cy="235" r="56" fill="none" stroke="#4de7ff" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 600 235" to="360 600 235" dur="5s" repeatCount="indefinite"/></circle><circle cx="600" cy="235" r="10" fill="#fff"><animate attributeName="r" values="8;13;8" dur="1.3s" repeatCount="indefinite"/></circle></g><text x="600" y="188" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="15" font-weight="800">COMMIT OBJECT</text><text x="600" y="255" text-anchor="middle" fill="#4de7ff" font-family="monospace" font-size="12">7c91e4a</text><text x="600" y="274" text-anchor="middle" fill="#8995b5" font-family="system-ui" font-size="10">snapshot + parent + message</text><path d="M730 235H800" stroke="url(#f)" stroke-width="3" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".7s" repeatCount="indefinite"/></path><circle cx="735" cy="235" r="6" fill="#a78bfa" filter="url(#gl)"><animate attributeName="cx" values="735;795;735" dur="1.1s" repeatCount="indefinite"/></circle><rect x="815" y="110" width="330" height="255" rx="18" fill="#080c19" stroke="#8067ff"/><text x="980" y="143" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="800">LOCAL HISTORY</text><path d="M870 182V325" stroke="#303a5b" stroke-width="4"/><circle cx="870" cy="195" r="7" fill="#6f7b9d"/><circle cx="870" cy="250" r="10" fill="#4de7ff" filter="url(#gl)"/><circle cx="870" cy="305" r="7" fill="#6f7b9d"/><text x="895" y="200" fill="#9aa6c3" font-family="monospace" font-size="11">4b82d1a</text><text x="895" y="255" fill="#4de7ff" font-family="monospace" font-size="11">7c91e4a  ← HEAD</text><text x="895" y="310" fill="#9aa6c3" font-family="monospace" font-size="11">a1f90cc</text><text x="600" y="415" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">commit = immutable snapshot + hash + parent history</text></svg>