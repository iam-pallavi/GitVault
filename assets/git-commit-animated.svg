<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset="1" stop-color="#211044"/></linearGradient><linearGradient id="f"><stop stop-color="#b98cff"/><stop offset="1" stop-color="#4deaff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git commit</text><text x="600" y="74" text-anchor="middle" fill="#a5afd0" font-family="system-ui" font-size="13">The staged index becomes an immutable snapshot in local history</text><rect x="55" y="110" width="330" height="255" rx="18" fill="#070b17" stroke="#4deaff"/><text x="80" y="143" fill="#4deaff" font-family="system-ui" font-size="12" font-weight="800">INDEX</text><rect x="80" y="172" width="280" height="44" rx="8" fill="#10172a" stroke="#293653"/><text x="100" y="199" fill="#e0e5f6" font-family="monospace" font-size="12">app.py ✓ staged</text><text x="80" y="255" fill="#cfd5ee" font-family="monospace" font-size="12">$ git commit -m</text><text x="80" y="278" fill="#cfd5ee" font-family="monospace" font-size="12">  "update app"</text><text x="80" y="318" fill="#67e6b0" font-family="monospace" font-size="11">creating snapshot...</text><path d="M385 235H475" stroke="url(#f)" stroke-width="4" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".6s" repeatCount="indefinite"/></path><circle cx="390" cy="235" r="7" fill="#4deaff" filter="url(#g)"><animate attributeName="cx" values="390;465;390" dur="1.1s" repeatCount="indefinite"/></circle><g filter="url(#g)"><circle cx="600" cy="235" r="108" fill="#714dff" opacity=".13"><animate attributeName="r" values="92;118;92" dur="2s" repeatCount="indefinite"/></circle><circle cx="600" 