<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" rx="32" fill="#070b16"/>
<rect x="24" y="24" width="1552" height="852" rx="28" fill="#0b1120" stroke="#263653" stroke-width="2"/>
<text x="70" y="75" fill="#8da0bd" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">GITVAULT / GIT BASICS / 08</text>
<text x="70" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="46" font-weight="800">git commit</text>
<text x="70" y="158" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="17">Save the staged changes as a new snapshot in local Git history.</text>

<rect x="70" y="205" width="700" height="430" rx="24" fill="#03060c" stroke="#30435f" stroke-width="2"/>
<rect x="70" y="205" width="700" height="52" rx="24" fill="#111a2c"/>
<circle cx="103" cy="231" r="6" fill="#fb7185"/><circle cx="125" cy="231" r="6" fill="#fbbf24"/><circle cx="147" cy="231" r="6" fill="#34d399"/>
<text x="180" y="236" fill="#8fa1ba" font-family="monospace" font-size="13">Git Bash — my-project</text>
<text x="105" y="295" fill="#9aa9c0" font-family="monospace" font-size="14">pallavi@devbox ~/my-project</text>
<text x="105" y="330" fill="#ffffff" font-family="monospace" font-size="15">$ git status</text>
<text x="105" y="360" fill="#9aa9c0" font-family="monospace" font-size="13">Changes to be committed:</text>
<text x="125" y="390" fill="#34d399" font-family="monospace" font-size="14">modified:   app.py</text>
<text x="125" y="418" fill="#34d399" font-family="monospace" font-size="14">new file:   README.md</text>
<line x1="105" y1="442" x2="735" y2="442" stroke="#202d43"/>
<text x="105" y="478" fill="#9aa9c0" font-family="monospace" font-size="14">pallavi@devbox ~/my-project</text>
<text x="105" y="512" fill="#ffffff" font-family="monospace" font-size="15">$ git commit -m "Add project files"</text>
<text x="105" y="550" fill="#34d399" font-family="monospace" font-size="12">[main a1b2c3d] Add project files</text>
<text x="105" y="576" fill="#9aa9c0" font-family="monospace" font-size="12">2 files changed, 18 insertions(+)</text>
<text x="105" y="602" fill="#64748b" font-family="monospace" font-size="11">illustrative commit ID / output</text>

<text x="815" y="215" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">WHAT ACTUALLY HAPPENS</text>
<rect x="815" y="250" width="700" height="385" rx="24" fill="#080d19" stroke="#30435f" stroke-width="2"/>

<rect x="850" y="300" width="180" height="150" rx="18" fill="#0b1820" stroke="#2dd4bf" stroke-width="2"/>
<text x="940" y="335" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Staging Area</text>
<text x="875" y="375" fill="#34d399" font-family="monospace" font-size="13">app.py</text>
<text x="875" y="402" fill="#34d399" font-family="monospace" font-size="13">README.md</text>
<text x="875" y="430" fill="#67e8f9" font-family="monospace" font-size="10">READY</text>

<rect x="1070" y="335" width="225" height="80" rx="18" fill="#101a2d" stroke="#8b5cf6" stroke-width="2"/>
<text x="1182" y="363" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11">COMMAND</text>
<text x="1182" y="391" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">git commit -m "..."</text>

<rect x="1335" y="300" width="145" height="150" rx="18" fill="#111127" stroke="#818cf8" stroke-width="2"/>
<text x="1407" y="335" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Commit</text>
<text x="1360" y="375" fill="#a78bfa" font-family="monospace" font-size="12">a1b2c3d</text>
<text x="1360" y="402" fill="#9aa9c0" font-family="monospace" font-size="10">saved snapshot</text>
<text x="1360" y="427" fill="#67e8f9" font-family="monospace" font-size="10">LOCAL HISTORY</text>

<line x1="1030" y1="375" x2="1070" y2="375" stroke="#8b5cf6" stroke-width="4"/>
<line x1="1295" y1="375" x2="1335" y2="375" stroke="#8b5cf6" stroke-width="4"/>
<path d="M1058 365 L1070 375 L1058 385" fill="none" stroke="#8b5cf6" stroke-width="3"/>
<path d="M1323 365 L1335 375 L1323 385" fill="none" stroke="#8b5cf6" stroke-width="3"/>

<rect x="850" y="480" width="630" height="115" rx="18" fill="#0b101c" stroke="#293852"/>
<text x="875" y="510" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700">A COMMIT REMEMBERS</text>
<text x="875" y="545" fill="#ffffff" font-family="Arial,sans-serif" font-size="13">• staged snapshot</text>
<text x="875" y="570" fill="#ffffff" font-family="Arial,sans-serif" font-size="13">• commit message</text>
<text x="1110" y="545" fill="#ffffff" font-family="Arial,sans-serif" font-size="13">• author + time</text>
<text x="1110" y="570" fill="#ffffff" font-family="Arial,sans-serif" font-size="13">• link to previous history</text>

<rect x="70" y="680" width="1445" height="125" rx="22" fill="#050914" stroke="#2b3d5b" stroke-width="2"/>
<text x="100" y="715" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">THE GIT WORKFLOW</text>
<text x="100" y="758" fill="#9aa9c0" font-family="monospace" font-size="14">EDIT</text>
<text x="180" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="220" y="758" fill="#9aa9c0" font-family="monospace" font-size="14">git add</text>
<text x="350" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="390" y="758" fill="#34d399" font-family="monospace" font-size="14">STAGED</text>
<text x="510" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="550" y="758" fill="#ffffff" font-family="monospace" font-size="14">git commit</text>
<text x="720" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="760" y="758" fill="#a78bfa" font-family="monospace" font-size="14">LOCAL HISTORY</text>
<text x="100" y="787" fill="#7f8da4" font-family="Arial,sans-serif" font-size="12">Commit records the staged snapshot. It does not upload the commit to GitHub.</text>
<text x="1445" y="787" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">STATIC • NO MOVEMENT</text>
</svg>