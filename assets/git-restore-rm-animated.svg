<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b"><stop stop-color="#050817"/><stop offset="1" stop-color="#180d32"/></linearGradient><linearGradient id="g"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git restore • git rm</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">different commands, different effects on the working tree and index</text><g font-family="system-ui"><rect x="45" y="110" width="350" height="255" rx="18" fill="#080c19" stroke="#a78bfa"/><rect x="425" y="110" width="350" height="255" rx="18" fill="#080c19" stroke="#4de7ff"/><rect x="805" y="110" width="350" height="255" rx="18" fill="#080c19" stroke="#8067ff"/><text x="220" y="145" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="800">git restore file.txt</text><text x="220" y="185" text-anchor="middle" fill="#dfe4f8" font-family="monospace" font-size="13">modified → original</text><path d="M295 210H145" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".8s" repeatCount="indefinite"/></path><text x="220" y="250" text-anchor="middle" fill="#8c98b8" font-size="11">restores working-tree content</text><text x="220" y="282" text-anchor="middle" fill="#ef9bba" font-size="11">unstaged work can be discarded</text><text x="600" y="145" text-anchor="middle" fill="#4de7ff" font-size="15" font-weight="800">git rm file.txt</text><text x="600" y="185" text-anchor="middle" fill="#dfe4f8" font-family="monospace" font-size="13">tracked → deleted + staged</text><rect x="530" y="205" width="140" height="44" rx="9" fill="#10172a" stroke="#4de7ff"/><text x="600" y="233" text-anchor="middle" fill="#dfe4f8" font-family="monospace" font-size="12">file.txt</text><path d="M550 260L650 300M650 260L550 300" stroke="#ef9bba" stroke-width="3"/><text x="600" y="330" text-anchor="middle" fill="#8c98b8" font-size="11">removes file and stages deletion</text><text x="980" y="145" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="800">git rm --cached</text><text x="980" y="185" text-anchor="middle" fill="#dfe4f8" font-family="monospace" font-size="13">tracked → untracked</text><path d="M900 220H1060" stroke="url(#g)" stroke-width="3" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".8s" repeatCount="indefinite"/></path><text x="980" y="260" text-anchor="middle" fill="#8c98b8" font-size="11">removes from Git tracking</text><text x="980" y="282" text-anchor="middle" fill="#4de7ff" font-size="11">local file remains</text></g><text x="600" y="410" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">restore = revert content • rm = delete + stage • --cached = untrack</text></svg>