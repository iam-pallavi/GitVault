<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0d1328"/><stop offset="1" stop-color="#1b0d34"/></linearGradient><linearGradient id="a"><stop stop-color="#ff6f91"/><stop offset=".5" stop-color="#4bdfff"/><stop offset="1" stop-color="#55e6b3"/></linearGradient></defs><rect width="1200" height="520" rx="30" fill="url(#b)"/><g opacity=".07" stroke="#aab5d4"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">restore • rm</text><text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">Three commands, three different effects on files and the index</text><g font-family="monospace"><rect x="45" y="110" width="350" height="300" rx="20" fill="#090e1c" stroke="#49dfff"/><text x="70" y="140" fill="#49dfff" font-size="12" font-weight="800">git restore file.txt</text><text x="70" y="170" fill="#7e8cac" font-size="10">discard unstaged edits</text><rect x="70" y="200" width="280" height="45" rx="9" fill="#111a2b"/><text x="90" y="228" fill="#ff7895">modified</text><path d="M350 268H80" stroke="#34415f" stroke-width="4"/><path d="M350 268H80" stroke="#49dfff" stroke-width="2" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".6s" repeatCount="indefinite"/></path><text x="70" y="305" fill="#55e6b3">→ HEAD version</text><text x="70" y="330" fill="#71809f" font-size="10">working-tree change removed</text><rect x="425" y="110" width="350" height="300" rx="20" fill="#090e1c" stroke="#ff6f91"/><text x="450" y="140" fill="#ff7895" font-size="12" font-weight="800">git rm file.txt</text><text x="450" y="170" fill="#7e8cac" font-size="10">delete + stage deletion</text><rect x="450" y="200" width="280" height="45" rx="9" fill="#111a2b"/><text x="470" y="228" fill="#e5eaf7">file.txt</text><path d="M590 255V330" stroke="#ff6f91" stroke-width="3" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur=".55s" repeatCount="indefinite"/></path><text x="470" y="365" fill="#ff7895">deleted</text><text x="620" y="365" fill="#55e6b3">deletion staged</text><rect x="805" y="110" width="350" height="300" rx="20" fill="#090e1c" stroke="#55e6b3"/><text x="830" y="140" fill="#55e6b3" font-size="12" font-weight="800">git rm --cached file.txt</text><text x="830" y="170" fill="#7e8cac" font-size="10">untrack, keep local file</text><rect x="830" y="200" width="280" height="45" rx="9" fill="#111a2b"/><text x="850" y="228" fill="#e5eaf7">file.txt</text><path d="M970 255V320" stroke="#55e6b3" stroke-width="3" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur=".55s" repeatCount="indefinite"/></path><text x="850" y="355" fill="#55e6b3">index: removed</text><text x="1015" y="355" text-anchor="end" fill="#71809f">disk: kept</text></g><text x="600" y="455" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">restore = recover/discard • rm = delete + stage • rm --cached = untrack</text><text x="600" y="490" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">Always check the command target before running destructive file operations.</text></svg>