<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#11102E"/><stop offset="1" stop-color="#281052"/></linearGradient><linearGradient id="neon"><stop stop-color="#9B5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="32" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">git restore • git rm</text><text x="600" y="86" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">similar-looking commands — very different outcomes</text><g font-family="system-ui"><rect x="55" y="125" width="340" height="190" rx="28" fill="#10142B" fill-opacity=".92" stroke="#9B5CFF" stroke-width="2"/><text x="225" y="163" text-anchor="middle" fill="#9B5CFF" font-size="18" font-weight="800">git restore</text><rect x="125" y="192" width="200" height="52" rx="14" fill="#090D20" stroke="#30345F"/><text x="225" y="224" text-anchor="middle" fill="#55E6FF" font-family="monospace" font-size="15">file.txt</text><path d="M295 218H155" stroke="#55E6FF" stroke-width="3" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".8s" repeatCount="indefinite"/></path><text x="225" y="278" text-anchor="middle" fill="#8F99BF" font-size="12">restore file content</text><text x="225" y="296" text-anchor="middle" fill="#E3B8D0" font-size="11">⚠ may discard unstaged work</text><rect x="430" y="125" width="340" height="190" rx="28" fill="#10142B" fill-opacity=".92" stroke="#55E6FF" stroke-width="2"/><text x="600" y="163" text-anchor="middle" fill="#55E6FF" font-size="18" font-weight="800">git rm</text><rect x="500" y="192" width="200" height="52" rx="14" fill="#090D20" stroke="#30345F"/><text x="600" y="224" text-anchor="middle" fill="#D7DBF5" font-family="monospace" font-size="15">file.txt</text><g filter="url(#glow)"><circle cx="600" cy="218" r="7" fill="#55E6FF"><animate attributeName="cx" values="600;655;600" dur="1.5s" repeatCount="indefinite"/></circle></g><text x="600" y="278" text-anchor="middle" fill="#8F99BF" font-size="12">remove file + stage deletion</text><text x="600" y="296" text-anchor="middle" fill="#8F99BF" font-size="11">tracked file is removed</text><rect x="805" y="125" width="340" height="190" rx="28" fill="#10142B" fill-opacity=".92" stroke="#7C5CFF" stroke-width="2"/><text x="975" y="163" text-anchor="middle" fill="#7C5CFF" font-size="18" font-weight="800">git rm --cached</text><rect x="875" y="192" width="200" height="52" rx="14" fill="#090D20" stroke="#30345F"/><text x="975" y="224" text-anchor="middle" fill="#D7DBF5" font-family="monospace" font-size="15">file.txt</text><path d="M925 270H1025" stroke="url(#neon)" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".8s" repeatCount="indefinite"/></path><text x="975" y="294" text-anchor="middle" fill="#8F99BF" font-size="12">untrack file</text><text x="975" y="309" text-anchor="middle" fill="#55E6FF" font-size="11">local file stays</text></g><rect x="300" y="350" width="600" height="40" rx="18" fill="#0B0F25" stroke="#30345F"/><text x="600" y="375" text-anchor="middle" fill="#A9B1D6" font-family="monospace" font-size="13">restore = revert content • rm = remove + stage deletion</text></svg>