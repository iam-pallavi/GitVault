<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#070A18"/><stop offset="1" stop-color="#24104D"/></linearGradient><linearGradient id="f"><stop stop-color="#7C5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="390" rx="30" fill="url(#b)"/><text x="600" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git restore • git rm</text><text x="600" y="82" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">two commands, two different file-management actions</text><g font-family="system-ui" text-anchor="middle"><rect x="55" y="125" width="330" height="150" rx="25" fill="#11162F" stroke="#7C5CFF" stroke-width="2"/><text x="220" y="168" fill="white" font-size="20" font-weight="800">git restore</text><text x="220" y="198" fill="#B7BEE0" font-size="14">discard unstaged changes</text><text x="220" y="225" fill="#8F99BF" font-size="13">restore file from index</text><rect x="435" y="125" width="330" height="150" rx="25" fill="#11162F" stroke="#55E6FF" stroke-width="2"/><text x="600" y="168" fill="white" font-size="20" font-weight="800">git rm</text><text x="600" y="198" fill="#B7BEE0" font-size="14">remove file + stage deletion</text><text x="600" y="225" fill="#8F99BF" font-size="13">tracked file is removed</text><rect x="815" y="125" width="330" height="150" rx="25" fill="#11162F" stroke="#B16CFF" stroke-width="2"/><text x="980" y="168" fill="white" font-size="20" font-weight="800">git rm --cached</text><text x="980" y="198" fill="#B7BEE0" font-size="14">untrack the file</text><text x="980" y="225" fill="#8F99BF" font-size="13">local file stays</text></g><path d="M385 200H435M765 200H815" stroke="#30345F" stroke-width="8"/><path d="M385 200H435M765 200H815" stroke="url(#f)" stroke-width="3" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite"/></path><g filter="url(#g)"><circle r="8" fill="#55E6FF"><animateMotion dur="1.4s" repeatCount="indefinite" path="M385 200H435"/></circle><circle r="7" fill="#B16CFF"><animateMotion dur="1.4s" begin=".5s" repeatCount="indefinite" path="M765 200H815"/></circle></g><rect x="300" y="315" width="600" height="42" rx="18" fill="#0C1026" stroke="#30345F"/><text x="600" y="342" text-anchor="middle" fill="#A9B1D6" font-family="monospace" font-size="13">⚠ restore may discard work • rm stages deletion</text></svg>