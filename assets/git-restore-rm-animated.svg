<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset="1" stop-color="#211044"/></linearGradient><linearGradient id="f"><stop stop-color="#b98cff"/><stop offset="1" stop-color="#4deaff"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="29" font-weight="800">git restore • git rm</text><text x="600" y="74" text-anchor="middle" fill="#a5afd0" font-family="system-ui" font-size="13">Three commands, three different file-state transitions</text><g font-family="system-ui"><rect x="45" y="108" width="350" height="265" rx="18" fill="#070b17" stroke="#b98cff"/><text x="220" y="140" text-anchor="middle" fill="#b98cff" font-size="14" font-weight="800">git restore file.txt</text><rect x="105" y="172" width="230" height="42" rx="8" fill="#10172a" stroke="#293653"/><text x="220" y="198" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="12">modified file</text><path d="M310 235H130" stroke="#b98cff" stroke-width="4" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".6s" repeatCount="indefinite"/></path><circle cx="300" cy="235" r="7" fill="#b98cff"><animate attributeName="cx" values="300;140;300" dur="1.3s" repeatCount="indefinite"/></circle><text x="220" y="270" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="11">→ HEAD/index content</text><text x="220" y="306" text-anchor="middle" fill="#ff819d" font-size="11">unstaged changes discarded</text></g><g font-family="system-ui"><rect x="425" y="108" width="350" height="265" rx="18" fill="#070b17" stroke="#4deaff"/><text x="600" y="140" text-anchor="middle" fill="#4deaff" font-size="14" font-weight="800">git rm file.txt</text><rect x="510" y="172" width="180" height="42" rx="8" fill="#10172a" stroke="#293653"/><text x="600" y="198" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="12">file.txt</text><path d="M540 235L660 285M660 235L540 285" stroke="#ff7896" stroke-width="3"/><circle cx="600" cy="260" r="9" fill="#ff7896"><animate attributeName="r" values="5;13;5" dur="1.1s" repeatCount="indefinite"/></circle><text x="600" y="315" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="11">working tree deleted</text><text x="600" y="334" text-anchor="middle" fill="#ff819d" font-size="10">deletion staged</text></g><g font-family="system-ui"><rect x="805" y="108" width="350" height="265" rx="18" fill="#070b17" stroke="#8067ff"/><text x="980" y="140" text-anchor="middle" fill="#b98cff" font-size="14" font-weight="800">git rm --cached</text><rect x="895" y="172" width="170" height="42" rx="8" fill="#10172a" stroke="#293653"/><text x="980" y="198" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="12">file.txt</text><path d="M930 235H1030" stroke="url(#f)" stroke-width="4" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".6s" repeatCount="indefinite"/></path><circle cx="930" cy="235" r="7" fill="#4deaff"><animate attributeName="cx" values="930;1030;930" dur="1.3s" repeatCount="indefinite"/></circle><text x="980" y="270" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="11">removed from index</text><text x="980" y="300" text-anchor="middle" fill="#62e6b1" font-size="11">local file remains</text></g><rect x="300" y="400" width="600" height="34" rx="17" fill="#080c18" stroke="#46527a"/><text x="600" y="422" text-anchor="middle" fill="#b7c0da" font-family="monospace" font-size="11">restore = content • rm = delete + stage • --cached = untrack</text></svg>