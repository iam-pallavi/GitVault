<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360"><rect width="1100" height="360" rx="24" fill="#0b1020"/><text x="550" y="52" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="700">git restore • git rm</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="105" width="280" height="130" rx="18" fill="#151d35" stroke="#6d5dfc"/><text x="220" y="150" fill="white" font-size="20">Unstaged Changes</text><text x="220" y="180" fill="#9aa7c7" font-size="14">git restore</text><text x="220" y="205" fill="#9aa7c7" font-size="14">restore from index</text><rect x="410" y="105" width="280" height="130" rx="18" fill="#151d35" stroke="#00c8ff"/><text x="550" y="150" fill="white" font-size="20">Tracked File</text><text x="550" y="180" fill="#9aa7c7" font-size="14">git rm</text><text x="550" y="205" fill="#9aa7c7" font-size="14">remove + stage deletion</text><rect x="740" y="105" width="280" height="130" rx="18" fill="#151d35" stroke="#8a6cff"/><text x="880" y="150" fill="white" font-size="20">Local File Kept</text><text x="880" y="180" fill="#9aa7c7" font-size="14">git rm --cached</text><text x="880" y="205" fill="#9aa7c7" font-size="14">untrack only</text></g><path d="M360 170H410M690 170H740" stroke="#00d4ff" stroke-width="5"/><circle r="8" fill="white"><animateMotion path="M360 170H410" dur="1.2s" repeatCount="indefinite"/></circle><circle r="8" fill="#b8a8ff"><animateMotion path="M690 170H740" dur="1.2s" begin=".6s" repeatCount="indefinite"/></circle><text x="550" y="305" text-anchor="middle" fill="#8d9ab8" font-family="monospace" font-size="15">⚠ restore can discard changes • rm stages deletion</text></svg>