<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040611"/><stop offset=".5" stop-color="#100B29"/><stop offset="1" stop-color="#29104F"/></linearGradient><linearGradient id="neon"><stop stop-color="#B66CFF"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="34" fill="url(#bg)"/><g fill="#9B6CFF" opacity=".35"><circle cx="90" cy="100" r="2"><animate attributeName="cy" values="100;75;100" dur="3s" repeatCount="indefinite"/></circle><circle cx="1110" cy="95" r="2"><animate attributeName="cx" values="1110;1140;1110" dur="4s" repeatCount="indefinite"/></circle></g><text x="600" y="55" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="850">git restore • git rm</text><text x="600" y="83" text-anchor="middle" fill="#AEB5D5" font-family="system-ui" font-size="14">three actions — restore content, remove a file, or stop tracking it</text><g font-family="system-ui"><rect x="55" y="125" width="340" height="190" rx="30" fill="#11132D" fill-opacity=".72" stroke="#B66CFF" stroke-opacity=".65"/><text x="225" y="160" text-anchor="middle" fill="#B66CFF" font-size="17" font-weight="850">git restore</text><g transform="translate(225 218)"><rect x="-70" y="-27" width="140" height="54" rx="15" fill="#090C20" stroke="#30345F"/><text x="0" y="6" text-anchor="middle" fill="#DDE1F7" font-family="monospace" font-size="14">file.txt</text><path d="M70 0 C115 -45 120 45 70 0" fill="none" stroke="#55E6FF" stroke-width="3" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".8s" repeatCount="indefinite"/></path><circle cx="105" cy="0" r="6" fill="#55E6FF" filter="url(#glow)"/></g><text x="225" y="278" text-anchor="middle" fill="#8B95BC" font-size="11">restore content</text><text x="225" y="297" text-anchor="middle" fill="#D99ABB" font-size="11">⚠ may discard unstaged work</text><rect x="430" y="125" width="340" height="190" rx="30" fill="#11132D" fill-opacity=".72" stroke="#55E6FF" stroke-opacity=".65"/><text x="600" y="160" text-anchor="middle" fill="#55E6FF" font-size="17" font-weight="850">git rm</text><g transform="translate(600 218)"><rect x="-70" y="-27" width="140" height="54" rx="15" fill="#090C20" stroke="#30345F"/><text x="0" y="6" text-anchor="middle" fill="#DDE1F7" font-family="monospace" font-size="14">file.txt</text><path d="M-15 -7 L15 23 M15 -7 L-15 23" stroke="#55E6FF" stroke-width="3"/><circle cx="0" cy="8" r="25" fill="none" stroke="#55E6FF" opacity=".35"><animate attributeName="r" values="20;34;20" dur="1.8s" repeatCount="indefinite"/></circle></g><text x="600" y="278" text-anchor="middle" fill="#8B95BC" font-size="11">remove file + stage deletion</text><text x="600" y="297" text-anchor="middle" fill="#8B95BC" font-size="11">tracked file is removed</text><rect x="805" y="125" width="340" height="190" rx="30" fill="#11132D" fill-opacity=".72" stroke="#7C5CFF" stroke-opacity=".65"/><text x="975" y="160" text-anchor="middle" fill="#7C5CFF" font-size="17" font-weight="850">git rm --cached</text><g transform="translate(975 218)"><rect x="-70" y="-27" width="140" height="54" rx="15" fill="#090C20" stroke="#30345F"/><text x="0" y="6" text-anchor="middle" fill="#DDE1F7" font-family="monospace" font-size="14">file.txt</text><path d="M-95 0 H-72" stroke="url(#neon)" stroke-width="3" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur=".7s" repeatCount="indefinite"/></path><circle cx="-105" cy="0" r="6" fill="#B66CFF" filter="url(#glow)"/></g><text x="975" y="278" text-anchor="middle" fill="#8B95BC" font-size="11">untrack the file</text><text x="975" y="297" text-anchor="middle" fill="#55E6FF" font-size="11">local file stays</text></g><rect x="315" y="350" width="570" height="38" rx="19" fill="#090C20" stroke="#30345F"/><text x="600" y="375" text-anchor="middle" fill="#AEB5D5" font-family="monospace" font-size="13">restore = revert content • rm = remove • --cached = untrack</text></svg>