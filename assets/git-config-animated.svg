<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060914"/><stop offset=".55" stop-color="#111638"/><stop offset="1" stop-color="#070A18"/></linearGradient>
 <linearGradient id="prompt" x1="0" x2="1"><stop stop-color="#62F6FF"/><stop offset="1" stop-color="#39F5B2"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F5F7FF}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9FA9D0}.mono{font-family:Consolas,Monaco,monospace}.cyan{fill:#62F6FF}.green{fill:#39F5B2}.label{font-size:13px;letter-spacing:2.5px}.title{font-size:45px;font-weight:750}.sub{font-size:18px}.cmd{font-size:23px;fill:#F5F7FF}.out{font-size:21px;fill:#39F5B2}.dim{font-size:17px;fill:#7E89B0}.small{font-size:15px}
 </style>
</defs>
<rect width="1500" height="820" fill="url(#bg)"/>
<g opacity=".10"><path d="M0 120H1500M0 220H1500M0 320H1500M0 420H1500M0 520H1500M0 620H1500M0 720H1500" stroke="#7D87C5"/><path d="M100 0V820M300 0V820M500 0V820M700 0V820M900 0V820M1100 0V820M1300 0V820" stroke="#7D87C5"/></g>

<text x="70" y="70" class="t title">Git Configuration</text>
<text x="70" y="105" class="m sub">Type the command in the terminal → Git responds with the output.</text>
<text x="1430" y="70" text-anchor="end" class="cyan label">04 / TERMINAL</text>

<!-- single terminal -->
<g>
 <rect x="70" y="145" width="1360" height="575" rx="24" fill="#070A13" stroke="#3B4777" stroke-width="2"/>
 <rect x="70" y="145" width="1360" height="52" rx="24" fill="#0E1326"/>
 <circle cx="102" cy="171" r="7" fill="#FF6B8A"/><circle cx="126" cy="171" r="7" fill="#FFD166"/><circle cx="150" cy="171" r="7" fill="#39F5B2"/>
 <text x="190" y="178" class="m mono small">Git Bash — Git Configuration</text>

 <text x="105" y="245" class="green mono small">pallavi@devbox</text>
 <text x="250" y="245" class="m mono small">MINGW64 ~/GitVault</text>

 <!-- command 1 -->
 <text x="105" y="305" class="cyan mono cmd">$ git config --global user.name "Pallavi"</text>
 <rect x="105" y="279" width="0" height="34" fill="#62F6FF" opacity=".13">
   <animate attributeName="width" values="0;570" dur="1.1s" fill="freeze"/>
 </rect>
 <text x="105" y="350" class="out mono" opacity="0">✓ name saved to global Git config
   <animate attributeName="opacity" begin="1.2s" dur=".3s" values="0;1" fill="freeze"/>
 </text>

 <!-- command 2 -->
 <text x="105" y="420" class="cyan mono cmd" opacity="0">$ git config --global user.email "pallavi@example.com"
   <animate attributeName="opacity" begin="1.9s" dur=".25s" values="0;1" fill="freeze"/>
 </text>
 <text x="105" y="465" class="out mono" opacity="0">✓ email saved to global Git config
   <animate attributeName="opacity" begin="3.05s" dur=".3s" values="0;1" fill="freeze"/>
 </text>

 <!-- command 3 -->
 <text x="105" y="535" class="cyan mono cmd" opacity="0">$ git config --global --list
   <animate attributeName="opacity" begin="3.7s" dur=".25s" values="0;1" fill="freeze"/>
 </text>
 <text x="105" y="580" class="out mono" opacity="0">user.name=Pallavi
   <animate attributeName="opacity" begin="4.15s" dur=".3s" values="0;1" fill="freeze"/>
 </text>
 <text x="105" y="615" class="out mono" opacity="0">user.email=pallavi@example.com
   <animate attributeName="opacity" begin="4.5s" dur=".3s" values="0;1" fill="freeze"/>
 </text>
 <text x="105" y="665" class="green mono small" opacity="0">✓ Git identity configured
   <animate attributeName="opacity" begin="5s" dur=".3s" values="0;1" fill="freeze"/>
 </text>

 <!-- blinking cursor -->
 <rect x="105" y="680" width="13" height="25" fill="#62F6FF" filter="url(#glow)">
   <animate attributeName="opacity" values="0;1;0" dur=".9s" repeatCount="indefinite" begin="1s"/>
 </rect>
</g>

<!-- small terminal footer -->
<text x="750" y="765" text-anchor="middle" class="m small">Command → Output → Verification</text>
<text x="750" y="790" text-anchor="middle" class="green small">Everything is shown directly inside the terminal.</text>
</svg>