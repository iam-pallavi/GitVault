<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#080d1e"/><stop offset=".5" stop-color="#17103a"/><stop offset="1" stop-color="#062032"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="url(#b)"/><text x="70" y="58" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Git Configuration — Who is creating the commit?</text><g transform="translate(70 100)"><rect width="610" height="250" rx="20" fill="#060a15" stroke="#364267"/><text x="28" y="38" fill="#7485af" font-family="monospace">LOCAL GIT CONFIG</text><text x="28" y="82" fill="#fff" font-family="monospace">$ git config --global user.name</text><text x="28" y="116" fill="#72f2c2" font-family="monospace" opacity="0"><animate attributeName="opacity" begin=".7s" dur=".3s" values="0;1" fill="freeze"/>Pallavi</text><text x="28" y="164" fill="#fff" font-family="monospace">$ git config --global user.email</text><text x="28" y="198" fill="#72f2c2" font-family="monospace" opacity="0"><animate attributeName="opacity" begin="1.5s" dur=".3s" values="0;1" fill="freeze"/>you@example.com</text></g><g transform="translate(750 115)"><circle cx="100" cy="80" r="62" fill="#101a35" stroke="#7c5cff" stroke-width="4"/><circle cx="100" cy="62" r="18" fill="#cbd7f7"/><path d="M63 118c10-35 64-35 74 0" fill="#cbd7f7"/><path d="M175 80h150" stroke="#00e5ff" stroke-width="4"/><text x="185" y="62" fill="#fff" font-family="Arial" font-size="17">Commit Author</text><text x="185" y="90" fill="#9daed2" font-family="Arial" font-size="15">Name + email attached</text><text x="185" y="122" fill="#9daed2" font-family="Arial" font-size="15">to future commits</text></g><text x="70" y="390" fill="#8fa0c5" font-family="Arial" font-size="15">--global = applies to Git repositories for your user on this computer</text></svg>