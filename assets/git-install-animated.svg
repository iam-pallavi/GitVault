<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#080d1e"/><stop offset=".5" stop-color="#1a123d"/><stop offset="1" stop-color="#062032"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="url(#b)"/><text x="70" y="60" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Git Installation &amp; Verification</text><rect x="70" y="105" width="1060" height="245" rx="20" fill="#060a15" stroke="#364267"/><text x="100" y="145" fill="#7082ad" font-family="monospace">PALLAVI@DEVBOX ~/projects</text><text x="100" y="195" fill="#fff" font-family="monospace" font-size="20">$ git --version</text><text x="100" y="240" fill="#7df5c5" font-family="monospace" font-size="20" opacity="0"><animate attributeName="opacity" begin=".8s" dur=".3s" values="0;1" fill="freeze"/>git version 2.x.x</text><path d="M100 285H760" stroke="#33405f"/><text x="800" y="288" fill="#b7c6e7" font-family="Arial" font-size="16">Git installed ✓</text><circle cx="1055" cy="285" r="18" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="30 80"><animateTransform attributeName="transform" type="rotate" from="0 1055 285" to="360 1055 285" dur="2s" repeatCount="indefinite"/></circle><text x="100" y="325" fill="#8d9cbe" font-family="Arial" font-size="15">Verify first → then configure your Git identity</text></svg>