<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0d1328"/><stop offset="1" stop-color="#1b0d34"/></linearGradient><linearGradient id="a"><stop stop-color="#ff6f91"/><stop offset=".5" stop-color="#4bdfff"/><stop offset="1" stop-color="#55e6b3"/></linearGradient></defs><rect width="1200" height="520" rx="30" fill="url(#b)"/><g opacity=".07" stroke="#aab5d4"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git diff</text><text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">A visual code comparison — additions, deletions and context</text><rect x="50" y="108" width="1100" height="310" rx="22" fill="#080e1d" stroke="#34405e"/><rect x="75" y="135" width="1050" height="255" rx="14" fill="#060a14" stroke="#263451"/><text x="100" y="162" fill="#7785a4" font-family="monospace" font-size="10">diff --git a/app.py b/app.py</text><g font-family="monospace" font-size="12"><text x="100" y="192" fill="#74819f">@@ function deploy()</text><rect x="92" y="207" width="1010" height="30" rx="5" fill="#1a101c"/><text x="105" y="227" fill="#ff7897">- print("deploying old config")</text><rect x="92" y="242" width="1010" height="30" rx="5" fill="#0d211d"/><text x="105" y="262" fill="#62e6b1">+ print("deploying current config")</text><text x="105" y="298" fill="#8b97b4">  return release_id</text><text x="100" y="350" fill="#596984">3 lines context • 1 deletion • 1 addition</text></g><rect x="92" y="207" width="4" height="65" fill="url(#a)"><animate attributeName="x" values="92;1100;92" dur="2.6s" repeatCount="indefinite"/></rect><circle cx="600" cy="430" r="5" fill="#55eaff"><animate attributeName="r" values="4;10;4" dur="1.2s" repeatCount="indefinite"/></circle><rect x="300" y="438" width="600" height="40" rx="20" fill="#070b16" stroke="#465276"/><text x="600" y="464" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">git diff  →  working tree ↔ index / HEAD</text><text x="600" y="501" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">Review the exact changes before staging or committing.</text></svg>