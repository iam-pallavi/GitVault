<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040714"/><stop offset="1" stop-color="#190d35"/></linearGradient><linearGradient id="scan"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">git diff</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">See the exact line-level difference between versions of a file</text><rect x="60" y="105" width="1080" height="280" rx="18" fill="#070b17" stroke="#303a59"/><rect x="80" y="125" width="1040" height="38" rx="8" fill="#11172a"/><text x="100" y="150" fill="#dce1f2" font-family="monospace" font-size="13">$ git diff</text><text x="830" y="150" fill="#7582a0" font-family="monospace" font-size="11">a/app.py → b/app.py</text><g font-family="monospace" font-size="12"><rect x="90" y="180" width="690" height="30" rx="5" fill="#2a101d"/><text x="105" y="201" fill="#ff8ba5">- version = 1.0</text><rect x="90" y="214" width="690" height="30" rx="5" fill="#102a21"/><text x="105" y="235" fill="#72e6b1">+ version = 1.1</text><rect x="90" y="248" width="690" height="30" rx="5" fill="#102a21"/><text x="105" y="269" fill="#72e6b1">+ status = updated</text><text x="105" y="306" fill="#7582a0">  status = ready</text></g><rect x="795" y="180" width="300" height="100" rx="14" fill="#0b1223" stroke="#4de7ff"/><text x="945" y="207" text-anchor="middle" fill="#4de7ff" font-family="system-ui" font-size="11" font-weight="800">LIVE COMPARISON</text><text x="945" y="232" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="11">working tree</text><text x="945" y="253" text-anchor="middle" fill="#7582a0" font-family="system-ui" font-size="10">vs</text><text x="945" y="272" text-anchor="middle" fill="#dce1f2" font-family="monospace" font-size="11">index / HEAD</text><rect x="90" y="327" width="1005" height="3" fill="#293451"/><rect x="90" y="327" width="120" height="3" fill="url(#scan)"><animate attributeName="x" values="90;975;90" dur="2.7s" repeatCount="indefinite"/></rect><text x="105" y="356" fill="#ff8ba5" font-family="monospace" font-size="11">− removed</text><text x="250" y="356" fill="#72e6b1" font-family="monospace" font-size="11">+ added</text><text x="600" y="415" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git diff shows what changed before you stage it</text></svg>