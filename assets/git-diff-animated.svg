<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#11102E"/><stop offset="1" stop-color="#281052"/></linearGradient><linearGradient id="neon"><stop stop-color="#9B5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="32" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="32" font-weight="800">git diff</text><text x="600" y="86" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">inspect the exact changes before you stage or commit</text><rect x="65" y="125" width="430" height="205" rx="28" fill="#10142B" fill-opacity=".92" stroke="#7C5CFF" stroke-width="2"/><rect x="705" y="125" width="430" height="205" rx="28" fill="#10142B" fill-opacity=".92" stroke="#55E6FF" stroke-width="2"/><text x="105" y="160" fill="#9B5CFF" font-family="system-ui" font-size="13" font-weight="800">BEFORE</text><text x="745" y="160" fill="#55E6FF" font-family="system-ui" font-size="13" font-weight="800">AFTER</text><g font-family="monospace" font-size="15"><rect x="100" y="180" width="350" height="35" rx="9" fill="#19152F"/><text x="116" y="203" fill="#C8CDEA">version = 1.0</text><rect x="100" y="225" width="350" height="35" rx="9" fill="#25152E"/><text x="116" y="248" fill="#E39ABF">- status = ready</text><rect x="740" y="180" width="350" height="35" rx="9" fill="#10263A"/><text x="756" y="203" fill="#55E6FF">+ version = 1.1</text><rect x="740" y="225" width="350" height="35" rx="9" fill="#10263A"/><text x="756" y="248" fill="#55E6FF">+ status = updated</text></g><path d="M505 225H695" stroke="#30345F" stroke-width="10"/><path d="M505 225H695" stroke="url(#neon)" stroke-width="4" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1s" repeatCount="indefinite"/></path><g filter="url(#glow)"><circle r="9" fill="#55E6FF"><animateMotion dur="1.5s" repeatCount="indefinite" path="M505 225H695"/></circle></g><circle cx="600" cy="225" r="32" fill="#090D20" stroke="#9B5CFF" stroke-width="2"><animate attributeName="r" values="27;40;27" dur="2s" repeatCount="indefinite"/></circle><text x="600" y="230" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="12" font-weight="800">DIFF</text><text x="600" y="378" text-anchor="middle" fill="#A9B1D6" font-family="monospace" font-size="14">git diff = compare changes that are not yet staged</text></svg>