<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0d1328"/><stop offset="1" stop-color="#1b0d34"/></linearGradient>
</defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<g opacity=".07" stroke="#aab5d4"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g>
<text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git diff</text>
<text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">See exactly what changed before you stage or commit</text>
<rect x="50" y="108" width="1100" height="310" rx="22" fill="#080e1d" stroke="#34405e"/>
<rect x="75" y="135" width="1050" height="255" rx="14" fill="#060a14" stroke="#263451"/>
<text x="100" y="162" fill="#7785a4" font-family="monospace" font-size="10">pallavi@devbox ~/my-project</text>
<text x="100" y="185" fill="#fff" font-family="monospace" font-size="12">$ git diff</text>
<text x="100" y="212" fill="#74819f" font-family="monospace" font-size="10">diff --git a/app.py b/app.py</text>
<text x="100" y="236" fill="#8b97b4" font-family="monospace" font-size="11">@@ function deploy()</text>
<rect x="92" y="248" width="1010" height="29" rx="5" fill="#1a101c"/>
<text x="105" y="268" fill="#ff7897" font-family="monospace" font-size="12">- print("deploying old config")</text>
<rect x="92" y="283" width="1010" height="29" rx="5" fill="#0d211d"/>
<text x="105" y="303" fill="#62e6b1" font-family="monospace" font-size="12">+ print("deploying current config")</text>
<text x="105" y="332" fill="#8b97b4" font-family="monospace" font-size="12">  return release_id</text>
<text x="100" y="365" fill="#596984" font-family="monospace" font-size="10">1 deletion • 1 addition • context unchanged</text>
<rect x="92" y="378" width="1010" height="2" fill="#2a3550"/>
<text x="600" y="408" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="11">WORKING TREE ↔ INDEX / HEAD</text>
<rect x="300" y="438" width="600" height="40" rx="20" fill="#070b16" stroke="#465276"/>
<text x="600" y="464" text-anchor="middle" fill="#55eaff" font-family="monospace" font-size="12">git diff = unstaged changes</text>
<text x="600" y="501" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">For staged changes, use git diff --staged</text>
</svg>