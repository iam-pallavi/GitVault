<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b"><stop stop-color="#050817"/><stop offset="1" stop-color="#180d32"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git diff</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">see the exact unstaged lines that changed in your working tree</text><rect x="65" y="105" width="1070" height="275" rx="18" fill="#080c19" stroke="#293152"/><rect x="85" y="125" width="1030" height="35" rx="8" fill="#11172a"/><text x="105" y="149" fill="#cfd5ee" font-family="monospace" font-size="14">$ git diff</text><text x="720" y="149" fill="#737f9f" font-family="monospace" font-size="11">a/app.py → b/app.py</text><text x="105" y="195" fill="#ef9bba" font-family="monospace" font-size="13">- version = 1.0</text><text x="105" y="222" fill="#737f9f" font-family="monospace" font-size="12">  status = ready</text><text x="105" y="249" fill="#73e6b1" font-family="monospace" font-size="13">+ version = 1.1</text><text x="105" y="276" fill="#73e6b1" font-family="monospace" font-size="13">+ status = updated</text><line x1="90" y1="300" x2="1110" y2="300" stroke="#222b49"/><text x="105" y="330" fill="#7f8baa" font-family="monospace" font-size="11">red  = removed line</text><text x="350" y="330" fill="#7f8baa" font-family="monospace" font-size="11">green = added line</text><rect x="780" y="190" width="270" height="72" rx="12" fill="#0d1324" stroke="#8067ff"/><text x="915" y="218" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="800">BEFORE → AFTER</text><text x="915" y="242" text-anchor="middle" fill="#dbe0f4" font-family="monospace" font-size="11">unstaged working-tree change</text><rect x="85" y="350" width="1030" height="3" fill="#293152"/><rect x="85" y="350" width="120" height="3" fill="#4de7ff"><animate attributeName="x" values="85;995;85" dur="3s" repeatCount="indefinite"/></rect><text x="600" y="415" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git diff compares your working tree with the staged version</text></svg>