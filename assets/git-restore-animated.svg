<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#080d1e"/><stop offset=".5" stop-color="#19103d"/><stop offset="1" stop-color="#062333"/></linearGradient></defs><rect width="1200" height="450" rx="28" fill="url(#b)"/><text x="70" y="60" fill="#fff" font-family="Arial" font-size="28" font-weight="700">git restore — discard an unstaged change</text><g transform="translate(70 105)"><rect width="1060" height="250" rx="20" fill="#060a15" stroke="#364267"/><text x="30" y="38" fill="#7183ad" font-family="monospace">WORKING TREE</text><rect x="30" y="65" width="360" height="125" rx="14" fill="#111936"/><text x="55" y="105" fill="#fff" font-family="monospace">README.md</text><text x="55" y="140" fill="#ff8f9a" font-family="monospace">- old line</text><text x="55" y="170" fill="#7df5c5" font-family="monospace">+ accidental line</text><path d="M420 128H625" stroke="#00e5ff" stroke-width="5" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur=".7s" repeatCount="indefinite"/></path><text x="465" y="105" fill="#9fb0d7" font-family="Arial" font-size="14">restore from index</text><g transform="translate(680 70)"><circle cx="85" cy="60" r="55" fill="#101936" stroke="#7c5cff" stroke-width="4"/><path d="M85 30a32 32 0 1 1-28 17" fill="none" stroke="#fff" stroke-width="7"/><path d="M52 47l5-20 18 8" fill="none" stroke="#fff" stroke-width="7"/><text x="155" y="55" fill="#fff" font-family="Arial" font-size="18">Tracked file</text><text x="155" y="82" fill="#91a2c7" font-family="Arial" font-size="15">back to last staged state</text></g><rect x="680" y="175" width="300" height="42" rx="10" fill="#0f1730"/><text x="700" y="202" fill="#7df5c5" font-family="monospace">$ git restore README.md</text></g><text x="70" y="400" fill="#ffcf72" font-family="Arial" font-size="15">⚠ Discarded unstaged changes may not be easily recoverable.</text></svg>