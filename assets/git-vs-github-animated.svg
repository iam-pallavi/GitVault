<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070A18"/><stop offset=".55" stop-color="#15133A"/><stop offset="1" stop-color="#24104D"/></linearGradient><linearGradient id="flow"><stop stop-color="#7C5CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="360" rx="30" fill="url(#bg)"/><circle cx="150" cy="80" r="120" fill="#7C5CFF" opacity=".12" filter="url(#g)"/><circle cx="1050" cy="290" r="140" fill="#55E6FF" opacity=".08" filter="url(#g)"/><text x="600" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">Git vs GitHub</text><text x="600" y="82" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">local version control meets remote collaboration</text><g font-family="system-ui"><rect x="80" y="125" width="400" height="150" rx="25" fill="#11162F" fill-opacity=".88" stroke="#7C5CFF" stroke-width="2"/><text x="280" y="170" text-anchor="middle" fill="white" font-size="25" font-weight="800">Git</text><text x="280" y="202" text-anchor="middle" fill="#B7BEE0" font-size="15">Version control • Local</text><text x="280" y="228" text-anchor="middle" fill="#858FB8" font-size="13">commits • branches • history</text><rect x="720" y="125" width="400" height="150" rx="25" fill="#11162F" fill-opacity=".88" stroke="#55E6FF" stroke-width="2"/><text x="920" y="170" text-anchor="middle" fill="white" font-size="25" font-weight="800">GitHub</text><text x="920" y="202" text-anchor="middle" fill="#B7BEE0" font-size="15">Hosting • Collaboration</text><text x="920" y="228" text-anchor="middle" fill="#858FB8" font-size="13">PRs • issues • remote repos</text></g><path d="M480 200H720" stroke="#30345F" stroke-width="8" stroke-linecap="round"/><path d="M480 200H720" stroke="url(#flow)" stroke-width="3" stroke-dasharray="12 12"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1s" repeatCount="indefinite"/></path><g filter="url(#g)"><circle r="8" fill="#B58CFF"><animateMotion dur="2.2s" repeatCount="indefinite" path="M480 200H720"/></circle><circle r="5" fill="#55E6FF"><animateMotion dur="2.2s" begin=".8s" repeatCount="indefinite" path="M480 200H720"/></circle></g><circle cx="600" cy="200" r="28" fill="#0C1026" stroke="#9B6CFF" stroke-width="2"><animate attributeName="r" values="24;34;24" dur="2s" repeatCount="indefinite"/></circle><text x="600" y="206" text-anchor="middle" fill="white" font-family="monospace" font-size="13">VS</text></svg>