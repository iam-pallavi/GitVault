<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0b1024"/><stop offset="1" stop-color="#21103a"/></linearGradient>
<linearGradient id="flow"><stop stop-color="#4ce9c0"/><stop offset=".5" stop-color="#4bdfff"/><stop offset="1" stop-color="#aa7cff"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="560" rx="32" fill="url(#bg)"/>
<g opacity=".07" stroke="#b9c4df"><path d="M40 100H1160M40 160H1160M40 220H1160M40 280H1160M40 340H1160M40 400H1160M40 460H1160"/><path d="M100 70V500M200 70V500M300 70V500M400 70V500M500 70V500M600 70V500M700 70V500M800 70V500M900 70V500M1000 70V500M1100 70V500"/></g>
<text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="32" font-weight="800">Git vs GitHub</text>
<text x="600" y="75" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">One manages your version history locally. The other hosts it online.</text>
<!-- Git side -->
<rect x="48" y="112" width="472" height="310" rx="26" fill="#080d1b" stroke="#49dfff" stroke-width="1.5"/>
<circle cx="88" cy="148" r="15" fill="#49dfff" opacity=".15"/><circle cx="88" cy="148" r="6" fill="#49dfff" filter="url(#glow)"/>
<text x="116" y="154" fill="#49dfff" font-family="system-ui" font-size="18" font-weight="800">GIT</text><text x="116" y="174" fill="#71809f" font-family="system-ui" font-size="11">Local version control</text>
<rect x="78" y="198" width="410" height="174" rx="18" fill="#050912" stroke="#263552"/>
<g font-family="monospace" font-size="13"><text x="102" y="228" fill="#dfe5f4">$ git commit -m "save changes"</text><text x="102" y="258" fill="#65e6b1">[main abc1234] save changes</text><text x="102" y="286" fill="#9aa7c3">1 file changed</text><text x="102" y="318" fill="#71809f">Commit ID: abc1234</text><text x="102" y="346" fill="#71809f">Saved in Local History</text></g>
<!-- GitHub side -->
<rect x="680" y="112" width="472" height="310" rx="26" fill="#080d1b" stroke="#aa7cff" stroke-width="1.5"/>
<circle cx="720" cy="148" r="15" fill="#aa7cff" opacity=".15"/><circle cx="720" cy="148" r="6" fill="#aa7cff" filter="url(#glow)"/>
<text x="748" y="154" fill="#aa7cff" font-family="system-ui" font-size="18" font-weight="800">GITHUB</text><text x="748" y="174" fill="#71809f" font-family="system-ui" font-size="11">Remote collaboration platform</text>
<rect x="710" y="198" width="410" height="174" rx="18" fill="#080c17" stroke="#3a3158"/>
<g font-family="monospace" font-size="13"><text x="734" y="228" fill="#dfe5f4">Repository: GitVault</text><text x="734" y="258" fill="#65dfff">main → Remote Repository</text><text x="734" y="286" fill="#9aa7c3">Pull Requests • Code Review</text><text x="734" y="318" fill="#9aa7c3">Issues • Actions • Collaboration</text><text x="734" y="346" fill="#71809f">Commit ID: abc1234</text></g>
<!-- bridge -->
<path d="M520 270H680" stroke="#273451" stroke-width="12" stroke-linecap="round"/>
<path d="M520 270H680" stroke="url(#flow)" stroke-width="3" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur=".6s" repeatCount="indefinite"/></path>
<circle r="8" fill="#55eaff" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M520 270H680"/></circle>
<text x="600" y="238" text-anchor="middle" fill="#dce4f3" font-family="monospace" font-size="12">git push origin main</text>
<text x="600" y="302" text-anchor="middle" fill="#7e8ca9" font-family="system-ui" font-size="10">Local → Remote</text>
<!-- bottom learning strip -->
<rect x="190" y="450" width="820" height="60" rx="30" fill="#090e1d" stroke="#293754"/>
<text x="600" y="475" text-anchor="middle" fill="#dfe7f5" font-family="system-ui" font-size="13" font-weight="700">Git = version control engine  •  GitHub = online collaboration</text>
<text x="600" y="496" text-anchor="middle" fill="#71809f" font-family="system-ui" font-size="11">Git works on your machine. GitHub stores and shares Git repositories.</text>
</svg>