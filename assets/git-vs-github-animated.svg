<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0d1328"/><stop offset="1" stop-color="#1b0d34"/></linearGradient><linearGradient id="a"><stop stop-color="#4ce9c0"/><stop offset=".5" stop-color="#4bdfff"/><stop offset="1" stop-color="#aa7cff"/></linearGradient></defs><rect width="1200" height="520" rx="30" fill="url(#b)"/><g opacity=".07" stroke="#aab5d4"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">Git vs GitHub</text><text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">Git creates and manages local history — GitHub hosts and collaborates on it</text><rect x="50" y="108" width="460" height="300" rx="22" fill="#090e1c" stroke="#49dfff"/><text x="80" y="140" fill="#49dfff" font-family="system-ui" font-size="12" font-weight="800">GIT • LOCAL ENGINE</text><rect x="80" y="165" width="400" height="190" rx="15" fill="#060a14" stroke="#293754"/><g font-family="monospace" font-size="12"><text x="105" y="198" fill="#dfe5f4">$ git commit -m "release"</text><text x="105" y="228" fill="#65e6b1">[main 7c91e4a] release</text><text x="105" y="255" fill="#9aa7c3">1 file changed, 12 insertions</text><text x="105" y="295" fill="#71809f">local repository</text></g><rect x="690" y="108" width="460" height="300" rx="22" fill="#090e1c" stroke="#aa7cff"/><text x="720" y="140" fill="#aa7cff" font-family="system-ui" font-size="12" font-weight="800">GITHUB • REMOTE COLLABORATION</text><rect x="720" y="165" width="400" height="190" rx="15" fill="#0a101e" stroke="#293754"/><g font-family="monospace" font-size="12"><text x="745" y="198" fill="#dfe5f4">origin/main</text><text x="745" y="228" fill="#65dfff">● 7c91e4a</text><text x="745" y="255" fill="#9aa7c3">issues • pull requests</text><text x="745" y="282" fill="#9aa7c3">reviews • CI/CD</text><text x="745" y="315" fill="#71809f">remote repository</text></g><path d="M510 255H690" stroke="#293754" stroke-width="10"/><path d="M510 255H690" stroke="url(#a)" stroke-width="2" stroke-dasharray="9 9"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur=".55s" repeatCount="indefinite"/></path><circle r="7" fill="#55eaff"><animateMotion dur="2s" repeatCount="indefinite" path="M510 255H690"/></circle><text x="600" y="225" text-anchor="middle" fill="#dce4f3" font-family="monospace" font-size="11">git push origin main</text><text x="600" y="445" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">Git = version control engine   |   GitHub = hosted collaboration platform</text><text x="600" y="482" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">You can use Git without GitHub; GitHub uses Git repositories underneath.</text></svg>