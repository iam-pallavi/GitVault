<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050713"/><stop offset=".52" stop-color="#0a1026"/><stop offset="1" stop-color="#170c2b"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#55e6c1"/><stop offset=".5" stop-color="#5be7ff"/><stop offset="1" stop-color="#b889ff"/></linearGradient>
  <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111a31"/><stop offset="1" stop-color="#060a15"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="termClip"><rect x="70" y="150" width="330" height="245" rx="18"/></clipPath>
</defs>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<circle cx="260" cy="280" r="190" fill="#48ddff" opacity=".05" filter="url(#blur)"/>
<circle cx="965" cy="275" r="210" fill="#a66cff" opacity=".055" filter="url(#blur)"/>
<path d="M35 115H1165M35 445H1165" stroke="#dbe6ff" opacity=".035"/>

<text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="29" font-weight="850">GIT  →  GITHUB</text>
<text x="600" y="72" text-anchor="middle" fill="#8391ad" font-family="system-ui,sans-serif" font-size="12">One works locally. The other connects your repository to the world.</text>

<!-- local terminal -->
<g>
 <rect x="58" y="138" width="354" height="270" rx="22" fill="#080d19" stroke="#273653"/>
 <rect x="70" y="150" width="330" height="245" rx="18" fill="url(#terminal)"/>
 <circle cx="91" cy="171" r="4" fill="#ff6680"/><circle cx="105" cy="171" r="4" fill="#ffd166"/><circle cx="119" cy="171" r="4" fill="#55e6c1"/>
 <text x="88" y="202" fill="#55e6c1" font-family="monospace" font-size="12">pallavi@laptop ~/GitVault</text>
 <text x="88" y="226" fill="#dfe7f5" font-family="monospace" font-size="12">$ git status</text>
 <text x="88" y="248" fill="#ff7896" font-family="monospace" font-size="11">modified: README.md</text>
 <text x="88" y="271" fill="#dfe7f5" font-family="monospace" font-size="12">$ git add README.md</text>
 <text x="88" y="294" fill="#dfe7f5" font-family="monospace" font-size="12">$ git commit -m "save changes"</text>
 <text x="88" y="317" fill="#55e6c1" font-family="monospace" font-size="11">✓ changes saved in Git history</text>
 <text x="88" y="340" fill="#7e8da9" font-family="monospace" font-size="11">$ git push</text>
 <path d="M88 365H365" stroke="#1d2941"/>
 <text x="241" y="383" text-anchor="middle" fill="#7585a2" font-family="system-ui,sans-serif" font-size="10">YOUR LOCAL MACHINE</text>
</g>

<!-- moving file/change -->
<g>
 <rect x="424" y="250" width="76" height="46" rx="12" fill="#0d1729" stroke="#55e6c1"/>
 <text x="462" y="269" text-anchor="middle" fill="#55e6c1" font-family="monospace" font-size="10">README.md</text>
 <text x="462" y="284" text-anchor="middle" fill="#70819f" font-family="system-ui,sans-serif" font-size="8">changed file</text>
 <animateMotion dur="3.8s" repeatCount="indefinite" path="M0 0 C55 -70 90 -70 145 0"/>
</g>

<!-- git core / version history -->
<g>
 <circle cx="585" cy="268" r="91" fill="#070d1a" stroke="#55e6c1" stroke-width="2"/>
 <circle cx="585" cy="268" r="68" fill="none" stroke="#263955" stroke-width="2" stroke-dasharray="3 9">
   <animateTransform attributeName="transform" type="rotate" from="0 585 268" to="360 585 268" dur="8s" repeatCount="indefinite"/>
 </circle>
 <path d="M553 268L585 236L617 268L585 300Z" fill="none" stroke="#55e6c1" stroke-width="6" transform="rotate(45 585 268)"/>
 <circle cx="585" cy="268" r="13" fill="#07101c" stroke="#5be7ff" stroke-width="3"/>
 <text x="585" y="205" text-anchor="middle" fill="#5be7ff" font-family="system-ui,sans-serif" font-size="23" font-weight="900">GIT</text>
 <text x="585" y="334" text-anchor="middle" fill="#cbd6eb" font-family="system-ui,sans-serif" font-size="11" font-weight="700">VERSION CONTROL</text>
 <text x="585" y="350" text-anchor="middle" fill="#6f809e" font-family="system-ui,sans-serif" font-size="9">track • stage • commit • branch</text>
</g>

<!-- commit history trail -->
<g>
 <path d="M640 190 C690 170 728 180 748 214 C768 248 755 284 790 304" fill="none" stroke="#263752" stroke-width="3"/>
 <circle cx="650" cy="187" r="7" fill="#55e6c1"/>
 <circle cx="716" cy="188" r="7" fill="#5be7ff"/>
 <circle cx="764" cy="250" r="7" fill="#b889ff"/>
 <circle cx="790" cy="304" r="7" fill="#fff"/>
 <text x="650" y="171" fill="#7e8eaa" font-family="system-ui,sans-serif" font-size="9">Previous</text>
 <text x="704" y="175" fill="#7e8eaa" font-family="system-ui,sans-serif" font-size="9">Saved</text>
 <text x="750" y="269" fill="#7e8eaa" font-family="system-ui,sans-serif" font-size="9">New commit</text>
</g>

<!-- push beam -->
<path d="M795 304 C850 304 855 250 900 250" fill="none" stroke="#1e2d48" stroke-width="16" stroke-linecap="round"/>
<path d="M795 304 C850 304 855 250 900 250" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="12 10">
 <animate attributeName="stroke-dashoffset" from="0" to="-44" dur=".7s" repeatCount="indefinite"/>
</path>
<circle r="7" fill="#55e6c1" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M795 304 C850 304 855 250 900 250"/></circle>
<text x="846" y="291" text-anchor="middle" fill="#e6edff" font-family="monospace" font-size="11">git push</text>

<!-- github repository window -->
<g>
 <rect x="900" y="138" width="244" height="270" rx="22" fill="#080c18" stroke="#9d73ff" stroke-width="2"/>
 <text x="926" y="174" fill="#c39cff" font-family="system-ui,sans-serif" font-size="21" font-weight="900">GitHub</text>
 <text x="926" y="195" fill="#72819f" font-family="system-ui,sans-serif" font-size="9">REMOTE REPOSITORY</text>
 <path d="M925 211H1118" stroke="#202e49"/>
 <text x="926" y="237" fill="#dfe7f5" font-family="monospace" font-size="11">iam-pallavi / GitVault</text>
 <rect x="926" y="252" width="192" height="43" rx="10" fill="#10172a" stroke="#273752"/>
 <circle cx="942" cy="273" r="5" fill="#55e6c1"/>
 <text x="954" y="277" fill="#dfe7f5" font-family="monospace" font-size="10">main</text>
 <text x="990" y="277" fill="#7e8eaa" font-family="system-ui,sans-serif" font-size="9">latest changes</text>
 <path d="M926 311H1118" stroke="#202e49"/>
 <text x="926" y="333" fill="#8f9db8" font-family="system-ui,sans-serif" font-size="10">Pull Requests</text>
 <text x="926" y="351" fill="#8f9db8" font-family="system-ui,sans-serif" font-size="10">Code Review</text>
 <text x="926" y="369" fill="#8f9db8" font-family="system-ui,sans-serif" font-size="10">Issues • Actions • Team</text>
 <circle cx="1110" cy="170" r="4" fill="#b889ff"><animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/></circle>
</g>

<!-- collaboration wave -->
<g>
 <path d="M930 445 C975 420 1020 470 1065 445 C1090 431 1110 433 1130 445" fill="none" stroke="#394966" stroke-width="2"/>
 <circle cx="930" cy="445" r="6" fill="#55e6c1"><animate attributeName="cy" values="445;438;445" dur="1.6s" repeatCount="indefinite"/></circle>
 <circle cx="1065" cy="445" r="6" fill="#b889ff"><animate attributeName="cy" values="445;452;445" dur="1.9s" repeatCount="indefinite"/></circle>
 <text x="1030" y="476" text-anchor="middle" fill="#d9e4fb" font-family="system-ui,sans-serif" font-size="11" font-weight="700">COLLABORATION</text>
</g>

<!-- central labels -->
<g>
 <text x="235" y="438" text-anchor="middle" fill="#aab8d1" font-family="system-ui,sans-serif" font-size="11">Git works on your machine</text>
 <text x="585" y="438" text-anchor="middle" fill="#aab8d1" font-family="system-ui,sans-serif" font-size="11">Git remembers versions</text>
 <text x="1020" y="438" text-anchor="middle" fill="#aab8d1" font-family="system-ui,sans-serif" font-size="11">GitHub shares the repository</text>
</g>

<rect x="150" y="500" width="900" height="38" rx="19" fill="#080d19" stroke="#263651"/>
<text x="600" y="524" text-anchor="middle" fill="#e0e8fa" font-family="system-ui,sans-serif" font-size="11" font-weight="700">GIT = version control  •  GITHUB = remote hosting + collaboration</text>
</svg>