<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050817"/><stop offset=".55" stop-color="#0d1026"/><stop offset="1" stop-color="#180d32"/></linearGradient><linearGradient id="flow"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#6d8cff"/><stop offset="1" stop-color="#4de7ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="500" rx="30" fill="url(#bg)"/><path d="M0 410H1200M0 90H1200" stroke="#222746" opacity=".35"/><g fill="#fff" opacity=".45"><circle cx="90" cy="120" r="2"/><circle cx="1080" cy="95" r="1.7"/><circle cx="1020" cy="420" r="2"/><circle cx="180" cy="390" r="1.5"/></g><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">Git <tspan fill="#8f78ff">vs</tspan> GitHub</text><text x="600" y="74" text-anchor="middle" fill="#9fa8cc" font-family="system-ui" font-size="13">local version control → remote collaboration</text><g font-family="system-ui"><rect x="55" y="115" width="450" height="275" rx="18" fill="#0b1020" stroke="#8067ff" stroke-width="2"/><rect x="695" y="115" width="450" height="275" rx="18" fill="#0b1420" stroke="#4de7ff" stroke-width="2"/><rect x="75" y="135" width="410" height="30" rx="8" fill="#151b32"/><circle cx="92" cy="150" r="4" fill="#ff6b6b"/><circle cx="106" cy="150" r="4" fill="#ffd166"/><circle cx="120" cy="150" r="4" fill="#5ee38b"/><text x="145" y="155" fill="#9ba5c8" font-family="monospace" font-size="11">developer@local ~/project</text><text x="80" y="195" fill="#c7ccef" font-family="monospace" font-size="13">$ git status</text><text x="80" y="219" fill="#ef9bff" font-family="monospace" font-size="12">modified: app.py</text><text x="80" y="244" fill="#c7ccef" font-family="monospace" font-size="13">$ git add app.py</text><text x="80" y="268" fill="#73e6b1" font-family="monospace" font-size="12">Changes staged</text><text x="80" y="292" fill="#c7ccef" font-family="monospace" font-size="13">$ git commit -m "update"</text><text x="80" y="316" fill="#73e6b1" font-family="monospace" font-size="12">[main 7c91e4a] update</text><text x="80" y="345" fill="#7f89ad" font-family="system-ui" font-size="13">Git stores history locally.</text><rect x="715" y="135" width="410" height="30" rx="8" fill="#132034"/><circle cx="732" cy="150" r="4" fill="#ff6b6b"/><circle cx="746" cy="150" r="4" fill="#ffd166"/><circle cx="760" cy="150" r="4" fill="#5ee38b"/><text x="785" y="155" fill="#9ba5c8" font-family="monospace" font-size="11">github.com / iam-pallavi</text><text x="720" y="195" fill="#c7ccef" font-family="monospace" font-size="13">origin/main</text><circle cx="735" cy="225" r="7" fill="#4de7ff" filter="url(#glow)"/><text x="755" y="230" fill="#fff" font-family="monospace" font-size="12">7c91e4a</text><text x="720" y="258" fill="#8e99ba" font-family="system-ui" font-size="13">Remote repository</text><rect x="720" y="278" width="360" height="34" rx="7" fill="#111b2e" stroke="#273957"/><text x="738" y="300" fill="#aeb9d7" font-family="monospace" font-size="11">Pull requests   Issues   Review</text><text x="720" y="345" fill="#7f89ad" font-family="system-ui" font-size="13">GitHub stores, reviews &amp; collaborates.</text></g><path d="M506 252 C570 252 630 252 695 252" fill="none" stroke="#2c3558" stroke-width="8"/><path d="M506 252 C570 252 630 252 695 252" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="9 12"><animate attributeName="stroke-dashoffset" from="0" to="-42" dur="1s" repeatCount="indefinite"/></path><g filter="url(#glow)"><rect x="0" y="246" width="18" height="12" rx="3" fill="#a78bfa"><animateMotion dur="1.8s" repeatCount="indefinite" path="M506 252 C570 252 630 252 695 252"/></rect><rect x="0" y="246" width="12" height="8" rx="2" fill="#4de7ff"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M506 252 C570 252 630 252 695 252"/></rect></g><text x="600" y="430" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git commit → git push → GitHub remote</text><text x="600" y="454" text-anchor="middle" fill="#657092" font-family="system-ui" font-size="12">Git = tool on your machine  •  GitHub = platform on the internet</text></svg>