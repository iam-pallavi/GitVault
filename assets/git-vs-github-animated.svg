<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020611"/><stop offset=".48" stop-color="#09132A"/><stop offset="1" stop-color="#17091F"/></linearGradient>
  <linearGradient id="git" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FF4D35"/><stop offset=".55" stop-color="#F97350"/><stop offset="1" stop-color="#C026D3"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  <linearGradient id="wire" x1="0" x2="1"><stop stop-color="#FF7558"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#8B5CF6" stop-opacity=".34"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#A8B7D8" stroke-opacity=".045"/></pattern>
  <style>
   .title{font:800 48px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#93A4C2}.label{font:800 10px Inter,Segoe UI,sans-serif;fill:#8EA4C7;letter-spacing:2.5px}.head{font:800 25px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 14px Inter,Segoe UI,sans-serif;fill:#A7B4CA}.code{font:650 14px ui-monospace,Consolas,monospace;fill:#DDFBFF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71839F}
  </style>
</defs>

<rect width="1600" height="900" rx="38" fill="url(#bg)"/>
<rect width="1600" height="900" rx="38" fill="url(#grid)"/>
<circle cx="800" cy="405" r="390" fill="url(#halo)" filter="url(#soft)"><animate attributeName="r" values="310;430;310" dur="7s" repeatCount="indefinite"/></circle>

<text x="68" y="55" class="label">GITVAULT / GIT BASICS / 02</text>
<text x="68" y="105" class="title">Git vs GitHub</text>
<text x="68" y="135" class="sub">Git controls version history on your machine. GitHub hosts and shares that repository online.</text>

<!-- LOCAL MACHINE -->
<g transform="translate(70 220)" filter="url(#shadow)">
 <rect width="430" height="405" rx="30" fill="#07101D" stroke="#29415F" stroke-width="2"/>
 <text x="28" y="38" class="label">01 / LOCAL MACHINE</text>
 <text x="28" y="70" class="head">Your project + Git</text>

 <!-- terminal -->
 <rect x="28" y="94" width="374" height="185" rx="20" fill="#02050B" stroke="#1F354C"/>
 <rect x="28" y="94" width="374" height="30" rx="20" fill="#0C1727"/>
 <circle cx="50" cy="109" r="5" fill="#FF6B57"/><circle cx="67" cy="109" r="5" fill="#FBBF24"/><circle cx="84" cy="109" r="5" fill="#34D399"/>
 <text x="108" y="113" class="tiny">PROJECT TERMINAL</text>
 <text x="50" y="153" class="code">$ git status</text>
 <text x="50" y="181" class="body">modified:  app.py</text>
 <text x="50" y="207" class="body">modified:  README.md</text>
 <text x="50" y="233" class="body">untracked: notes.txt</text>
 <text x="50" y="260" class="tiny">FILES + HISTORY ARE LOCAL</text>

 <!-- git badge -->
 <g transform="translate(30 310)">
  <path d="M0 30L38 0L76 30V80L38 110L0 80Z" fill="url(#git)" stroke="#FFB7A1" stroke-width="2"/>
  <path d="M38 18L55 31V52L38 65L21 52V31Z" fill="none" stroke="#FFF8F5" stroke-width="3" opacity=".75"/>
  <text x="38" y="50" text-anchor="middle" style="font:900 13px Inter,Segoe UI,sans-serif;fill:#fff">GIT</text>
 </g>
 <text x="135" y="337" class="head">Version control</text>
 <text x="135" y="362" class="body">Track • commit • branch • recover</text>
 <text x="135" y="388" class="tiny">THE TOOL RUNS ON YOUR COMPUTER</text>
</g>

<!-- GIT CORE / HISTORY -->
<g transform="translate(800 410)">
 <ellipse rx="280" ry="205" fill="none" stroke="#7180AE" stroke-opacity=".16" stroke-width="2" stroke-dasharray="5 13"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="215" ry="155" fill="none" stroke="#22D3EE" stroke-opacity=".14" stroke-width="2" stroke-dasharray="3 12"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/></ellipse>

 <!-- left connection -->
 <path d="M-300 0 C-220 -120 -125 -125 -78 -62" fill="none" stroke="#253751" stroke-width="15" stroke-linecap="round"/>
 <path d="M-300 0 C-220 -120 -125 -125 -78 -62" fill="none" stroke="url(#wire)" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 18"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.4s" repeatCount="indefinite"/></path>

 <!-- right connection -->
 <path d="M78 62 C125 125 220 120 300 0" fill="none" stroke="#253751" stroke-width="15" stroke-linecap="round"/>
 <path d="M78 62 C125 125 220 120 300 0" fill="none" stroke="url(#wire)" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 18"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.4s" repeatCount="indefinite"/></path>

 <!-- orbiting history nodes -->
 <g>
  <circle cx="-150" cy="-95" r="12" fill="#FF8060" stroke="#FFD0C4"/><text x="-150" y="-91" text-anchor="middle" style="font:800 8px Inter;fill:#fff">C1</text>
  <circle cx="150" cy="-95" r="12" fill="#A78BFA" stroke="#E4D9FF"/><text x="150" y="-91" text-anchor="middle" style="font:800 8px Inter;fill:#fff">C2</text>
  <circle cx="-155" cy="95" r="12" fill="#67E8F9" stroke="#D8FCFF"/><text x="-155" y="99" text-anchor="middle" style="font:800 8px Inter;fill:#06202A">C3</text>
  <circle cx="155" cy="95" r="12" fill="#C084FC" stroke="#F1D8FF"/><text x="155" y="99" text-anchor="middle" style="font:800 8px Inter;fill:#fff">C4</text>
  <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="16s" repeatCount="indefinite"/>
 </g>

 <!-- fixed core -->
 <g filter="url(#shadow)">
  <circle r="96" fill="#080E1D" stroke="#5F4D91" stroke-width="2"/>
  <circle r="78" fill="url(#git)" stroke="#FFD1BF" stroke-width="2"/>
  <path d="M-38 -4L0 -42L38 -4L0 34Z" fill="none" stroke="#FFF9F5" stroke-width="5" opacity=".78"/>
  <text y="9" text-anchor="middle" style="font:900 23px Inter,Segoe UI,sans-serif;fill:#fff">GIT</text>
  <circle r="105" fill="none" stroke="#FF7757" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 14"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle>
 </g>
 <text x="0" y="130" text-anchor="middle" class="label">VERSION CONTROL SYSTEM</text>
 <text x="0" y="156" text-anchor="middle" class="code">git commit</text>
 <text x="0" y="181" text-anchor="middle" class="tiny">SAVES A SNAPSHOT INTO HISTORY</text>

 <!-- packets -->
 <circle r="7" fill="#FF896B" filter="url(#glow)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M-300 0 C-220 -120 -125 -125 -78 -62"/></circle>
 <circle r="6" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="2.5s" begin="1.25s" repeatCount="indefinite" path="M78 62 C125 125 220 120 300 0"/></circle>
</g>

<!-- GITHUB -->
<g transform="translate(1100 220)" filter="url(#shadow)">
 <rect width="430" height="405" rx="30" fill="#0B1025" stroke="#454B7E" stroke-width="2"/>
 <text x="28" y="38" class="label">02 / ONLINE PLATFORM</text>
 <text x="28" y="70" class="head">GitHub</text>
 <text x="28" y="96" class="body">A place to host Git repositories.</text>

 <!-- cloud -->
 <g transform="translate(215 205)">
  <ellipse rx="150" ry="110" fill="#10183B" stroke="#4F5EB0" stroke-opacity=".55"/>
  <path d="M-88 55C-126 55-151 31-151-2C-151-38-123-66-88-66C-68-66-51-58-39-43C-25-76 4-94 37-94C82-94 116-60 116-17C116-12 115-7 115-2C141 5 158 25 158 49C158 82 131 105 97 105H-88C-124 105-151 84-151 55Z" fill="url(#blue)" opacity=".18" stroke="#67E8F9" stroke-width="3"/>
  <!-- collaboration network -->
  <path d="M-63 12L0 -32L63 12M-63 12L0 53L63 12" fill="none" stroke="#DDFBFF" stroke-opacity=".75" stroke-width="3">
   <animate attributeName="stroke-opacity" values=".35;.9;.35" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="-63" cy="12" r="10" fill="#67E8F9" filter="url(#glow)"/><circle cx="0" cy="-32" r="10" fill="#A78BFA" filter="url(#glow)"/><circle cx="63" cy="12" r="10" fill="#C084FC" filter="url(#glow)"/><circle cx="0" cy="53" r="10" fill="#818CF8" filter="url(#glow)"/>
  <text x="0" y="137" text-anchor="middle" class="tiny">REMOTE REPOSITORY</text>
 </g>
 <text x="28" y="335" class="code">github.com / iam-pallavi</text>
 <text x="28" y="362" class="body">Host • share • review • collaborate</text>
 <text x="28" y="389" class="tiny">PULL REQUESTS • ISSUES • TEAMWORK</text>
</g>

<!-- PUSH / PULL animated labels -->
<g transform="translate(525 650)">
 <rect width="550" height="54" rx="27" fill="#07101D" stroke="#314764"/>
 <text x="275" y="34" text-anchor="middle" class="code">COMMIT → PUSH → GITHUB → PULL</text>
 <circle cx="32" cy="27" r="5" fill="#FF8060" filter="url(#glow)"><animate attributeName="cx" values="32;518;32" dur="4s" repeatCount="indefinite"/></circle>
</g>

<!-- bottom memory -->
<g transform="translate(70 740)">
 <rect width="1460" height="92" rx="26" fill="#050A15" stroke="#263A57"/>
 <text x="30" y="28" class="label">REMEMBER</text>
 <text x="30" y="61" class="body" style="font-size:16px"><tspan fill="#FF8060" font-weight="800">GIT</tspan> = version control on your computer.</text>
 <text x="520" y="61" class="body" style="font-size:16px"><tspan fill="#67E8F9" font-weight="800">GITHUB</tspan> = online hosting + collaboration for Git repositories.</text>
 <text x="1260" y="61" class="tiny">GIT ≠ GITHUB</text>
</g>

<text x="1530" y="55" text-anchor="end" class="tiny">TOOL ≠ PLATFORM</text>
</svg>