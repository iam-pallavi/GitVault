<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#080c1b"/><stop offset=".5" stop-color="#171034"/><stop offset="1" stop-color="#061a2d"/></linearGradient><linearGradient id="line"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient></defs><rect width="1200" height="500" rx="28" fill="url(#bg)"/><text x="600" y="55" text-anchor="middle" fill="#fff" font-size="30" font-family="Arial" font-weight="700">Git vs GitHub — Inside the Developer Workflow</text><g transform="translate(55 105)"><rect width="470" height="300" rx="22" fill="#0d1328" stroke="#344066"/><text x="25" y="35" fill="#9aa9ce" font-family="monospace" font-size="14">LOCAL TERMINAL • ~/project</text><rect x="22" y="60" width="426" height="145" rx="12" fill="#060912"/><g fill="#dbe7ff" font-family="monospace" font-size="17"><text x="38" y="94">$ git add .</text><text x="38" y="128">$ git commit -m "update"</text><text x="38" y="164" fill="#6ee7b7">✓ saved in local history</text></g><g><circle cx="55" cy="240" r="8" fill="#7c5cff"/><circle cx="150" cy="240" r="8" fill="#7c5cff"/><circle cx="245" cy="240" r="8" fill="#7c5cff"/><path d="M63 240h79M158 240h79" stroke="#6877a5" stroke-width="3"/></g><text x="25" y="275" fill="#fff" font-family="Arial" font-size="18">Git = version control</text></g><g transform="translate(675 105)"><rect width="470" height="300" rx="22" fill="#0d1328" stroke="#344066"/><text x="25" y="35" fill="#9aa9ce" font-family="monospace" font-size="14">GITHUB • github.com/iam-pallavi</text><circle cx="235" cy="130" r="52" fill="#111b38" stroke="#00e5ff" stroke-width="4"/><path d="M212 130h46M235 107v46" stroke="#00e5ff" stroke-width="6"/><text x="25" y="220" fill="#fff" font-family="Arial" font-size="18">GitHub = hosted collaboration</text><text x="25" y="253" fill="#9aa9ce" font-family="Arial" font-size="15">Remote repo • Pull Requests • Issues • Review</text></g><path d="M525 255 C575 205 625 205 675 255" fill="none" stroke="url(#line)" stroke-width="5"/><circle r="7" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" path="M525 255 C575 205 625 205 675 255"/></circle><text x="600" y="455" text-anchor="middle" fill="#b9c8ec" font-family="Arial" font-size="17">commit → push → remote branch → collaboration</text></svg>