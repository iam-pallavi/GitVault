<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040D"/><stop offset=".5" stop-color="#0B1028"/><stop offset="1" stop-color="#17082A"/></linearGradient>
 <linearGradient id="git" x1="0" x2="1"><stop stop-color="#FF8A3D"/><stop offset=".5" stop-color="#F04438"/><stop offset="1" stop-color="#A21CAF"/></linearGradient>
 <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#6366F1" stop-opacity=".35"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#A8B7D8" stroke-opacity=".045"/></pattern>
 <style>
 .title{font:800 44px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#91A0BA}.label{font:700 11px Inter,Segoe UI,sans-serif;fill:#91A4C2;letter-spacing:2px}.head{font:800 23px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 14px Inter,Segoe UI,sans-serif;fill:#9AA9C3}.code{font:600 14px ui-monospace,Consolas,monospace;fill:#E6FAFF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71839F}
 </style>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect width="1600" height="900" rx="36" fill="url(#grid)"/>
<circle cx="800" cy="420" r="420" fill="url(#halo)" filter="url(#blur)"><animate attributeName="r" values="350;440;350" dur="6s" repeatCount="indefinite"/></circle>

<text x="70" y="58" class="label">GITVAULT / GIT BASICS / 02</text>
<text x="70" y="108" class="title">Git vs GitHub — what is the difference?</text>
<text x="70" y="138" class="sub">Git manages version history on your computer. GitHub hosts Git repositories online for sharing and collaboration.</text>

<!-- LOCAL GIT SIDE -->
<g transform="translate(70 205)" filter="url(#shadow)">
 <rect width="570" height="430" rx="28" fill="#091426" stroke="#2B4969" stroke-width="2"/>
 <rect width="570" height="5" rx="2" fill="#FF7043"/>
 <text x="30" y="40" class="label">01 / LOCAL COMPUTER</text>
 <text x="30" y="78" class="head">Git — Version Control System</text>
 <text x="30" y="105" class="body">Git works locally and records the history of your project.</text>

 <rect x="30" y="135" width="510" height="220" rx="20" fill="#030812" stroke="#20334D"/>
 <text x="55" y="168" class="label">YOUR PROJECT</text>
 <text x="55" y="198" class="code">📁 my-project</text>
 <text x="55" y="228" class="body">app.py        → modified</text>
 <text x="55" y="255" class="body">index.html    → modified</text>
 <text x="55" y="282" class="body">README.md     → saved</text>

 <rect x="55" y="305" width="210" height="32" rx="16" fill="#101C31" stroke="#355477"/>
 <text x="160" y="326" text-anchor="middle" class="tiny">LOCAL GIT REPOSITORY</text>

 <text x="30" y="392" class="tiny">TRACK CHANGES • CREATE COMMITS • VIEW HISTORY</text>
</g>

<!-- GITHUB SIDE -->
<g transform="translate(960 205)" filter="url(#shadow)">
 <rect width="570" height="430" rx="28" fill="#10132A" stroke="#563D79" stroke-width="2"/>
 <rect width="570" height="5" rx="2" fill="#E879F9"/>
 <text x="30" y="40" class="label">02 / ONLINE PLATFORM</text>
 <text x="30" y="78" class="head">GitHub — Remote Collaboration Platform</text>
 <text x="30" y="105" class="body">GitHub hosts Git repositories online and adds collaboration features.</text>

 <rect x="30" y="135" width="510" height="220" rx="20" fill="#030812" stroke="#30265B"/>
 <text x="55" y="168" class="label">REMOTE REPOSITORY</text>
 <g transform="translate(300 230)">
   <circle r="58" fill="#111B38" stroke="#00E5FF" stroke-width="3" filter="url(#glow)"/>
   <path d="M-24 -4L0 -28L24 -4L0 20Z" fill="none" stroke="#00E5FF" stroke-width="5"/>
   <circle cx="0" cy="-28" r="5" fill="#00E5FF"/><circle cx="-24" cy="-4" r="5" fill="#00E5FF"/><circle cx="24" cy="-4" r="5" fill="#00E5FF"/><circle cx="0" cy="20" r="5" fill="#00E5FF"/>
 </g>
 <text x="55" y="220" class="code">github.com / iam-pallavi</text>
 <text x="55" y="252" class="body">Remote repository</text>
 <text x="55" y="280" class="body">Pull Requests • Issues • Code Review</text>
 <text x="55" y="308" class="body">Team sharing • Remote backup</text>

 <text x="30" y="392" class="tiny">HOST • SHARE • REVIEW • COLLABORATE</text>
</g>

<!-- CENTRAL REAL WORKFLOW -->
<g transform="translate(800 415)">
 <ellipse rx="270" ry="105" fill="none" stroke="url(#flow)" stroke-opacity=".22" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></ellipse>
 <g filter="url(#shadow)">
  <polygon points="0,-105 105,-52 105,52 0,105 -105,52 -105,-52" fill="url(#git)" stroke="#FFC08A" stroke-width="2"/>
  <path d="M0 -68L42 -45V3L0 27L-42 3V-45Z" fill="none" stroke="#FFF4ED" stroke-opacity=".45" stroke-width="3"/>
  <text x="0" y="-8" text-anchor="middle" style="font:900 31px Inter,Segoe UI,sans-serif;fill:white">GIT</text>
  <text x="0" y="18" text-anchor="middle" style="font:700 10px Inter,Segoe UI,sans-serif;fill:#FFE8D8;letter-spacing:2px">LOCAL VERSION CONTROL</text>
 </g>
 <text x="0" y="145" text-anchor="middle" class="label">THE CONNECTION</text>
 <text x="0" y="172" text-anchor="middle" class="code">LOCAL GIT REPOSITORY → GITHUB REMOTE REPOSITORY</text>
</g>

<!-- REAL COMMAND FLOW -->
<g fill="none" stroke-linecap="round">
 <path d="M640 370 C700 350 730 350 735 360" stroke="#22D3EE66" stroke-width="5"/>
 <path d="M865 360 C870 350 900 350 960 370" stroke="#E879F966" stroke-width="5"/>
 <circle r="8" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M640 370 C700 350 730 350 735 360"/></circle>
 <circle r="8" fill="#F0ABFC" filter="url(#glow)"><animateMotion dur="2.4s" begin=".5s" repeatCount="indefinite" path="M865 360 C870 350 900 350 960 370"/></circle>
</g>

<!-- COMMAND STRIP -->
<g transform="translate(240 665)" filter="url(#shadow)">
 <rect width="1120" height="120" rx="26" fill="#070C18" stroke="#293D5D" stroke-width="2"/>
 <text x="40" y="32" class="label">HOW GIT AND GITHUB WORK TOGETHER</text>
 <g transform="translate(40 52)">
  <rect width="165" height="42" rx="21" fill="#0D1B2E" stroke="#2A4A67"/><text x="82" y="78" text-anchor="middle" class="code">Edit files</text>
  <path d="M170 21H215" stroke="#52708D" stroke-width="3"/><polygon points="215,21 205,15 205,27" fill="#52708D"/>
  <rect x="220" width="165" height="42" rx="21" fill="#0D1B2E" stroke="#2A4A67"/><text x="302" y="78" text-anchor="middle" class="code">git add</text>
  <path d="M390 21H435" stroke="#52708D" stroke-width="3"/><polygon points="435,21 425,15 425,27" fill="#52708D"/>
  <rect x="440" width="165" height="42" rx="21" fill="#15112D" stroke="#4A3C72"/><text x="522" y="78" text-anchor="middle" class="code">git commit</text>
  <path d="M610 21H655" stroke="#8065A7" stroke-width="3"/><polygon points="655,21 645,15 645,27" fill="#8065A7"/>
  <rect x="660" width="165" height="42" rx="21" fill="#17102D" stroke="#664A7D"/><text x="742" y="78" text-anchor="middle" class="code">git push</text>
  <path d="M830 21H875" stroke="#8065A7" stroke-width="3"/><polygon points="875,21 865,15 865,27" fill="#8065A7"/>
  <rect x="880" width="165" height="42" rx="21" fill="#10152D" stroke="#355477"/><text x="962" y="78" text-anchor="middle" class="code">GitHub</text>
 </g>
</g>

<!-- BOTTOM DEFINITION -->
<g transform="translate(70 820)">
 <text x="0" y="0" class="body" style="font-size:15px"><tspan fill="#FF9A6A" font-weight="700">Git</tspan> = the tool that tracks and manages project history locally.</text>
 <text x="800" y="0" class="body" style="font-size:15px"><tspan fill="#67E8F9" font-weight="700">GitHub</tspan> = the online platform that hosts Git repositories and enables collaboration.</text>
</g>

<rect x="70" y="175" width="1460" height="2" fill="url(#flow)" opacity=".35"><animate attributeName="x" values="70;120;70" dur="5s" repeatCount="indefinite"/></rect>
</svg>