<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040714"/><stop offset=".5" stop-color="#0d1026"/><stop offset="1" stop-color="#190d35"/></linearGradient><linearGradient id="f"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#7387ff"/><stop offset="1" stop-color="#4de7ff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="500" rx="30" fill="url(#bg)"/><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">Git <tspan fill="#9c7bff">vs</tspan> GitHub</text><text x="600" y="74" text-anchor="middle" fill="#9fa8cc" font-family="system-ui" font-size="13">Git creates local history • GitHub hosts and collaborates on that history</text><rect x="45" y="112" width="465" height="280" rx="20" fill="#080d1b" stroke="#8067ff"/><rect x="690" y="112" width="465" height="280" rx="20" fill="#08131f" stroke="#4de7ff"/><rect x="65" y="132" width="425" height="34" rx="8" fill="#11172a"/><circle cx="85" cy="149" r="5" fill="#ff657f"/><circle cx="103" cy="149" r="5" fill="#ffc75f"/><circle cx="121" cy="149" r="5" fill="#5ce1b0"/><text x="145" y="154" fill="#8995b7" font-family="monospace" font-size="11">pallavi@devbox ~/project</text><text x="72" y="198" fill="#dce1f2" font-family="monospace" font-size="12">$ git add .</text><text x="72" y="224" fill="#dce1f2" font-family="monospace" font-size="12">$ git commit -m "update"</text><text x="72" y="250" fill="#67e6b0" font-family="monospace" font-size="11">[main 7c91e4a] update</text><text x="72" y="280" fill="#8b97b5" font-family="system-ui" font-size="12">LOCAL REPOSITORY</text><circle cx="100" cy="315" r="9" fill="#4de7ff"/><circle cx="165" cy="315" r="9" fill="#a78bfa"/><circle cx="230" cy="315" r="9" fill="#687596"/><path d="M100 315H230" stroke="#39445f" stroke-width="4"/><text x="72" y="350" fill="#7783a1" font-family="system-ui" font-size="11">Version history lives on your machine.</text><rect x="710" y="132" width="425" height="34" rx="8" fill="#122033"/><circle cx="730" cy="149" r="5" fill="#ff657f"/><circle cx="748" cy="149" r="5" fill="#ffc75f"/><circle cx="766" cy="149" r="5" fill="#5ce1b0"/><text x="790" y="154" fill="#8995b7" font-family="monospace" font-size="11">github.com / iam-pallavi</text><text x="718" y="198" fill="#dce1f2" font-family="monospace" font-size="12">origin/main</text><circle cx="735" cy="225" r="8" fill="#4de7ff" filter="url(#gl)"/><text x="755" y="230" fill="#fff" font-family="monospace" font-size="11">7c91e4a</text><rect x="718" y="250" width="385" height="48" rx="9" fill="#101c2d" stroke="#29415d"/><text x="738" y="280" fill="#aeb9d7" font-family="monospace" font-size="11">Pull requests  •  Issues  •  Review</text><text x="718" y="330" fill="#7783a1" font-family="system-ui" font-size="12">Remote collaboration happens here.</text><path d="M510 252 C570 252 630 252 690 252" fill="none" stroke="#2b3552" stroke-width="10"/><path d="M510 252 C570 252 630 252 690 252" fill="none" stroke="url(#f)" stroke-width="3" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1s" repeatCount="indefinite"/></path><g filter="url(#gl)"><rect x="0" y="246" width="30" height="12" rx="4" fill="#a78bfa"><animateMotion dur="1.8s" repeatCount="indefinite" path="M510 252 C570 252 630 252 690 252"/></rect><rect x="0" y="246" width="20" height="9" rx="3" fill="#4de7ff"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M510 252 C570 252 630 252 690 252"/></rect></g><text x="600" y="430" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git commit → git push → GitHub remote</text><text x="600" y="454" text-anchor="middle" fill="#657092" font-family="system-ui" font-size="12">Git = version control tool • GitHub = collaboration platform</text></svg>