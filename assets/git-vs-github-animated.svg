<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".52" stop-color="#0A1022"/><stop offset="1" stop-color="#160A25"/></linearGradient>
 <linearGradient id="gitGrad" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FF6A3D"/><stop offset=".55" stop-color="#F04438"/><stop offset="1" stop-color="#C026D3"/></linearGradient>
 <linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
 <linearGradient id="bridge" x1="0" x2="1"><stop stop-color="#FF8A5B"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
 <radialGradient id="coreGlow"><stop stop-color="#8B5CF6" stop-opacity=".28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#A7B7D8" stroke-opacity=".04"/></pattern>
 <style>
 .title{font:800 44px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#91A0BA}.label{font:700 11px Inter,Segoe UI,sans-serif;fill:#8EA2C1;letter-spacing:2.2px}.head{font:800 25px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 14px Inter,Segoe UI,sans-serif;fill:#9EABC0}.code{font:650 14px ui-monospace,Consolas,monospace;fill:#DDF8FF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71829D}
 </style>
</defs>

<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<rect width="1600" height="900" rx="36" fill="url(#grid)"/>
<circle cx="800" cy="430" r="410" fill="url(#coreGlow)" filter="url(#soft)"><animate attributeName="r" values="350;430;350" dur="7s" repeatCount="indefinite"/></circle>

<text x="70" y="58" class="label">GITVAULT / GIT BASICS / 02</text>
<text x="70" y="108" class="title">Git vs GitHub</text>
<text x="70" y="138" class="sub">Same ecosystem. Different jobs: Git controls version history locally; GitHub hosts that repository online.</text>

<!-- LOCAL MACHINE -->
<g transform="translate(70 205)" filter="url(#shadow)">
 <rect width="445" height="475" rx="30" fill="#081321" stroke="#28435F" stroke-width="2"/>
 <rect x="24" y="24" width="397" height="255" rx="22" fill="#02060D" stroke="#20364E"/>
 <rect x="24" y="24" width="397" height="30" rx="22" fill="#0C1727"/>
 <circle cx="45" cy="39" r="5" fill="#FF6B57"/><circle cx="62" cy="39" r="5" fill="#FBBF24"/><circle cx="79" cy="39" r="5" fill="#34D399"/>
 <text x="105" y="43" class="tiny">LOCAL MACHINE</text>
 <text x="50" y="88" class="label">YOUR PROJECT</text>
 <text x="50" y="121" class="code">$ cd my-project</text>
 <text x="50" y="151" class="code">$ git status</text>
 <text x="50" y="181" class="body">modified:  app.py</text>
 <text x="50" y="207" class="body">modified:  README.md</text>
 <text x="50" y="233" class="body">untracked: notes.txt</text>
 <path d="M50 252H390" stroke="#1D334B"/>
 <text x="50" y="270" class="tiny">FILES LIVE HERE</text>

 <text x="28" y="315" class="label">GIT LIVES HERE TOO</text>
 <g transform="translate(42 338)">
   <path d="M0 28L36 0L72 28V76L36 104L0 76Z" fill="url(#gitGrad)" stroke="#FFB08B" stroke-width="2"/>
   <path d="M36 19L52 31V50L36 62L20 50V31Z" fill="none" stroke="#FFF4ED" stroke-width="3" opacity=".65"/>
   <text x="36" y="48" text-anchor="middle" style="font:900 13px Inter,Segoe UI,sans-serif;fill:#fff">GIT</text>
 </g>
 <text x="135" y="365" class="head">Version control</text>
 <text x="135" y="390" class="body">Tracks changes and creates commits.</text>
 <text x="135" y="416" class="body">History stays on your computer.</text>
 <text x="135" y="447" class="tiny">LOCAL • TRACK • COMMIT • HISTORY</text>
</g>

<!-- CENTER BRIDGE -->
<g transform="translate(800 390)">
 <ellipse rx="220" ry="170" fill="none" stroke="#5B6EA8" stroke-opacity=".18" stroke-width="2" stroke-dasharray="5 12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="155" ry="112" fill="none" stroke="#22D3EE" stroke-opacity=".14" stroke-width="2" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/></ellipse>

 <!-- local endpoint -->
 <g transform="translate(-240 -5)">
  <circle r="25" fill="#0B1A2A" stroke="#FF7955" stroke-width="3"/>
  <circle r="8" fill="#FF7955" filter="url(#glow)"/>
  <text x="0" y="48" text-anchor="middle" class="tiny">LOCAL GIT</text>
 </g>

 <!-- github endpoint -->
 <g transform="translate(240 5)">
  <circle r="25" fill="#11162E" stroke="#67E8F9" stroke-width="3"/>
  <path d="M-10 -1L0 -11L10 -1L0 9Z" fill="none" stroke="#67E8F9" stroke-width="3"/>
  <circle r="6" fill="#67E8F9" filter="url(#glow)"/>
  <text x="0" y="48" text-anchor="middle" class="tiny">GITHUB</text>
 </g>

 <!-- bridge -->
 <path d="M-212 0 C-120 -105 120 105 212 0" fill="none" stroke="#263957" stroke-width="14" stroke-linecap="round"/>
 <path d="M-212 0 C-120 -105 120 105 212 0" fill="none" stroke="url(#bridge)" stroke-width="4" stroke-linecap="round" stroke-dasharray="22 18">
   <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.7s" repeatCount="indefinite"/>
 </path>
 <circle r="80" fill="#0A1020" stroke="#6B5AA7" stroke-opacity=".55" stroke-width="2" filter="url(#shadow)"/>
 <path d="M0 -42L42 -21V21L0 42L-42 21V-21Z" fill="url(#gitGrad)" stroke="#FFD0B7" stroke-width="2"/>
 <text x="0" y="8" text-anchor="middle" style="font:900 23px Inter,Segoe UI,sans-serif;fill:white">GIT</text>
 <text x="0" y="104" text-anchor="middle" class="label">THE TOOL</text>
 <text x="0" y="128" text-anchor="middle" class="code">git commit</text>
 <text x="0" y="150" text-anchor="middle" class="code">git push →</text>

 <!-- packets -->
 <circle r="7" fill="#FF9B73" filter="url(#glow)"><animateMotion dur="2.8s" repeatCount="indefinite" path="M-212 0 C-120 -105 120 105 212 0"/></circle>
 <circle r="5" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M-212 0 C-120 -105 120 105 212 0"/></circle>
</g>

<!-- ONLINE GITHUB -->
<g transform="translate(1085 205)" filter="url(#shadow)">
 <rect width="445" height="475" rx="30" fill="#0E1228" stroke="#4B4273" stroke-width="2"/>
 <text x="28" y="48" class="label">ONLINE / REMOTE</text>
 <text x="28" y="86" class="head">GitHub</text>
 <text x="28" y="112" class="body">A platform that hosts Git repositories.</text>

 <!-- cloud -->
 <g transform="translate(220 225)">
  <ellipse cx="0" cy="28" rx="150" ry="105" fill="#11183A" stroke="#3B82F6" stroke-opacity=".28" stroke-width="2"/>
  <path d="M-90 40C-125 40-145 18-145-10C-145-43-119-68-87-68C-70-68-54-61-43-49C-28-79 0-96 32-96C77-96 112-63 112-21C112-16 112-11 111-7C136 0 153 19 153 43C153 75 127 96 95 96H-90C-125 96-150 72-150 40Z" fill="url(#cloudGrad)" opacity=".18" stroke="#67E8F9" stroke-width="3"/>
  <circle cx="-58" cy="12" r="8" fill="#67E8F9"/><circle cx="0" cy="-30" r="8" fill="#A78BFA"/><circle cx="58" cy="12" r="8" fill="#C084FC"/>
  <path d="M-50 8L-8 -23L50 8" fill="none" stroke="#DDFBFF" stroke-width="3" opacity=".8"/>
  <text x="0" y="145" text-anchor="middle" class="tiny">REMOTE REPOSITORY</text>
 </g>

 <text x="28" y="370" class="code">github.com / iam-pallavi</text>
 <text x="28" y="399" class="body">Share repositories • review code</text>
 <text x="28" y="425" class="body">Pull Requests • Issues • Teamwork</text>
 <text x="28" y="454" class="tiny">HOST • SHARE • COLLABORATE</text>
</g>

<!-- LOWER EXPLANATION -->
<g transform="translate(70 725)">
 <rect width="1460" height="105" rx="25" fill="#070C18" stroke="#243653"/>
 <text x="35" y="32" class="label">REMEMBER IT THIS WAY</text>
 <text x="35" y="67" class="body" style="font-size:16px"><tspan fill="#FF9B73" font-weight="800">GIT</tspan> is the version-control tool on your computer.</text>
 <text x="760" y="67" class="body" style="font-size:16px"><tspan fill="#67E8F9" font-weight="800">GITHUB</tspan> is the online platform where Git repositories can be hosted and shared.</text>
 <text x="35" y="91" class="tiny">EDIT → COMMIT → PUSH → REMOTE REPOSITORY</text>
 <text x="760" y="91" class="tiny">GIT ≠ GITHUB</text>
</g>

<text x="1530" y="58" text-anchor="end" class="tiny">VERSION CONTROL ≠ HOSTING PLATFORM</text>
</svg>