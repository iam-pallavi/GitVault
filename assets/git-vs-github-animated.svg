<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset=".5" stop-color="#0d1028"/><stop offset="1" stop-color="#211044"/></linearGradient><linearGradient id="f"><stop stop-color="#b98cff"/><stop offset=".5" stop-color="#7588ff"/><stop offset="1" stop-color="#4deaff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="500" rx="30" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">Git <tspan fill="#b98cff">vs</tspan> GitHub</text><text x="600" y="74" text-anchor="middle" fill="#a5afd0" font-family="system-ui" font-size="13">Git builds local history • GitHub stores, shares and reviews it remotely</text><rect x="45" y="112" width="465" height="280" rx="20" fill="#070b17" stroke="#8067ff"/><rect x="690" y="112" width="465" height="280" rx="20" fill="#07131f" stroke="#4deaff"/><rect x="65" y="132" width="425" height="34" rx="8" fill="#11172a"/><circle cx="85" cy="149" r="5" fill="#ff657f"/><circle cx="103" cy="149" r="5" fill="#ffc75f"/><circle cx="121" cy="149" r="5" fill="#5ce1b0"/><text x="145" y="154" fill="#8995b7" font-family="monospace" font-size="11">LOCAL TERMINAL • ~/project</text><text x="72" y="198" fill="#dce1f2" font-family="monospace" font-size="12">$ git add .</text><text x="72" y="224" fill="#dce1f2" font-family="monospace" font-size="12">$ git commit -m "update"</text><text x="72" y="250" fill="#67e6b0" font-family="monospace" font-size="11">[main 7c91e4a] update</text><text x="72" y="280" fill="#8b97b5" font-size="12">LOCAL REPOSITORY</text><circle cx="100" cy="315" r="9" fill="#4deaff"/><circle cx="165" cy="315" r="9" fill="#b98cff"/><circle cx="230" cy="315" r="9" fill="#687596"/><path d="M100 315H230" stroke="#39445f" stroke-width="4"/><text x="72" y="350" fill="#7783a1" font-size="11">History exists on your machine.</text><rect x="710" y="132" width="425" height="34" rx="8" fill="#122033"/><text x="790" y="154" fill="#8995b7" font-family="monospace" font-size="11">github.com / iam-pallavi</text><text x="718" y="198" fill="#dce1f2" font-family="monospace" font-size="12">origin/main</text><circle cx="735" cy="225" r="8" fill="#4deaff" filter="url(#g)"><animate attributeName="r" values="7;12;7" dur="1.2s" repeatCount="indefinite"/></circle><text x="755" y="230" fill="white" font-family="monospace" font-size="11">7c91e4a</text><rect x="718" y="250" width="385" height="48" rx="9" fill="#101c2d" stroke="#29415d"/><text x="738" y="280" fill="#aeb9d7" font-family="monospace" font-size="11">Pull requests • Issues • Review</text><text x="718" y="330" fill="#7783a1" font-size="12">Remote collaboration happens here.</text><path d="M510 252C570 252 630 252 690 252" fill="none" stroke="#2b3552" stroke-width="10"/><path d="M510 252C570 252 630 252 690 252" fill="none" stroke="url(#f)" stroke-width="3" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur=".8s" repeatCount="indefinite"/></path><g filter="url(#g)"><rect x="0" y="246" width="30" height="12" rx="4" fill="#b98cff"><animateMotion dur="1.7s" repeatCount="indefinite" path="M510 252C570 252 630 252 690 252"/></rect><rect x="0" y="246" width="20" height="9" rx="3" fill="#4deaff"><animateMotion dur="1.7s" begin=".85s" repeatCount="indefinite" path="M510 252C570 252 630 252 690 252"/></rect></g><text x="600" y="430" text-anchor="middle" fill="#b7c0da" font-family="monospace" font-size="13">commit → push → remote branch → collaboration</text><text x="600" y="454" text-anchor="middle" fill="#657092" font-family="system-ui" font-size="12">Git = version control • GitHub = hosted collaboration platform</text></svg>