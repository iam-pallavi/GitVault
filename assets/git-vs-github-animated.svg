<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020611"/><stop offset=".45" stop-color="#081126"/><stop offset="1" stop-color="#18091F"/></linearGradient>
  <linearGradient id="git" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FF553D"/><stop offset=".55" stop-color="#F9734F"/><stop offset="1" stop-color="#C026D3"/></linearGradient>
  <linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  <linearGradient id="link" x1="0" x2="1"><stop stop-color="#FF7255"/><stop offset=".48" stop-color="#67E8F9"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#8B5CF6" stop-opacity=".26"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#9FB2D7" stroke-opacity=".045"/></pattern>
  <style>
    .title{font:800 48px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:500 16px Inter,Segoe UI,sans-serif;fill:#93A4C2}.label{font:800 10px Inter,Segoe UI,sans-serif;fill:#8EA4C7;letter-spacing:2.5px}.head{font:800 27px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.body{font:500 14px Inter,Segoe UI,sans-serif;fill:#A7B4CA}.code{font:650 14px ui-monospace,Consolas,monospace;fill:#DDFBFF}.tiny{font:700 10px ui-monospace,Consolas,monospace;fill:#71839F}
  </style>
</defs>

<rect width="1600" height="900" rx="38" fill="url(#bg)"/>
<rect width="1600" height="900" rx="38" fill="url(#grid)"/>
<circle cx="800" cy="420" r="390" fill="url(#halo)"><animate attributeName="r" values="330;430;330" dur="8s" repeatCount="indefinite"/></circle>

<text x="68" y="55" class="label">GITVAULT / GIT BASICS / 02</text>
<text x="68" y="105" class="title">Git vs GitHub</text>
<text x="68" y="135" class="sub">Git manages version history. GitHub gives that Git repository a place to live, share and collaborate online.</text>

<!-- LOCAL SIDE: floating desktop -->
<g transform="translate(85 250)" filter="url(#shadow)">
  <rect x="0" y="0" width="430" height="340" rx="28" fill="#07101D" stroke="#29415F" stroke-width="2"/>
  <rect x="28" y="28" width="374" height="205" rx="20" fill="#02050B" stroke="#1E344C"/>
  <rect x="28" y="28" width="374" height="30" rx="20" fill="#0C1727"/>
  <circle cx="49" cy="43" r="5" fill="#FF6B57"/><circle cx="66" cy="43" r="5" fill="#FBBF24"/><circle cx="83" cy="43" r="5" fill="#34D399"/>
  <text x="110" y="47" class="tiny">LOCAL MACHINE</text>
  <text x="52" y="88" class="code">$ git status</text>
  <text x="52" y="119" class="body">modified:  app.py</text>
  <text x="52" y="146" class="body">modified:  README.md</text>
  <text x="52" y="173" class="body">untracked: notes.txt</text>
  <path d="M52 192H375" stroke="#20354C"/>
  <text x="52" y="216" class="tiny">YOUR PROJECT FILES</text>

  <g transform="translate(35 270)">
    <path d="M0 27L34 0L68 27V72L34 99L0 72Z" fill="url(#git)" stroke="#FFB39A" stroke-width="2"/>
    <path d="M34 18L49 29V48L34 59L19 48V29Z" fill="none" stroke="#FFF5F0" stroke-width="3" opacity=".75"/>
    <text x="34" y="47" text-anchor="middle" style="font:900 12px Inter,Segoe UI,sans-serif;fill:#fff">GIT</text>
  </g>
  <text x="125" y="294" class="head">Git</text>
  <text x="125" y="319" class="body">Version control on your machine</text>
  <text x="125" y="343" class="tiny">TRACK • COMMIT • BRANCH • HISTORY</text>
</g>

<!-- LOCAL label -->
<text x="300" y="625" text-anchor="middle" class="label">LOCAL • YOUR COMPUTER</text>

<!-- CENTRAL 3D-ish GIT ENGINE -->
<g transform="translate(800 415)">
  <ellipse rx="275" ry="205" fill="none" stroke="#6B78A8" stroke-opacity=".15" stroke-width="2" stroke-dasharray="5 13"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="205" ry="150" fill="none" stroke="#22D3EE" stroke-opacity=".12" stroke-width="2" stroke-dasharray="3 11"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/></ellipse>

  <!-- left cable -->
  <path d="M-285 0 C-215 -120 -125 -120 -75 -60" fill="none" stroke="#263752" stroke-width="16" stroke-linecap="round"/>
  <path d="M-285 0 C-215 -120 -125 -120 -75 -60" fill="none" stroke="url(#link)" stroke-width="4" stroke-linecap="round" stroke-dasharray="20 18"><animate attributeName="stroke-dashoffset" from="0" to="-76" dur="1.6s" repeatCount="indefinite"/></path>
  <!-- right cable -->
  <path d="M75 60 C125 120 215 120 285 0" fill="none" stroke="#263752" stroke-width="16" stroke-linecap="round"/>
  <path d="M75 60 C125 120 215 120 285 0" fill="none" stroke="url(#link)" stroke-width="4" stroke-linecap="round" stroke-dasharray="20 18"><animate attributeName="stroke-dashoffset" from="0" to="-76" dur="1.6s" repeatCount="indefinite"/></path>

  <!-- rotating Git core -->
  <g filter="url(#shadow)">
    <path d="M0 -92L92 0L0 92L-92 0Z" fill="#0B1020" stroke="#6E5AA7" stroke-width="2"/>
    <path d="M0 -65L65 0L0 65L-65 0Z" fill="url(#git)" stroke="#FFD1BF" stroke-width="2"/>
    <path d="M-35 -5L0 -40L35 -5L0 30Z" fill="none" stroke="#FFF8F5" stroke-width="5" opacity=".72"/>
    <text x="0" y="9" text-anchor="middle" style="font:900 22px Inter,Segoe UI,sans-serif;fill:#fff">GIT</text>
  </g>
  <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>

  <text x="0" y="125" text-anchor="middle" class="label">VERSION CONTROL ENGINE</text>
  <text x="0" y="151" text-anchor="middle" class="code">git commit</text>
  <text x="0" y="176" text-anchor="middle" class="code">git push →</text>

  <!-- moving packets -->
  <circle r="7" fill="#FF8A68" filter="url(#glow)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M-285 0 C-215 -120 -125 -120 -75 -60"/></circle>
  <circle r="6" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M75 60 C125 120 215 120 285 0"/></circle>
</g>

<!-- GITHUB CLOUD -->
<g transform="translate(1090 235)" filter="url(#shadow)">
  <rect width="425" height="370" rx="30" fill="#0B1024" stroke="#3F4778" stroke-width="2"/>
  <text x="30" y="42" class="label">ONLINE • REMOTE</text>
  <text x="30" y="78" class="head">GitHub</text>
  <text x="30" y="104" class="body">A platform for hosting Git repositories.</text>

  <!-- cloud / network -->
  <g transform="translate(212 205)">
    <ellipse rx="150" ry="110" fill="#10183B" stroke="#4F5EB0" stroke-opacity=".5"/>
    <path d="M-88 55C-126 55-151 31-151-2C-151-38-123-66-88-66C-68-66-51-58-39-43C-25-76 4-94 37-94C82-94 116-60 116-17C116-12 116-7 115-2C141 5 158 25 158 49C158 82 131 105 97 105H-88C-124 105-151 84-151 55Z" fill="url(#gh)" opacity=".17" stroke="#67E8F9" stroke-width="3"/>
    <circle cx="-62" cy="14" r="9" fill="#67E8F9" filter="url(#glow)"/><circle cx="0" cy="-34" r="9" fill="#A78BFA" filter="url(#glow)"/><circle cx="62" cy="14" r="9" fill="#C084FC" filter="url(#glow)"/>
    <path d="M-54 10L-8 -25L54 10" fill="none" stroke="#E5FBFF" stroke-width="3"/>
    <text x="0" y="135" text-anchor="middle" class="tiny">REMOTE REPOSITORY</text>
  </g>
  <text x="30" y="325" class="code">github.com / iam-pallavi</text>
  <text x="30" y="350" class="tiny">HOST • SHARE • REVIEW • COLLABORATE</text>
</g>

<text x="1300" y="635" text-anchor="middle" class="label">ONLINE • TEAM • SHARING</text>

<!-- bottom memory strip -->
<g transform="translate(85 700)">
  <rect width="1430" height="112" rx="28" fill="#050A15" stroke="#263A57"/>
  <text x="35" y="31" class="label">THE SIMPLE DIFFERENCE</text>
  <text x="35" y="66" class="body" style="font-size:17px"><tspan fill="#FF8060" font-weight="800">GIT</tspan> = the version-control tool that tracks your project's history.</text>
  <text x="760" y="66" class="body" style="font-size:17px"><tspan fill="#67E8F9" font-weight="800">GITHUB</tspan> = the online platform that hosts and shares Git repositories.</text>
  <text x="35" y="92" class="tiny">LOCAL CHANGE → COMMIT → PUSH → REMOTE REPOSITORY</text>
  <text x="760" y="92" class="tiny">GIT ≠ GITHUB</text>
</g>

<text x="1530" y="55" text-anchor="end" class="tiny">TOOL ≠ PLATFORM</text>
</svg>