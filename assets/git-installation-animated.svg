 <rect x="25" y="55" width="305" height="190" rx="14" fill="#090C18" stroke="#29335E"/>
 <text x="43" y="84" class="t body">Adjust PATH Environment</text>
 <text x="43" y="113" class="m tiny">● Git from the command line</text><text x="43" y="138" class="m tiny">  and also from 3rd-party software</text>
 <rect x="43" y="164" width="245" height="45" rx="9" fill="#122A2A" stroke="#39F5B2"/><text x="55" y="192" class="green tiny">Recommended choice</text>
 <path d="M300 185l12 12 22-28" fill="none" stroke="#39F5B2" stroke-width="4"/>
</g>
<g transform="translate(815 545)">
 <rect width="355" height="285" rx="24" fill="#0B1028" stroke="#394477"/>
 <text x="25" y="35" class="green label">07 · INSTALL</text>
 <rect x="25" y="55" width="305" height="190" rx="14" fill="#090C18" stroke="#29335E"/>
 <text x="43" y="84" class="t body">Ready to Install</text><text x="43" y="113" class="m tiny">Git is ready with your selected options.</text>
 <rect x="43" y="143" width="245" height="18" rx="9" fill="#18213B"/><rect x="43" y="143" width="190" height="18" rx="9" fill="url(#a)"><animate attributeName="width" values="35;245;35" dur="2.8s" repeatCount="indefinite"/></rect>
 <text x="43" y="191" class="green tiny">Installing files…</text><text x="43" y="219" class="m tiny">Finish the setup wizard.</text>
</g>
<g transform="translate(1195 545)">
 <rect width="350" height="285" rx="24" fill="#0B1028" stroke="#39F5B2"/>
 <text x="25" y="35" class="green label">08 · FINISH + VERIFY</text>
 <rect x="25" y="55" width="300" height="190" rx="14" fill="#090C18" stroke="#29335E"/>
 <text x="43" y="84" class="t body">Git Setup Complete</text><path d="M47 116l12 12 23-29" fill="none" stroke="#39F5B2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="43" y="160" class="m tiny">Open Git Bash or Windows Terminal</text>
 <rect x="43" y="178" width="250" height="43" rx="9" fill="#070A16" stroke="#2B3766"/><text x="57" y="205" class="mono small green">$ git --version</text>
 <circle cx="277" cy="198" r="7" fill="#39F5B2" filter="url(#g)"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></circle>
</g>

