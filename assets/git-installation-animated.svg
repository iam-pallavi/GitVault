<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060916"/><stop offset=".5" stop-color="#11163A"/><stop offset="1" stop-color="#07091B"/></linearGradient>
 <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62F6FF"/><stop offset=".5" stop-color="#9B7CFF"/><stop offset="1" stop-color="#39F5B2"/></linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7882C7" stroke-opacity=".07"/></pattern>
 <style>
 .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F5F7FF}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#A7AFD5}.mono{font-family:Consolas,ui-monospace,monospace}.cyan{fill:#62F6FF}.green{fill:#39F5B2}.purple{fill:#B39CFF}.label{font-size:13px;letter-spacing:2.5px}.title{font-size:48px;font-weight:750}.sub{font-size:19px}.h{font-size:24px;font-weight:700}.body{font-size:17px}.tiny{font-size:13px}.num{font-size:15px;font-weight:700}
 </style>
</defs>
<rect width="1600" height="980" fill="url(#bg)"/><rect width="1600" height="980" fill="url(#grid)"/>
<circle cx="800" cy="480" r="360" fill="#625CFF" opacity=".07" filter="url(#g)"/>
<text x="70" y="70" class="t title">How Git Is Actually Installed on Windows</text>
<text x="70" y="105" class="m sub">Download → run the .exe → setup wizard → choose options → PATH → install → finish → verify</text>
<text x="1530" y="70" text-anchor="end" class="cyan label">GIT FOR WINDOWS · REAL INSTALL FLOW</text>

