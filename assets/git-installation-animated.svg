<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A19"/><stop offset=".5" stop-color="#11153A"/><stop offset="1" stop-color="#080A1D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62F6FF"/><stop offset=".5" stop-color="#9B7CFF"/><stop offset="1" stop-color="#39F5B2"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39F5B2"/><stop offset="1" stop-color="#62F6FF"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7882C7" stroke-opacity=".07"/></pattern>
  <style>
    .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F5F7FF}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#A3ACD6}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cyan{fill:#62F6FF}.green{fill:#39F5B2}.purple{fill:#B39CFF}.label{font-size:14px;letter-spacing:3px}.title{font-size:52px;font-weight:750}.sub{font-size:21px}.step{font-size:16px;font-weight:700}.small{font-size:16px}.body{font-size:20px}.big{font-size:28px;font-weight:700}.tiny{font-size:13px}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="800" cy="430" r="300" fill="#625CFF" opacity=".09" filter="url(#blur)"/>

<text x="80" y="72" class="t title">How to Install Git on Windows</text>
<text x="80" y="110" class="m sub">The real installation flow — download → installer → options → install → verify</text>
<text x="1520" y="72" text-anchor="end" class="cyan label">GIT FOR WINDOWS</text>

<!-- timeline -->
<line x1="130" y1="175" x2="1470" y2="175" stroke="#303866" stroke-width="3"/>
<line x1="130" y1="175" x2="1470" y2="175" stroke="url(#accent)" stroke-width="3" stroke-dasharray="70 1270" stroke-dashoffset="0">
  <animate attributeName="stroke-dashoffset" values="1340;0" dur="4s" repeatCount="indefinite"/>
</line>
<g class="t step">
  <circle cx="130" cy="175" r="24" fill="#101633" stroke="#62F6FF" stroke-width="3"/><text x="130" y="181" text-anchor="middle">1</text>
  <circle cx="390" cy="175" r="24" fill="#101633" stroke="#62F6FF" stroke-width="3"/><text x="390" y="181" text-anchor="middle">2</text>
  <circle cx="650" cy="175" r="24" fill="#101633" stroke="#9B7CFF" stroke-width="3"/><text x="650" y="181" text-anchor="middle">3</text>
  <circle cx="910" cy="175" r="24" fill="#101633" stroke="#9B7CFF" stroke-width="3"/><text x="910" y="181" text-anchor="middle">4</text>
  <circle cx="1170" cy="175" r="24" fill="#101633" stroke="#39F5B2" stroke-width="3"/><text x="1170" y="181" text-anchor="middle">5</text>
  <circle cx="1430" cy="175" r="24" fill="#101633" stroke="#39F5B2" stroke-width="3"/><text x="1430" y="181" text-anchor="middle">6</text>
</g>
<g class="m small" text-anchor="middle">
  <text x="130" y="218">Download</text><text x="390" y="218">Run installer</text><text x="650" y="218">Choose options</text><text x="910" y="218">PATH setting</text><text x="1170" y="218">Install</text><text x="1430" y="218">Verify</text>
</g>

<!-- STEP 1 download -->
<g transform="translate(70 265)">
  <rect width="470" height="330" rx="26" fill="#0B1028" stroke="#394477"/>
  <text x="30" y="38" class="cyan label">STEP 1 · DOWNLOAD</text>
  <rect x="30" y="65" width="410" height="210" rx="16" fill="#070A16" stroke="#29335E"/>
  <text x="55" y="102" class="m small">Browser</text>
  <rect x="55" y="120" width="360" height="42" rx="9" fill="#10162F"/>
  <text x="72" y="147" class="mono tiny t">git-scm.com/install/windows</text>
  <rect x="55" y="184" width="360" height="72" rx="12" fill="#11183A" stroke="#37457D"/>
  <text x="76" y="213" class="t small">Git for Windows / x64</text>
  <text x="76" y="238" class="m tiny">Download the installer</text>
  <circle cx="380" cy="219" r="13" fill="#39F5B2"/>
  <path d="M374 219h12M380 213v12" stroke="#07121A" stroke-width="3"/>
  <circle cx="390" cy="286" r="7" fill="#62F6FF" filter="url(#glow)"><animate attributeName="cx" values="70;390;70" dur="2.5s" repeatCount="indefinite"/></circle>
</g>

<!-- STEP 2 installer -->
<g transform="translate(565 265)">
  <rect width="470" height="330" rx="26" fill="#0B1028" stroke="#394477"/>
  <text x="30" y="38" class="cyan label">STEP 2 · RUN SETUP</text>
  <rect x="30" y="65" width="410" height="210" rx="16" fill="#090C18" stroke="#29335E"/>
  <rect x="30" y="65" width="410" height="35" rx="16" fill="#171D3A"/>
  <text x="50" y="88" class="t small">Git 2.55.0 Setup</text>
  <text x="55" y="133" class="t body">Welcome to Git Setup</text>
  <text x="55" y="164" class="m tiny">This wizard will install Git for Windows.</text>
  <rect x="55" y="196" width="155" height="38" rx="8" fill="#171F43" stroke="#4A5AA0"/>
  <text x="132" y="220" text-anchor="middle" class="t small">Next ›</text>
  <text x="55" y="258" class="m tiny">Follow the installer wizard.</text>
  <path d="M360 216l18 18 34-45" fill="none" stroke="#39F5B2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" stroke-dashoffset="80"><animate attributeName="stroke-dashoffset" values="80;0;80" dur="2.4s" repeatCount="indefinite"/></path>
</g>

<!-- STEP 3 options -->
<g transform="translate(1060 265)">
  <rect width="470" height="330" rx="26" fill="#0B1028" stroke="#394477"/>
  <text x="30" y="38" class="purple label">STEP 3 · INSTALLER OPTIONS</text>
  <rect x="30" y="65" width="410" height="210" rx="16" fill="#090C18" stroke="#29335E"/>
  <text x="52" y="98" class="t small">Select Components</text>
  <text x="52" y="130" class="m tiny">✓ Git Bash Here</text>
  <text x="52" y="157" class="m tiny">✓ Git GUI Here</text>
  <text x="52" y="184" class="m tiny">✓ Git LFS</text>
  <text x="52" y="211" class="m tiny">✓ Associate .git* configuration files</text>
  <rect x="52" y="230" width="135" height="25" rx="7" fill="#172041"/>
  <text x="119" y="248" text-anchor="middle" class="t tiny">Next ›</text>
  <rect x="350" y="125" width="45" height="45" rx="12" fill="#171F43" stroke="#9B7CFF"/>
  <path d="M363 148l9 9 17-20" fill="none" stroke="#9B7CFF" stroke-width="4"/>
</g>

<!-- PATH bridge -->
<g transform="translate(70 630)">
  <rect width="1460" height="170" rx="28" fill="#090D23" stroke="#343D74"/>
  <text x="35" y="38" class="green label">STEP 4 · PATH + INSTALL</text>
  <text x="35" y="76" class="t big">Choose how Git is available from your terminal</text>
  <text x="35" y="108" class="m small">The installer configures Git so commands such as <tspan class="mono cyan">git --version</tspan> can be run from a terminal.</text>
  <rect x="35" y="127" width="560" height="22" rx="11" fill="#171D3B"/>
  <rect x="35" y="127" width="390" height="22" rx="11" fill="url(#green)">
    <animate attributeName="width" values="60;520;60" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="650" y="79" class="t small">Installer</text>
  <text x="650" y="110" class="m tiny">PATH configured</text>
  <path d="M800 100H1010" stroke="#45508D" stroke-width="3"/>
  <circle cx="800" cy="100" r="7" fill="#62F6FF"><animate attributeName="cx" values="800;1010;800" dur="2.2s" repeatCount="indefinite"/></circle>
  <rect x="1035" y="63" width="350" height="70" rx="15" fill="#070A16" stroke="#2B3766"/>
  <text x="1060" y="91" class="mono tiny m">Windows Terminal / Git Bash</text>
  <text x="1060" y="117" class="mono small green">$ git --version</text>
</g>

<!-- final verify badge -->
<g transform="translate(1360 35)">
  <rect width="160" height="42" rx="21" fill="#0B1C23" stroke="#39F5B2"/>
  <circle cx="25" cy="21" r="8" fill="#39F5B2"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="43" y="27" class="green small">READY TO VERIFY</text>
</g>

</svg>
