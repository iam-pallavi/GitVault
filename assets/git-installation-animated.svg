<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A19"/><stop offset=".5" stop-color="#11153A"/><stop offset="1" stop-color="#080A1D"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62F6FF"/><stop offset=".5" stop-color="#9B7CFF"/><stop offset="1" stop-color="#39F5B2"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7882C7" stroke-opacity=".07"/></pattern>
 <style>
 .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F5F7FF}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#A3ACD6}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cyan{fill:#62F6FF}.green{fill:#39F5B2}.purple{fill:#B39CFF}.label{font-size:14px;letter-spacing:3px}.title{font-size:52px;font-weight:750}.sub{font-size:21px}.step{font-size:16px;font-weight:700}.small{font-size:16px}.body{font-size:20px}.big{font-size:28px;font-weight:700}.tiny{font-size:13px}
 </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<text x="80" y="72" class="t title">How to Install Git on Windows</text>
<text x="80" y="110" class="m sub">Step 2: open the Git installer you downloaded</text>
<text x="1520" y="72" text-anchor="end" class="cyan label">STEP 02 · OPEN INSTALLER</text>

<!-- Downloads window -->
<g transform="translate(80 180)">
 <rect width="620" height="500" rx="28" fill="#0B1028" stroke="#394477" stroke-width="2"/>
 <rect x="25" y="25" width="570" height="450" rx="18" fill="#0A0F21" stroke="#29335E"/>
 <rect x="25" y="25" width="570" height="58" rx="18" fill="#151B35"/>
 <text x="55" y="62" class="t body">Downloads</text>
 <text x="55" y="125" class="m small">Today</text>
 <rect x="50" y="150" width="520" height="95" rx="16" fill="#11183A" stroke="#39477F"/>
 <rect x="72" y="172" width="48" height="48" rx="10" fill="#17264B" stroke="#62F6FF"/>
 <text x="96" y="203" text-anchor="middle" class="cyan big">G</text>
 <text x="140" y="185" class="t small">Git-2.55.0-64-bit.exe</text>
 <text x="140" y="213" class="m tiny">Git for Windows • Installer</text>
 <path d="M500 178v32M488 198l12 12 12-12" stroke="#39F5B2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="50" y="270" width="520" height="52" rx="14" fill="#102A2B" stroke="#39F5B2"/>
 <text x="310" y="303" text-anchor="middle" class="green step">DOUBLE-CLICK THE .EXE FILE</text>
 <text x="50" y="380" class="m small">Downloaded installer</text>
 <text x="50" y="415" class="t body">Git-2.55.0-64-bit.exe</text>
 <text x="50" y="447" class="m tiny">This starts the Windows installation setup.</text>
</g>

<!-- Animated action arrow -->
<g>
 <path d="M710 420 C780 420 790 420 850 420" fill="none" stroke="#62F6FF" stroke-width="4" stroke-dasharray="12 10"/>
 <circle cx="710" cy="420" r="7" fill="#62F6FF" filter="url(#glow)"><animate attributeName="cx" values="710;850;710" dur="2s" repeatCount="indefinite"/></circle>
 <text x="780" y="390" text-anchor="middle" class="cyan label">DOUBLE-CLICK</text>
</g>

<!-- UAC dialog -->
<g transform="translate(870 205)">
 <rect width="620" height="210" rx="24" fill="#10152D" stroke="#4A5590" stroke-width="2"/>
 <text x="40" y="48" class="t body">User Account Control</text>
 <text x="40" y="83" class="m small">Do you want to allow this app to make</text>
 <text x="40" y="107" class="m small">changes to your device?</text>
 <text x="40" y="145" class="t small">Git for Windows</text>
 <rect x="390" y="142" width="90" height="42" rx="10" fill="#102A2B" stroke="#39F5B2"/>
 <text x="435" y="169" text-anchor="middle" class="green step">Yes</text>
 <rect x="490" y="142" width="90" height="42" rx="10" fill="#161B35" stroke="#394477"/>
 <text x="535" y="169" text-anchor="middle" class="m step">No</text>
 <circle cx="435" cy="163" r="7" fill="#39F5B2" filter="url(#glow)"><animate attributeName="r" values="5;9;5" dur="1.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Setup welcome -->
<g transform="translate(870 455)">
 <rect width="620" height="225" rx="24" fill="#0B1028" stroke="#394477" stroke-width="2"/>
 <text x="38" y="48" class="purple label">GIT SETUP</text>
 <text x="38" y="88" class="t big">Welcome to Git Setup</text>
 <text x="38" y="122" class="m small">This will install Git for Windows on your computer.</text>
 <text x="38" y="151" class="m small">Click Next to continue.</text>
 <rect x="420" y="166" width="145" height="42" rx="10" fill="#102A2B" stroke="#39F5B2"/>
 <text x="492" y="193" text-anchor="middle" class="green step">Next →</text>
 <path d="M405 187h-50" stroke="#9B7CFF" stroke-width="3" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" values="0;-30" dur="1s" repeatCount="indefinite"/></path>
</g>

<text x="800" y="770" text-anchor="middle" class="t body">Downloaded .exe → double-click → User Account Control → Yes → Git Setup opens</text>
<text x="800" y="812" text-anchor="middle" class="m small">Next step → choose the installation options and continue with Next</text>
<text x="800" y="855" text-anchor="middle" class="m tiny">STEP 02 COMPLETE — the installer is now open</text>
</svg>