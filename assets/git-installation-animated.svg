<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A19"/><stop offset=".5" stop-color="#11153A"/><stop offset="1" stop-color="#080A1D"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62F6FF"/><stop offset=".5" stop-color="#9B7CFF"/><stop offset="1" stop-color="#39F5B2"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7882C7" stroke-opacity=".07"/></pattern>
 <style>
 .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F5F7FF}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#A3ACD6}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cyan{fill:#62F6FF}.green{fill:#39F5B2}.purple{fill:#B39CFF}.label{font-size:14px;letter-spacing:3px}.title{font-size:52px;font-weight:750}.sub{font-size:21px}.step{font-size:16px;font-weight:700}.small{font-size:16px}.body{font-size:20px}.big{font-size:28px;font-weight:700}.tiny{font-size:13px}
 </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<text x="80" y="72" class="t title">How to Install Git on Windows</text>
<text x="80" y="110" class="m sub">First step: open your browser and download Git for Windows</text>
<text x="1520" y="72" text-anchor="end" class="cyan label">STEP 01 · DOWNLOAD</text>

<!-- Browser -->
<g transform="translate(150 180)">
 <rect width="1300" height="470" rx="30" fill="#0B1028" stroke="#394477" stroke-width="2"/>
 <rect x="30" y="30" width="1240" height="410" rx="20" fill="#080B18" stroke="#29335E"/>
 <rect x="30" y="30" width="1240" height="62" rx="20" fill="#151B35"/>
 <circle cx="62" cy="61" r="7" fill="#FF6B7A"/><circle cx="86" cy="61" r="7" fill="#FFD166"/><circle cx="110" cy="61" r="7" fill="#39F5B2"/>
 <text x="145" y="68" class="m small">Browser</text>
 <rect x="280" y="45" width="850" height="34" rx="17" fill="#080B18" stroke="#303A68"/>
 <text x="305" y="68" class="mono small cyan">git-scm.com/install/windows</text>
 <path d="M1145 61h80" stroke="#47528C" stroke-width="3"/>
 <circle cx="1145" cy="61" r="6" fill="#62F6FF"><animate attributeName="cx" values="1145;1225;1145" dur="1.8s" repeatCount="indefinite"/></circle>

 <!-- website -->
 <text x="75" y="145" class="t big">Git for Windows</text>
 <text x="75" y="178" class="m body">Download the latest maintained Git for Windows build.</text>
 <rect x="75" y="215" width="760" height="105" rx="18" fill="#11183A" stroke="#39477F"/>
 <text x="105" y="248" class="t body">Git for Windows / x64</text>
 <text x="105" y="278" class="m small">Windows installer • x64</text>
 <text x="105" y="301" class="m tiny">Latest maintained version shown on the official Git site</text>
 <rect x="880" y="230" width="300" height="64" rx="14" fill="#102A2B" stroke="#39F5B2" stroke-width="2"/>
 <text x="1030" y="270" text-anchor="middle" class="green body">Download</text>
 <path d="M1110 252v20M1100 264l10 10 10-10" fill="none" stroke="#39F5B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

 <text x="75" y="365" class="m small">What we do here:</text>
 <text x="75" y="397" class="t body">Open browser → type the Git download page → click Download</text>
</g>

<!-- Download packet -->
<g transform="translate(545 700)">
 <rect width="510" height="105" rx="22" fill="#0A1126" stroke="#394477"/>
 <circle cx="62" cy="53" r="25" fill="#101C36" stroke="#62F6FF"/>
 <path d="M62 39v25M50 53l12 12 12-12" stroke="#62F6FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="105" y="47" class="t body">Git installer starts downloading</text>
 <text x="105" y="73" class="m small">Next step → open the downloaded installer</text>
 <circle cx="470" cy="53" r="7" fill="#39F5B2" filter="url(#glow)"><animate attributeName="cx" values="430;480;430" dur="1.6s" repeatCount="indefinite"/></circle>
</g>

<text x="800" y="855" text-anchor="middle" class="m small">DOWNLOAD ONLY — installation starts after the downloaded installer is opened</text>
</svg>