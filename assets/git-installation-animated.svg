 <rect x="25" y="55" width="305" height="190" rx="14" fill="#090C18" stroke="#29335E"/>
 <text x="43" y="84" class="t body">Select Components</text><text x="43" y="114" class="m tiny">✓ Git Bash Here</text><text x="43" y="137" class="m tiny">✓ Git GUI Here</text><text x="43" y="160" class="m tiny">✓ Git LFS</text><text x="43" y="183" class="m tiny">✓ File associations</text>
