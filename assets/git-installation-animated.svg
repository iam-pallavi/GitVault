 <rect x="25" y="55" width="305" height="190" rx="14" fill="#090C18" stroke="#29335E"/>
 <text x="43" y="85" class="t body">Downloads</text><rect x="43" y="99" width="269" height="40" rx="9" fill="#151A31"/>
 <text x="57" y="124" class="mono tiny t">Git-2.55.0-64-bit.exe</text>
 <text x="43" y="164" class="m tiny">Double-click the installer</text>
 <rect x="43" y="184" width="115" height="34" rx="8" fill="#171F43" stroke="#62F6FF"/><text x="100" y="206" text-anchor="middle" class="cyan tiny">OPEN</text>
 <text x="181" y="206" class="m tiny">→ UAC: Yes</text>
</g>
<g transform="translate(815 225)">
 <rect width="355" height="285" rx="24" fill="#0B1028" stroke="#394477"/>
