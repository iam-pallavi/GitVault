<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060916"/><stop offset=".5" stop-color="#111637"/><stop offset="1" stop-color="#080A1D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62F6FF"/><stop offset=".5" stop-color="#9B7CFF"/><stop offset="1" stop-color="#39F5B2"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7882C7" stroke-opacity=".06"/></pattern>
  <style>
    .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F5F7FF}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#A6AED4}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cyan{fill:#62F6FF}.green{fill:#39F5B2}.purple{fill:#B39CFF}.label{font-size:13px;letter-spacing:2.5px}.title{font-size:48px;font-weight:760}.sub{font-size:19px}.h{font-size:22px;font-weight:700}.body{font-size:16px}.tiny{font-size:13px}.step{font-size:15px;font-weight:700}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="800" cy="430" r="330" fill="#625CFF" opacity=".07" filter="url(#glow)"/>

<text x="70" y="65" class="t title">How Git is Actually Installed on Windows</text>
<text x="70" y="102" class="m sub">A practical installer walkthrough — what you click, what you choose, and what gets verified.</text>
<text x="1530" y="62" text-anchor="end" class="cyan label">GIT FOR WINDOWS · PRACTICAL FLOW</text>

<!-- timeline -->
<line x1="80" y1="145" x2="1520" y2="145" stroke="#303866" stroke-width="3"/>
<line x1="80" y1="145" x2="1520" y2="145" stroke="url(#accent)" stroke-width="3" stroke-dasharray="85 1355">
 <animate attributeName="stroke-dashoffset" values="1440;0" dur="4.5s" repeatCount="indefinite"/>
</line>
<g class="t step" text-anchor="middle">
 <circle cx="80" cy="145" r="21" fill="#101633" stroke="#62F6FF" stroke-width="2"/><text x="80" y="150">1</text>
 <circle cx="286" cy="145" r="21" fill="#101633" stroke="#62F6FF" stroke-width="2"/><text x="286" y="150">2</text>
 <circle cx="492" cy="145" r="21" fill="#101633" stroke="#62F6FF" stroke-width="2"/><text x="492" y="150">3</text>
 <circle cx="698" cy="145" r="21" fill="#101633" stroke="#9B7CFF" stroke-width="2"/><text x="698" y="150">4</text>
 <circle cx="904" cy="145" r="21" fill="#101633" stroke="#9B7CFF" stroke-width="2"/><text x="904" y="150">5</text>
 <circle cx="1110" cy="145" r="21" fill="#101633" stroke="#9B7CFF" stroke-width="2"/><text x="1110" y="150">6</text>
 <circle cx="1316" cy="145" r="21" fill="#101633" stroke="#39F5B2" stroke-width="2"/><text x="1316" y="150">7</text>
 <circle cx="1520" cy="145" r="21" fill="#101633" stroke="#39F5B2" stroke-width="2"/><text x="1520" y="150">8</text>
</g>
<g class="m tiny" text-anchor="middle">
 <text x="80" y="183">Download</text><text x="286" y="183">Open .exe</text><text x="492" y="183">License</text><text x="698" y="183">Location</text><text x="904" y="183">Components</text><text x="1110" y="183">PATH</text><text x="1316" y="183">Install</text><text x="1520" y="183">Verify</text>
</g>

<!-- Main installer window -->
<g transform="translate(70 220)">
 <rect width="1460" height="570" rx="30" fill="#090D22" stroke="#354073" stroke-width="2"/>
 <rect x="0" y="0" width="1460" height="48" rx="30" fill="#111735"/>
 <circle cx="28" cy="24" r="6" fill="#62F6FF"/><circle cx="48" cy="24" r="6" fill="#9B7CFF"/><circle cx="68" cy="24" r="6" fill="#39F5B2"/>
 <text x="100" y="30" class="m tiny">Git 2.55.0 Setup · Windows Installer</text>

 <!-- left step stack -->
 <g transform="translate(35 78)">
  <text x="0" y="0" class="cyan label">STEP-BY-STEP</text>
  <text x="0" y="30" class="t h">Follow the wizard in this order</text>
  <g transform="translate(0 58)">
   <rect width="300" height="52" rx="13" fill="#101734" stroke="#3D4A83"/><circle cx="27" cy="26" r="14" fill="#18234A" stroke="#62F6FF"/><text x="27" y="31" text-anchor="middle" class="cyan step">1</text><text x="52" y="31" class="t body">Download Git for Windows</text>
   <rect y="64" width="300" height="52" rx="13" fill="#101734" stroke="#3D4A83"/><circle cx="27" cy="90" r="14" fill="#18234A" stroke="#62F6FF"/><text x="27" y="95" text-anchor="middle" class="cyan step">2</text><text x="52" y="95" class="t body">Run the downloaded .exe</text>
   <rect y="128" width="300" height="52" rx="13" fill="#101734" stroke="#3D4A83"/><circle cx="27" cy="154" r="14" fill="#18234A" stroke="#62F6FF"/><text x="27" y="159" text-anchor="middle" class="cyan step">3</text><text x="52" y="159" class="t body">Accept the license</text>
   <rect y="192" width="300" height="52" rx="13" fill="#101734" stroke="#3D4A83"/><circle cx="27" cy="218" r="14" fill="#18234A" stroke="#9B7CFF"/><text x="27" y="223" text-anchor="middle" class="purple step">4</text><text x="52" y="223" class="t body">Choose install location</text>
   <rect y="256" width="300" height="52" rx="13" fill="#101734" stroke="#3D4A83"/><circle cx="27" cy="282" r="14" fill="#18234A" stroke="#9B7CFF"/><text x="27" y="287" text-anchor="middle" class="purple step">5</text><text x="52" y="287" class="t body">Select components</text>
   <rect y="320" width="300" height="52" rx="13" fill="#101734" stroke="#3D4A83"/><circle cx="27" cy="346" r="14" fill="#18234A" stroke="#9B7CFF"/><text x="27" y="351" text-anchor="middle" class="purple step">6</text><text x="52" y="351" class="t body">Configure PATH</text>
   <rect y="384" width="300" height="52" rx="13" fill="#0D211F" stroke="#39F5B2"/><circle cx="27" cy="410" r="14" fill="#123B32" stroke="#39F5B2"/><text x="27" y="415" text-anchor="middle" class="green step">7</text><text x="52" y="415" class="t body">Install → Finish</text>
  </g>
 </g>

 <!-- dialog: actual choices -->
 <g transform="translate(370 78)">
  <text x="0" y="0" class="purple label">WHAT YOU SEE IN SETUP</text>
  <rect x="0" y="28" width="650" height="430" rx="20" fill="#070A16" stroke="#303A6C"/>
  <text x="28" y="62" class="t h">Installer pages</text>

  <!-- mini dialog 1 -->
  <rect x="28" y="86" width="594" height="78" rx="12" fill="#101631"/>
  <text x="48" y="113" class="m tiny">License Agreement</text>
  <text x="48" y="139" class="t body">Read → accept → Next</text>
  <rect x="520" y="105" width="76" height="34" rx="7" fill="#1A2750"/><text x="558" y="127" text-anchor="middle" class="t tiny">Next ›</text>

  <!-- mini dialog 2 -->
  <rect x="28" y="178" width="594" height="88" rx="12" fill="#101631"/>
  <text x="48" y="205" class="m tiny">Destination Folder</text>
  <text x="48" y="233" class="mono tiny cyan">C:\Program Files\Git</text>
  <text x="48" y="253" class="m tiny">Keep the default location unless you have a reason to change it.</text>

  <!-- mini dialog 3 -->
  <rect x="28" y="280" width="594" height="150" rx="12" fill="#101631"/>
  <text x="48" y="307" class="m tiny">Select Components</text>
  <text x="48" y="334" class="t tiny">✓ Git Bash Here</text>
  <text x="48" y="358" class="t tiny">✓ Git GUI Here</text>
  <text x="48" y="382" class="t tiny">✓ Git LFS</text>
  <text x="48" y="406" class="t tiny">✓ File associations</text>
  <circle cx="575" cy="354" r="25" fill="#171E43" stroke="#9B7CFF" stroke-width="2"><animate attributeName="r" values="21;28;21" dur="1.8s" repeatCount="indefinite"/></circle>
  <path d="M564 354l8 8 16-18" fill="none" stroke="#9B7CFF" stroke-width="4"/>
 </g>

 <!-- PATH + terminal -->
 <g transform="translate(1050 78)">
  <text x="0" y="0" class="green label">MOST IMPORTANT SETUP CHOICE</text>
  <rect x="0" y="28" width="375" height="430" rx="20" fill="#070A16" stroke="#303A6C"/>
  <text x="24" y="62" class="t h">PATH setting</text>
  <text x="24" y="91" class="m tiny">Choose the option that lets Git</text>
  <text x="24" y="110" class="m tiny">work from Command Prompt / PowerShell.</text>
  <rect x="24" y="134" width="327" height="76" rx="13" fill="#0D211F" stroke="#39F5B2"/>
  <text x="42" y="160" class="green tiny">Recommended</text>
  <text x="42" y="186" class="t body">Git from the command line</text>
  <text x="42" y="203" class="m tiny">and also from 3rd-party software</text>
  <path d="M300 170l12 12 22-27" fill="none" stroke="#39F5B2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="244" class="m tiny">Then continue through the remaining</text>
  <text x="24" y="264" class="m tiny">defaults and click Install.</text>
  <rect x="24" y="294" width="327" height="88" rx="13" fill="#0D1126" stroke="#2F3A70"/>
  <text x="42" y="322" class="m tiny">After installation</text>
  <text x="42" y="351" class="mono small cyan">git --version</text>
  <text x="42" y="372" class="mono tiny green">git version 2.55.0</text>
  <circle cx="320" cy="338" r="7" fill="#39F5B2" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.3s" repeatCount="indefinite"/></circle>
 </g>
</g>

<!-- bottom practical sequence -->
<g transform="translate(70 815)">
 <text x="0" y="0" class="m tiny">PRACTICAL SEQUENCE</text>
 <text x="185" y="0" class="t body">Download installer</text><text x="350" y="0" class="cyan">→</text>
 <text x="385" y="0" class="t body">Run .exe</text><text x="485" y="0" class="cyan">→</text>
 <text x="520" y="0" class="t body">Accept + Next</text><text x="645" y="0" class="cyan">→</text>
 <text x="680" y="0" class="t body">Keep defaults</text><text x="810" y="0" class="cyan">→</text>
 <text x="845" y="0" class="t body">PATH for command line</text><text x="1045" y="0" class="cyan">→</text>
 <text x="1080" y="0" class="green body">Install</text><text x="1160" y="0" class="cyan">→</text>
 <text x="1195" y="0" class="t body">Open terminal</text><text x="1320" y="0" class="cyan">→</text>
 <text x="1355" y="0" class="mono green body">git --version ✓</text>
</g>
</svg>