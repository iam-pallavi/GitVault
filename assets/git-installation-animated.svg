 <rect x="25" y="55" width="305" height="190" rx="14" fill="#090C18" stroke="#29335E"/>
 <text x="43" y="84" class="t body">Git Setup</text><text x="43" y="112" class="m tiny">GNU General Public License</text>
 <rect x="43" y="126" width="269" height="58" rx="8" fill="#11172E"/><text x="57" y="149" class="m tiny">Review the license agreement</text><text x="57" y="169" class="m tiny">Then click Next</text>
 <rect x="43" y="198" width="115" height="30" rx="7" fill="#171F43" stroke="#9B7CFF"/><text x="100" y="218" text-anchor="middle" class="purple tiny">NEXT ›</text>
</g>
<g transform="translate(1195 225)">
 <rect width="350" height="285" rx="24" fill="#0B1028" stroke="#394477"/>
 <text x="25" y="35" class="purple label">04 · INSTALL LOCATION</text>
 <rect x="25" y="55" width="300" height="190" rx="14" fill="#090C18" stroke="#29335E"/>
 <text x="43" y="84" class="t body">Destination Folder</text>
 <rect x="43" y="104" width="264" height="36" rx="7" fill="#11172E"/><text x="54" y="127" class="mono tiny m">C:\Program Files\Git</text>
 <text x="43" y="162" class="m tiny">Usually keep the default location.</text>
 <rect x="43" y="194" width="115" height="30" rx="7" fill="#171F43" stroke="#9B7CFF"/><text x="100" y="214" text-anchor="middle" class="purple tiny">NEXT ›</text>
</g>

<!-- Row 2 -->
<g transform="translate(55 545)">
 <rect width="355" height="285" rx="24" fill="#0B1028" stroke="#394477"/>
