 <rect x="25" y="55" width="305" height="190" rx="14" fill="#070A16" stroke="#29335E"/>
 <text x="43" y="84" class="m tiny">Browser</text><rect x="43" y="96" width="269" height="34" rx="8" fill="#10162F"/>
 <text x="56" y="118" class="mono tiny t">git-scm.com/install/windows</text>
 <text x="43" y="157" class="t body">Git for Windows / x64</text><text x="43" y="181" class="m tiny">Download the installer</text>
 <rect x="43" y="201" width="120" height="28" rx="7" fill="#12322E" stroke="#39F5B2"/><text x="103" y="220" text-anchor="middle" class="green tiny">DOWNLOAD</text>
 <circle cx="270" cy="215" r="7" fill="#62F6FF" filter="url(#g)"><animate attributeName="cx" values="165;285;165" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(435 225)">
 <rect width="355" height="285" rx="24" fill="#0B1028" stroke="#394477"/>
