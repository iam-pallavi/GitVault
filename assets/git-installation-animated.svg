 <text x="95" y="192">Download</text><text x="296" y="192">Run .exe</text><text x="497" y="192">License</text><text x="698" y="192">Location</text><text x="899" y="192">Components</text><text x="1100" y="192">PATH</text><text x="1301" y="192">Install</text><text x="1502" y="192">Verify</text>
