 <text x="28" y="54" class="t body">Installer finished</text><text x="220" y="54" class="cyan body">→</text><text x="255" y="54" class="t body">Git is on PATH</text><text x="490" y="54" class="cyan body">→</text><text x="525" y="54" class="t body">Terminal finds git</text><text x="800" y="54" class="cyan body">→</text><text x="835" y="54" class="mono green body">git --version</text><text x="1065" y="54" class="cyan body">→</text><text x="1100" y="54" class="green body">Git ready ✓</text>
 <circle cx="1430" cy="35" r="9" fill="#39F5B2" filter="url(#g)"/>
