<line x1="95" y1="155" x2="1505" y2="155" stroke="url(#a)" stroke-width="3" stroke-dasharray="90 1320">
 <animate attributeName="stroke-dashoffset" values="1410;0" dur="4s" repeatCount="indefinite"/>
</line>
