<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b"><stop stop-color="#050817"/><stop offset="1" stop-color="#180d32"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git log</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">read the actual commit history stored in your local repository</text><rect x="70" y="105" width="1060" height="275" rx="18" fill="#080c19" stroke="#293152"/><rect x="90" y="125" width="1020" height="35" rx="8" fill="#11172a"/><text x="110" y="149" fill="#cfd5ee" font-family="monospace" font-size="14">$ git log --oneline --decorate</text><path d="M145 205V345" stroke="#303a5b" stroke-width="4"/><g font-family="monospace" font-size="13"><circle cx="145" cy="205" r="9" fill="#4de7ff"/><text x="175" y="210" fill="#4de7ff">7c91e4a (HEAD -&gt; main) update app</text><text x="175" y="230" fill="#737f9f" font-family="system-ui" font-size="11">today • current commit</text><circle cx="145" cy="270" r="8" fill="#a78bfa"/><text x="175" y="275" fill="#d9def3">4b82d1a add README</text><text x="175" y="295" fill="#737f9f" font-family="system-ui" font-size="11">previous snapshot</text><circle cx="145" cy="335" r="8" fill="#737f9f"/><text x="175" y="340" fill="#d9def3">a1f90cc initial commit</text></g><rect x="760" y="185" width="300" height="135" rx="14" fill="#0d1324" stroke="#4de7ff"/><text x="910" y="215" text-anchor="middle" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">WHAT LOG SHOWS</text><text x="790" y="250" fill="#aeb8d7" font-family="system-ui" font-size="12">• commit hash</text><text x="790" y="274" fill="#aeb8d7" font-family="system-ui" font-size="12">• branch / HEAD</text><text x="790" y="298" fill="#aeb8d7" font-family="system-ui" font-size="12">• message + order</text><text x="600" y="415" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git log = inspect history; it does not change your files</text></svg>