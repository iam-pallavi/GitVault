<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset="1" stop-color="#211044"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git log</text><text x="600" y="74" text-anchor="middle" fill="#a5afd0" font-family="system-ui" font-size="13">A living timeline of commits, hashes, branches and HEAD</text><rect x="60" y="105" width="1080" height="280" rx="18" fill="#060a15" stroke="#354064"/><rect x="80" y="125" width="1040" height="38" rx="8" fill="#10172a"/><text x="100" y="150" fill="#dce1f2" font-family="monospace" font-size="13">$ git log --oneline --decorate</text><path d="M135 205V345" stroke="#303a5b" stroke-width="5"/><path d="M135 205V345" stroke="#4deaff" stroke-width="2" stroke-dasharray="7 12"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur=".8s" repeatCount="indefinite"/></path><g font-family="monospace"><circle cx="135" cy="205" r="10" fill="#4deaff" filter="url(#g)"><animate attributeName="r" values="8;14;8" dur="1.3s" repeatCount="indefinite"/></circle><text x="165" y="210" fill="#4deaff" font-size="13">7c91e4a (HEAD → main) update app</text><circle cx="135" cy="270" r="8" fill="#b98cff"/><text x="165" y="275" fill="#dbe0f2" font-size="13">4b82d1a add README</text><circle cx="135" cy="335" r="8" fill="#65718f"/><text x="165" y="340" fill="#dbe0f2" font-size="13">a1f90cc initial commit</text></g><rect x="735" y="184" width="310" height="135" rx="14" fill="#0b1223" stroke="#4deaff"/><text x="890" y="214" text-anchor="middle" fill="#4deaff" font-size="12" font-weight="800">REF POINTERS</text><text x="770" y="247" fill="#aeb8d5" font-family="monospace" font-size="11">HEAD  →  main</text><text x="770" y="274" fill="#aeb8d5" font-family="monospace" font-size="11">main  →  7c91e4a</text><text x="770" y="301" fill="#aeb8d5" font-family="monospace" font-size="11">parent → 4b82d1a</text><circle cx="1045" cy="247" r="5" fill="#4deaff"><animate attributeName="opacity" values="1;.15;1" dur="1s" repeatCount="indefinite"/></circle><path d="M700 205C660 205 630 235 600 270" fill="none" stroke="#b98cff" stroke-width="2" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur=".7s" repeatCount="indefinite"/></path><rect x="300" y="400" width="600" height="34" rx="17" fill="#080c18" stroke="#46527a"/><text x="600" y="422" text-anchor="middle" fill="#b7c0da" font-family="monospace" font-size="11">git log = read history • refs move • commits remain</text></svg>