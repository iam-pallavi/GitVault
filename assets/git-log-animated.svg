<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" rx="32" fill="#070b16"/>
<rect x="24" y="24" width="1552" height="852" rx="28" fill="#0b1120" stroke="#263653" stroke-width="2"/>
<text x="70" y="75" fill="#8da0bd" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">GITVAULT / GIT BASICS / 09</text>
<text x="70" y="125" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="800">git log</text>
<text x="70" y="158" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="17">View the commit history of your local Git repository.</text>

<rect x="70" y="205" width="700" height="480" rx="24" fill="#03060c" stroke="#30435f" stroke-width="2"/>
<rect x="70" y="205" width="700" height="52" rx="24" fill="#111a2c"/>
<circle cx="103" cy="231" r="6" fill="#fb7185"/><circle cx="125" cy="231" r="6" fill="#fbbf24"/><circle cx="147" cy="231" r="6" fill="#34d399"/>
<text x="180" y="236" fill="#8fa1ba" font-family="monospace" font-size="13">Git Bash — my-project</text>
<text x="105" y="295" fill="#9aa9c0" font-family="monospace" font-size="14">pallavi@devbox ~/my-project</text>
<text x="105" y="330" fill="#fff" font-family="monospace" font-size="15">$ git log</text>
<text x="105" y="365" fill="#a78bfa" font-family="monospace" font-size="13">commit a1b2c3d</text>
<text x="125" y="391" fill="#9aa9c0" font-family="monospace" font-size="12">Author: Pallavi</text>
<text x="125" y="415" fill="#9aa9c0" font-family="monospace" font-size="12">Date:   Sep 16 2026</text>
<text x="125" y="442" fill="#fff" font-family="monospace" font-size="12">    Add project files</text>
<text x="105" y="480" fill="#a78bfa" font-family="monospace" font-size="13">commit 7f8e9d1</text>
<text x="125" y="506" fill="#9aa9c0" font-family="monospace" font-size="12">Author: Pallavi</text>
<text x="125" y="530" fill="#9aa9c0" font-family="monospace" font-size="12">Date:   Sep 15 2026</text>
<text x="125" y="557" fill="#fff" font-family="monospace" font-size="12">    Initial project setup</text>
<text x="105" y="605" fill="#64748b" font-family="monospace" font-size="11">Newest commit appears first.</text>
<text x="105" y="630" fill="#64748b" font-family="monospace" font-size="11">IDs and dates above are illustrative.</text>

<text x="815" y="215" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">WHAT GIT LOG SHOWS</text>
<rect x="815" y="250" width="700" height="435" rx="24" fill="#080d19" stroke="#30435f" stroke-width="2"/>

<rect x="850" y="295" width="610" height="90" rx="18" fill="#0d1824" stroke="#34d399" stroke-width="2"/>
<text x="880" y="327" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">LATEST / CURRENT</text>
<text x="880" y="354" fill="#fff" font-family="monospace" font-size="14">a1b2c3d  →  Add project files</text>
<text x="880" y="375" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="12">saved snapshot • author • date</text>

<line x1="905" y1="385" x2="905" y2="415" stroke="#465673" stroke-width="4"/>
<rect x="850" y="415" width="610" height="90" rx="18" fill="#0d1422" stroke="#49dfff" stroke-width="2"/>
<text x="880" y="447" fill="#49dfff" font-family="monospace" font-size="11" font-weight="700">PREVIOUS</text>
<text x="880" y="474" fill="#fff" font-family="monospace" font-size="14">7f8e9d1  →  Initial project setup</text>
<text x="880" y="495" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="12">earlier saved snapshot</text>

<rect x="850" y="535" width="610" height="115" rx="18" fill="#0b101c" stroke="#293852"/>
<text x="880" y="568" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">QUICK VERSION</text>
<text x="880" y="601" fill="#fff" font-family="monospace" font-size="15">$ git log --oneline</text>
<text x="880" y="628" fill="#9aa9c0" font-family="monospace" font-size="12">a1b2c3d Add project files</text>

<rect x="70" y="730" width="1445" height="75" rx="20" fill="#050914" stroke="#2b3d5b" stroke-width="2"/>
<text x="100" y="761" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">REMEMBER</text>
<text x="245" y="763" fill="#fff" font-family="Arial,sans-serif" font-size="14">git log = see commit history • git log --oneline = compact history • newest commit first</text>
<text x="100" y="788" fill="#7f8da4" font-family="Arial,sans-serif" font-size="12">git log only displays history; it does not create, change, or upload commits.</text>
</svg>