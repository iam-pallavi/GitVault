<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040714"/><stop offset="1" stop-color="#190d35"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">git log</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">Read the commit graph, hashes, refs and messages stored in local history</text><rect x="60" y="105" width="1080" height="280" rx="18" fill="#070b17" stroke="#303a59"/><rect x="80" y="125" width="1040" height="38" rx="8" fill="#11172a"/><text x="100" y="150" fill="#dce1f2" font-family="monospace" font-size="13">$ git log --oneline --decorate</text><path d="M135 205V345" stroke="#303a5b" stroke-width="4"/><path d="M135 205V345" stroke="#4de7ff" stroke-width="2" stroke-dasharray="7 12"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1s" repeatCount="indefinite"/></path><g font-family="monospace"><circle cx="135" cy="205" r="10" fill="#4de7ff" filter="url(#gl)"><animate attributeName="r" values="8;13;8" dur="1.4s" repeatCount="indefinite"/></circle><text x="165" y="210" fill="#4de7ff" font-size="13">7c91e4a (HEAD -&gt; main) update app</text><text x="165" y="231" fill="#7783a2" font-family="system-ui" font-size="11">current commit</text><circle cx="135" cy="270" r="8" fill="#a78bfa"/><text x="165" y="275" fill="#dbe0f2" font-size="13">4b82d1a add README</text><text x="165" y="296" fill="#7783a2" font-family="system-ui" font-size="11">previous snapshot</text><circle cx="135" cy="335" r="8" fill="#65718f"/><text x="165" y="340" fill="#dbe0f2" font-size="13">a1f90cc initial commit</text></g><rect x="735" y="184" width="310" height="135" rx="14" fill="#0b1223" stroke="#4de7ff"/><text x="890" y="214" text-anchor="middle" fill="#4de7ff" font-family="system-ui" font-size="12" font-weight="800">REF POINTERS</text><text x="770" y="247" fill="#aeb8d5" font-family="monospace" font-size="11">HEAD  →  main</text><text x="770" y="274" fill="#aeb8d5" font-family="monospace" font-size="11">main  →  7c91e4a</text><text x="770" y="301" fill="#aeb8d5" font-family="monospace" font-size="11">parent → 4b82d1a</text><circle cx="1045" cy="247" r="5" fill="#4de7ff"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle><text x="600" y="415" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">git log = inspect history without changing the working tree</text></svg>