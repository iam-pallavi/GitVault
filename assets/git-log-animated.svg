<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0e1429"/><stop offset="1" stop-color="#1b0c35"/></linearGradient><linearGradient id="a"><stop stop-color="#4ce9c0"/><stop offset=".5" stop-color="#4bdcff"/><stop offset="1" stop-color="#aa7cff"/></linearGradient></defs><rect width="1200" height="520" rx="30" fill="url(#b)"/><g opacity=".07" stroke="#aab5d4"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git log</text><text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">Walk backward through the immutable commit graph</text><rect x="70" y="110" width="1060" height="310" rx="22" fill="#080e1d" stroke="#34405e"/><path d="M190 180V350" stroke="#35425e" stroke-width="4"/><g font-family="monospace"><circle cx="190" cy="180" r="10" fill="#4ce9c0"/><circle cx="190" cy="265" r="10" fill="#4bdcff"/><circle cx="190" cy="350" r="10" fill="#aa7cff"/><text x="225" y="185" fill="#fff" font-size="13">9d2af31</text><text x="330" y="185" fill="#9aa6c3" font-size="11">HEAD → main   latest commit</text><text x="225" y="270" fill="#fff" font-size="13">7c91e4a</text><text x="330" y="270" fill="#9aa6c3" font-size="11">fix: update README</text><text x="225" y="355" fill="#fff" font-size="13">a18d2f1</text><text x="330" y="355" fill="#9aa6c3" font-size="11">initial project snapshot</text><path d="M700 180H1040M700 265H1040M700 350H1040" stroke="#273650" stroke-width="2"/><text x="700" y="160" fill="#71809e" font-size="10">REF POINTERS</text><text x="720" y="205" fill="#65e6b1">main</text><text x="720" y="290" fill="#65dfff">HEAD</text><text x="720" y="375" fill="#a982ff">parent</text></g><circle r="6" fill="#55eaff"><animateMotion dur="3.2s" repeatCount="indefinite" path="M190 180V350"/></circle><rect x="270" y="442" width="660" height="40" rx="20" fill="#070b16" stroke="#465276"/><text x="600" y="467" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">git log  →  newest commit → parent → older history</text><text x="600" y="503" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">Git log reads history; it does not rewrite it.</text></svg>