<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#10162d"/><stop offset="1" stop-color="#1c0d36"/></linearGradient><linearGradient id="line"><stop stop-color="#55e6b3"/><stop offset=".5" stop-color="#49dfff"/><stop offset="1" stop-color="#b27cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="30" fill="url(#bg)"/><g opacity=".06" stroke="#b9c4df"><path d="M40 105H1160M40 160H1160M40 215H1160M40 270H1160M40 325H1160M40 380H1160M40 435H1160"/><path d="M100 80V460M200 80V460M300 80V460M400 80V460M500 80V460M600 80V460M700 80V460M800 80V460M900 80V460M1000 80V460M1100 80V460"/></g><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">Git History — git log</text><text x="600" y="74" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">See the saved snapshots in your repository, from newest to oldest</text><rect x="70" y="105" width="1060" height="325" rx="24" fill="#080d1b" stroke="#33415f"/><text x="110" y="138" fill="#71809f" font-family="system-ui" font-size="11" font-weight="800">COMMIT HISTORY</text><path d="M180 170V365" stroke="#34425f" stroke-width="5"/><path d="M180 170V365" stroke="url(#line)" stroke-width="2" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1s" repeatCount="indefinite"/></path><g font-family="system-ui"><circle cx="180" cy="175" r="13" fill="#55e6b3" filter="url(#glow)"/><circle cx="180" cy="270" r="13" fill="#49dfff" filter="url(#glow)"/><circle cx="180" cy="365" r="13" fill="#b27cff" filter="url(#glow)"/><g fill="#fff" font-size="15" font-weight="800"><text x="220" y="171">Current commit</text><text x="220" y="266">Previous commit</text><text x="220" y="361">Older commit</text></g><g fill="#aeb9d2" font-size="11"><text x="220" y="190">Branch: main  •  HEAD points here</text><text x="220" y="285">Saved snapshot before the current commit</text><text x="220" y="380">Earlier saved snapshot</text></g><g font-family="monospace"><rect x="650" y="145" width="390" height="72" rx="16" fill="#0c1527" stroke="#55e6b3"/><text x="675" y="171" fill="#55e6b3" font-size="10" font-weight="800">CURRENT COMMIT</text><text x="675" y="194" fill="#fff" font-size="12">Commit ID: abc1234</text><rect x="650" y="240" width="390" height="72" rx="16" fill="#0c1527" stroke="#49dfff"/><text x="675" y="266" fill="#49dfff" font-size="10" font-weight="800">PREVIOUS COMMIT</text><text x="675" y="289" fill="#fff" font-size="12">Commit ID: def5678</text><rect x="650" y="335" width="390" height="72" rx="16" fill="#0c1527" stroke="#b27cff"/><text x="675" y="361" fill="#b27cff" font-size="10" font-weight="800">OLDER COMMIT</text><text x="675" y="384" fill="#fff" font-size="12">Commit ID: ghi9012</text></g></g><circle r="7" fill="#fff" filter="url(#glow)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M180 175V270V365"/></circle><rect x="255" y="447" width="690" height="38" rx="19" fill="#070b16" stroke="#465276"/><text x="600" y="471" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">git log  →  current commit  →  previous commit  →  older history</text><text x="600" y="505" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">Git log shows history; each commit is a saved snapshot.</text></svg>