<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340"><rect width="1000" height="340" rx="24" fill="#0b1020"/><text x="500" y="52" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="700">git log</text><g font-family="monospace"><g transform="translate(180 105)"><circle cx="0" cy="0" r="9" fill="#00d4ff"><animate attributeName="r" values="7;12;7" dur="2s" repeatCount="indefinite"/></circle><line x1="0" y1="10" x2="0" y2="72" stroke="#6d5dfc" stroke-width="4"/><text x="35" y="6" fill="white" font-size="18">Commit 3</text><text x="35" y="30" fill="#9aa7c7" font-size="14">Update README</text></g><g transform="translate(180 180)"><circle cx="0" cy="0" r="9" fill="#8a6cff"/><line x1="0" y1="10" x2="0" y2="72" stroke="#6d5dfc" stroke-width="4"/><text x="35" y="6" fill="white" font-size="18">Commit 2</text><text x="35" y="30" fill="#9aa7c7" font-size="14">Add Git commands</text></g><g transform="translate(180 255)"><circle cx="0" cy="0" r="9" fill="#6d5dfc"/><text x="35" y="6" fill="white" font-size="18">Commit 1</text><text x="35" y="30" fill="#9aa7c7" font-size="14">Initial commit</text></g></g><text x="700" y="170" text-anchor="middle" fill="#aeb8d0" font-family="Arial" font-size="18">History moves</text><text x="700" y="200" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="18">backward through time</text><circle cx="700" cy="235" r="35" fill="none" stroke="#6d5dfc" opacity=".5"><animate attributeName="r" values="20;50;20" dur="2.5s" repeatCount="indefinite"/></circle></svg>