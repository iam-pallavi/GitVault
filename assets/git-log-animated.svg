<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#11102E"/><stop offset="1" stop-color="#281052"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="32" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="32" font-weight="800">git log</text><text x="600" y="86" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">inspect the timeline of commits — your repository's memory</text><rect x="80" y="120" width="700" height="220" rx="28" fill="#10142B" fill-opacity=".92" stroke="#7C5CFF" stroke-width="2"/><path d="M155 165V295" stroke="#30345F" stroke-width="5"/><path d="M155 165V295" stroke="#55E6FF" stroke-width="2" stroke-dasharray="7 12"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1.2s" repeatCount="indefinite"/></path><g font-family="system-ui"><circle cx="155" cy="170" r="11" fill="#55E6FF" filter="url(#glow)"><animate attributeName="r" values="9;15;9" dur="2s" repeatCount="indefinite"/></circle><text x="195" y="175" fill="#fff" font-size="17" font-weight="800">a8f3c2  Update README</text><text x="195" y="197" fill="#7F89B0" font-size="12">HEAD • 2 minutes ago</text><circle cx="155" cy="230" r="10" fill="#9B5CFF"/><text x="195" y="235" fill="#fff" font-size="17" font-weight="700">71d9a1  Add Git commands</text><text x="195" y="257" fill="#7F89B0" font-size="12">1 hour ago</text><circle cx="155" cy="290" r="10" fill="#7C5CFF"/><text x="195" y="295" fill="#fff" font-size="17" font-weight="700">2c40ef  Initial commit</text><text x="195" y="317" fill="#7F89B0" font-size="12">yesterday</text></g><rect x="830" y="120" width="290" height="220" rx="28" fill="#10142B" fill-opacity=".92" stroke="#55E6FF" stroke-width="2"/><text x="975" y="163" text-anchor="middle" fill="#55E6FF" font-family="system-ui" font-size="13" font-weight="800">COMMAND</text><rect x="870" y="190" width="210" height="48" rx="14" fill="#090D20" stroke="#30345F"/><text x="975" y="220" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">git log --oneline</text><circle cx="975" cy="275" r="20" fill="none" stroke="#9B5CFF" opacity=".7"><animate attributeName="r" values="16;38;16" dur="2.5s" repeatCount="indefinite"/></circle><text x="975" y="280" text-anchor="middle" fill="#9B5CFF" font-family="system-ui" font-size="12" font-weight="700">HISTORY</text><text x="600" y="380" text-anchor="middle" fill="#A9B1D6" font-family="monospace" font-size="14">git log = see what happened, when, and in which order</text></svg>