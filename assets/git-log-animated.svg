<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#070A18"/><stop offset="1" stop-color="#24104D"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="380" rx="30" fill="url(#b)"/><text x="600" y="55" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git log</text><text x="600" y="82" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="14">read the story of your repository, one commit at a time</text><line x1="190" y1="130" x2="190" y2="305" stroke="#5B4FA8" stroke-width="5"/><g font-family="system-ui"><g><circle cx="190" cy="140" r="11" fill="#55E6FF" filter="url(#g)"><animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite"/></circle><text x="235" y="146" fill="white" font-size="19" font-weight="700">Commit 3</text><text x="235" y="172" fill="#8F99BF" font-size="14">Update README</text></g><g><circle cx="190" cy="215" r="10" fill="#A46CFF"/><text x="235" y="221" fill="white" font-size="19" font-weight="700">Commit 2</text><text x="235" y="247" fill="#8F99BF" font-size="14">Add Git commands</text></g><g><circle cx="190" cy="290" r="10" fill="#7C5CFF"/><text x="235" y="296" fill="white" font-size="19" font-weight="700">Commit 1</text><text x="235" y="322" fill="#8F99BF" font-size="14">Initial commit</text></g></g><rect x="670" y="125" width="410" height="190" rx="26" fill="#11162F" stroke="#55E6FF" stroke-opacity=".7"/><text x="875" y="178" text-anchor="middle" fill="white" font-family="system-ui" font-size="23" font-weight="800">History = project memory</text><text x="875" y="216" text-anchor="middle" fill="#A9B1D6" font-family="system-ui" font-size="15">Use git log to inspect commits</text><text x="875" y="250" text-anchor="middle" fill="#55E6FF" font-family="monospace" font-size="15">git log --oneline</text><circle cx="875" cy="285" r="18" fill="none" stroke="#9B6CFF" opacity=".6"><animate attributeName="r" values="15;35;15" dur="2.4s" repeatCount="indefinite"/></circle></svg>