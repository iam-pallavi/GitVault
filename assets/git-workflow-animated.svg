<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A18"/><stop offset=".48" stop-color="#11143A"/><stop offset="1" stop-color="#24104D"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6C63FF"/><stop offset=".5" stop-color="#C06CFF"/><stop offset="1" stop-color="#55E6FF"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171B3D"/><stop offset="1" stop-color="#0F1230"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <style>
    .title{font:700 30px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff;letter-spacing:.4px}.sub{font:500 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#A9B1D6}.label{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.cmd{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#C8CEFF}.hint{font:500 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#8E97C1}.num{font:800 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}
  </style>
</defs>
<rect width="1400" height="500" rx="32" fill="url(#bg)"/>
<circle cx="180" cy="70" r="140" fill="#6C63FF" opacity=".13" filter="url(#blur)"/>
<circle cx="1210" cy="420" r="170" fill="#55E6FF" opacity=".08" filter="url(#blur)"/>
<circle cx="700" cy="220" r="210" fill="#A85CFF" opacity=".045" filter="url(#blur)"/>
<text x="700" y="55" text-anchor="middle" class="title">⚡ Git Workflow — Watch the Change Flow</text>
<text x="700" y="82" text-anchor="middle" class="sub">Every change moves through four simple stages</text>

<!-- animated progress rail -->
<path d="M150 235 H1250" stroke="#30345F" stroke-width="5" stroke-linecap="round"/>
<path d="M150 235 H1250" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 14" opacity=".75">
  <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.4s" repeatCount="indefinite"/>
</path>

<!-- moving energy particles -->
<g filter="url(#glow)">
 <circle r="8" fill="#8D7BFF"><animateMotion dur="3.2s" repeatCount="indefinite" path="M150 235 H1250"/></circle>
 <circle r="5" fill="#D18CFF"><animateMotion dur="3.2s" begin=".8s" repeatCount="indefinite" path="M150 235 H1250"/></circle>
 <circle r="6" fill="#55E6FF"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M150 235 H1250"/></circle>
</g>

<!-- cards -->
<g>
 <rect x="55" y="150" width="270" height="170" rx="24" fill="url(#card)" stroke="#6C63FF" stroke-width="1.6"/>
 <circle cx="88" cy="182" r="16" fill="#6C63FF"/><text x="88" y="186" text-anchor="middle" class="num">01</text>
 <text x="190" y="185" text-anchor="middle" class="label">Working Directory</text>
 <text x="190" y="226" text-anchor="middle" class="cmd">git status</text>
 <text x="190" y="252" text-anchor="middle" class="hint">Check what changed</text>
 <text x="190" y="276" text-anchor="middle" class="hint">before you stage it</text>

 <rect x="375" y="150" width="270" height="170" rx="24" fill="url(#card)" stroke="#9B6CFF" stroke-width="1.6"/>
 <circle cx="408" cy="182" r="16" fill="#9B6CFF"/><text x="408" y="186" text-anchor="middle" class="num">02</text>
 <text x="510" y="185" text-anchor="middle" class="label">Staging Area</text>
 <text x="510" y="226" text-anchor="middle" class="cmd">git add .</text>
 <text x="510" y="252" text-anchor="middle" class="hint">Choose the changes</text>
 <text x="510" y="276" text-anchor="middle" class="hint">you want to commit</text>

 <rect x="695" y="150" width="270" height="170" rx="24" fill="url(#card)" stroke="#C06CFF" stroke-width="1.6"/>
 <circle cx="728" cy="182" r="16" fill="#C06CFF"/><text x="728" y="186" text-anchor="middle" class="num">03</text>
 <text x="830" y="185" text-anchor="middle" class="label">Local Repository</text>
 <text x="830" y="226" text-anchor="middle" class="cmd">git commit</text>
 <text x="830" y="252" text-anchor="middle" class="hint">Save a versioned</text>
 <text x="830" y="276" text-anchor="middle" class="hint">snapshot locally</text>

 <rect x="1015" y="150" width="330" height="170" rx="24" fill="url(#card)" stroke="#55E6FF" stroke-width="1.6"/>
 <circle cx="1048" cy="182" r="16" fill="#55E6FF"/><text x="1048" y="186" text-anchor="middle" class="num">04</text>
 <text x="1180" y="185" text-anchor="middle" class="label">GitHub Remote ☁</text>
 <text x="1180" y="226" text-anchor="middle" class="cmd">git push</text>
 <text x="1180" y="252" text-anchor="middle" class="hint">Send your commits</text>
 <text x="1180" y="276" text-anchor="middle" class="hint">to the remote repository</text>
</g>

<!-- stage dots -->
<g filter="url(#glow)">
 <circle cx="190" cy="235" r="10" fill="#6C63FF"><animate attributeName="r" values="8;12;8" dur="1.4s" repeatCount="indefinite"/></circle>
 <circle cx="510" cy="235" r="10" fill="#9B6CFF"><animate attributeName="r" values="8;12;8" dur="1.4s" begin=".35s" repeatCount="indefinite"/></circle>
 <circle cx="830" cy="235" r="10" fill="#C06CFF"><animate attributeName="r" values="8;12;8" dur="1.4s" begin=".7s" repeatCount="indefinite"/></circle>
 <circle cx="1180" cy="235" r="10" fill="#55E6FF"><animate attributeName="r" values="8;12;8" dur="1.4s" begin="1.05s" repeatCount="indefinite"/></circle>
</g>

<rect x="265" y="370" width="870" height="64" rx="18" fill="#080C20" stroke="#30345F"/>
<text x="700" y="397" text-anchor="middle" class="hint">THE LOOP</text>
<text x="700" y="421" text-anchor="middle" class="cmd">git status   →   git add   →   git commit   →   git push</text>
<circle cx="286" cy="402" r="5" fill="#55E6FF"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
</svg>
