<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080B1A"/><stop offset="0.55" stop-color="#11133A"/><stop offset="1" stop-color="#24104A"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6C63FF"/><stop offset="0.5" stop-color="#B56CFF"/><stop offset="1" stop-color="#5EE7FF"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .title{font:700 26px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.label{font:600 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.cmd{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#BFC6FF}.sub{font:500 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9EA6C9}
  </style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<circle cx="180" cy="60" r="100" fill="#6C63FF" opacity=".12" filter="url(#soft)"/>
<circle cx="1040" cy="350" r="120" fill="#5EE7FF" opacity=".09" filter="url(#soft)"/>
<text x="600" y="52" text-anchor="middle" class="title">Git Workflow — How Changes Move</text>
<text x="600" y="78" text-anchor="middle" class="sub">Check → Stage → Commit → Push</text>

<g stroke="url(#line)" stroke-width="4" fill="none" opacity=".65">
  <path id="p1" d="M235 190 H285"/><path id="p2" d="M475 190 H525"/><path id="p3" d="M715 190 H765"/><path id="p4" d="M955 190 H1005"/>
</g>

<g filter="url(#glow)" fill="#A98BFF">
  <circle r="7"><animateMotion dur="1.8s" repeatCount="indefinite" path="M235 190 H285"/></circle>
  <circle r="7" fill="#C78BFF"><animateMotion dur="1.8s" begin=".45s" repeatCount="indefinite" path="M475 190 H525"/></circle>
  <circle r="7" fill="#8BDBFF"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M715 190 H765"/></circle>
  <circle r="7" fill="#5EE7FF"><animateMotion dur="1.8s" begin="1.35s" repeatCount="indefinite" path="M955 190 H1005"/></circle>
</g>

<g>
  <rect x="45" y="135" width="190" height="110" rx="20" fill="#151936" stroke="#6C63FF" stroke-width="1.5"/>
  <text x="140" y="174" text-anchor="middle" class="label">Working Directory</text><text x="140" y="204" text-anchor="middle" class="cmd">git status</text><text x="140" y="225" text-anchor="middle" class="sub">see what changed</text>

  <rect x="285" y="135" width="190" height="110" rx="20" fill="#19163B" stroke="#9B6CFF" stroke-width="1.5"/>
  <text x="380" y="174" text-anchor="middle" class="label">Staging Area</text><text x="380" y="204" text-anchor="middle" class="cmd">git add .</text><text x="380" y="225" text-anchor="middle" class="sub">select changes</text>

  <rect x="525" y="135" width="190" height="110" rx="20" fill="#21163F" stroke="#B56CFF" stroke-width="1.5"/>
  <text x="620" y="174" text-anchor="middle" class="label">Local Repository</text><text x="620" y="204" text-anchor="middle" class="cmd">git commit</text><text x="620" y="225" text-anchor="middle" class="sub">save a snapshot</text>

  <rect x="765" y="135" width="190" height="110" rx="20" fill="#171D3D" stroke="#73C8FF" stroke-width="1.5"/>
  <text x="860" y="174" text-anchor="middle" class="label">Commit History</text><text x="860" y="204" text-anchor="middle" class="cmd">git log</text><text x="860" y="225" text-anchor="middle" class="sub">track versions</text>

  <rect x="1005" y="135" width="150" height="110" rx="20" fill="#10243A" stroke="#5EE7FF" stroke-width="1.5"/>
  <text x="1080" y="174" text-anchor="middle" class="label">GitHub ☁</text><text x="1080" y="204" text-anchor="middle" class="cmd">git push</text><text x="1080" y="225" text-anchor="middle" class="sub">share remotely</text>
</g>

<rect x="180" y="305" width="840" height="58" rx="16" fill="#090D1D" stroke="#2D315A"/>
<circle cx="208" cy="334" r="7" fill="#5EE7FF"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="230" y="340" class="cmd">$ git status  →  git add .  →  git commit  →  git push</text>
</svg>
