<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0d1328"/><stop offset="1" stop-color="#1b0d34"/></linearGradient><linearGradient id="a"><stop stop-color="#b27cff"/><stop offset=".5" stop-color="#49dfff"/><stop offset="1" stop-color="#55e6b3"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="30" fill="url(#b)"/><g opacity=".07" stroke="#aab5d4"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">Git workflow</text><text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">A file's journey from your editor to local history and the remote repository</text><g font-family="system-ui"><rect x="35" y="125" width="205" height="235" rx="20" fill="#090e1c" stroke="#745cff"/><text x="137" y="157" text-anchor="middle" fill="#b27cff" font-size="11" font-weight="800">WORKING TREE</text><rect x="65" y="185" width="145" height="90" rx="12" fill="#0f1729" stroke="#293754"/><text x="137" y="218" text-anchor="middle" fill="#e1e7f5" font-family="monospace" font-size="12">app.py</text><text x="137" y="242" text-anchor="middle" fill="#ff7895" font-family="monospace" font-size="10">modified</text><text x="137" y="310" text-anchor="middle" fill="#71809f" font-size="10">edit files</text><rect x="275" y="125" width="205" height="235" rx="20" fill="#071321" stroke="#49dfff"/><text x="377" y="157" text-anchor="middle" fill="#49dfff" font-size="11" font-weight="800">INDEX</text><rect x="305" y="185" width="145" height="90" rx="12" fill="#0e1b2d" stroke="#49dfff"/><text x="377" y="218" text-anchor="middle" fill="#e1e7f5" font-family="monospace" font-size="12">app.py</text><text x="377" y="242" text-anchor="middle" fill="#55e6b3" font-family="monospace" font-size="10">staged ✓</text><text x="377" y="310" text-anchor="middle" fill="#71809f" font-size="10">git add</text><rect x="515" y="125" width="205" height="235" rx="20" fill="#090e1c" stroke="#55e6b3"/><text x="617" y="157" text-anchor="middle" fill="#55e6b3" font-size="11" font-weight="800">LOCAL REPOSITORY</text><circle cx="617" cy="230" r="48" fill="#0d1829" stroke="#49dfff"/><text x="617" y="226" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">7c91e4a</text><text x="617" y="245" text-anchor="middle" fill="#71809f" font-family="monospace" font-size="9">commit</text><text x="617" y="310" text-anchor="middle" fill="#71809f" font-size="10">git commit</text><rect x="755" y="125" width="205" height="235" rx="20" fill="#090e1c" stroke="#aa7cff"/><text x="857" y="157" text-anchor="middle" fill="#aa7cff" font-size="11" font-weight="800">REMOTE</text><circle cx="857" cy="230" r="48" fill="#10152a" stroke="#aa7cff"/><text x="857" y="226" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">origin</text><text x="857" y="245" text-anchor="middle" fill="#71809f" font-family="monospace" font-size="9">main</text><text x="857" y="310" text-anchor="middle" fill="#71809f" font-size="10">git push</text></g><path d="M240 242H275M480 242H515M720 242H755" stroke="#293754" stroke-width="10"/><path d="M240 242H275M480 242H515M720 242H755" stroke="url(#a)" stroke-width="2" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur=".55s" repeatCount="indefinite"/></path><circle r="6" fill="#55eaff" filter="url(#g)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M240 242H275M480 242H515M720 242H755"/></circle><rect x="150" y="400" width="900" height="44" rx="22" fill="#070b16" stroke="#465276"/><text x="600" y="428" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">edit → git status → git add → git commit → git push</text><text x="600" y="486" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">The index is the bridge between your working files and the next commit.</text></svg>