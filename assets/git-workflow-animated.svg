<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".45" stop-color="#0A1030"/><stop offset="1" stop-color="#180B38"/></linearGradient>
  <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6E5BFF"/><stop offset=".48" stop-color="#B66CFF"/><stop offset="1" stop-color="#4DEBFF"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18204A" stop-opacity=".9"/><stop offset="1" stop-color="#090E26" stop-opacity=".72"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#FFFFFF"/><stop offset=".18" stop-color="#BFA9FF"/><stop offset=".52" stop-color="#775CFF" stop-opacity=".7"/><stop offset="1" stop-color="#775CFF" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
  <style>
    .title{font:800 31px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8F9FF;letter-spacing:.6px}.sub{font:500 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#929BC6}.stage{font:800 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F7F8FF}.small{font:500 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#7F89B6}.cmd{font:650 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#C8D0FF}.tiny{font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#68739F}.num{font:800 10px system-ui,-apple-system,Segoe UI,sans-serif;fill:#FFF}
  </style>
</defs>

<!-- cinematic background -->
<rect width="1400" height="560" rx="34" fill="url(#bg)"/>
<circle cx="170" cy="80" r="170" fill="#6257FF" opacity=".12" filter="url(#soft)"/>
<circle cx="1230" cy="430" r="210" fill="#4DEBFF" opacity=".08" filter="url(#soft)"/>
<circle cx="700" cy="280" r="190" fill="#9D5CFF" opacity=".055" filter="url(#soft)"/>

<!-- subtle HUD grid -->
<g opacity=".16" stroke="#56608D" stroke-width="1">
 <path d="M80 115H1320M80 165H1320M80 395H1320M80 445H1320"/>
 <path d="M140 90V470M300 90V470M460 90V470M620 90V470M780 90V470M940 90V470M1100 90V470M1260 90V470"/>
</g>

<!-- header -->
<text x="700" y="55" text-anchor="middle" class="title">GIT WORKFLOW</text>
<text x="700" y="82" text-anchor="middle" class="sub">A change becomes a versioned snapshot — then travels to the remote</text>

<!-- top status HUD -->
<g>
 <rect x="72" y="28" width="170" height="28" rx="14" fill="#0A1029" stroke="#303B68"/>
 <circle cx="91" cy="42" r="4" fill="#55F0C2"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
 <text x="104" y="46" class="tiny">REPOSITORY • ACTIVE</text>
 <rect x="1150" y="28" width="178" height="28" rx="14" fill="#0A1029" stroke="#303B68"/>
 <text x="1239" y="46" text-anchor="middle" class="tiny">FLOW • LIVE / 04</text>
</g>

<!-- main flowing path -->
<path d="M150 285 C270 285 300 205 405 205 S535 365 650 285 S790 205 900 285 S1030 365 1250 285" fill="none" stroke="#242C55" stroke-width="9" stroke-linecap="round"/>
<path d="M150 285 C270 285 300 205 405 205 S535 365 650 285 S790 205 900 285 S1030 365 1250 285" fill="none" stroke="url(#energy)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 16" opacity=".9">
 <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.1s" repeatCount="indefinite"/>
</path>

<!-- energy packets -->
<g filter="url(#glow)">
 <circle r="7" fill="#7D68FF"><animateMotion dur="4.2s" repeatCount="indefinite" path="M150 285 C270 285 300 205 405 205 S535 365 650 285 S790 205 900 285 S1030 365 1250 285"/></circle>
 <circle r="5" fill="#C27BFF"><animateMotion dur="4.2s" begin="1.4s" repeatCount="indefinite" path="M150 285 C270 285 300 205 405 205 S535 365 650 285 S790 205 900 285 S1030 365 1250 285"/></circle>
 <circle r="5" fill="#52E9FF"><animateMotion dur="4.2s" begin="2.8s" repeatCount="indefinite" path="M150 285 C270 285 300 205 405 205 S535 365 650 285 S790 205 900 285 S1030 365 1250 285"/></circle>
</g>

<!-- stage 01 -->
<g>
 <circle cx="150" cy="285" r="58" fill="#080D25" stroke="#665CFF" stroke-width="1.5"/>
 <circle cx="150" cy="285" r="45" fill="none" stroke="#665CFF" opacity=".45" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0 150 285" to="360 150 285" dur="8s" repeatCount="indefinite"/></circle>
 <circle cx="150" cy="285" r="25" fill="#665CFF" opacity=".14" filter="url(#glow)"/>
 <circle cx="150" cy="285" r="8" fill="#8E80FF"><animate attributeName="r" values="7;11;7" dur="1.4s" repeatCount="indefinite"/></circle>
 <text x="150" y="350" text-anchor="middle" class="stage">01 • WORK</text><text x="150" y="369" text-anchor="middle" class="cmd">git status</text>
 <text x="150" y="387" text-anchor="middle" class="small">detect changes</text>
</g>

<!-- stage 02 -->
<g>
 <circle cx="405" cy="205" r="58" fill="#080D25" stroke="#9164FF" stroke-width="1.5"/>
 <circle cx="405" cy="205" r="45" fill="none" stroke="#9164FF" opacity=".45" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="360 405 205" to="0 405 205" dur="7s" repeatCount="indefinite"/></circle>
 <path d="M392 205l9 9 18-20" fill="none" stroke="#C3B4FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="405" y="125" text-anchor="middle" class="stage">02 • STAGE</text><text x="405" y="107" text-anchor="middle" class="cmd">git add</text>
 <text x="405" y="285" text-anchor="middle" class="small">select changes</text>
</g>

<!-- stage 03 central commit core -->
<g filter="url(#glow)">
 <circle cx="650" cy="285" r="92" fill="url(#core)" opacity=".5"/>
 <circle cx="650" cy="285" r="64" fill="#0A0E2A" stroke="#C16CFF" stroke-width="2"/>
 <circle cx="650" cy="285" r="50" fill="none" stroke="#C16CFF" opacity=".45" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="rotate" from="0 650 285" to="360 650 285" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="650" cy="285" r="10" fill="#D3A0FF"><animate attributeName="r" values="8;13;8" dur="1.2s" repeatCount="indefinite"/></circle>
</g>
<text x="650" y="180" text-anchor="middle" class="stage">03 • COMMIT</text>
<text x="650" y="199" text-anchor="middle" class="cmd">git commit</text>
<text x="650" y="385" text-anchor="middle" class="small">versioned snapshot</text>
<text x="650" y="402" text-anchor="middle" class="tiny">SHA • a8f31c2</text>

<!-- stage 04 -->
<g>
 <circle cx="900" cy="205" r="58" fill="#080D25" stroke="#B76CFF" stroke-width="1.5"/>
 <circle cx="900" cy="205" r="45" fill="none" stroke="#B76CFF" opacity=".45" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0 900 205" to="360 900 205" dur="8s" repeatCount="indefinite"/></circle>
 <path d="M885 212l15-16 15 16M900 196v25" fill="none" stroke="#DDBBFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="900" y="125" text-anchor="middle" class="stage">04 • PUSH</text><text x="900" y="107" text-anchor="middle" class="cmd">git push</text>
 <text x="900" y="285" text-anchor="middle" class="small">send to remote</text>
</g>

<!-- stage 05 remote endpoint -->
<g filter="url(#glow)">
 <circle cx="1250" cy="285" r="58" fill="#080D25" stroke="#4DEBFF" stroke-width="1.5"/>
 <circle cx="1250" cy="285" r="45" fill="none" stroke="#4DEBFF" opacity=".45" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="360 1250 285" to="0 1250 285" dur="7s" repeatCount="indefinite"/></circle>
 <path d="M1236 278c0-9 6-15 14-15s14 6 14 15v15h-28z" fill="none" stroke="#91F5FF" stroke-width="3"/><circle cx="1250" cy="278" r="3" fill="#91F5FF"/>
</g>
<text x="1250" y="350" text-anchor="middle" class="stage">REMOTE • GITHUB</text>
<text x="1250" y="369" text-anchor="middle" class="cmd">origin / main</text>
<text x="1250" y="387" text-anchor="middle" class="small">shared repository</text>

<!-- lower command console -->
<g>
 <rect x="250" y="445" width="900" height="68" rx="20" fill="url(#glass)" stroke="#303A68"/>
 <circle cx="278" cy="468" r="4" fill="#FF6B9A"/><circle cx="292" cy="468" r="4" fill="#FFC76B"/><circle cx="306" cy="468" r="4" fill="#55E6FF"/>
 <text x="330" y="472" class="tiny">GIT • PIPELINE TRACE</text>
 <text x="700" y="495" text-anchor="middle" class="cmd">working tree  →  staging  →  commit  →  push  →  origin/main</text>
 <circle cx="1115" cy="486" r="7" fill="#55F0C2"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
</g>

<!-- tiny moving particles -->
<g fill="#8D7BFF" opacity=".65">
 <circle cx="270" cy="130" r="2"><animate attributeName="cy" values="130;115;130" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="1040" cy="145" r="2"><animate attributeName="cy" values="145;128;145" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="1140" cy="410" r="2"><animate attributeName="cy" values="410;394;410" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="350" cy="420" r="2"><animate attributeName="cy" values="420;402;420" dur="3s" repeatCount="indefinite"/></circle>
</g>
</svg>