<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030611"/><stop offset=".5" stop-color="#0b1024"/><stop offset="1" stop-color="#190b31"/></linearGradient><linearGradient id="flow"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="560" rx="30" fill="url(#bg)"/><g opacity=".08" stroke="#9aa8c7"><path d="M35 100H1165M35 150H1165M35 200H1165M35 250H1165M35 300H1165M35 350H1165M35 400H1165M35 450H1165"/><path d="M100 80V480M200 80V480M300 80V480M400 80V480M500 80V480M600 80V480M700 80V480M800 80V480M900 80V480M1000 80V480M1100 80V480"/></g><text x="600" y="44" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">Git workflow</text><text x="600" y="70" text-anchor="middle" fill="#a8b3cc" font-family="system-ui" font-size="13">Watch one file move through the real Git lifecycle</text><g font-family="system-ui"><rect x="35" y="120" width="210" height="250" rx="22" fill="#080d1b" stroke="#8b5cf6" stroke-width="1.5"/><text x="55" y="150" fill="#b78cff" font-size="11" font-weight="800">1 · WORKING FOLDER</text><rect x="58" y="180" width="164" height="105" rx="12" fill="#0d1425" stroke="#293754"/><text x="78" y="207" fill="#7886a5" font-family="monospace" font-size="9">project/</text><text x="78" y="231" fill="#e7ecf7" font-family="monospace" font-size="12">app.py</text><text x="78" y="253" fill="#fb7185" font-family="monospace" font-size="10">● Modified</text><text x="140" y="330" text-anchor="middle" fill="#73819d" font-size="10">You edit the file</text><rect x="270" y="120" width="210" height="250" rx="22" fill="#07121f" stroke="#22d3ee" stroke-width="1.5"/><text x="290" y="150" fill="#49ddff" font-size="11" font-weight="800">2 · STAGING AREA</text><rect x="293" y="180" width="164" height="105" rx="12" fill="#0c1a2b" stroke="#24506a"/><text x="313" y="207" fill="#7886a5" font-family="monospace" font-size="9">index</text><text x="313" y="231" fill="#e7ecf7" font-family="monospace" font-size="12">app.py</text><text x="313" y="253" fill="#34d399" font-family="monospace" font-size="10">✓ Staged</text><text x="375" y="330" text-anchor="middle" fill="#73819d" font-size="10">git add app.py</text><rect x="505" y="120" width="210" height="250" rx="22" fill="#07141b" stroke="#34d399" stroke-width="1.5"/><text x="525" y="150" fill="#50e6aa" font-size="11" font-weight="800">3 · LOCAL HISTORY</text><rect x="528" y="180" width="164" height="105" rx="12" fill="#0b1b20" stroke="#245347"/><circle cx="560" cy="220" r="14" fill="#122c2a" stroke="#34d399"><animate attributeName="r" values="12;17;12" dur="2s" repeatCount="indefinite"/></circle><text x="585" y="218" fill="#e7ecf7" font-family="monospace" font-size="11">New commit</text><text x="585" y="240" fill="#8b9ab8" font-family="monospace" font-size="10">Commit ID: abc1234</text><text x="610" y="330" text-anchor="middle" fill="#73819d" font-size="10">git commit -m "Save changes"</text><rect x="740" y="120" width="210" height="250" rx="22" fill="#0b0d1d" stroke="#a78bfa" stroke-width="1.5"/><text x="760" y="150" fill="#bda7ff" font-size="11" font-weight="800">4 · GITHUB</text><rect x="763" y="180" width="164" height="105" rx="12" fill="#12132a" stroke="#493d76"/><text x="783" y="207" fill="#7886a5" font-family="monospace" font-size="9">Remote repository</text><text x="783" y="231" fill="#e7ecf7" font-family="monospace" font-size="12">main branch</text><text x="783" y="253" fill="#bda7ff" font-family="monospace" font-size="10">✓ Changes pushed</text><text x="845" y="330" text-anchor="middle" fill="#73819d" font-size="10">git push origin main</text></g><g stroke="#33415f" stroke-width="8" stroke-linecap="round"><path d="M245 235H270M480 235H505M715 235H740"/></g><g stroke="url(#flow)" stroke-width="2" stroke-dasharray="7 8"><path d="M245 235H270"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur=".5s" repeatCount="indefinite"/></path><path d="M480 235H505"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur=".5s" repeatCount="indefinite"/></path><path d="M715 235H740"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur=".5s" repeatCount="indefinite"/></path></g><circle r="7" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M245 235H270 M480 235H505 M715 235H740"/></circle><rect x="130" y="410" width="940" height="52" rx="26" fill="#050914" stroke="#35405e"/><text x="600" y="442" text-anchor="middle" fill="#d9e1f0" font-family="monospace" font-size="12">edit file  →  git status  →  git add  →  git commit  →  git push</text><text x="600" y="505" text-anchor="middle" fill="#7886a5" font-family="system-ui" font-size="11">Working Folder → Staging Area → Local History → GitHub</text></svg>