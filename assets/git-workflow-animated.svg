<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" rx="32" fill="#070b16"/><rect x="24" y="24" width="1552" height="852" rx="28" fill="#0b1120" stroke="#263653" stroke-width="2"/><text x="70" y="75" fill="#8da0bd" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">GITVAULT / GIT BASICS / 13</text><text x="70" y="125" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="800">Basic Git Workflow</text><text x="70" y="158" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="17">The complete local Git cycle — from editing a file to uploading the commit.</text><rect x="70" y="205" width="700" height="430" rx="24" fill="#03060c" stroke="#30435f" stroke-width="2"/><rect x="70" y="205" width="700" height="52" rx="24" fill="#111a2c"/><circle cx="103" cy="231" r="6" fill="#fb7185"/><circle cx="125" cy="231" r="6" fill="#fbbf24"/><circle cx="147" cy="231" r="6" fill="#34d399"/><text x="180" y="236" fill="#8fa1ba" font-family="monospace" font-size="13">Git Bash — my-project</text><text x="105" y="295" fill="#9aa9c0" font-family="monospace" font-size="14">pallavi@devbox ~/my-project</text><text x="105" y="330" fill="#fff" font-family="monospace" font-size="15">$ git status</text><text x="105" y="360" fill="#fb7185" font-family="monospace" font-size="13">modified: app.py</text><text x="105" y="398" fill="#fff" font-family="monospace" font-size="15">$ git add app.py</text><text x="105" y="436" fill="#34d399" font-family="monospace" font-size="12">app.py → staged</text><text x="105" y="474" fill="#fff" font-family="monospace" font-size="15">$ git commit -m "Update app"</text><text x="105" y="512" fill="#a78bfa" font-family="monospace" font-size="12">[main a1b2c3d] Update app</text><text x="105" y="550" fill="#fff" font-family="monospace" font-size="15">$ git push origin main</text><text x="105" y="588" fill="#67e8f9" font-family="monospace" font-size="12">→ changes uploaded to GitHub</text><text x="105" y="615" fill="#64748b" font-family="monospace" font-size="10">Output shown is illustrative.</text><text x="815" y="215" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">THE 5-STEP CYCLE</text><rect x="815" y="250" width="700" height="385" rx="24" fill="#080d19" stroke="#30435f" stroke-width="2"/><g font-family="Arial,sans-serif"><rect x="850" y="285" width="610" height="52" rx="14" fill="#111729"/><text x="875" y="318" fill="#a78bfa" font-family="monospace" font-size="12">01</text><text x="925" y="318" fill="#fff" font-size="15" font-weight="700">Edit</text><text x="1010" y="318" fill="#9aa9c0" font-size="13">Change the file in the working folder</text><rect x="850" y="350" width="610" height="52" rx="14" fill="#0d1824"/><text x="875" y="383" fill="#67e8f9" font-family="monospace" font-size="12">02</text><text x="925" y="383" fill="#fff" font-size="15" font-weight="700">Check</text><text x="1010" y="383" fill="#9aa9c0" font-size="13">git status → inspect what changed</text><rect x="850" y="415" width="610" height="52" rx="14" fill="#0d1824"/><text x="875" y="448" fill="#34d399" font-family="monospace" font-size="12">03</text><text x="925" y="448" fill="#fff" font-size="15" font-weight="700">Stage</text><text x="1010" y="448" fill="#9aa9c0" font-size="13">git add → select changes for next commit</text><rect x="850" y="480" width="610" height="52" rx="14" fill="#111729"/><text x="875" y="513" fill="#a78bfa" font-family="monospace" font-size="12">04</text><text x="925" y="513" fill="#fff" font-size="15" font-weight="700">Commit</text><text x="1010" y="513" fill="#9aa9c0" font-size="13">git commit → save a local snapshot</text><rect x="850" y="545" width="610" height="52" rx="14" fill="#0d1824"/><text x="875" y="578" fill="#67e8f9" font-family="monospace" font-size="12">05</text><text x="925" y="578" fill="#fff" font-size="15" font-weight="700">Push</text><text x="1010" y="578" fill="#9aa9c0" font-size="13">git push → upload commits to GitHub</text></g><rect x="70" y="680" width="1445" height="125" rx="22" fill="#050914" stroke="#2b3d5b" stroke-width="2"/><text x="100" y="715" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">MEMORY LINE</text><text x="100" y="758" fill="#fff" font-family="monospace" font-size="14">EDIT → STATUS → ADD → COMMIT → PUSH</text><text x="100" y="788" fill="#7f8da4" font-family="Arial,sans-serif" font-size="12">Working Folder → Staging Area → Local History → Remote GitHub Repository</text><text x="1445" y="788" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">STATIC • NO MOVEMENT</text></svg>