<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03050D"/><stop offset=".48" stop-color="#0B1021"/><stop offset="1" stop-color="#17102B"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6572FF"/><stop offset=".5" stop-color="#A96CFF"/><stop offset="1" stop-color="#54E6FF"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#141A31" stop-opacity=".94"/><stop offset="1" stop-color="#090D1C" stop-opacity=".96"/></linearGradient>
  <radialGradient id="commit"><stop stop-color="#FFFFFF"/><stop offset=".12" stop-color="#D8C8FF"/><stop offset=".38" stop-color="#9B69FF" stop-opacity=".8"/><stop offset="1" stop-color="#714DFF" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    .h{font:800 30px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F7F8FF;letter-spacing:.5px}.s{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#7E89AA}.t{font:700 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F2F4FF}.m{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#BFC8EA}.x{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#687391}.g{font:700 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#6F7B9D}.green{fill:#62E6B1}.purple{fill:#C29BFF}.cyan{fill:#70ECFF}
  </style>
</defs>

<rect width="1400" height="620" rx="34" fill="url(#bg)"/>
<circle cx="180" cy="120" r="190" fill="#625CFF" opacity=".08" filter="url(#shadow)"/>
<circle cx="1210" cy="450" r="220" fill="#45E6FF" opacity=".055" filter="url(#shadow)"/>

<!-- subtle technical grid -->
<g stroke="#303955" stroke-width="1" opacity=".17">
 <path d="M70 105H1330M70 155H1330M70 455H1330M70 505H1330"/>
 <path d="M120 85V535M280 85V535M440 85V535M600 85V535M760 85V535M920 85V535M1080 85V535M1240 85V535"/>
</g>

<!-- header -->
<text x="700" y="48" text-anchor="middle" class="h">GIT WORKFLOW</text>
<text x="700" y="73" text-anchor="middle" class="s">From an edited file to a real commit on origin/main</text>
<rect x="72" y="27" width="170" height="26" rx="13" fill="#0B1122" stroke="#28334F"/>
<circle cx="90" cy="40" r="4" class="green"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="102" y="44" class="x">WORKTREE • CLEAN TRACE</text>
<rect x="1155" y="27" width="173" height="26" rx="13" fill="#0B1122" stroke="#28334F"/><text x="1241" y="44" text-anchor="middle" class="x">LIVE REPLAY • 04 STEPS</text>

<!-- realistic terminal window -->
<g>
 <rect x="85" y="102" width="420" height="195" rx="18" fill="#050812" stroke="#2A3550"/>
 <rect x="85" y="102" width="420" height="35" rx="18" fill="#0D1324"/>
 <circle cx="108" cy="119" r="5" fill="#FF657F"/><circle cx="126" cy="119" r="5" fill="#FFC75F"/><circle cx="144" cy="119" r="5" fill="#5CE1B0"/>
 <text x="169" y="123" class="x">pallavi@devbox • ~/GitVault</text>
 <text x="106" y="166" class="m"><tspan fill="#62E6B1">$</tspan> git status</text>
 <text x="106" y="187" class="x">On branch main</text>
 <text x="106" y="205" class="x">Changes not staged for commit:</text>
 <text x="106" y="224" class="x"><tspan fill="#FF718B"> M</tspan> 01-Git-Basics/README.md</text>
 <text x="106" y="243" class="x"><tspan fill="#FF718B"> M</tspan> assets/git-workflow-animated.svg</text>
 <text x="106" y="271" class="m"><tspan fill="#62E6B1">$</tspan> <tspan class="purple">git add .</tspan><animate attributeName="opacity" values=".25;1;1" dur="4.2s" repeatCount="indefinite"/></text>
</g>

<!-- files moving out of terminal -->
<g filter="url(#glow)">
 <rect x="460" y="178" width="35" height="43" rx="5" fill="#151D38" stroke="#8970FF"/>
 <path d="M468 191h19M468 199h15M468 207h11" stroke="#BDA8FF" stroke-width="2"/>
 <animateTransform attributeName="transform" type="translate" values="0 0;35 8;70 0" dur="2.8s" repeatCount="indefinite"/>
</g>

<!-- working tree node -->
<g>
 <circle cx="590" cy="250" r="55" fill="#090F22" stroke="#6572FF" stroke-width="1.5"/>
 <circle cx="590" cy="250" r="43" fill="none" stroke="#6572FF" stroke-dasharray="3 8" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="0 590 250" to="360 590 250" dur="7s" repeatCount="indefinite"/></circle>
 <path d="M570 244h40M570 253h30M570 262h21" stroke="#9BA8FF" stroke-width="3" stroke-linecap="round"/>
 <text x="590" y="330" text-anchor="middle" class="t">WORKING TREE</text>
 <text x="590" y="349" text-anchor="middle" class="m">git status</text>
 <text x="590" y="367" text-anchor="middle" class="x">modified files detected</text>
</g>

<!-- staging node -->
<g>
 <circle cx="790" cy="175" r="52" fill="#0A1023" stroke="#9067FF" stroke-width="1.5"/>
 <circle cx="790" cy="175" r="39" fill="none" stroke="#9067FF" stroke-dasharray="3 8" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="360 790 175" to="0 790 175" dur="6s" repeatCount="indefinite"/></circle>
 <path d="M774 176l10 10 22-24" fill="none" stroke="#C8B5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="790" y="106" text-anchor="middle" class="t">STAGING AREA</text>
 <text x="790" y="125" text-anchor="middle" class="m">git add</text>
 <text x="790" y="246" text-anchor="middle" class="x">selected snapshot</text>
</g>

<!-- realistic commit object -->
<g filter="url(#glow)">
 <circle cx="990" cy="285" r="112" fill="url(#commit)" opacity=".52"/>
 <circle cx="990" cy="285" r="67" fill="#090D20" stroke="#B36BFF" stroke-width="2"/>
 <circle cx="990" cy="285" r="51" fill="none" stroke="#C28CFF" stroke-dasharray="4 8" opacity=".65"><animateTransform attributeName="transform" type="rotate" from="0 990 285" to="360 990 285" dur="6s" repeatCount="indefinite"/></circle>
 <path d="M970 285h40M990 265v40" stroke="#D8B7FF" stroke-width="3" stroke-linecap="round"/>
 <circle cx="990" cy="285" r="9" fill="#FFF"><animate attributeName="r" values="7;11;7" dur="1.3s" repeatCount="indefinite"/></circle>
</g>
<text x="990" y="188" text-anchor="middle" class="t">COMMIT OBJECT</text>
<text x="990" y="207" text-anchor="middle" class="m">git commit -m "update"</text>
<text x="990" y="383" text-anchor="middle" class="x">snapshot created</text>
<text x="990" y="401" text-anchor="middle" class="x">SHA • 7c91e4a</text>

<!-- branch / history -->
<g>
 <path d="M990 405 C990 442 1050 455 1110 455 H1220" fill="none" stroke="#39435E" stroke-width="5" stroke-linecap="round"/>
 <path d="M990 405 C990 442 1050 455 1110 455 H1220" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.1s" repeatCount="indefinite"/></path>
 <circle cx="1110" cy="455" r="8" fill="#B36BFF"/><circle cx="1165" cy="455" r="8" fill="#9B78FF"/><circle cx="1220" cy="455" r="10" fill="#62E6FF"><animate attributeName="r" values="8;13;8" dur="1.5s" repeatCount="indefinite"/></circle>
 <text x="1110" y="482" text-anchor="middle" class="x">HEAD</text><text x="1165" y="482" text-anchor="middle" class="x">7c91e4a</text><text x="1220" y="482" text-anchor="middle" class="x">origin/main</text>
</g>

<!-- push packet -->
<g filter="url(#glow)">
 <rect x="1190" y="248" width="38" height="30" rx="7" fill="#0D1A2A" stroke="#55E6FF"/>
 <path d="M1209 270v-15M1203 261l6-7 6 7" stroke="#7AF0FF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <animateMotion dur="2.6s" repeatCount="indefinite" path="M1030 285 C1100 285 1140 260 1208 263"/>
</g>

<!-- remote server -->
<g>
 <rect x="1180" y="102" width="170" height="120" rx="18" fill="url(#panel)" stroke="#30415E"/>
 <text x="1265" y="130" text-anchor="middle" class="g">REMOTE REPOSITORY</text>
 <rect x="1205" y="147" width="120" height="20" rx="5" fill="#0A1020" stroke="#283750"/>
 <circle cx="1218" cy="157" r="3" fill="#62E6B1"/><text x="1230" y="161" class="x">origin / main</text>
 <rect x="1205" y="176" width="120" height="20" rx="5" fill="#0A1020" stroke="#283750"/>
 <circle cx="1218" cy="186" r="3" fill="#A875FF"/><text x="1230" y="190" class="x">latest • 7c91e4a</text>
 <text x="1265" y="213" text-anchor="middle" class="x">git push</text>
</g>

<!-- central animated route -->
<path d="M645 250 C680 250 710 175 738 175" fill="none" stroke="#303B5D" stroke-width="6"/>
<path d="M645 250 C680 250 710 175 738 175" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-dasharray="9 13"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.2s" repeatCount="indefinite"/></path>
<path d="M842 175 C900 175 930 230 948 260" fill="none" stroke="#303B5D" stroke-width="6"/>
<path d="M842 175 C900 175 930 230 948 260" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-dasharray="9 13"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.2s" repeatCount="indefinite"/></path>

<!-- lower console / playback bar -->
<g>
 <rect x="180" y="525" width="1040" height="58" rx="17" fill="#070B17" stroke="#293550"/>
 <circle cx="208" cy="544" r="4" fill="#FF667F"/><circle cx="222" cy="544" r="4" fill="#FFC75F"/><circle cx="236" cy="544" r="4" fill="#5CE1B0"/>
 <text x="260" y="548" class="x">GIT REPLAY</text>
 <text x="700" y="558" text-anchor="middle" class="m"><tspan fill="#62E6B1">git status</tspan>  →  <tspan fill="#A97BFF">git add .</tspan>  →  <tspan fill="#C68BFF">git commit</tspan>  →  <tspan fill="#65E7FF">git push</tspan></text>
 <circle cx="1170" cy="554" r="6" fill="#62E6B1"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
</g>

<!-- subtle particles -->
<g fill="#8B78FF">
 <circle cx="530" cy="120" r="2"><animate attributeName="cy" values="120;108;120" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="1060" cy="95" r="2"><animate attributeName="cy" values="95;82;95" dur="2.7s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="520" r="2"><animate attributeName="cy" values="520;506;520" dur="2.5s" repeatCount="indefinite"/></circle>
</g>
</svg>