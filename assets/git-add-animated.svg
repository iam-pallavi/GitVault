<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030817"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#21113d"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.c{font-family:ui-monospace,Consolas,monospace}.h{font-size:40px;font-weight:900}.b{font-size:18px;font-weight:800}.s{font-size:13px}.x{font-size:11px}</style>
</defs>
<rect width="1500" height="820" rx="34" fill="url(#bg)"/>
<g opacity=".08" stroke="#64748b"><path d="M0 140H1500M0 280H1500M0 420H1500M0 560H1500M0 700H1500"/><path d="M150 0V820M300 0V820M450 0V820M600 0V820M750 0V820M900 0V820M1050 0V820M1200 0V820M1350 0V820"/></g>
<text x="60" y="64" class="t h">git add</text>
<text x="60" y="94" class="m s">Choose what should become part of your next commit.</text>
<text x="1440" y="62" text-anchor="end" class="m c x">GIT BASICS / 07</text>

<!-- terminal -->
<rect x="60" y="145" width="560" height="530" rx="28" fill="#050b17" stroke="#263c5b"/>
<text x="92" y="182" fill="#67e8f9" class="c x">TERMINAL / STAGE A CHANGE</text>
<circle cx="95" cy="215" r="5" fill="#fb7185"/><circle cx="113" cy="215" r="5" fill="#fbbf24"/><circle cx="131" cy="215" r="5" fill="#34d399"/>
<text x="92" y="253" class="m c s">pallavi@devbox ~/my-project</text>
<text x="92" y="287" class="t c s">$ git status</text>
<text x="92" y="318" class="m c x">Changes not staged for commit:</text>
<text x="112" y="348" fill="#fb7185" class="c s">modified:   app.py</text>
<text x="112" y="375" fill="#fb7185" class="c s">modified:   README.md</text>
<text x="92" y="420" class="t c s">$ git add app.py</text>
<text x="92" y="454" fill="#34d399" class="c x">✓ app.py staged</text>
<text x="92" y="492" class="t c s">$ git status</text>
<text x="92" y="523" fill="#34d399" class="c x">Changes to be committed:</text>
<text x="112" y="550" fill="#67e8f9" class="c s">modified:   app.py</text>
<text x="92" y="585" fill="#94a3b8" class="c x">README.md remains unstaged</text>
<rect x="92" y="615" width="496" height="38" rx="12" fill="#0b1828" stroke="#155e75"/>
<text x="340" y="639" text-anchor="middle" fill="#67e8f9" class="c x">git add changes the STAGING STATE</text>

<!-- staging concept -->
<rect x="665" y="145" width="380" height="530" rx="28" fill="#071121" stroke="#38476d"/>
<text x="855" y="182" text-anchor="middle" fill="#a5b4fc" class="c x">WHAT GIT ADD ACTUALLY DOES</text>
<text x="855" y="224" text-anchor="middle" class="t b">Working Tree</text>
<rect x="720" y="248" width="270" height="92" rx="18" fill="#151027" stroke="#6d3f64"/>
<text x="745" y="278" fill="#fb7185" class="c s">app.py</text>
<text x="745" y="305" class="m c x">modified content</text>
<text x="855" y="366" text-anchor="middle" fill="#67e8f9" class="c x">git add app.py</text>
<path d="M855 345V395" stroke="url(#accent)" stroke-width="4"/>
<rect x="720" y="410" width="270" height="112" rx="18" fill="#0b1828" stroke="#155e75"/>
<text x="745" y="442" fill="#67e8f9" class="c s">INDEX / STAGING AREA</text>
<text x="745" y="470" class="t c x">app.py • selected snapshot</text>
<text x="745" y="496" fill="#34d399" class="c x">✓ ready for next commit</text>
<text x="855" y="570" text-anchor="middle" fill="#c4b5fd" class="c x">Git prepares the index</text>
<text x="855" y="595" text-anchor="middle" fill="#64748b" class="c x">It does NOT create a commit</text>

<!-- result -->
<rect x="1090" y="145" width="350" height="530" rx="28" fill="#0a1021" stroke="#5a4380"/>
<text x="1265" y="182" text-anchor="middle" fill="#d8b4fe" class="c x">AFTER git add</text>
<text x="1265" y="224" text-anchor="middle" class="t b">Next commit selection</text>
<rect x="1130" y="260" width="270" height="62" rx="16" fill="#10251f" stroke="#27634f"/>
<text x="1155" y="287" fill="#34d399" class="c x">STAGED ✓</text>
<text x="1155" y="307" class="t c s">app.py</text>
<rect x="1130" y="340" width="270" height="62" rx="16" fill="#151027" stroke="#6d3f64"/>
<text x="1155" y="367" fill="#fb7185" class="c x">UNSTAGED</text>
<text x="1155" y="387" class="t c s">README.md</text>
<rect x="1130" y="430" width="270" height="100" rx="18" fill="#11152e" stroke="#4c3a79"/>
<text x="1265" y="462" text-anchor="middle" fill="#a78bfa" class="c x">NEXT STEP</text>
<text x="1265" y="490" text-anchor="middle" class="t c s">git commit -m</text>
<text x="1265" y="512" text-anchor="middle" fill="#94a3b8" class="c x">only staged content commits</text>
<text x="1265" y="582" text-anchor="middle" fill="#67e8f9" class="c x">ADD = PREPARE</text>
<text x="1265" y="604" text-anchor="middle" fill="#64748b" class="c x">COMMIT = SAVE HISTORY</text>

<!-- bottom -->
<rect x="60" y="705" width="1380" height="60" rx="20" fill="#050a15" stroke="#293e61"/>
<text x="90" y="742" fill="#67e8f9" class="c x">WORKING TREE</text>
<text x="245" y="742" class="t b">→</text>
<text x="275" y="742" fill="#a78bfa" class="c x">git add</text>
<text x="390" y="742" class="t b">→</text>
<text x="425" y="742" fill="#34d399" class="c x">STAGING AREA</text>
<text x="610" y="742" class="t b">→</text>
<text x="645" y="742" fill="#d8b4fe" class="c x">git commit</text>
<text x="800" y="742" class="t b">→</text>
<text x="835" y="742" fill="#f8fafc" class="c x">PROJECT HISTORY</text>
<text x="1380" y="742" text-anchor="end" fill="#94a3b8" class="c x">NO PUSH • NO GITHUB YET</text>
</svg>