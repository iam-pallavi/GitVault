<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" rx="32" fill="#070b16"/>
<rect x="24" y="24" width="1552" height="852" rx="28" fill="#0b1120" stroke="#263653" stroke-width="2"/>
<text x="70" y="75" fill="#8da0bd" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">GITVAULT / GIT BASICS / 07</text>
<text x="70" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="46" font-weight="800">git add</text>
<text x="70" y="158" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="17">Stage selected changes for the next commit.</text>

<rect x="70" y="205" width="690" height="430" rx="24" fill="#03060c" stroke="#30435f" stroke-width="2"/>
<rect x="70" y="205" width="690" height="52" rx="24" fill="#111a2c"/>
<circle cx="103" cy="231" r="6" fill="#fb7185"/><circle cx="125" cy="231" r="6" fill="#fbbf24"/><circle cx="147" cy="231" r="6" fill="#34d399"/>
<text x="180" y="236" fill="#8fa1ba" font-family="monospace" font-size="13">Git Bash — my-project</text>
<text x="105" y="295" fill="#9aa9c0" font-family="monospace" font-size="14">pallavi@devbox ~/my-project</text>
<text x="105" y="330" fill="#ffffff" font-family="monospace" font-size="15">$ git status</text>
<text x="105" y="360" fill="#8fa1ba" font-family="monospace" font-size="13">Changes not staged for commit:</text>
<text x="125" y="390" fill="#fb7185" font-family="monospace" font-size="14">modified:   app.py</text>
<text x="125" y="418" fill="#fb7185" font-family="monospace" font-size="14">modified:   README.md</text>
<line x1="105" y1="442" x2="720" y2="442" stroke="#202d43"/>
<text x="105" y="478" fill="#9aa9c0" font-family="monospace" font-size="14">pallavi@devbox ~/my-project</text>
<text x="105" y="512" fill="#ffffff" font-family="monospace" font-size="15">$ git add app.py</text>
<text x="105" y="550" fill="#67e8f9" font-family="monospace" font-size="12">app.py is now in the staging area</text>
<text x="105" y="585" fill="#64748b" font-family="monospace" font-size="11">No success message is printed by default.</text>

<text x="815" y="215" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">WHAT ACTUALLY HAPPENS</text>
<rect x="815" y="250" width="700" height="385" rx="24" fill="#080d19" stroke="#30435f" stroke-width="2"/>

<rect x="850" y="300" width="190" height="150" rx="18" fill="#141323" stroke="#7f3f63" stroke-width="2"/>
<text x="945" y="335" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Working Tree</text>
<text x="875" y="375" fill="#fb7185" font-family="monospace" font-size="14">app.py</text>
<text x="875" y="402" fill="#9aa9c0" font-family="monospace" font-size="11">edited file</text>
<text x="875" y="425" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="13">real file on disk</text>

<rect x="1080" y="335" width="225" height="80" rx="18" fill="#101a2d" stroke="#22d3ee" stroke-width="2"/>
<text x="1192" y="363" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11">COMMAND</text>
<text x="1192" y="391" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">git add app.py</text>

<rect x="1345" y="300" width="135" height="150" rx="18" fill="#0b1820" stroke="#2dd4bf" stroke-width="2"/>
<text x="1412" y="335" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Index</text>
<text x="1370" y="375" fill="#34d399" font-family="monospace" font-size="13">app.py</text>
<text x="1370" y="402" fill="#67e8f9" font-family="monospace" font-size="10">STAGED</text>
<text x="1370" y="425" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="12">next commit</text>

<line x1="1040" y1="375" x2="1080" y2="375" stroke="#8b5cf6" stroke-width="4"/>
<line x1="1305" y1="375" x2="1345" y2="375" stroke="#ec4899" stroke-width="4"/>
<path d="M1068 365 L1080 375 L1068 385" fill="none" stroke="#8b5cf6" stroke-width="3"/>
<path d="M1333 365 L1345 375 L1333 385" fill="none" stroke="#ec4899" stroke-width="3"/>

<rect x="850" y="480" width="630" height="115" rx="18" fill="#0b101c" stroke="#293852"/>
<text x="875" y="510" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">SELECTIVE STAGING</text>
<text x="875" y="545" fill="#34d399" font-family="monospace" font-size="14">app.py</text>
<text x="1010" y="545" fill="#34d399" font-family="monospace" font-size="11">STAGED</text>
<text x="875" y="575" fill="#fb7185" font-family="monospace" font-size="14">README.md</text>
<text x="1010" y="575" fill="#fb7185" font-family="monospace" font-size="11">NOT STAGED</text>
<text x="1190" y="558" fill="#9aa9c0" font-family="Arial,sans-serif" font-size="13">Only app.py enters the next commit.</text>

<rect x="70" y="680" width="1445" height="125" rx="22" fill="#050914" stroke="#2b3d5b" stroke-width="2"/>
<text x="100" y="715" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">THE GIT WORKFLOW</text>
<text x="100" y="758" fill="#9aa9c0" font-family="monospace" font-size="14">EDIT FILE</text>
<text x="245" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="285" y="758" fill="#ffffff" font-family="monospace" font-size="14">git add</text>
<text x="405" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="445" y="758" fill="#34d399" font-family="monospace" font-size="14">STAGED</text>
<text x="565" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="605" y="758" fill="#ffffff" font-family="monospace" font-size="14">git commit</text>
<text x="775" y="758" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">→</text>
<text x="815" y="758" fill="#a78bfa" font-family="monospace" font-size="14">HISTORY</text>
<text x="100" y="787" fill="#7f8da4" font-family="Arial,sans-serif" font-size="12">git add does not create a commit. It updates the index with the version selected for the next commit.</text>
</svg>