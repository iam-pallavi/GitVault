<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040714"/><stop offset="1" stop-color="#190d35"/></linearGradient><linearGradient id="scan"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4de7ff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><g opacity=".13" stroke="#6b759d"><path d="M50 100H1150M50 150H1150M50 200H1150M50 250H1150M50 300H1150M50 350H1150"/><path d="M100 85V380M250 85V380M400 85V380M550 85V380M700 85V380M850 85V380M1000 85V380"/></g><text x="600" y="48" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">git status</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">Git scans the repository state — it does not modify your files</text><rect x="60" y="105" width="575" height="270" rx="18" fill="#070b17" stroke="#303a5a"/><rect x="60" y="105" width="575" height="38" rx="18" fill="#11172a"/><circle cx="86" cy="124" r="5" fill="#ff657f"/><circle cx="104" cy="124" r="5" fill="#ffc75f"/><circle cx="122" cy="124" r="5" fill="#5ce1b0"/><text x="150" y="129" fill="#8995b7" font-family="monospace" font-size="11">pallavi@devbox ~/GitVault</text><text x="90" y="180" fill="#dce1f3" font-family="monospace" font-size="14">$ git status<tspan fill="#4de7ff">_</tspan><animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/></text><text x="90" y="211" fill="#66e6b0" font-family="monospace" font-size="12">On branch main</text><text x="90" y="238" fill="#aeb8d3" font-family="monospace" font-size="12">Changes not staged for commit:</text><text x="120" y="265" fill="#ff7b99" font-family="monospace" font-size="12">modified:   app.py</text><text x="120" y="290" fill="#ff7b99" font-family="monospace" font-size="12">modified:   README.md</text><text x="90" y="326" fill="#73809f" font-family="monospace" font-size="11">nothing staged • use git diff to inspect</text><rect x="690" y="118" width="400" height="230" rx="18" fill="#091022" stroke="#4b5680"/><text x="890" y="150" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="800">WORKTREE SCAN</text><g font-family="monospace" font-size="12"><rect x="735" y="178" width="310" height="38" rx="8" fill="#10172b" stroke="#293754"/><text x="755" y="202" fill="#dbe0f2">app.py</text><text x="1018" y="202" text-anchor="end" fill="#ff7b99">MODIFIED</text><rect x="735" y="228" width="310" height="38" rx="8" fill="#10172b" stroke="#293754"/><text x="755" y="252" fill="#dbe0f2">README.md</text><text x="1018" y="252" text-anchor="end" fill="#ff7b99">MODIFIED</text></g><rect x="714" y="173" width="4" height="101" fill="url(#scan)" opacity=".7"><animate attributeName="x" values="714;1060;714" dur="2.4s" repeatCount="indefinite"/></rect><circle cx="890" cy="305" r="7" fill="#4de7ff" filter="url(#gl)"><animate attributeName="r" values="5;10;5" dur="1.4s" repeatCount="indefinite"/></circle><text x="600" y="415" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">status = inspect • classify • report</text></svg>