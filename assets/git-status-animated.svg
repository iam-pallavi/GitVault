<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030817"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#21113d"/></linearGradient>
<linearGradient id="scan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.c{font-family:ui-monospace,Consolas,monospace}.h{font-size:40px;font-weight:900}.b{font-size:18px;font-weight:800}.s{font-size:13px}.x{font-size:11px}</style>
</defs>
<rect width="1500" height="820" rx="34" fill="url(#bg)"/>
<g opacity=".08" stroke="#64748b"><path d="M0 140H1500M0 280H1500M0 420H1500M0 560H1500M0 700H1500"/><path d="M150 0V820M300 0V820M450 0V820M600 0V820M750 0V820M900 0V820M1050 0V820M1200 0V820M1350 0V820"/></g>
<text x="60" y="64" class="t h">git status</text>
<text x="60" y="94" class="m s">Ask Git: “What has changed, and what is ready to be committed?”</text>
<text x="1440" y="62" text-anchor="end" class="m c x">GIT BASICS / 06</text>

<!-- terminal -->
<rect x="60" y="145" width="505" height="485" rx="28" fill="#050b17" stroke="#263c5b"/>
<text x="92" y="182" fill="#67e8f9" class="c x">TERMINAL / REPOSITORY CHECK</text>
<circle cx="95" cy="215" r="5" fill="#fb7185"/><circle cx="113" cy="215" r="5" fill="#fbbf24"/><circle cx="131" cy="215" r="5" fill="#34d399"/>
<text x="92" y="253" class="m c s">pallavi@devbox ~/my-project</text>
<text x="92" y="287" class="t c s">$ git status</text>
<rect x="92" y="307" width="441" height="1" fill="#1e293b"/>
<text x="92" y="340" fill="#67e8f9" class="c s">On branch main</text>
<text x="92" y="370" class="m c s">Changes not staged for commit:</text>
<text x="112" y="403" fill="#fb7185" class="c s">modified:   app.py</text>
<text x="112" y="430" fill="#fb7185" class="c s">modified:   README.md</text>
<text x="92" y="474" fill="#64748b" class="c s">no changes added to commit</text>
<text x="92" y="505" fill="#64748b" class="c x">use “git add” to stage changes</text>
<rect x="92" y="548" width="441" height="48" rx="14" fill="#0b1828" stroke="#155e75"/>
<text x="312" y="578" text-anchor="middle" fill="#67e8f9" class="c x">OUTPUT = CURRENT REPOSITORY STATE</text>

<!-- central scanner -->
<text x="610" y="182" fill="#a5b4fc" class="c x">REPOSITORY STATE SCANNER</text>
<rect x="610" y="215" width="355" height="415" rx="28" fill="#071121" stroke="#38476d"/>
<text x="787" y="253" text-anchor="middle" class="t b">Three places Git compares</text>
<!-- working tree -->
<rect x="650" y="285" width="275" height="75" rx="18" fill="#0b1729" stroke="#33466a"/>
<text x="670" y="313" class="t c s">WORKING TREE</text>
<text x="670" y="338" fill="#fb7185" class="c x">app.py • modified</text>
<circle cx="900" cy="322" r="7" fill="#fb7185" filter="url(#glow)"/>
<!-- index -->
<rect x="650" y="380" width="275" height="75" rx="18" fill="#0b1729" stroke="#33466a"/>
<text x="670" y="408" class="t c s">INDEX / STAGING AREA</text>
<text x="670" y="433" fill="#64748b" class="c x">nothing staged</text>
<circle cx="900" cy="417" r="7" fill="#64748b"/>
<!-- head -->
<rect x="650" y="475" width="275" height="75" rx="18" fill="#0b1729" stroke="#33466a"/>
<text x="670" y="503" class="t c s">HEAD → main</text>
<text x="670" y="528" fill="#67e8f9" class="c x">last committed snapshot</text>
<circle cx="900" cy="512" r="7" fill="#67e8f9" filter="url(#glow)"/>
<!-- scanner -->
<path d="M640 275H935" stroke="url(#scan)" stroke-width="3" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1s" repeatCount="indefinite"/></path>
<circle cx="640" cy="275" r="5" fill="#22d3ee" filter="url(#glow)"><animate attributeName="cx" values="640;935;640" dur="2.5s" repeatCount="indefinite"/></circle>
<text x="787" y="590" text-anchor="middle" fill="#67e8f9" class="c x">GIT INSPECTS • IT DOES NOT CHANGE</text>

<!-- state result -->
<text x="1010" y="182" fill="#d8b4fe" class="c x">RESULT / WHAT GIT FOUND</text>
<rect x="1010" y="215" width="430" height="415" rx="28" fill="#0a1021" stroke="#5a4380"/>
<text x="1045" y="253" class="t b">Repository status</text>
<text x="1045" y="278" class="m s">Git reports what needs attention.</text>
<rect x="1045" y="315" width="360" height="64" rx="16" fill="#151027" stroke="#6d3f64"/>
<text x="1068" y="341" fill="#fb7185" class="c x">UNSTAGED CHANGES</text>
<text x="1068" y="361" class="t c s">2 modified files</text>
<rect x="1045" y="397" width="360" height="64" rx="16" fill="#0b1828" stroke="#294b63"/>
<text x="1068" y="423" fill="#67e8f9" class="c x">STAGING AREA</text>
<text x="1068" y="443" fill="#94a3b8" class="t c s">empty / clean</text>
<rect x="1045" y="479" width="360" height="64" rx="16" fill="#0b1828" stroke="#294b63"/>
<text x="1068" y="505" fill="#a78bfa" class="c x">HEAD</text>
<text x="1068" y="525" class="t c s">points to main branch</text>
<rect x="1045" y="566" width="360" height="38" rx="12" fill="#11152e" stroke="#4c3a79"/>
<text x="1225" y="590" text-anchor="middle" fill="#c4b5fd" class="c x">STATUS = INSPECTION ONLY</text>

<!-- bridge packets -->
<path d="M565 365 C580 365 595 365 610 365" fill="none" stroke="url(#scan)" stroke-width="4" stroke-dasharray="8 10"/>
<circle r="6" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="1.4s" repeatCount="indefinite" path="M565 365 C580 365 595 365 610 365"/></circle>
<path d="M965 365 C980 365 995 365 1010 365" fill="none" stroke="url(#scan)" stroke-width="4" stroke-dasharray="8 10"/>
<circle r="6" fill="#d8b4fe" filter="url(#glow)"><animateMotion dur="1.4s" repeatCount="indefinite" path="M965 365 C980 365 995 365 1010 365"/></circle>

<!-- bottom -->
<rect x="60" y="670" width="1380" height="90" rx="24" fill="#050a15" stroke="#293e61"/>
<text x="90" y="704" fill="#67e8f9" class="c x">THE CORE IDEA</text>
<text x="90" y="730" class="t b">git status only tells you the current state — it does not stage, commit, push, or delete.</text>
<text x="1380" y="730" text-anchor="end" fill="#a78bfa" class="c x">NEXT → git add</text>
</svg>