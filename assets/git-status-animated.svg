<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b"><stop stop-color="#050817"/><stop offset="1" stop-color="#180d32"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git status</text><text x="600" y="74" text-anchor="middle" fill="#9da7c8" font-family="system-ui" font-size="13">inspect the working tree before staging or committing</text><rect x="70" y="110" width="1060" height="255" rx="18" fill="#080c19" stroke="#293152"/><rect x="90" y="130" width="1020" height="34" rx="8" fill="#11172a"/><circle cx="108" cy="147" r="5" fill="#ff6b6b"/><circle cx="126" cy="147" r="5" fill="#ffd166"/><circle cx="144" cy="147" r="5" fill="#5ee38b"/><text x="170" y="152" fill="#8792b5" font-family="monospace" font-size="11">developer@local ~/my-project</text><text x="105" y="202" fill="#cfd5ee" font-family="monospace" font-size="15">$ git status</text><text x="105" y="230" fill="#73e6b1" font-family="monospace" font-size="13">On branch main</text><text x="105" y="255" fill="#aeb7d5" font-family="monospace" font-size="13">Changes not staged for commit:</text><text x="135" y="281" fill="#ef9bba" font-family="monospace" font-size="13">modified:   app.py</text><text x="135" y="306" fill="#ef9bba" font-family="monospace" font-size="13">modified:   README.md</text><text x="105" y="337" fill="#7e89ad" font-family="monospace" font-size="12">nothing staged • inspect changes with git diff</text><g><rect x="760" y="205" width="260" height="112" rx="12" fill="#0d1324" stroke="#8067ff"/><text x="890" y="230" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="800">WORKING TREE</text><text x="890" y="258" text-anchor="middle" fill="#e0e4f7" font-family="monospace" font-size="12">app.py</text><text x="890" y="282" text-anchor="middle" fill="#ef9bba" font-family="monospace" font-size="11">MODIFIED</text><text x="890" y="304" text-anchor="middle" fill="#657092" font-family="system-ui" font-size="10">not staged yet</text></g><circle cx="745" cy="260" r="7" fill="#4de7ff"><animate attributeName="cx" values="735;755;735" dur="2s" repeatCount="indefinite"/></circle><text x="600" y="410" text-anchor="middle" fill="#aeb8d7" font-family="monospace" font-size="13">status = inspect repository state, not change it</text></svg>