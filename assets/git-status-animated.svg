<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".55" stop-color="#0d1328"/><stop offset="1" stop-color="#1b0d34"/></linearGradient><linearGradient id="a"><stop stop-color="#4ce9c0"/><stop offset=".5" stop-color="#49dfff"/><stop offset="1" stop-color="#aa7cff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="30" fill="url(#b)"/><g opacity=".07" stroke="#a8b4d5"><path d="M40 90H1160M40 140H1160M40 190H1160M40 240H1160M40 290H1160M40 340H1160M40 390H1160M40 440H1160"/><path d="M100 70V470M200 70V470M300 70V470M400 70V470M500 70V470M600 70V470M700 70V470M800 70V470M900 70V470M1000 70V470M1100 70V470"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="31" font-weight="800">git status</text><text x="600" y="72" text-anchor="middle" fill="#9da9c7" font-family="system-ui" font-size="13">A live repository scan — see Git classify changes in real time</text><rect x="50" y="105" width="520" height="305" rx="20" fill="#090e1c" stroke="#34405e"/><rect x="50" y="105" width="520" height="40" rx="20" fill="#11192c"/><circle cx="78" cy="126" r="5" fill="#ff6685"/><circle cx="96" cy="126" r="5" fill="#ffd15b"/><circle cx="114" cy="126" r="5" fill="#5de6b1"/><text x="142" y="131" fill="#7685a5" font-family="monospace" font-size="11">pallavi@devbox ~/GitVault</text><g font-family="monospace"><text x="78" y="178" fill="#e7ebf7" font-size="13">$ git status<tspan fill="#4ce9ff">_</tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text><text x="78" y="207" fill="#65e6b1" font-size="12">On branch main</text><text x="78" y="235" fill="#b8c2da" font-size="12">Changes not staged for commit:</text><text x="105" y="263" fill="#ff7895" font-size="12">modified:   app.py</text><text x="105" y="288" fill="#ff7895" font-size="12">modified:   README.md</text><text x="78" y="330" fill="#7786a6" font-size="11">nothing staged • inspect with git diff</text></g><rect x="610" y="105" width="540" height="305" rx="20" fill="#080f20" stroke="#34415f"/><text x="640" y="135" fill="#8290b1" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1.4">STATE INSPECTOR</text><g font-family="monospace"><rect x="640" y="160" width="480" height="56" rx="12" fill="#0e1729" stroke="#293754"/><text x="660" y="185" fill="#e2e7f4" font-size="12">working tree</text><text x="1100" y="185" text-anchor="end" fill="#ff7895" font-size="11">2 modified</text><rect x="640" y="230" width="480" height="56" rx="12" fill="#0e1729" stroke="#293754"/><text x="660" y="255" fill="#e2e7f4" font-size="12">index / staging area</text><text x="1100" y="255" text-anchor="end" fill="#65e6b1" font-size="11">clean</text><rect x="640" y="300" width="480" height="56" rx="12" fill="#0e1729" stroke="#293754"/><text x="660" y="325" fill="#e2e7f4" font-size="12">HEAD → main</text><text x="1100" y="325" text-anchor="end" fill="#66ddff" font-size="11">last commit</text></g><rect x="645" y="166" width="4" height="42" fill="url(#a)"><animate attributeName="x" values="645;1110;645" dur="2.4s" repeatCount="indefinite"/></rect><circle cx="880" cy="385" r="5" fill="#50e8ff" filter="url(#g)"><animate attributeName="r" values="4;10;4" dur="1.2s" repeatCount="indefinite"/></circle><text x="600" y="452" text-anchor="middle" fill="#c8d0e2" font-family="monospace" font-size="12">git status  →  working tree ↔ index ↔ HEAD</text><text x="600" y="490" text-anchor="middle" fill="#687596" font-family="system-ui" font-size="11">It reports repository state. It does not stage, commit, push or delete.</text></svg>