<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset="1" stop-color="#211044"/></linearGradient><linearGradient id="s"><stop stop-color="#c095ff"/><stop offset="1" stop-color="#4deaff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="28" fill="url(#b)"/><text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui" font-size="30" font-weight="800">git status</text><text x="600" y="74" text-anchor="middle" fill="#a5afd0" font-family="system-ui" font-size="13">A live repository scan: inspect, classify, report</text><rect x="55" y="105" width="570" height="270" rx="18" fill="#060a15" stroke="#354064"/><rect x="55" y="105" width="570" height="38" rx="18" fill="#10172a"/><circle cx="82" cy="124" r="5" fill="#ff657f"/><circle cx="100" cy="124" r="5" fill="#ffc75f"/><circle cx="118" cy="124" r="5" fill="#5ce1b0"/><text x="150" y="129" fill="#8995b7" font-family="monospace" font-size="11">pallavi@devbox ~/GitVault</text><text x="90" y="180" fill="#e1e6f7" font-family="monospace" font-size="14">$ git status<tspan fill="#4deaff">_</tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text><text x="90" y="211" fill="#68e6b1" font-family="monospace" font-size="12">On branch main</text><text x="90" y="238" fill="#b4bdd7" font-family="monospace" font-size="12">Changes not staged for commit:</text><text x="120" y="265" fill="#ff7d9a" font-family="monospace" font-size="12">modified:   app.py</text><text x="120" y="290" fill="#ff7d9a" font-family="monospace" font-size="12">modified:   README.md</text><text x="90" y="326" fill="#7885a4" font-family="monospace" font-size="11">nothing staged • inspect with git diff</text><g><text x="700" y="132" fill="#8996bb" font-family="system-ui" font-size="11" font-weight="800">WORKTREE SCANNER</text><rect x="690" y="150" width="420" height="190" rx="16" fill="#081121" stroke="#34415f"/><g font-family="monospace" font-size="12"><rect x="725" y="180" width="350" height="38" rx="8" fill="#10172b" stroke="#293754"/><text x="745" y="204" fill="#e0e5f5">app.py</text><text x="1055" y="204" text-anchor="end" fill="#ff7d9a">MODIFIED</text><rect x="725" y="235" width="350" height="38" rx="8" fill="#10172b" stroke="#293754"/><text x="745" y="259" fill="#e0e5f5">README.md</text><text x="1055" y="259" text-anchor="end" fill="#ff7d9a">MODIFIED</text></g><rect x="708" y="175" width="4" height="110" fill="url(#s)" opacity=".9"><animate attributeName="x" values="708;1080;708" dur="2.1s" repeatCount="indefinite"/></rect><circle cx="900" cy="310" r="7" fill="#4deaff" filter="url(#g)"><animate attributeName="r" values="5;11;5" dur="1.2s" repeatCount="indefinite"/></circle><text x="900" y="330" text-anchor="middle" fill="#74809e" font-family="system-ui" font-size="10">Git reads state; it does not edit files</text></g><rect x="330" y="398" width="540" height="35" rx="18" fill="#080c18" stroke="#46527a"/><text x="600" y="421" text-anchor="middle" fill="#b7c0da" font-family="monospace" font-size="11">working tree → index → HEAD comparison</text></svg>