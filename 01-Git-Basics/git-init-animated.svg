<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#07152d"/><stop offset="1" stop-color="#210b3a"/></linearGradient><linearGradient id="n"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#e879f9"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.c{font-family:ui-monospace,Consolas,monospace}.h{font-size:38px;font-weight:900}.b{font-size:18px;font-weight:800}.s{font-size:13px}.x{font-size:11px}</style></defs><rect width="1400" height="760" rx="34" fill="url(#b)"/><g opacity=".12" stroke="#64748b"><path d="M0 130H1400M0 260H1400M0 390H1400M0 520H1400M0 650H1400"/><path d="M140 0V760M280 0V760M420 0V760M560 0V760M700 0V760M840 0V760M980 0V760M1120 0V760M1260 0V760"/></g><circle cx="300" cy="330" r="150" fill="#22d3ee" opacity=".07"><animate attributeName="r" values="130;180;130" dur="6s" repeatCount="indefinite"/></circle><circle cx="1100" cy="400" r="180" fill="#a855f7" opacity=".07"><animate attributeName="r" values="160;210;160" dur="7s" repeatCount="indefinite"/></circle><text x="58" y="62" class="t h">git init</text><text x="58" y="92" class="m s">Watch a normal project become a Git repository.</text><text x="1340" y="62" text-anchor="end" class="m c x">GIT BASICS / 01</text><g><rect x="55" y="125" width="365" height="34" rx="17" fill="#0a1628" stroke="#23405e"/><text x="78" y="147" fill="#67e8f9" class="c x">01 / WORKING FOLDER</text><rect x="465" y="125" width="430" height="34" rx="17" fill="#10172e" stroke="#3d3a78"/><text x="488" y="147" fill="#a5b4fc" class="c x">02 / COMMAND EXECUTION</text><rect x="940" y="125" width="405" height="34" rx="17" fill="#15102b" stroke="#5a3a78"/><text x="963" y="147" fill="#d8b4fe" class="c x">03 / REPOSITORY CREATED</text></g><g><rect x="55" y="175" width="365" height="375" rx="26" fill="#081323" fill-opacity=".86" stroke="#2b4669"/><text x="85" y="216" class="t b">Before Git</text><text x="85" y="239" class="m s">Normal files on your computer.</text><rect x="85" y="270" width="305" height="220" rx="18" fill="#050b17" stroke="#20334f"/><text x="108" y="305" class="t c s">my-project/</text><text x="108" y="348" class="m c s">├── app.py</text><text x="108" y="380" class="m c s">├── index.html</text><text x="108" y="412" class="m c s">├── style.css</text><text x="108" y="444" class="m c s">└── README.md</text><text x="108" y="486" fill="#fb7185" class="c x">● NOT A GIT REPOSITORY</text></g><g><rect x="465" y="175" width="430" height="375" rx="26" fill="#081323" fill-opacity=".86" stroke="#3b4770"/><text x="500" y="216" class="t b">Initialize the project</text><rect x="500" y="252" width="360" height="155" rx="17" fill="#02050b" stroke="#1e293b"/><circle cx="520" cy="274" r="5" fill="#fb7185"/><circle cx="538" cy="274" r="5" fill="#fbbf24"/><circle cx="556" cy="274" r="5" fill="#34d399"/><text x="525" y="309" class="m c x">~/projects/my-project</text><text x="525" y="343" class="t c s">$ git init</text><rect x="525" y="365" width="310" height="4" rx="2" fill="#172033"/><rect x="525" y="365" width="310" height="4" rx="2" fill="url(#n)"><animate attributeName="width" values="0;310;310;0" dur="3s" repeatCount="indefinite"/></rect><circle r="7" fill="#67e8f9" filter="url(#g)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M525 367 L835 367"/></circle><text x="525" y="394" fill="#67e8f9" class="c x">Initializing repository...</text><rect x="500" y="435" width="360" height="78" rx="15" fill="#071927" stroke="#155e75"/><text x="525" y="462" fill="#67e8f9" class="c x">GIT PREPARES LOCAL METADATA</text><text x="525" y="488" class="m s">A hidden .git directory will be created.</text></g><g><rect x="940" y="175" width="405" height="375" rx="26" fill="#081323" fill-opacity=".86" stroke="#553b7d"/><text x="975" y="216" class="t b">After Git</text><text x="975" y="239" class="m s">The folder is now a Git repository.</text><rect x="975" y="270" width="335" height="220" rx="18" fill="#050a17" stroke="#2d3157"/><text x="997" y="305" class="t c s">my-project/</text><text x="997" y="342" class="m c s">├── app.py</text><text x="997" y="372" class="m c s">├── index.html</text><text x="997" y="402" class="m c s">├── style.css</text><text x="997" y="432" fill="#d8b4fe" class="c s">└── .git/</text><rect x="1080" y="414" width="205" height="34" rx="9" fill="#1a1031" stroke="#8b5cf6"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></rect><text x="1182" y="436" text-anchor="middle" fill="#c4b5fd" class="c x">Git repository data</text><circle cx="1290" cy="432" r="7" fill="#d8b4fe" filter="url(#g)"><animate attributeName="r" values="5;12;5" dur="1.8s" repeatCount="indefinite"/></circle><rect x="997" y="500" width="292" height="32" rx="16" fill="#062127" stroke="#155e75"/><text x="1143" y="521" text-anchor="middle" fill="#67e8f9" class="c x">✓ REPOSITORY INITIALIZED</text></g><path d="M420 362 C440 362 445 362 465 362M895 362 C915 362 920 362 940 362" fill="none" stroke="url(#n)" stroke-width="5" stroke-dasharray="10 9"/><circle r="8" fill="#fff" filter="url(#g)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M420 362 C440 362 445 362 465 362"/></circle><circle r="8" fill="#e9d5ff" filter="url(#g)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M895 362 C915 362 920 362 940 362"/></circle><rect x="55" y="595" width="1290" height="105" rx="24" fill="#050a15" stroke="#293e61"/><text x="83" y="625" fill="#67e8f9" class="c x">THE CORE IDEA</text><text x="83" y="657" class="t b">git init = initialize Git in the current folder</text><text x="83" y="682" class="m s">It creates .git. Your files are NOT committed yet.</text><text x="1308" y="657" text-anchor="end" fill="#a78bfa" class="c x">NEXT → git status</text><text x="1308" y="682" text-anchor="end" class="m x">initialize ≠ commit</text></svg>