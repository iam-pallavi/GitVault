<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#08142b"/><stop offset="1" stop-color="#1a0b32"/></linearGradient><linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#d946ef"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.c{font-family:ui-monospace,Consolas,monospace}.h{font-size:36px;font-weight:900}.b{font-size:18px;font-weight:800}.s{font-size:13px}.x{font-size:11px}</style></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><circle cx="700" cy="365" r="260" fill="#6366f1" opacity=".06"><animate attributeName="r" values="220;285;220" dur="6s" repeatCount="indefinite"/></circle><text x="58" y="62" class="t h">git init</text><text x="58" y="92" class="m s">The first step: turn an ordinary project into a Git repository.</text><text x="1340" y="62" text-anchor="end" class="m c x">GIT BASICS / 01</text>
<!-- project --> <g><text x="60" y="145" class="m c x">BEFORE</text><rect x="55" y="170" width="365" height="390" rx="26" fill="#050b18" stroke="#263958"/><text x="85" y="210" class="t b">Your project</text><text x="85" y="234" class="m s">Just normal files on your computer.</text><rect x="85" y="270" width="305" height="54" rx="12" fill="#0c1729" stroke="#334766"/><text x="105" y="304" class="t c s">📁 my-project/</text><g class="c s"><text x="105" y="355" class="m">├── app.py</text><text x="105" y="385" class="m">├── index.html</text><text x="105" y="415" class="m">└── style.css</text></g><rect x="85" y="455" width="305" height="55" rx="12" fill="#130f1d" stroke="#7f1d4d"/><text x="105" y="479" fill="#fb7185" class="c x">STATUS</text><text x="105" y="498" class="m c x">Not a Git repository</text></g>
<!-- command --> <g><text x="505" y="145" class="m c x">ACTION</text><rect x="465" y="170" width="430" height="390" rx="26" fill="#040914" stroke="#35486c"/><text x="500" y="210" class="t b">Initialize Git</text><rect x="500" y="245" width="360" height="145" rx="16" fill="#02050b" stroke="#1e293b"/><text x="525" y="275" class="m c x">TERMINAL</text><text x="525" y="315" class="t c s">$ cd my-project</text><text x="525" y="350" fill="#67e8f9" class="c s">$ git init</text><rect x="525" y="372" width="310" height="3" fill="#1e293b"/><rect x="525" y="372" width="310" height="3" fill="url(#neon)"><animate attributeName="width" values="0;310;310;0" dur="3s" repeatCount="indefinite"/></rect><circle r="7" fill="#67e8f9" filter="url(#gl)"><animateMotion dur="2.1s" repeatCount="indefinite" path="M525 373 L835 373"/></circle><rect x="500" y="420" width="360" height="90" rx="15" fill="#09172a" stroke="#164e63"/><text x="525" y="450" fill="#67e8f9" class="c x">INITIALIZE REPOSITORY</text><text x="525" y="477" class="t s">Git prepares a hidden .git directory.</text></g>
<!-- result --> <g><text x="980" y="145" class="m c x">AFTER</text><rect x="940" y="170" width="405" height="390" rx="26" fill="#050b18" stroke="#473775"/><text x="975" y="210" class="t b">Repository ready ✓</text><text x="975" y="234" class="m s">The project now has Git’s local database.</text><rect x="975" y="270" width="335" height="210" rx="16" fill="#080d1b" stroke="#263b5e"/><text x="995" y="302" class="t c s">📁 my-project/</text><text x="995" y="335" class="m c s">├── app.py</text><text x="995" y="363" class="m c s">├── index.html</text><text x="995" y="391" class="m c s">├── style.css</text><text x="995" y="419" fill="#c4b5fd" class="c s">└── .git/</text><circle cx="1280" cy="420" r="8" fill="#a78bfa" filter="url(#gl)"><animate attributeName="r" values="6;12;6" dur="1.8s" repeatCount="indefinite"/></circle><rect x="975" y="495" width="335" height="40" rx="12" fill="#071c20" stroke="#155e75"/><text x="1142" y="520" text-anchor="middle" fill="#67e8f9" class="c x">✓ GIT REPOSITORY CREATED</text></g>
<!-- animated bridge --> <path d="M420 365 C440 365 445 365 465 365" fill="none" stroke="url(#neon)" stroke-width="4" stroke-dasharray="9 9"/><path d="M895 365 C915 365 920 365 940 365" fill="none" stroke="url(#neon)" stroke-width="4" stroke-dasharray="9 9"/><circle r="7" fill="#fff" filter="url(#gl)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M420 365 C440 365 445 365 465 365"/></circle><circle r="7" fill="#d8b4fe" filter="url(#gl)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M895 365 C915 365 920 365 940 365"/></circle>
<!-- bottom --> <rect x="55" y="610" width="1290" height="92" rx="22" fill="#060c18" stroke="#2b3e60"/><text x="82" y="638" class="m c x">UNDERSTAND IT</text><text x="82" y="667" class="t b">git init = “Start Git in this folder.”</text><text x="500" y="667" class="m s">It creates .git and prepares the project for future tracking.</text><text x="1305" y="667" text-anchor="end" fill="#67e8f9" class="c x">NEXT → git status</text></svg>