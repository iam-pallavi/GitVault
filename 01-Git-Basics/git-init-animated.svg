<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#0b1024"/><stop offset="1" stop-color="#190b30"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:Inter,Segoe UI,sans-serif;fill:#94a3b8}.c{font-family:ui-monospace,Consolas,monospace}.h{font-size:31px;font-weight:900}.b{font-size:18px;font-weight:800}.s{font-size:13px}.x{font-size:11px}</style></defs><rect width="1200" height="650" rx="30" fill="url(#b)"/><circle cx="600" cy="320" r="230" fill="#7c3aed" opacity=".07"><animate attributeName="r" values="200;250;200" dur="5s" repeatCount="indefinite"/></circle><text x="45" y="55" class="t h">git init — Create a Git Repository</text><text x="45" y="82" class="m s">One command turns an ordinary project folder into a Git repository.</text>
<!-- folder --> <g><rect x="45" y="145" width="300" height="330" rx="22" fill="#07101e" stroke="#2b3c5a"/><text x="72" y="180" class="m c x">STEP 1 • BEFORE</text><text x="72" y="212" class="t b">Normal project folder</text><rect x="72" y="240" width="246" height="52" rx="10" fill="#0d1728" stroke="#334766"/><text x="90" y="272" class="t c s">📁 my-project/</text><text x="92" y="325" class="m c s">app.py</text><text x="92" y="353" class="m c s">index.html</text><text x="92" y="381" class="m c s">style.css</text><text x="72" y="435" fill="#fbbf24" class="c x">No .git directory yet</text></g>
<!-- command --> <g><text x="440" y="145" class="m c x">STEP 2 • RUN COMMAND</text><rect x="405" y="170" width="390" height="170" rx="24" fill="#050a15" stroke="#3c4a69"/><text x="435" y="207" class="m c x">TERMINAL</text><text x="435" y="250" class="t c s">$ cd my-project</text><text x="435" y="284" fill="#67e8f9" class="c s">$ git init</text><rect x="430" y="305" width="335" height="5" rx="2" fill="#22d3ee"><animate attributeName="width" values="0;335;0" dur="2.8s" repeatCount="indefinite"/></rect><circle r="7" fill="#67e8f9" filter="url(#gl)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M430 310 L765 310"/></circle></g>
<!-- repo --> <g><text x="855" y="145" class="m c x">STEP 3 • AFTER</text><rect x="830" y="170" width="325" height="305" rx="24" fill="#07101e" stroke="#4c3a78"/><text x="858" y="207" class="t b">Repository initialized ✓</text><rect x="858" y="235" width="270" height="52" rx="10" fill="#0b1825" stroke="#164e63"/><text x="876" y="267" class="t c s">📁 my-project/</text><rect x="875" y="305" width="236" height="55" rx="10" fill="#120d29" stroke="#8b5cf6"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></rect><text x="895" y="329" fill="#d8b4fe" class="t c s">.git/</text><text x="895" y="348" class="m c x">Git metadata + repository data</text><text x="858" y="405" fill="#67e8f9" class="c s">✓ Git can now track this project</text><text x="858" y="430" class="m c x">Working tree is ready</text></g>
<!-- arrows --> <path d="M345 305 C370 305 380 255 405 255" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="7 8"/><path d="M795 255 C815 255 815 255 830 255" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="7 8"/><circle r="6" fill="#fff" filter="url(#gl)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M345 305 C370 305 380 255 405 255"/></circle><circle r="6" fill="#d8b4fe" filter="url(#gl)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M795 255 C815 255 815 255 830 255"/></circle>
<!-- explanation --> <rect x="45" y="515" width="1110" height="90" rx="20" fill="#070d1b" stroke="#293b5b"/><text x="72" y="545" class="m c x">WHAT JUST HAPPENED?</text><text x="72" y="574" class="t b">git init does NOT commit your files.</text><text x="72" y="596" class="m s">It initializes the repository by creating the hidden .git directory, so Git can start tracking the project.</text><text x="1125" y="555" text-anchor="end" fill="#22d3ee" class="c x">NEXT → git status</text></svg>